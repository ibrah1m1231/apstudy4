units:[
{title:"The Global Tapestry (c. 1200–1450)",weight:[8,10],
 desc:"State-building and belief systems across Afro-Eurasia and the Americas.",
 notes:[
  {h:"East and South Asia",b:[
   "**Song China** used a Confucian bureaucracy selected by the civil service exam, expanded rice agriculture (Champa rice), and produced for market with paper money and iron.",
   "Neo-Confucianism reinforced filial piety and patriarchal hierarchy; foot binding marked elite status.",
   "Chinese influence shaped Korea (closely modeled), Japan (selectively adopted, with feudal daimyo and samurai), and Vietnam (adopted yet resisted).",
   "In South Asia, the **Delhi Sultanate** ruled a largely Hindu population; the **bhakti movement** and **Sufism** both stressed personal devotion and eased conversion. Vijayanagara and the Rajput states resisted."]},
  {h:"Dar al-Islam and Europe",b:[
   "The Abbasid Caliphate fragmented; Turkic and Mamluk military groups took power, but Islamic trade, scholarship, and law continued to expand.",
   "Muslim scholars advanced mathematics, astronomy, and medicine and preserved Greek texts — later transmitted to Europe.",
   "Europe was **feudal and manorial**, decentralized, with the Catholic Church as the main unifying institution.",
   "Europe's comparative position: politically fragmented and economically less developed than Song China or Dar al-Islam in 1200."]},
  {h:"Africa and the Americas",b:[
   "**Mali** grew rich from trans-Saharan gold and salt trade; Mansa Musa's pilgrimage advertised its wealth and Timbuktu became a center of learning.",
   "Swahili city-states on the East African coast thrived on Indian Ocean trade and developed a Bantu-Arabic culture.",
   "Great Zimbabwe and Ethiopia (Christian) show the diversity of African political and religious forms.",
   "In the Americas: the **Aztec (Mexica)** used tribute and chinampas; the **Inca** used the mit'a labor system, quipu records, and an extensive road network; the Mississippian culture built Cahokia."]}],
 tip:"Unit 1 is where comparison questions get their material. Be able to compare two states' methods of legitimizing and consolidating power.",
 terms:["Song China","civil service exam","Neo-Confucianism","Delhi Sultanate","bhakti","Sufism","feudalism","manorialism","Mali","Mansa Musa","Swahili city-states","Aztec","Inca","mit'a"],
 cards:[
 ["How did Song China select officials?","Through a Confucian civil service examination system, creating a merit-based scholar-bureaucracy."],
 ["What was the bhakti movement?","A Hindu devotional movement emphasizing personal love of a deity over ritual and caste hierarchy."],
 ["How did Sufism aid the spread of Islam?","Its mystical, personal approach and tolerance of local practices made conversion easier across cultures."],
 ["What made Mali wealthy?","Control of trans-Saharan trade in gold and salt."],
 ["What was the Inca mit'a system?","A mandatory public labor obligation owed to the state in exchange for protection and support."],
 ["What unified politically fragmented medieval Europe?","The Catholic Church, which provided shared religion, law, learning, and administration."],
 ["What was a chinampa?","An Aztec floating garden plot that allowed intensive agriculture in lake beds."]]},
{title:"Networks of Exchange (c. 1200–1450)",weight:[8,10],
 desc:"The Silk Roads, Indian Ocean, trans-Saharan trade, and the Mongols.",
 notes:[
  {h:"Trade networks",b:[
   "**Silk Roads**: luxury goods over land, supported by caravanserai, camel saddles, and credit instruments like bills of exchange. Trading-post empires and diasporic merchant communities grew along the routes.",
   "**Indian Ocean trade**: larger bulk goods moved by dhow and junk, timed to **monsoon winds**; navigational aids included the compass, astrolabe, and lateen sail.",
   "**Trans-Saharan trade**: camel caravans linked West African gold to Mediterranean markets, spreading Islam southward.",
   "Commercial growth produced new financial practices (banking houses, paper money, credit) and urban merchant classes."]},
  {h:"The Mongols and consequences of exchange",b:[
   "The **Mongol Empire** was the largest contiguous land empire; it reopened the Silk Roads, enforced relative safety (the *Pax Mongolica*), practiced religious tolerance, and moved artisans and scholars across Eurasia.",
   "Mongol rule transmitted technology (gunpowder, printing) westward and Greek and Islamic learning in both directions.",
   "Disease traveled the same routes: the **Black Death** killed perhaps a third of Europe's population and reshaped labor, wages, and religious authority.",
   "Crops and techniques spread too — sugar, cotton, citrus, and bananas in Africa — with environmental consequences including deforestation and soil exhaustion."]}],
 tip:"Nearly every 1200–1450 prompt can be answered through trade networks. Know one technology, one commodity, and one cultural transfer for each network.",
 terms:["Silk Roads","caravanserai","bill of exchange","Indian Ocean trade","monsoon winds","dhow","trans-Saharan trade","Mongol Empire","Pax Mongolica","Black Death","diasporic community"],
 cards:[
 ["What technologies enabled Indian Ocean trade?","The dhow and junk, the lateen sail, the compass, the astrolabe, and knowledge of monsoon wind patterns."],
 ["What was a caravanserai?","A roadside inn along the Silk Roads providing shelter, water, and trade for caravans."],
 ["What is a bill of exchange?","A credit instrument allowing merchants to trade without carrying large amounts of currency."],
 ["Three effects of Mongol rule on Eurasian exchange","Safer long-distance trade, transfer of technologies like gunpowder and printing, and movement of scholars and artisans."],
 ["How did the Black Death reach Europe?","Along the trade routes the Mongols had secured, carried by merchants and fleas on rats."],
 ["Name two social effects of the Black Death in Europe","Labor shortages raised peasant wages and weakened serfdom; the Church's authority was shaken."],
 ["What is a diasporic merchant community?","A settlement of foreign merchants living permanently in a trading city, blending with and influencing local culture."]]},
{title:"Land-Based Empires (c. 1450–1750)",weight:[12,15],
 desc:"Gunpowder empires, their legitimation strategies, and religious conflict.",
 notes:[
  {h:"The gunpowder empires",b:[
   "**Ottoman**: devshirme recruited Christian boys into the janissary corps and bureaucracy; religious minorities were organized in millets and paid a tax.",
   "**Safavid (Persia)**: Shi'a Islam as state religion, putting it in conflict with the Sunni Ottomans and Mughals.",
   "**Mughal (South Asia)**: a Muslim minority ruling a Hindu majority; **Akbar** pursued religious tolerance and administrative inclusion, while Aurangzeb reversed course.",
   "**Qing China**: a Manchu minority ruling Han Chinese, maintaining the exam system while enforcing visible signs of submission.",
   "**Russia**: expanded east across Siberia, centralized tsarist power, and bound peasants in serfdom."]},
  {h:"Legitimizing and consolidating power",b:[
   "Rulers legitimized authority through religion (divine right, caliphate, Son of Heaven), monumental architecture (Versailles, Taj Mahal, Topkapi), art patronage, and tribute.",
   "Bureaucracies and tax systems (tax farming, the Ottoman timar, the Mughal zamindar) extended reach but created local power holders.",
   "**Military organization** mattered: gunpowder weapons enabled centralization and the defeat of mounted nomads.",
   "Religious conflict shaped politics — the Protestant Reformation in Europe, Sunni-Shi'a rivalry in the Islamic world, and Sikhism's emergence in South Asia."]}],
 tip:"Comparison prompts often ask how two empires legitimized power. Have a religion-based example and an architecture or art example ready for each.",
 terms:["gunpowder empire","devshirme","janissary","millet","Safavid","Mughal","Akbar","Qing","serfdom","divine right","tax farming","zamindar","Sikhism"],
 cards:[
 ["What was the Ottoman devshirme system?","Recruiting and training Christian boys for service as janissaries and administrators, loyal directly to the sultan."],
 ["What was the millet system?","Ottoman organization of religious minorities into self-governing communities under their own leaders."],
 ["Why did Safavid Persia conflict with its neighbors?","It established Shi'a Islam as the state religion, clashing with Sunni Ottomans and Mughals."],
 ["How did Akbar rule a Hindu-majority empire?","Through religious tolerance, tax relief for non-Muslims, and inclusion of Hindus in administration."],
 ["How did Qing rulers legitimize Manchu rule over Han China?","They maintained Confucian institutions and the exam system while enforcing Manchu customs as signs of submission."],
 ["Name three ways early modern rulers legitimized power","Religious claims such as divine right, monumental architecture, and patronage of art and scholarship."],
 ["Why did gunpowder favor centralized states?","Artillery could reduce fortifications and defeat mounted nomadic cavalry, advantages only wealthy central governments could afford."]]},
{title:"Transoceanic Interconnections (c. 1450–1750)",weight:[12,15],
 desc:"Maritime exploration, the Columbian Exchange, and new economic systems.",
 notes:[
  {h:"Exploration and empire",b:[
   "Technologies: caravel, carrack, astrolabe, magnetic compass, and understanding of wind patterns. Motives: trade routes to Asia, Christianity, and state competition.",
   "Portugal built a **trading-post empire** in the Indian Ocean; Spain conquered American empires; the Dutch and English used **joint-stock companies** (VOC, East India Company) to spread risk.",
   "**Maritime empires** relied on coerced labor: the **encomienda** and **hacienda** systems, the Inca-derived **mit'a** repurposed for silver mining at Potosí, and the Atlantic slave trade.",
   "Mercantilism treated colonies as sources of bullion and raw materials."]},
  {h:"The Columbian Exchange and new social orders",b:[
   "Disease devastated Native populations; American crops (potato, maize) raised Eurasian and African populations; Old World animals transformed American ecosystems and Plains cultures.",
   "**Silver** from Potosí and Mexico flowed to China through Manila, creating the first truly global economy and fueling inflation in Europe.",
   "The **Atlantic slave trade** forcibly moved roughly twelve million Africans, reshaping African states and producing plantation societies in the Americas.",
   "New social hierarchies: the Spanish **casta** system, creole elites, and **syncretic** religions such as Vodun and Santería.",
   "Resistance was constant: maroon communities, revolts, the **Pueblo Revolt**, and Native and African cultural persistence."]}],
 tip:"For economic-system prompts, connect a labor system to a commodity and a place: mit'a to silver at Potosí, chattel slavery to sugar in Brazil and the Caribbean.",
 terms:["caravel","trading-post empire","joint-stock company","encomienda","hacienda","Potosí","Columbian Exchange","Atlantic slave trade","Middle Passage","casta system","syncretism","maroon community","Pueblo Revolt"],
 cards:[
 ["What is a joint-stock company and why did it matter?","A business owned by many shareholders that spread the risk of expensive voyages, enabling Dutch and English colonial expansion."],
 ["What was a trading-post empire?","Control of coastal ports and sea lanes to dominate trade rather than conquering territory — the Portuguese model in the Indian Ocean."],
 ["Why was Potosí so significant?","Its silver, mined with coerced labor, financed Spain and flowed to China, creating a global economy."],
 ["What were the demographic consequences of the Columbian Exchange?","Native American populations collapsed from disease while American crops raised populations in Europe, Africa, and Asia."],
 ["What was the casta system?","A Spanish colonial hierarchy ranking people by ancestry and racial mixture, determining rights and status."],
 ["Give an example of religious syncretism in the Americas","Vodun or Santería, blending West African beliefs with Catholic practice."],
 ["What was the Pueblo Revolt?","A 1680 uprising that drove the Spanish out of New Mexico for over a decade."]]},
{title:"Revolutions (c. 1750–1900)",weight:[12,15],
 desc:"Enlightenment ideas, political revolutions, and industrialization's beginnings.",
 notes:[
  {h:"Enlightenment and political revolution",b:[
   "Enlightenment thinkers advanced **natural rights**, the social contract, popular sovereignty, and separation of powers, and inspired calls to end slavery and expand women's rights (Wollstonecraft).",
   "Revolutions: **American** (independence from Britain), **French** (overthrow of monarchy and society's restructuring), **Haitian** (the only successful large-scale slave revolt, creating the first Black republic), and **Latin American** (creole-led independence under Bolívar and San Martín).",
   "**Nationalism** became a new basis for states — unification in Germany and Italy, and independence movements within empires.",
   "Outcomes varied: the Haitian Revolution frightened slaveholding societies; Latin American independence left social hierarchies largely intact."]},
  {h:"Industrialization",b:[
   "Britain industrialized first because of coal and iron, waterways, capital, colonial markets, agricultural productivity, and favorable laws.",
   "Key shifts: the **factory system**, division of labor, steam power, railroads, and the **second industrial revolution** of steel, chemicals, and electricity.",
   "Industrialization spread to Belgium, France, Germany, the United States, Russia (state-led, Trans-Siberian Railway), and Japan after the **Meiji Restoration** — the clearest case of deliberate state-led industrialization.",
   "Ottoman and Qing attempts at reform (Tanzimat, Self-Strengthening Movement) were less successful, partly because of unequal treaties and internal resistance.",
   "**Economic theory** shifted: Adam Smith's free markets, then critiques by Marx and the rise of socialism."]}],
 tip:"For 'causes of industrialization' prompts, keep a list of five: resources, capital, labor supply, markets, and supportive government or legal institutions.",
 terms:["Enlightenment","natural rights","social contract","Haitian Revolution","Simón Bolívar","nationalism","factory system","second industrial revolution","Meiji Restoration","Tanzimat","Adam Smith","Marx"],
 cards:[
 ["Which Enlightenment ideas most influenced revolutions?","Natural rights, the social contract, popular sovereignty, and separation of powers."],
 ["Why is the Haitian Revolution historically unique?","It was the only large-scale slave revolt to create an independent state, establishing the first Black republic."],
 ["Why did Britain industrialize first?","Abundant coal and iron, navigable waterways, accumulated capital, colonial markets, a mobile labor force, and supportive laws."],
 ["What was the Meiji Restoration?","Japan's rapid, state-directed modernization and industrialization after 1868, adopting Western technology while asserting Japanese identity."],
 ["What was the Self-Strengthening Movement?","A Qing attempt to adopt Western military and industrial technology while preserving Confucian institutions; it had limited success."],
 ["What distinguishes the second industrial revolution?","Steel, chemicals, electricity, and precision machinery rather than textiles and steam alone."],
 ["How did nationalism change the map of Europe?","It drove the unification of Germany and Italy and independence movements that weakened multiethnic empires."]]},
{title:"Consequences of Industrialization (c. 1750–1900)",weight:[12,15],
 desc:"Imperialism, economic transformation, migration, and resistance.",
 notes:[
  {h:"Imperialism",b:[
   "Motives: raw materials and markets, strategic bases, nationalist competition, and ideological justifications including **Social Darwinism** and the 'civilizing mission'.",
   "Tools: steamships, quinine, the Maxim gun, telegraph, and the Suez Canal. The **Berlin Conference** partitioned Africa without African participation.",
   "Forms of control ranged from settler colonies to protectorates, spheres of influence in China, and **economic imperialism** in Latin America.",
   "Resistance was widespread: the **Indian Rebellion of 1857**, Ethiopia's victory at Adwa, the Boxer Rebellion, Zulu and Asante wars, and the Ghost Dance."]},
  {h:"Economic and social change",b:[
   "**Cash-crop and extractive economies** reorganized colonies around exports — cotton, rubber, palm oil, tea — creating dependence and famine vulnerability.",
   "New labor systems replaced slavery: **indentured servitude** (Indian and Chinese laborers worldwide), convict labor, and penal colonies, producing new diasporas.",
   "Migration surged: Europeans to the Americas, Chinese and Indians across the Indian and Pacific Oceans, with receiving societies often responding through exclusion laws and ethnic enclaves.",
   "Urbanization and industrial capitalism produced a new middle class, an industrial working class, labor unions, reform movements, and the beginnings of women's suffrage campaigns."]}],
 tip:"When a prompt mentions imperialism's effects, split your answer into economic reorganization, demographic movement, and resistance. It gives three distinct lines of evidence.",
 terms:["Social Darwinism","civilizing mission","Berlin Conference","sphere of influence","economic imperialism","Indian Rebellion of 1857","Battle of Adwa","Boxer Rebellion","cash crop","indentured servitude","settler colony","labor union"],
 cards:[
 ["What technologies made late-19th-century imperialism possible?","Steamships, quinine against malaria, repeating firearms, the telegraph, and canals like Suez."],
 ["What was the Berlin Conference?","An 1884–85 meeting where European powers divided Africa among themselves with no African representation."],
 ["What was economic imperialism?","Controlling a region's economy through investment, loans, and trade dominance without formal political rule."],
 ["Why is the Battle of Adwa significant?","Ethiopia defeated Italy, remaining independent and becoming a symbol of successful African resistance."],
 ["What replaced slavery as a coerced labor system after abolition?","Indentured servitude, especially of Indian and Chinese laborers, along with convict and penal labor."],
 ["How did cash-crop economies make colonies vulnerable?","Dependence on a single export left them exposed to price swings and unable to feed themselves in a crisis."],
 ["Name two responses of receiving societies to mass migration","Exclusion laws targeting specific nationalities and the formation of ethnic enclaves in cities."]]},
{title:"Global Conflict (c. 1900–present)",weight:[8,10],
 desc:"The world wars, total war, and mass atrocity.",
 notes:[
  {h:"World War I and the interwar years",b:[
   "Causes: nationalism, militarism, alliance systems, imperial rivalry, and the assassination at Sarajevo as trigger.",
   "**Total war** mobilized whole societies: conscription, war economies, propaganda, and women in industry. Colonial troops and resources were drawn in, raising expectations of postwar reform.",
   "The war toppled four empires (Russian, Ottoman, Austro-Hungarian, German); the **Treaty of Versailles** imposed reparations and created the mandate system.",
   "The **Russian Revolution** produced the first communist state. The Great Depression discredited liberal economics and enabled authoritarian movements.",
   "**Fascism** in Italy and **Nazism** in Germany combined extreme nationalism, militarism, a cult of leadership, and scapegoating; Japan pursued expansion in Asia."]},
  {h:"World War II and atrocity",b:[
   "Causes: unresolved grievances, failure of collective security and appeasement, economic collapse, and expansionist ideologies.",
   "Total war intensified: strategic bombing of cities, the Holocaust, the atomic bombings of Hiroshima and Nagasaki, and tens of millions of civilian deaths.",
   "The **Holocaust** was the systematic murder of six million Jews along with Roma, disabled people, and others — the central case in the century's history of state-sponsored mass violence, alongside the Armenian genocide and later Rwanda and Cambodia.",
   "The war ended European global dominance, created the United Nations, and set up a bipolar Cold War order."]}],
 tip:"Total war is the concept that unites this unit. For any world war prompt, identify how the state mobilized economy, population, and ideology.",
 terms:["total war","Treaty of Versailles","mandate system","Russian Revolution","Great Depression","fascism","Nazism","appeasement","Holocaust","genocide","United Nations"],
 cards:[
 ["What does total war mean?","Mobilizing an entire society — economy, population, propaganda — for warfare, erasing the line between military and civilian."],
 ["Four long-term causes of World War I","Nationalism, militarism, entangling alliances, and imperial rivalry."],
 ["What was the mandate system?","Former Ottoman and German territories administered by Allied powers under League of Nations supervision — colonialism under a new name."],
 ["How did colonial participation in the world wars affect empires?","It raised expectations of self-rule and strengthened independence movements when those expectations were denied."],
 ["Why did appeasement fail?","Concessions to expansionist powers increased rather than satisfied their demands."],
 ["How did fascism differ from earlier conservatism?","It was mass-mobilizing, militaristic, built on a leader cult, and defined the nation against internal enemies."],
 ["What global institution emerged from World War II to prevent future wars?","The United Nations."]]},
{title:"Cold War and Decolonization (c. 1900–present)",weight:[8,10],
 desc:"Superpower rivalry, independence movements, and new nations.",
 notes:[
  {h:"The Cold War",b:[
   "A bipolar contest between capitalist and communist models, fought through alliances (NATO, Warsaw Pact), proxy wars (Korea, Vietnam, Afghanistan, Angola), an arms race, and a space race.",
   "Nuclear weapons created deterrence and near-catastrophe (the Cuban Missile Crisis). The **Non-Aligned Movement** sought a third path.",
   "Communist states pursued **state-directed economies**: Soviet five-year plans and collectivization, China's Great Leap Forward and Cultural Revolution, with enormous human costs and some industrial gains.",
   "Market reforms under Deng Xiaoping and Gorbachev's glasnost and perestroika preceded the Soviet collapse in 1991."]},
  {h:"Decolonization",b:[
   "Weakened empires, wartime promises, and mobilized nationalist movements produced a wave of independence after 1945.",
   "Methods ranged from negotiated transfer (**India**, 1947, with Gandhi's nonviolent resistance and a violent partition) to armed struggle (**Algeria**, Vietnam) to protracted liberation war (Angola, Mozambique).",
   "New nations faced arbitrary colonial borders, single-crop economies, ethnic division, and Cold War pressure to choose sides.",
   "Challenges to existing states continued — apartheid's end in South Africa, the partition of Pakistan and Bangladesh, and redrawn borders after 1991."]}],
 tip:"When comparing decolonization movements, contrast the method (negotiation versus armed struggle) and the post-independence problem (borders, economy, or ethnic division).",
 terms:["bipolar world","proxy war","NATO","Warsaw Pact","Non-Aligned Movement","five-year plan","Great Leap Forward","Cultural Revolution","glasnost","perestroika","decolonization","partition","apartheid"],
 cards:[
 ["What was a Cold War proxy war?","A conflict in a third country where the superpowers backed opposing sides rather than fighting each other directly."],
 ["What was the Non-Aligned Movement?","An alliance of newly independent states refusing to commit to either Cold War bloc."],
 ["What were the results of the Great Leap Forward?","Forced collectivization and unrealistic industrial targets produced a catastrophic famine with tens of millions of deaths."],
 ["What were glasnost and perestroika?","Gorbachev's policies of political openness and economic restructuring, which accelerated the Soviet collapse."],
 ["Contrast Indian and Algerian decolonization","India gained independence mainly through negotiated transfer after mass nonviolent resistance; Algeria required a long and violent war against France."],
 ["What was partition in South Asia?","The 1947 division of British India into India and Pakistan, causing mass migration and communal violence."],
 ["Three challenges facing newly independent states","Arbitrary colonial borders, economies built around a single export, and Cold War pressure to align."]]},
{title:"Globalization (c. 1900–present)",weight:[8,10],
 desc:"Technology, the environment, economic integration, and global culture.",
 notes:[
  {h:"Science, technology, and environment",b:[
   "Medical advances (antibiotics, vaccines, the Green Revolution) extended life expectancy and drove population growth, shifting disease burdens toward chronic illness.",
   "Energy use, industrial agriculture, and urbanization produced **deforestation, air and water pollution, and climate change**, prompting international agreements and an environmental movement.",
   "Communication and transport technologies — containerization, air travel, satellites, the internet — compressed distance and made global supply chains possible."]},
  {h:"Economic and cultural globalization",b:[
   "**Multinational corporations**, free-trade agreements, and institutions (IMF, World Bank, WTO) knit economies together; **knowledge economies** replaced manufacturing in wealthy states while production moved to lower-wage regions.",
   "Critics point to inequality, labor exploitation, environmental cost, and loss of local economic control; supporters point to poverty reduction and growth.",
   "Culture globalized unevenly: mass media, sport, and consumer brands spread worldwide while **religious revivals**, nationalist movements, and local traditions asserted themselves.",
   "Movements for human rights — decolonization, civil rights, women's rights, and indigenous rights — became global in language and network.",
   "Migration and refugee flows, driven by conflict, economics, and climate, made citizenship and borders a central political question."]}],
 tip:"Globalization prompts want both integration and resistance. Pair an example of connection with an example of backlash.",
 terms:["Green Revolution","climate change","containerization","multinational corporation","IMF","WTO","knowledge economy","religious revival","human rights","refugee"],
 cards:[
 ["What was the Green Revolution?","The spread of high-yield crop varieties, fertilizers, and irrigation that greatly increased food production — with environmental and social costs."],
 ["How did containerization change the global economy?","Standardized shipping drastically cut transport costs, enabling globally dispersed supply chains."],
 ["What role do multinational corporations play in globalization?","They organize production across borders, seeking lower costs and new markets, which shifts manufacturing toward lower-wage regions."],
 ["Name two criticisms of economic globalization","Rising inequality and exploitation of labor and environments in producing regions."],
 ["Give an example of cultural resistance to globalization","Religious revival movements and nationalist politics asserting local identity against global consumer culture."],
 ["Which global institutions manage the international economy?","The International Monetary Fund, the World Bank, and the World Trade Organization."]]}
],
qbank:[
{u:1,q:"Which best explains the spread of Islam in South and Southeast Asia?",c:["Military conquest alone","Sufi missionaries and merchant networks","Forced conversion by the Delhi Sultanate","Mongol policy"],a:1,e:"Sufism's adaptability and Muslim merchants' trading presence made gradual conversion common."},
{u:2,q:"The Mongol Empire most affected Eurasian trade by",c:["closing the Silk Roads","making long-distance overland trade safer","banning foreign merchants","introducing the compass"],a:1,e:"The Pax Mongolica secured the routes and encouraged exchange of goods, people, and technology."},
{u:2,q:"Monsoon winds were essential to",c:["trans-Saharan caravans","Indian Ocean trade","Silk Road travel","Mediterranean galleys"],a:1,e:"Seasonal wind reversals set the timing of Indian Ocean voyages."},
{u:3,q:"The Ottoman devshirme system was designed to",c:["convert Christians by force","create officials loyal directly to the sultan","raise taxes from minorities","settle nomadic groups"],a:1,e:"Recruits had no independent power base, making them dependent on the sultan."},
{u:3,q:"Akbar's policies toward Hindus are best described as",c:["persecution","tolerance and administrative inclusion","forced relocation","indifference"],a:1,e:"He reduced discriminatory taxes and appointed Hindus to high office."},
{u:4,q:"The global flow of silver in the 16th and 17th centuries primarily ended up in",c:["West Africa","China","Russia","the Ottoman Empire"],a:1,e:"Chinese demand for silver as currency drew bullion from the Americas through Manila and Europe."},
{u:4,q:"A joint-stock company's main advantage was",c:["state ownership","spreading the financial risk of voyages among many investors","eliminating competition","avoiding taxes"],a:1,e:"Shared risk made expensive long-distance ventures feasible."},
{u:5,q:"The Haitian Revolution is distinctive because it",c:["was led by creole elites","created the first state founded by formerly enslaved people","restored monarchy","avoided violence"],a:1,e:"It was the only large-scale slave revolt to establish an independent nation."},
{u:5,q:"The Meiji Restoration is the clearest example of",c:["resistance to industrialization","state-directed industrialization","colonial economic dependence","religious revival"],a:1,e:"Japan's government deliberately imported technology and restructured institutions to industrialize rapidly."},
{u:6,q:"The Berlin Conference is significant because it",c:["ended the Atlantic slave trade","partitioned Africa among European powers without African participation","created the League of Nations","opened China to trade"],a:1,e:"It formalized the Scramble for Africa on European terms."},
{u:6,q:"After abolition, plantation economies most often turned to",c:["mechanization","indentured labor from Asia","free wage labor from Europe","abandoning cash crops"],a:1,e:"Indian and Chinese indentured laborers filled the labor gap, creating new diasporas."},
{u:7,q:"The Treaty of Versailles contributed to World War II primarily by",c:["disarming France","imposing reparations and humiliation on Germany","creating the United Nations","dividing Africa"],a:1,e:"Economic burden and national resentment fed the appeal of extremist movements."},
{u:8,q:"The Non-Aligned Movement sought to",c:["join NATO","avoid commitment to either Cold War bloc","restore colonial rule","build nuclear weapons"],a:1,e:"Newly independent states pursued independent development rather than superpower alignment."},
{u:9,q:"Containerization most directly enabled",c:["the Green Revolution","globally dispersed supply chains","decolonization","the space race"],a:1,e:"Cheap standardized shipping made it economical to manufacture components in many countries."}
]

],
units:[
{title:"Renaissance and Exploration (1450–1648)",weight:[10,15],
 desc:"Humanism, new monarchies, commercial growth, and overseas expansion.",
 notes:[
  {h:"Renaissance thought and art",b:[
   "**Humanism** studied classical texts to cultivate human potential and civic virtue; **Petrarch** and later **Erasmus** (Christian humanism) shaped the movement.",
   "Civic humanism in Italian city-states linked learning to public service; **Machiavelli's** *The Prince* separated political effectiveness from Christian morality.",
   "Artistic innovations — linear perspective, anatomical realism, oil painting, classical forms — were funded by patrons like the Medici.",
   "The **printing press** (Gutenberg, c. 1450) multiplied texts, raised literacy, standardized languages, and made both Renaissance and Reformation ideas spread rapidly.",
   "The Northern Renaissance was more religious in emphasis and used vernacular languages."]},
  {h:"New monarchies and exploration",b:[
   "**New monarchs** (Ferdinand and Isabella, Henry VII, Francis I) centralized taxation, reduced noble independence, built standing armies, and asserted control over the church within their realms.",
   "Motives for exploration combined state competition, commercial ambition, and religious mission; Portugal and Spain led, followed by the Dutch, English, and French.",
   "The **Commercial Revolution** brought joint-stock companies, banking, insurance, and a price revolution fed by American silver.",
   "Overseas empires and the Atlantic slave trade enriched Atlantic states and shifted Europe's economic center from the Mediterranean to the Atlantic coast."]}],
 tip:"The printing press is the single most useful piece of evidence in this period — it connects humanism, Reformation, and state power.",
 terms:["humanism","Petrarch","Erasmus","Machiavelli","patronage","printing press","Northern Renaissance","new monarchy","Commercial Revolution","price revolution"],
 cards:[
 ["What was Renaissance humanism?","A movement studying classical texts to develop human potential, eloquence, and civic virtue."],
 ["How did Christian humanism differ from Italian humanism?","It applied classical scholarship to scripture and church reform rather than civic life, as with Erasmus."],
 ["Why was Machiavelli's The Prince significant?","It analyzed political power on its own terms, separating effective rule from Christian moral standards."],
 ["Three effects of the printing press","Rapid spread of ideas, rising literacy, and standardization of vernacular languages."],
 ["What defined a 'new monarchy'?","Centralized taxation, reduced noble power, standing armies, and royal control over the church in its territory."],
 ["What was the price revolution?","Sustained inflation in 16th-century Europe driven largely by the influx of American silver."]]},
{title:"Age of Reformation (1450–1648)",weight:[10,15],
 desc:"Protestantism, Catholic reform, religious war, and social consequences.",
 notes:[
  {h:"Reformation",b:[
   "**Luther** attacked indulgences and taught salvation by faith alone, scripture alone, and the priesthood of all believers; the printing press spread his argument in weeks.",
   "**Calvin** emphasized predestination and built a disciplined Geneva; Calvinism spread to Scotland, the Netherlands, and France.",
   "The **English Reformation** began as a dynastic and political break under Henry VIII, producing a church that kept much Catholic form.",
   "Radical reformers (Anabaptists) rejected infant baptism and state churches and were persecuted by Catholics and Protestants alike.",
   "German princes used the Reformation to assert independence from the emperor; the **Peace of Augsburg (1555)** let rulers choose between Lutheranism and Catholicism."]},
  {h:"Catholic reform and religious war",b:[
   "The **Council of Trent** reaffirmed doctrine, reformed clerical abuses, and standardized training; the **Jesuits** led education and missionary work; the Index and Inquisition enforced orthodoxy.",
   "Religious warfare: the French Wars of Religion ending with Henry IV and the **Edict of Nantes**, the Dutch Revolt against Spain, and the **Thirty Years' War (1618–48)**.",
   "The **Peace of Westphalia (1648)** recognized state sovereignty over religion, effectively ending large-scale religious war and establishing the modern state system.",
   "Social consequences: clerical marriage, new emphasis on education and literacy, changed ideas about family and charity, and intensified **witch hunts** amid social stress."]}],
 tip:"Distinguish religious causes from political ones in the wars of religion. Most DBQ complexity points come from showing both operating together.",
 terms:["indulgences","Luther","sola fide","Calvin","predestination","Anabaptists","Peace of Augsburg","Council of Trent","Jesuits","Edict of Nantes","Thirty Years' War","Peace of Westphalia","witch hunts"],
 cards:[
 ["What were Luther's central theological claims?","Salvation by faith alone, authority of scripture alone, and the priesthood of all believers."],
 ["What was Calvin's distinctive doctrine?","Predestination — that God has already determined who will be saved."],
 ["How did the English Reformation differ from the German one?","It began for dynastic and political reasons under Henry VIII and retained much Catholic structure and ritual."],
 ["What did the Council of Trent accomplish?","It reaffirmed Catholic doctrine, corrected clerical abuses, and required seminaries to train priests."],
 ["What did the Peace of Augsburg establish?","That each German prince could choose Lutheranism or Catholicism for his territory."],
 ["Why is the Peace of Westphalia a turning point?","It recognized state sovereignty in religious matters and established the framework of the modern European state system."],
 ["Why did witch hunts intensify in this period?","Religious conflict, economic hardship, and social anxiety combined with intensified concern about heresy and the devil."]]},
{title:"Absolutism and Constitutionalism (1648–1815)",weight:[10,15],
 desc:"Two answers to the problem of sovereignty, and the balance of power.",
 notes:[
  {h:"Absolutism",b:[
   "**Louis XIV** is the model: divine-right theory, Versailles as a device to domesticate the nobility, intendants for administration, Colbert's mercantilism, and revocation of the Edict of Nantes.",
   "Eastern absolutism rested on different foundations: Prussia's army and Junker alliance, Austria's multiethnic Habsburg dynasty, and Russia's **Peter the Great** forcing Westernization and building St. Petersburg.",
   "Absolutist states built standing armies and bureaucracies funded by taxation — the fiscal-military state.",
   "Limits were real: noble privilege, regional law, and the cost of war constrained every absolute monarch."]},
  {h:"Constitutionalism and the balance of power",b:[
   "**England** moved the other way: the Civil War, Cromwell's republic, the Restoration, and the **Glorious Revolution (1688)** with the English Bill of Rights establishing parliamentary supremacy.",
   "The Dutch Republic combined commercial dominance, religious toleration, and oligarchic republican government.",
   "**Balance of power** diplomacy replaced religious war as the organizing logic, from the War of Spanish Succession to the Seven Years' War.",
   "**Enlightened absolutism** (Frederick the Great, Joseph II, Catherine the Great) applied reform from above — legal codes, religious toleration, education — without surrendering power.",
   "The **Partitions of Poland** show the balance of power at its most cynical."]}],
 tip:"A classic LEQ asks you to compare absolutism and constitutionalism. Organize by sovereignty, taxation, and the role of the nobility.",
 terms:["divine right","Louis XIV","Versailles","intendant","Colbert","Peter the Great","fiscal-military state","Glorious Revolution","English Bill of Rights","Dutch Republic","balance of power","enlightened absolutism","Partitions of Poland"],
 cards:[
 ["How did Versailles serve Louis XIV politically?","It drew the nobility into court ritual and dependence, keeping them away from independent regional power."],
 ["What was an intendant?","A royal official sent to administer a French province, bypassing local noble authority."],
 ["What did the Glorious Revolution establish?","Parliamentary supremacy over the monarchy, confirmed by the English Bill of Rights."],
 ["How did Peter the Great change Russia?","He forced Westernization of the military, administration, dress, and education, and built St. Petersburg as a window on Europe."],
 ["What is balance-of-power diplomacy?","Forming alliances to prevent any single state from dominating Europe."],
 ["What was enlightened absolutism?","Rulers adopting Enlightenment reforms — legal codes, toleration, education — while keeping absolute authority."],
 ["What limited absolute monarchs in practice?","Entrenched noble privileges, regional laws and customs, and the financial strain of warfare."]]},
{title:"Scientific, Philosophical, and Political Developments (1648–1815)",weight:[10,15],
 desc:"The Scientific Revolution, the Enlightenment, and a new public sphere.",
 notes:[
  {h:"Scientific Revolution",b:[
   "**Copernicus, Kepler, Galileo, Newton**: a heliocentric, mathematically described universe governed by natural law, confirmed by observation.",
   "Method mattered as much as findings: **Bacon's** empiricism and induction, **Descartes'** deductive rationalism and systematic doubt.",
   "Conflict with religious authority (Galileo's trial) was real but uneven; many scientists were devout and saw natural law as divine order.",
   "New institutions — the Royal Society, academies, journals — made science a collective enterprise."]},
  {h:"Enlightenment",b:[
   "Reason applied to human society: **Locke** (natural rights, government by consent, tabula rasa), **Montesquieu** (separation of powers), **Voltaire** (religious toleration, free expression), **Rousseau** (general will, popular sovereignty), **Smith** (free markets).",
   "**Mary Wollstonecraft** extended Enlightenment logic to women's education and rights; salons hosted by women were central to intellectual life.",
   "**Diderot's Encyclopédie**, coffeehouses, salons, and print culture created a **public sphere** where opinion could form independently of church and crown.",
   "Religion adapted: deism, Jansenism, Pietism, and Methodism responded to rationalism in different ways.",
   "The Enlightenment's social ideas reshaped attitudes toward childhood, education, punishment, slavery, and the family."]}],
 tip:"Pair every Enlightenment thinker with one concrete political consequence. 'Montesquieu's separation of powers shaped the American constitution' is the kind of evidence that scores.",
 terms:["heliocentrism","Newton","empiricism","Bacon","Descartes","Royal Society","Locke","Montesquieu","Voltaire","Rousseau","Adam Smith","Wollstonecraft","Encyclopédie","public sphere","deism"],
 cards:[
 ["What was the core shift of the Scientific Revolution?","From authority-based natural philosophy to observation, experiment, and mathematical description of natural law."],
 ["Contrast Bacon and Descartes","Bacon advocated empirical induction from observation; Descartes argued for deductive reasoning from indubitable first principles."],
 ["What did Locke argue about government?","That governments exist by consent to protect natural rights and may be replaced if they fail."],
 ["What was Montesquieu's key contribution?","Separation of powers among branches of government to prevent tyranny."],
 ["What did Rousseau mean by the general will?","The collective interest of the people, which legitimate government must express."],
 ["What did Wollstonecraft argue?","That women's apparent inferiority came from lack of education, and that Enlightenment rights must extend to women."],
 ["What was the public sphere?","Coffeehouses, salons, journals, and print culture where public opinion formed outside church and state control."]]},
{title:"Conflict, Crisis, and Reaction in the Late 18th Century",weight:[10,15],
 desc:"The French Revolution, Napoleon, and the conservative restoration.",
 notes:[
  {h:"The French Revolution",b:[
   "Causes: fiscal crisis from war debt, a rigid estate system, bad harvests and bread prices, Enlightenment ideas, and the example of the American Revolution.",
   "Phases: Estates-General and Tennis Court Oath; the **Declaration of the Rights of Man**; the constitutional monarchy; the radical republic and the **Terror** under Robespierre and the Committee of Public Safety; then the Thermidorian reaction and Directory.",
   "The revolution reorganized everything: abolition of feudal privilege, church lands nationalized (Civil Constitution of the Clergy), metric system, new legal equality for men.",
   "Women participated actively (the march to Versailles, political clubs) but the Republic denied them political rights; **Olympe de Gouges** protested and was executed.",
   "The **Haitian Revolution** forced the question of whether revolutionary rights applied to the colonies and the enslaved."]},
  {h:"Napoleon and restoration",b:[
   "Napoleon consolidated revolutionary gains while ending political liberty: the **Napoleonic Code**, concordat with the papacy, meritocratic administration, and censorship.",
   "His conquests spread legal equality and nationalism across Europe and provoked nationalist resistance in Spain, Germany, and Russia — the reason for his defeat as much as winter or Britain's navy.",
   "The **Congress of Vienna (1815)** under Metternich pursued legitimacy, compensation, and balance of power, restoring monarchies and containing France.",
   "**Conservatism** became an articulated ideology (Burke) against the liberal and nationalist forces the revolution unleashed. The 1820s–1848 revolts show the restoration's instability."]}],
 tip:"For French Revolution prompts, keep the phases straight. Much of the available credit comes from placing an event in the correct phase and explaining its logic.",
 terms:["Estates-General","Declaration of the Rights of Man","Reign of Terror","Robespierre","Olympe de Gouges","Napoleonic Code","nationalism","Congress of Vienna","Metternich","conservatism","Burke"],
 cards:[
 ["Four causes of the French Revolution","Fiscal crisis from war debt, the inequitable estate system, food shortages and high prices, and Enlightenment political ideas."],
 ["What did the Declaration of the Rights of Man proclaim?","Legal equality, natural rights, popular sovereignty, and freedom of religion and expression for men."],
 ["What was the Reign of Terror?","A period of mass executions under the Committee of Public Safety, justified as defending the Republic from internal and foreign enemies."],
 ["What did the Napoleonic Code preserve and what did it restrict?","It preserved legal equality among men, property rights, and religious toleration, while restricting women's legal standing and political liberty."],
 ["How did Napoleon's conquests spread nationalism?","French reforms and occupation provoked conquered peoples to define and defend their own national identities."],
 ["What principles guided the Congress of Vienna?","Legitimacy of restored monarchies, compensation for the victors, and a balance of power to contain France."],
 ["What was conservatism as an ideology?","A defense of tradition, established religion, hierarchy, and gradual change, articulated against revolutionary rationalism by Burke and others."]]},
{title:"Industrialization and Its Effects (1815–1914)",weight:[10,15],
 desc:"Industrial capitalism, urbanization, class, and reform.",
 notes:[
  {h:"Industrialization",b:[
   "Britain led because of coal and iron, canals and ports, agricultural productivity, capital, colonial markets, and a legal system favorable to enterprise.",
   "Railroads and steamships transformed markets and migration; the **second industrial revolution** brought steel, chemicals, and electricity, with Germany taking the lead in science-based industry.",
   "Continental industrialization was often state-supported (railroads, technical education, tariffs), producing a different relationship between government and industry.",
   "Eastern and southern Europe industrialized later and less completely, with serfdom's legacy and weaker capital markets as obstacles."]},
  {h:"Society and response",b:[
   "Urbanization brought overcrowding, disease, and then sanitary reform, public health boards, and municipal planning.",
   "A **middle class** defined itself through respectability, domestic ideology, and consumption; the **working class** formed unions, mutual aid societies, and political parties.",
   "Family and gender: the separate-spheres ideal for the middle class, wage work for working-class women and children, then protective legislation and falling birth rates late in the century.",
   "Responses to industrial capitalism: **liberalism** (free trade, limited government, property-based suffrage), **socialism** (utopian, then **Marxist**), **anarchism**, and Catholic social teaching.",
   "Reform over the century extended suffrage, limited hours, regulated factories, and built mass education — often in response to organized pressure rather than benevolence."]}],
 tip:"Avoid describing industrialization only as misery. The strongest essays show improvement over time and explain what caused it.",
 terms:["second industrial revolution","urbanization","sanitary reform","middle class","separate spheres","trade union","liberalism","utopian socialism","Marxism","anarchism","mass education"],
 cards:[
 ["Why did Britain industrialize first?","Coal and iron, transport networks, agricultural surplus, available capital, colonial markets, and supportive law."],
 ["How did continental industrialization differ from Britain's?","It was more often state-sponsored, with government investment in railroads, tariffs, and technical education."],
 ["What characterized the second industrial revolution?","Steel, chemicals, electricity, and science-based industry, with Germany a leader."],
 ["What was the separate-spheres ideology?","The middle-class ideal that men belonged in public economic life and women in the domestic household."],
 ["What did Marx argue about industrial society?","That class conflict between bourgeoisie and proletariat was inherent and would lead to revolution and a classless society."],
 ["Name three 19th-century reforms responding to industrial conditions","Factory acts limiting hours and child labor, public health and sanitation measures, and expanded suffrage."]]},
{title:"19th-Century Perspectives and Political Developments",weight:[10,15],
 desc:"Nationalism, unification, mass politics, imperialism, and cultural change.",
 notes:[
  {h:"Nationalism and unification",b:[
   "**1848** revolutions across Europe demanded liberal constitutions and national self-determination; most failed but permanently changed the political agenda.",
   "**Realpolitik**: Cavour in Italy and **Bismarck** in Germany used war and diplomacy rather than liberal idealism to unify their nations. German unification (1871) remade the balance of power.",
   "Multiethnic empires — Austria-Hungary, Russia, Ottoman — struggled to contain nationalist movements, which became the fault line leading to 1914.",
   "Mass politics emerged with wider suffrage, organized parties, popular press, and state-sponsored nationalism through schooling and conscription."]},
  {h:"Imperialism and culture",b:[
   "Motives for the **New Imperialism**: markets and raw materials, strategic competition, missionary impulse, and racial and Social Darwinist ideology.",
   "Consequences in Europe: nationalist rivalry, naval arms races, and alliance systems; in colonies: extractive economies, resistance, and new diasporas.",
   "Intellectual and cultural shifts: **Romanticism**'s emphasis on emotion and nation, then realism, then the crisis of certainty — Darwin, Nietzsche, Freud, and modernist art breaking with representation.",
   "Science and medicine (germ theory, vaccination, anesthesia) raised life expectancy and state capacity; secularization grew uneven and contested.",
   "Jewish emancipation coexisted with new racial **antisemitism** (the Dreyfus Affair), prompting **Zionism**."]}],
 tip:"For unification prompts, contrast the failed liberal nationalism of 1848 with the successful conservative Realpolitik of the 1860s. That comparison is the essay.",
 terms:["1848 revolutions","Realpolitik","Cavour","Bismarck","German unification","mass politics","New Imperialism","Social Darwinism","Romanticism","Darwin","Nietzsche","Freud","modernism","antisemitism","Zionism"],
 cards:[
 ["What did the 1848 revolutions demand, and what came of them?","Liberal constitutions and national self-determination; nearly all were suppressed, but their goals shaped later politics."],
 ["What is Realpolitik?","Politics based on practical power and interest rather than ideology or morality — Bismarck's method."],
 ["How did German unification change Europe?","A powerful industrial Germany at the center upset the balance of power and drove alliance-building and arms races."],
 ["What were the main motives of the New Imperialism?","Economic gain, strategic rivalry, missionary aims, and racial ideologies such as Social Darwinism."],
 ["How did Darwin, Nietzsche, and Freud unsettle 19th-century confidence?","They undercut ideas of divine design, objective morality, and rational self-control respectively."],
 ["What was the Dreyfus Affair?","A French scandal in which a Jewish officer was wrongly convicted of treason, exposing deep antisemitism and dividing the republic."],
 ["What prompted the rise of Zionism?","Persistent antisemitism despite legal emancipation convinced some Jews that a national homeland was necessary."]]},
{title:"20th-Century Global Conflicts",weight:[10,15],
 desc:"The world wars, revolution, depression, and dictatorship.",
 notes:[
  {h:"World War I and revolution",b:[
   "Causes: alliance systems, arms races, nationalist rivalry in the Balkans, imperial competition, and war plans that rewarded speed.",
   "**Total war**: trench stalemate, industrial slaughter, rationing, propaganda, women in war industries, and colonial troops.",
   "The **Russian Revolution** (1917) brought the Bolsheviks to power; civil war, war communism, then Lenin's New Economic Policy and Stalin's five-year plans and collectivization with famine and terror.",
   "Versailles left grievances: reparations, war-guilt, lost territory, and new unstable states in central Europe. The League of Nations lacked enforcement power."]},
  {h:"Depression, dictatorship, and World War II",b:[
   "The **Great Depression** discredited liberal economics, produced mass unemployment, and strengthened both communist and fascist movements.",
   "**Fascism** in Italy and **Nazism** in Germany: mass mobilization, leader cults, corporatist economies, suppression of opposition, and in Germany a racial ideology culminating in the **Holocaust**.",
   "Appeasement, the Spanish Civil War, and the Nazi-Soviet Pact preceded war in 1939. Blitzkrieg, occupation, resistance movements, and collaboration defined the European war.",
   "Outcomes: tens of millions dead, Europe divided, decolonization accelerated, and European global dominance ended."]}],
 tip:"Distinguish fascism from communism concretely — on property, class, and the nation — rather than calling both 'totalitarian' and stopping there.",
 terms:["alliance system","total war","Russian Revolution","Lenin","Stalin","five-year plan","Treaty of Versailles","League of Nations","Great Depression","fascism","Nazism","Holocaust","appeasement","blitzkrieg","resistance"],
 cards:[
 ["Why did the alliance system make a local crisis into a world war?","Mutual commitments meant a Balkan conflict automatically drew in the great powers."],
 ["How did World War I change the role of the state?","Governments directed economies, rationed goods, conscripted labor, and managed propaganda on an unprecedented scale."],
 ["What were Stalin's five-year plans?","Centrally planned drives for rapid heavy industrialization, accompanied by forced collectivization and famine."],
 ["How did the Great Depression strengthen extremist movements?","Mass unemployment and the apparent failure of liberal capitalism made radical alternatives credible."],
 ["How did fascism differ from communism?","Fascism preserved private property and glorified the nation and hierarchy; communism sought to abolish class and private ownership in the name of the international proletariat."],
 ["What was appeasement and why did it fail?","Conceding to Hitler's demands to avoid war; it strengthened rather than satisfied his ambitions."]]},
{title:"Cold War and Contemporary Europe",weight:[10,15],
 desc:"Division, recovery, integration, and the post-Cold War order.",
 notes:[
  {h:"Cold War Europe",b:[
   "Europe was divided: the **Marshall Plan** and NATO in the West, Soviet-imposed governments, Comecon, and the Warsaw Pact in the East, with Germany and Berlin the front line.",
   "Western Europe built **welfare states** and experienced sustained growth; Christian Democratic and Social Democratic parties dominated, and consumer society expanded.",
   "Eastern Europe saw periodic revolts (Hungary 1956, Prague 1968, Solidarity in Poland) suppressed or contained under the Brezhnev Doctrine.",
   "Decolonization cost Europe its empires, sometimes violently (Algeria), and brought large-scale migration from former colonies, reshaping European societies and debates about national identity."]},
  {h:"Integration and after 1989",b:[
   "European integration advanced from the Coal and Steel Community to the EEC and then the **European Union** and the euro — economic cooperation as the answer to a century of war.",
   "**1989**: the revolutions in Eastern Europe and the fall of the Berlin Wall; German reunification; the Soviet collapse in 1991; violent disintegration in Yugoslavia.",
   "Contemporary issues: EU expansion and euroskepticism, migration and refugee policy, aging populations, secularization alongside religious pluralism, second-wave and later feminism, environmental politics, and populist nationalism.",
   "Recurring course threads: the sources of state authority, the tension between national identity and wider European identity, and Europe's changing place in the world."]}],
 tip:"For post-1945 prompts, pair a Western development with its Eastern counterpart. Division is the organizing idea of the period.",
 terms:["Marshall Plan","NATO","Warsaw Pact","welfare state","Hungarian Revolution","Prague Spring","Solidarity","decolonization","European Union","euro","1989","German reunification","Yugoslav wars","euroskepticism","populism"],
 cards:[
 ["What was the Marshall Plan's purpose?","To rebuild Western European economies, stabilizing them against communist appeal and restoring trade partners."],
 ["What was the welfare state?","Postwar Western European systems of healthcare, pensions, unemployment insurance, and education funded by taxation."],
 ["Name two Eastern European challenges to Soviet control","The Hungarian Revolution of 1956 and the Prague Spring of 1968 (also Solidarity in Poland)."],
 ["Why did European integration begin with coal and steel?","Pooling the industries of war made another Franco-German war materially harder and built trust for wider cooperation."],
 ["What happened in Europe in 1989?","Communist governments fell across Eastern Europe and the Berlin Wall opened, leading to German reunification."],
 ["How did decolonization change European societies?","It ended empires and brought substantial migration from former colonies, reshaping demographics and debates over national identity."],
 ["Name two contemporary challenges facing the European Union","Euroskepticism and populist nationalism, and migration and refugee policy (also aging populations and economic divergence)."]]}
],
