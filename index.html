units:[
{title:"Chemistry of Life",weight:[8,11],
 desc:"Water, carbon, macromolecules, and the chemistry that makes biology possible.",
 notes:[
  {h:"Water and its properties",b:[
   "Water is **polar** and forms **hydrogen bonds**, which explain nearly all of its biological properties.",
   "**Cohesion** (water to water) and **adhesion** (water to surfaces) drive capillary action and the transpiration stream in plants.",
   "High **specific heat** and high heat of vaporization buffer temperature; evaporative cooling removes heat efficiently.",
   "Ice floats because hydrogen bonds lock into a less dense lattice, insulating the water below.",
   "Water is the universal solvent for polar and ionic substances (**hydrophilic**); nonpolar substances are **hydrophobic**."]},
  {h:"Carbon and functional groups",b:[
   "Carbon forms four covalent bonds, enabling chains, branches, and rings — the basis of macromolecular diversity.",
   "Functional groups confer properties: hydroxyl (polar), carboxyl (acidic), amino (basic), phosphate (negative charge, energy transfer), methyl (nonpolar).",
   "**Isomers** have the same formula but different arrangements and therefore different function — a recurring theme in enzyme specificity."]},
  {h:"The four macromolecules",b:[
   "**Dehydration synthesis** joins monomers by removing water; **hydrolysis** splits polymers by adding water.",
   "**Carbohydrates**: monosaccharides → polysaccharides. Starch and glycogen store energy; cellulose and chitin give structure because of their β linkages.",
   "**Lipids** are nonpolar: triglycerides store energy densely, phospholipids form bilayers (polar head, nonpolar tails), steroids act as signals. Saturated fats are straight and solid; unsaturated have double-bond kinks.",
   "**Proteins**: 20 amino acids joined by **peptide bonds**. Primary (sequence) → secondary (α helices, β sheets from backbone H bonds) → tertiary (R-group interactions) → quaternary (multiple subunits). **Structure determines function**, so denaturation by heat or pH destroys activity.",
   "**Nucleic acids**: nucleotides = sugar + phosphate + base. DNA is double-stranded, antiparallel, with A–T and G–C pairing; RNA is single-stranded with uracil. Both are built 5′ → 3′."]},
  {h:"Enzymes",b:[
   "Enzymes **lower activation energy** without changing ΔG or being consumed.",
   "The **active site** is specific to a substrate (induced fit). Optimal temperature and pH reflect the protein's stable conformation.",
   "**Competitive inhibitors** occupy the active site; **noncompetitive (allosteric)** inhibitors bind elsewhere and change the shape.",
   "Reaction rate rises with substrate concentration until enzymes are **saturated**, then plateaus."]}],
 tip:"When a question says a protein stopped working, the answer almost always traces back to a change in shape — and therefore a change in the active site or binding site.",
 terms:["hydrogen bond","cohesion","adhesion","specific heat","hydrophobic","dehydration synthesis","hydrolysis","peptide bond","denaturation","activation energy","competitive inhibitor","allosteric"],
 cards:[
 ["Why is water such a good solvent?","It is polar, so it surrounds and separates ions and other polar molecules."],
 ["Cohesion vs adhesion","Cohesion is water sticking to water; adhesion is water sticking to other surfaces."],
 ["Why does ice float?","Hydrogen bonds hold water in a crystalline lattice that is less dense than liquid water."],
 ["What reaction joins monomers into a polymer?","Dehydration synthesis — a water molecule is removed."],
 ["What reaction breaks a polymer apart?","Hydrolysis — a water molecule is added."],
 ["Which bond joins amino acids?","A peptide bond, formed between the carboxyl group of one and the amino group of the next."],
 ["What determines a protein's secondary structure?","Hydrogen bonding along the polypeptide backbone, producing α helices and β pleated sheets."],
 ["What determines tertiary structure?","Interactions among R groups — hydrophobic clustering, hydrogen bonds, ionic bonds, and disulfide bridges."],
 ["What do enzymes do to activation energy?","They lower it, speeding the reaction without changing the overall free energy change."],
 ["Competitive vs noncompetitive inhibition","Competitive inhibitors bind the active site; noncompetitive inhibitors bind elsewhere and change the enzyme's shape."],
 ["Why is cellulose indigestible to humans while starch is not?","Its β-glucose linkages are not recognized by human hydrolytic enzymes."],
 ["Three components of a nucleotide","A five-carbon sugar, a phosphate group, and a nitrogenous base."]]},
{title:"Cell Structure and Function",weight:[10,13],
 desc:"Compartments, membranes, transport, and why size matters.",
 notes:[
  {h:"Cell structure and surface area",b:[
   "Compartmentalization lets incompatible reactions proceed simultaneously and concentrates reactants.",
   "As a cell grows, volume increases faster than surface area, so the **surface-area-to-volume ratio falls** — this limits cell size and explains microvilli, root hairs, and flattened cells.",
   "Prokaryotes lack membrane-bound organelles and a nucleus; eukaryotes have both. Both have ribosomes, DNA, cytoplasm, and a plasma membrane.",
   "The **endosymbiotic theory** explains mitochondria and chloroplasts: a double membrane, circular DNA, and their own ribosomes point to a free-living bacterial origin."]},
  {h:"Membrane structure",b:[
   "The **fluid mosaic model**: a phospholipid bilayer with embedded proteins, cholesterol, and attached carbohydrates.",
   "Hydrophilic heads face the aqueous environments; hydrophobic tails face inward, making the membrane **selectively permeable**.",
   "Small nonpolar molecules (O₂, CO₂) cross freely; ions and large polar molecules require proteins.",
   "Cholesterol buffers fluidity; unsaturated tails keep membranes fluid at low temperature."]},
  {h:"Transport",b:[
   "**Passive transport** moves down a concentration gradient without ATP: simple diffusion, **facilitated diffusion** through channels or carriers, and **osmosis** for water (often through aquaporins).",
   "**Active transport** moves against the gradient using ATP — the sodium-potassium pump moves 3 Na⁺ out for 2 K⁺ in, creating an electrochemical gradient.",
   "**Secondary active transport** uses a gradient built by primary active transport.",
   "Bulk transport: **endocytosis** (phagocytosis, pinocytosis, receptor-mediated) brings material in; **exocytosis** releases it."]},
  {h:"Osmosis and water potential",b:[
   "Water moves from **high water potential to low water potential**. `Ψ = Ψ_p + Ψ_s`, and `Ψ_s = −iCRT`.",
   "**Hypertonic** solution (more solute outside) → cell loses water and shrinks (plasmolysis in plants). **Hypotonic** → cell gains water (lysis in animals; turgor in plants). **Isotonic** → no net movement.",
   "Pure water at atmospheric pressure has Ψ = 0; adding solute makes Ψ negative.",
   "Contractile vacuoles and cell walls are adaptations to osmotic stress."]}],
 tip:"Water potential problems are routine points: compute Ψ_s for both sides, compare, and state which direction water moves. Watch the units (i is the ionization count).",
 terms:["surface-area-to-volume ratio","endosymbiotic theory","fluid mosaic","selectively permeable","facilitated diffusion","active transport","sodium-potassium pump","water potential","hypertonic","plasmolysis"],
 cards:[
 ["Why can't cells grow indefinitely large?","The surface-area-to-volume ratio decreases, so the membrane cannot exchange materials fast enough for the volume."],
 ["Three pieces of evidence for endosymbiotic theory","Double membranes, their own circular DNA, and their own ribosomes resembling bacterial ones."],
 ["What does the fluid mosaic model describe?","A phospholipid bilayer with embedded and attached proteins, cholesterol, and carbohydrates that move laterally."],
 ["Which molecules cross a membrane without a protein?","Small nonpolar molecules such as O₂ and CO₂, and, slowly, water."],
 ["Passive vs active transport","Passive follows the concentration gradient and requires no ATP; active moves against the gradient and requires energy."],
 ["What does the sodium-potassium pump do?","Uses ATP to move 3 Na⁺ out and 2 K⁺ in, building an electrochemical gradient."],
 ["Water potential equation","Ψ = Ψ_p + Ψ_s, where Ψ_s = −iCRT"],
 ["Which direction does water move?","From higher water potential to lower water potential."],
 ["What happens to an animal cell in a hypotonic solution?","Water enters and the cell may swell and lyse."],
 ["What happens to a plant cell in a hypertonic solution?","Water leaves and the membrane pulls away from the cell wall — plasmolysis."],
 ["What is receptor-mediated endocytosis?","Specific molecules bind receptors and the membrane invaginates to bring them in by vesicle."],
 ["Role of cholesterol in an animal cell membrane","It buffers fluidity — preventing excessive fluidity when warm and stiffening when cold."]]},
{title:"Cellular Energetics",weight:[12,16],
 desc:"Enzymes, ATP, photosynthesis, and cellular respiration.",
 notes:[
  {h:"Energy and ATP",b:[
   "**ΔG = ΔH − TΔS**. Negative ΔG means **exergonic and spontaneous**; positive ΔG means **endergonic** and requires coupled energy input.",
   "Living systems are open, requiring a constant free-energy input; they maintain order locally while increasing entropy overall.",
   "ATP releases energy by hydrolysis of its terminal phosphate; **coupled reactions** use that energy to drive endergonic steps.",
   "Metabolic pathways are regulated by **feedback inhibition** — the end product inhibits an early enzyme."]},
  {h:"Photosynthesis",b:[
   "Overall: `6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂`. Light energy is converted into chemical energy.",
   "**Light reactions** (thylakoid membrane): light excites electrons in photosystem II, **water is split** releasing O₂, electrons pass along the electron transport chain pumping H⁺ into the thylakoid lumen, and ATP synthase makes ATP by **chemiosmosis**. Photosystem I reduces NADP⁺ to NADPH.",
   "**Calvin cycle** (stroma): CO₂ is fixed by **rubisco** onto RuBP, then ATP and NADPH reduce it to G3P. Three turns fix three CO₂; six turns yield one glucose.",
   "Pigments absorb specific wavelengths; chlorophyll a is the primary pigment, and accessory pigments broaden the spectrum captured.",
   "**C4 and CAM** plants separate carbon fixation from the Calvin cycle in space or time to reduce photorespiration in hot, dry conditions."]},
  {h:"Cellular respiration",b:[
   "**Glycolysis** (cytosol, anaerobic): glucose → 2 pyruvate, net 2 ATP by substrate-level phosphorylation and 2 NADH.",
   "**Pyruvate oxidation** produces acetyl-CoA, NADH, and CO₂.",
   "**Krebs cycle** (mitochondrial matrix): per turn, 3 NADH, 1 FADH₂, 1 ATP, 2 CO₂ — doubled per glucose.",
   "**Oxidative phosphorylation** (inner membrane): NADH and FADH₂ donate electrons, the ETC pumps H⁺ into the intermembrane space, and ATP synthase harnesses the gradient. **Oxygen is the final electron acceptor**, forming water.",
   "Block the ETC or remove oxygen and the proton gradient collapses — ATP production falls sharply even though glycolysis continues.",
   "**Fermentation** regenerates NAD⁺ without oxygen (lactic acid or alcoholic), letting glycolysis continue at a much lower ATP yield."]},
  {h:"Comparing the two",b:[
   "Photosynthesis is **anabolic and endergonic**; respiration is **catabolic and exergonic**. Each supplies the other's reactants.",
   "Both use an electron transport chain and **chemiosmosis** — a proton gradient driving ATP synthase. The direction of H⁺ pumping differs.",
   "Know where each step happens; 'location' questions are common and cheap."]}],
 tip:"For any ETC question: follow the protons. If the gradient cannot form, ATP synthase stops, regardless of what else is intact.",
 terms:["ΔG","exergonic","endergonic","feedback inhibition","light reactions","Calvin cycle","rubisco","chemiosmosis","glycolysis","Krebs cycle","oxidative phosphorylation","fermentation","photorespiration"],
 cards:[
 ["Gibbs free energy equation","ΔG = ΔH − TΔS"],
 ["What does a negative ΔG indicate?","An exergonic, thermodynamically favorable (spontaneous) reaction."],
 ["Where do the light reactions occur?","In the thylakoid membranes of the chloroplast."],
 ["Where does the Calvin cycle occur?","In the stroma of the chloroplast."],
 ["What molecule is split in the light reactions, and what is released?","Water is split, releasing O₂ and supplying electrons to photosystem II."],
 ["What does rubisco do?","Catalyzes the attachment of CO₂ to RuBP — the carbon-fixing step of the Calvin cycle."],
 ["Products of the light reactions used by the Calvin cycle","ATP and NADPH."],
 ["Where does glycolysis occur and what is its net ATP yield?","In the cytosol; a net of 2 ATP per glucose."],
 ["Where does the Krebs cycle occur?","In the mitochondrial matrix."],
 ["What is the final electron acceptor in aerobic respiration?","Oxygen, which combines with H⁺ to form water."],
 ["What is chemiosmosis?","ATP synthesis driven by a proton gradient across a membrane as H⁺ flows through ATP synthase."],
 ["Why does fermentation occur?","To regenerate NAD⁺ so glycolysis can continue producing ATP without oxygen."],
 ["What happens to ATP production if the ETC is blocked?","The proton gradient collapses, ATP synthase stops, and ATP output falls to glycolysis levels only."],
 ["How do C4 and CAM plants reduce photorespiration?","By separating initial carbon fixation from the Calvin cycle — spatially in C4 plants, temporally in CAM plants."],
 ["What is feedback inhibition?","The end product of a pathway inhibits an enzyme earlier in that pathway."]]},
{title:"Cell Communication and Cell Cycle",weight:[10,15],
 desc:"Signal transduction, feedback, mitosis, and checkpoints.",
 notes:[
  {h:"Cell signaling",b:[
   "Three stages: **reception** (ligand binds a receptor), **transduction** (a relay of molecules, often a phosphorylation cascade with second messengers like cAMP or Ca²⁺), and **response** (a change in gene expression or enzyme activity).",
   "Signal **amplification** means one ligand can trigger thousands of product molecules.",
   "Receptor types: membrane receptors for hydrophilic signals; **intracellular receptors** for hydrophobic signals like steroid hormones that cross the membrane.",
   "Signaling distance: direct contact (gap junctions, plasmodesmata), local (neurotransmitters, paracrine), long distance (hormones)."]},
  {h:"Feedback",b:[
   "**Negative feedback** counteracts a change and maintains homeostasis — body temperature, blood glucose, water balance.",
   "**Positive feedback** amplifies a change to complete a process — childbirth contractions, blood clotting, the action potential's rising phase.",
   "If a receptor is mutated or blocked, the downstream response fails even when the signal is present — a favorite exam scenario."]},
  {h:"The cell cycle",b:[
   "Interphase: **G1** (growth), **S** (DNA replication), **G2** (preparation). Then **M phase** (mitosis and cytokinesis).",
   "Mitosis: prophase (chromosomes condense), metaphase (aligned at the plate), anaphase (sister chromatids separate), telophase (nuclei re-form).",
   "Mitosis produces two genetically identical diploid cells; it is the basis of growth and repair."]},
  {h:"Checkpoints and cancer",b:[
   "Checkpoints at **G1** (is the cell big enough, is the DNA undamaged?), **G2** (is replication complete?), and **M** (are all chromosomes attached to spindles?).",
   "Cyclins and cyclin-dependent kinases (**CDKs**) drive the transitions; their concentrations oscillate.",
   "Loss of checkpoint control gives uncontrolled division — cancer. Mutations in tumor suppressors (p53) or proto-oncogenes disrupt this regulation.",
   "Growth factors act as external signals; cells also respond to density and anchorage."]}],
 tip:"Signal transduction questions are almost always 'what happens if step X is blocked?' Trace the pathway and name the specific missing product.",
 terms:["reception","transduction","second messenger","amplification","negative feedback","positive feedback","interphase","checkpoint","cyclin","CDK","p53"],
 cards:[
 ["Three stages of cell signaling","Reception, transduction, and response."],
 ["What is a second messenger? Give an example.","A small intracellular molecule that relays a signal — cAMP or Ca²⁺."],
 ["Why can steroid hormones use intracellular receptors?","They are hydrophobic and can diffuse through the plasma membrane."],
 ["Negative vs positive feedback","Negative feedback reverses a change to maintain homeostasis; positive feedback amplifies a change to drive a process to completion."],
 ["Give an example of positive feedback in the body","Childbirth contractions, blood clotting, or the rising phase of an action potential."],
 ["What happens in S phase?","DNA is replicated, producing sister chromatids."],
 ["What is checked at the G1 checkpoint?","Cell size, nutrients, growth signals, and DNA integrity before committing to replication."],
 ["What is checked at the M checkpoint?","That all chromosomes are properly attached to spindle fibers before anaphase."],
 ["What role do cyclins and CDKs play?","Their fluctuating levels and activity drive the cell past each cell-cycle checkpoint."],
 ["How does loss of p53 contribute to cancer?","Damaged DNA is no longer detected at the G1 checkpoint, so cells with mutations keep dividing."],
 ["What does mitosis produce?","Two genetically identical cells with the same chromosome number as the parent."]]},
{title:"Heredity",weight:[8,11],
 desc:"Meiosis, Mendelian and non-Mendelian inheritance, and chromosomal variation.",
 notes:[
  {h:"Meiosis",b:[
   "Meiosis halves the chromosome number: one diploid cell yields **four haploid** cells, each genetically unique.",
   "**Crossing over** in prophase I exchanges segments between homologs; **independent assortment** in metaphase I shuffles which homolog goes where (2ⁿ combinations); **random fertilization** multiplies the variation again.",
   "Homologs separate in **meiosis I**; sister chromatids separate in **meiosis II**.",
   "Nondisjunction — failure to separate properly — produces gametes with extra or missing chromosomes (aneuploidy)."]},
  {h:"Mendelian genetics",b:[
   "Law of **segregation**: the two alleles of a gene separate during gamete formation. Law of **independent assortment**: genes on different chromosomes assort independently.",
   "Monohybrid cross of two heterozygotes: 3:1 phenotype, 1:2:1 genotype. Dihybrid: 9:3:3:1.",
   "**Test cross** with a homozygous recessive reveals an unknown genotype.",
   "Use a **chi-square test** to decide whether observed offspring ratios differ significantly from the predicted ones: `χ² = Σ(O−E)²/E`, df = categories − 1."]},
  {h:"Beyond simple dominance",b:[
   "**Incomplete dominance**: heterozygote is intermediate (pink flowers). **Codominance**: both alleles fully expressed (AB blood type).",
   "**Multiple alleles** (ABO), **pleiotropy** (one gene, many traits), **epistasis** (one gene masks another), **polygenic** traits (continuous variation).",
   "**Sex-linked** (usually X-linked) traits appear more often in males, who have only one X. Affected fathers pass the allele to all daughters, never to sons.",
   "Linked genes on the same chromosome do not assort independently; **recombination frequency** measures map distance."]},
  {h:"Extranuclear and environmental effects",b:[
   "Mitochondrial and chloroplast genes are inherited **maternally** (cytoplasmic inheritance).",
   "The environment shapes phenotype: temperature-dependent coat color, hydrangea color with soil pH, and human height.",
   "Read a **pedigree** by testing recessive first: unaffected parents with an affected child indicates recessive; check whether affected individuals are mostly male for X-linkage."]}],
 tip:"On a pedigree question, state the reasoning, not just the answer: 'Two unaffected parents have an affected daughter, so the trait must be autosomal recessive.'",
 terms:["meiosis","crossing over","independent assortment","nondisjunction","segregation","test cross","chi-square","incomplete dominance","codominance","epistasis","sex-linked","pedigree","recombination frequency"],
 cards:[
 ["What does meiosis produce?","Four genetically unique haploid cells from one diploid cell."],
 ["Three sources of genetic variation in sexual reproduction","Crossing over, independent assortment, and random fertilization."],
 ["What separates in meiosis I vs meiosis II?","Homologous chromosomes separate in meiosis I; sister chromatids separate in meiosis II."],
 ["What is nondisjunction?","Failure of chromosomes or chromatids to separate properly, producing gametes with the wrong chromosome number."],
 ["Phenotype ratio of a heterozygous monohybrid cross","3:1"],
 ["Phenotype ratio of a heterozygous dihybrid cross","9:3:3:1"],
 ["Incomplete dominance vs codominance","Incomplete dominance gives a blended intermediate; codominance expresses both alleles fully and separately."],
 ["What is epistasis?","One gene's product masks or modifies the phenotypic effect of a different gene."],
 ["Why are X-linked recessive traits more common in males?","Males have one X chromosome, so a single recessive allele is expressed."],
 ["How do you recognize autosomal recessive inheritance in a pedigree?","Two unaffected parents produce an affected child, and affected individuals occur in both sexes about equally."],
 ["Chi-square formula and degrees of freedom for genetics","χ² = Σ(O − E)²/E with df = number of phenotype categories − 1."],
 ["How are mitochondrial genes inherited?","Maternally, through the cytoplasm of the egg."],
 ["What does a recombination frequency of 12% mean?","The two genes are linked and about 12 map units apart on the same chromosome."]]},
{title:"Gene Expression and Regulation",weight:[12,16],
 desc:"Replication, transcription, translation, mutation, regulation, and biotechnology.",
 notes:[
  {h:"DNA replication",b:[
   "Semiconservative: each new double helix keeps one parental strand. **Helicase** unwinds, **primase** lays RNA primers, **DNA polymerase** builds 5′→3′, **ligase** joins fragments.",
   "The **leading strand** is synthesized continuously; the **lagging strand** is made in Okazaki fragments because polymerase works only 5′→3′.",
   "Proofreading reduces errors to roughly one per billion bases; surviving errors are mutations.",
   "Telomeres protect chromosome ends, which shorten with each replication in most somatic cells."]},
  {h:"Transcription and translation",b:[
   "**Transcription** (nucleus in eukaryotes): RNA polymerase binds the promoter and builds mRNA from the template strand, 5′→3′.",
   "Eukaryotic RNA processing: add a **5′ cap** and **poly-A tail**, and **splice out introns** keeping exons. **Alternative splicing** lets one gene make several proteins.",
   "**Translation** (ribosome): mRNA codons pair with tRNA anticodons; each codon specifies an amino acid. Start at AUG (methionine) and stop at UAA/UAG/UGA.",
   "The genetic code is **redundant** (multiple codons per amino acid) but **unambiguous** (each codon specifies one amino acid), and nearly universal — which is why genes can be transferred between species."]},
  {h:"Mutations",b:[
   "**Point mutations**: silent (no amino acid change, thanks to redundancy), missense (different amino acid), nonsense (premature stop).",
   "**Frameshift** mutations from insertions or deletions not in multiples of three are usually the most damaging because every downstream codon changes.",
   "Mutations in regulatory regions change **how much** protein is made without changing the protein.",
   "Mutations in gametes are heritable; somatic mutations are not. Only variation that affects reproduction matters to evolution."]},
  {h:"Regulation of expression",b:[
   "Prokaryotes use **operons**. The **lac operon** is inducible: lactose (allolactose) removes the repressor so the genes are transcribed. The **trp operon** is repressible: tryptophan activates the repressor and shuts transcription off.",
   "Eukaryotic regulation happens at many levels: chromatin accessibility (histone modification, DNA methylation), transcription factors at promoters and enhancers, RNA processing, mRNA stability, and protein modification.",
   "**Differential gene expression** explains how one genome produces many cell types; all cells have the same DNA but transcribe different genes.",
   "Epigenetic changes alter expression without changing the sequence and can be inherited through cell divisions."]},
  {h:"Biotechnology",b:[
   "**PCR** amplifies DNA with primers, a heat-stable polymerase, and temperature cycling (denature, anneal, extend).",
   "**Gel electrophoresis** separates fragments by size — smaller fragments move farther toward the positive electrode because DNA is negatively charged.",
   "**Restriction enzymes** cut specific sequences; plasmids carry recombinant DNA into bacteria; **bacterial transformation** with a selectable marker identifies successful uptake.",
   "Sequencing and genetic engineering applications include gene therapy, GMOs, and diagnostics."]}],
 tip:"Electrophoresis results are read by size: shortest fragments travel farthest. State the direction and the reason (DNA is negatively charged) when you explain it.",
 terms:["semiconservative","helicase","Okazaki fragment","promoter","intron","exon","alternative splicing","codon","anticodon","missense","frameshift","operon","lac operon","epigenetics","PCR","gel electrophoresis","restriction enzyme"],
 cards:[
 ["Why is DNA replication called semiconservative?","Each new molecule keeps one original parental strand and one newly made strand."],
 ["Why is there a lagging strand?","DNA polymerase can only build 5′→3′, so one strand must be made in discontinuous Okazaki fragments."],
 ["What enzyme joins Okazaki fragments?","DNA ligase."],
 ["Three modifications to eukaryotic pre-mRNA","A 5′ cap, a poly-A tail, and splicing out of introns."],
 ["What does alternative splicing accomplish?","One gene can produce several different proteins by including different combinations of exons."],
 ["What are the start and stop codons?","AUG starts (methionine); UAA, UAG, and UGA stop."],
 ["What does it mean that the genetic code is redundant but unambiguous?","Several codons can specify the same amino acid, but each codon specifies only one amino acid."],
 ["Silent vs missense vs nonsense mutation","Silent: same amino acid. Missense: different amino acid. Nonsense: premature stop codon."],
 ["Why is a frameshift mutation usually more severe than a point mutation?","Every codon downstream is changed, so most of the protein is wrong."],
 ["How does the lac operon work?","Lactose is converted to allolactose, which binds the repressor and removes it from the operator, allowing transcription."],
 ["How does the trp operon work?","Tryptophan acts as a corepressor, activating the repressor so transcription stops when tryptophan is abundant."],
 ["How do cells with identical DNA become different types?","Differential gene expression — they transcribe different subsets of genes."],
 ["Three steps of one PCR cycle","Denature by heating, anneal primers at a lower temperature, extend with DNA polymerase."],
 ["In gel electrophoresis, which fragments travel farthest?","The smallest ones, because they pass through the gel matrix most easily."],
 ["Why does DNA move toward the positive electrode?","Its phosphate backbone carries a negative charge."]]},
{title:"Natural Selection",weight:[13,20],
 desc:"Evidence for evolution, population genetics, speciation, and phylogeny. The largest-weighted unit.",
 notes:[
  {h:"Natural selection and adaptation",b:[
   "Requirements: **variation** in a heritable trait, **differential reproductive success**, and more offspring than the environment can support.",
   "Fitness is reproductive success, not strength or size. Selection acts on phenotypes, changing **allele frequencies** in populations, not in individuals.",
   "Modes: **directional** (one extreme favored), **disruptive** (both extremes favored), **stabilizing** (intermediate favored).",
   "**Sexual selection** favors traits that improve mating success, sometimes at a survival cost.",
   "**Artificial selection** demonstrates the same mechanism with humans choosing the criterion."]},
  {h:"Hardy-Weinberg equilibrium",b:[
   "`p + q = 1` and `p² + 2pq + q² = 1`, where p² is homozygous dominant, 2pq heterozygous, q² homozygous recessive.",
   "Five conditions: no mutation, no selection, no migration, random mating, and a very large population. Equilibrium is the **null model** — deviation means evolution is happening.",
   "Standard problem: recessive phenotype frequency gives q², so `q = √(q²)` and p = 1 − q.",
   "A heterozygote advantage maintains a recessive allele at higher frequency than selection alone would predict (sickle cell and malaria)."]},
  {h:"Other mechanisms of change",b:[
   "**Genetic drift** is random change in allele frequency, strongest in small populations. The **bottleneck effect** and **founder effect** are special cases that reduce genetic diversity.",
   "**Gene flow** (migration) tends to make populations more similar and can introduce new alleles.",
   "Mutation is the ultimate source of new alleles but changes frequencies slowly by itself.",
   "Small populations lose diversity and are more vulnerable to environmental change — the core conservation-genetics argument."]},
  {h:"Speciation and phylogeny",b:[
   "The **biological species concept** defines species by reproductive isolation.",
   "**Allopatric** speciation follows geographic separation; **sympatric** speciation occurs without it (polyploidy, habitat or behavioral differentiation).",
   "Prezygotic barriers (habitat, temporal, behavioral, mechanical, gametic) prevent fertilization; postzygotic barriers (hybrid inviability or sterility) act after.",
   "**Punctuated equilibrium** (long stasis, rapid change) versus **gradualism** describe different tempos in the fossil record.",
   "Phylogenetic trees show relatedness by shared derived characters; **nodes** are common ancestors and branch length may indicate time. Closer shared nodes mean closer relationship, not 'more advanced'.",
   "**Homologous** structures indicate shared ancestry; **analogous** structures result from convergent evolution in similar environments.",
   "Evidence for common ancestry: the fossil record, anatomical and developmental homology, biogeography, and shared molecular machinery (DNA, ribosomes, ATP, common metabolic pathways)."]},
  {h:"Origin of life",b:[
   "Proposed sequence: abiotic synthesis of organic monomers, polymerization, self-replicating RNA (the **RNA world** hypothesis, since RNA can both carry information and catalyze), then membranes and cells.",
   "Experiments like Miller-Urey showed that organic monomers can form under plausible early-Earth conditions.",
   "Geologic evidence dates Earth at roughly 4.6 billion years, with prokaryotic life appearing within the first billion or so."]}],
 tip:"Hardy-Weinberg questions nearly always start from the recessive phenotype. Find q² first, take the square root, and only then compute everything else.",
 terms:["fitness","directional selection","stabilizing selection","Hardy-Weinberg","genetic drift","bottleneck effect","founder effect","gene flow","allopatric speciation","sympatric speciation","prezygotic barrier","phylogenetic tree","homologous","analogous","convergent evolution","RNA world"],
 cards:[
 ["Three requirements for natural selection","Heritable variation, differential reproductive success, and more offspring produced than can survive."],
 ["Define fitness in evolutionary terms","Relative reproductive success — how many surviving offspring an individual contributes."],
 ["Directional vs disruptive vs stabilizing selection","Directional favors one extreme; disruptive favors both extremes; stabilizing favors intermediates."],
 ["Hardy-Weinberg equations","p + q = 1 and p² + 2pq + q² = 1"],
 ["Five conditions for Hardy-Weinberg equilibrium","No mutation, no natural selection, no migration, random mating, and a very large population."],
 ["9% of a population shows a recessive trait. What is q?","q = √0.09 = 0.3, so p = 0.7."],
 ["What is genetic drift and when is it strongest?","Random change in allele frequencies; it has the greatest effect in small populations."],
 ["Bottleneck vs founder effect","A bottleneck is a sharp population reduction; a founder effect is a small group establishing a new population. Both reduce genetic diversity."],
 ["Allopatric vs sympatric speciation","Allopatric requires geographic isolation; sympatric occurs without it."],
 ["Give two prezygotic isolating barriers","Temporal (different breeding seasons) and behavioral (different courtship rituals), among habitat, mechanical, and gametic."],
 ["Homologous vs analogous structures","Homologous structures share a common ancestral origin; analogous structures evolved independently for similar function."],
 ["What does a node on a phylogenetic tree represent?","A common ancestor of the lineages that branch from it."],
 ["Four categories of evidence for common ancestry","Fossil record, anatomical and developmental homology, biogeography, and shared molecular features."],
 ["Why does the RNA world hypothesis focus on RNA?","RNA can both store information and catalyze reactions, so it could replicate before proteins existed."],
 ["Does natural selection act on individuals or populations?","Selection acts on individual phenotypes, but evolution — the change in allele frequency — happens in the population."]]},
{title:"Ecology",weight:[10,15],
 desc:"Behavior, population growth, communities, energy flow, and disturbance.",
 notes:[
  {h:"Behavior and communication",b:[
   "Responses to the environment increase fitness: taxis, kinesis, circadian rhythms, and migration.",
   "Communication can be visual, chemical (pheromones), auditory, or tactile; cooperative behavior such as pack hunting and altruism toward relatives (**kin selection**) can raise overall fitness.",
   "Innate behaviors are genetically programmed; learned behaviors depend on experience (habituation, imprinting, associative learning)."]},
  {h:"Population ecology",b:[
   "**Exponential growth** `dN/dt = rN` produces a J curve under ideal conditions.",
   "**Logistic growth** `dN/dt = rN((K − N)/K)` produces an S curve, slowing as N approaches the **carrying capacity K**.",
   "**Density-dependent** limits (competition, predation, disease) intensify as density rises; **density-independent** limits (weather, fire, flood) do not.",
   "**r-selected** species reproduce early and prolifically with little parental care; **K-selected** species invest in fewer offspring. Survivorship curves I, II, and III summarize the patterns.",
   "Age-structure diagrams predict future growth: a wide base means rapid growth ahead."]},
  {h:"Community interactions",b:[
   "**Competition** (−/−) can lead to resource partitioning or competitive exclusion; **predation** (+/−); **mutualism** (+/+); **commensalism** (+/0); **parasitism** (+/−).",
   "A **niche** is an organism's full role; the realized niche is narrower than the fundamental niche because of competition.",
   "**Keystone species** have effects out of proportion to their abundance. **Invasive species** lack natural controls and can collapse native communities.",
   "Coevolution produces matched adaptations — predator and prey, flower and pollinator, host and parasite."]},
  {h:"Energy flow and matter cycles",b:[
   "Producers capture energy; about **10%** of energy transfers between trophic levels, which is why food chains are short and biomass pyramids narrow.",
   "Energy flows **through** an ecosystem and is lost as heat; matter **cycles** (carbon, nitrogen, phosphorus, water).",
   "Nitrogen must be **fixed** by bacteria to be usable; phosphorus has no atmospheric phase and often limits growth.",
   "Organisms with a higher metabolic rate per unit mass need more energy per gram — small endotherms are the extreme case."]},
  {h:"Disturbance and change",b:[
   "Ecosystems respond to disturbance through **succession** — primary on bare rock, secondary after a disturbance that left soil.",
   "Greater **biodiversity** generally increases resilience to disturbance.",
   "Human impacts: habitat loss, introduction of invasive species, pollution, overharvesting, and climate change.",
   "Changes at one trophic level propagate: a trophic cascade can transform an entire community."]}],
 tip:"Ecology FRQs love 'describe a trend and then predict'. Describe the data first in plain terms, then give a mechanism for the prediction.",
 terms:["kin selection","exponential growth","logistic growth","carrying capacity","density-dependent","r-selected","K-selected","survivorship curve","niche","keystone species","invasive species","trophic level","10% rule","nitrogen fixation","succession","biodiversity"],
 cards:[
 ["Exponential growth equation","dN/dt = rN"],
 ["Logistic growth equation","dN/dt = rN((K − N)/K)"],
 ["What is carrying capacity?","The maximum population size an environment can sustain given its resources."],
 ["Density-dependent vs density-independent limiting factors","Density-dependent factors (competition, disease, predation) intensify with crowding; density-independent factors (weather, fire) do not."],
 ["r-selected vs K-selected species","r-selected: many offspring, little care, early reproduction. K-selected: few offspring, much care, later reproduction."],
 ["Approximately how much energy passes to the next trophic level?","About 10%."],
 ["Why are food chains short?","Energy loss at each transfer leaves too little to support many levels."],
 ["Energy vs matter in an ecosystem","Energy flows through and is lost as heat; matter cycles and is reused."],
 ["What is a keystone species?","A species whose effect on community structure is disproportionately large relative to its abundance."],
 ["Why are invasive species so damaging?","They arrive without their natural predators, competitors, or diseases, so their populations grow unchecked."],
 ["Primary vs secondary succession","Primary begins on bare substrate with no soil; secondary follows a disturbance that left soil intact."],
 ["Why must nitrogen be fixed?","Atmospheric N₂ is unusable by most organisms; bacteria convert it to ammonia or nitrate."],
 ["Which nutrient lacks an atmospheric component and often limits growth?","Phosphorus."],
 ["What does a wide-based age-structure diagram predict?","Rapid future population growth."]]}
],

{u:1,q:"Which property of water explains how it moves up a narrow plant vessel against gravity?",c:["High specific heat","Cohesion and adhesion","Low density as ice","Its nonpolar tails"],a:1,e:"Cohesion holds the water column together while adhesion pulls it along the vessel walls."},
{u:1,q:"A noncompetitive inhibitor reduces enzyme activity by",c:["binding the active site","changing the enzyme's shape from another site","raising activation energy","consuming the substrate"],a:1,e:"Allosteric binding alters the enzyme's conformation, distorting the active site."},
{u:2,q:"A cell is placed in a solution with a more negative water potential than the cell. Water will",c:["enter the cell","leave the cell","not move","move in both directions equally"],a:1,e:"Water always moves toward lower (more negative) water potential — out of the cell."},
{u:2,q:"Which best explains why mitochondria are thought to descend from bacteria?",c:["They make ATP","They have a double membrane, circular DNA, and their own ribosomes","They are found in all eukaryotes","They contain enzymes"],a:1,e:"These three features are the classic evidence for endosymbiosis."},
{u:3,q:"A drug blocks ATP synthase in mitochondria. The immediate result is",c:["the proton gradient collapses","protons accumulate in the intermembrane space","glycolysis stops","oxygen is no longer produced"],a:1,e:"With no channel to flow through, H⁺ builds up on the intermembrane side and ATP production by oxidative phosphorylation stops."},
{u:3,q:"In photosynthesis, the oxygen released comes from",c:["CO₂","water","glucose","NADPH"],a:1,e:"Photolysis of water in photosystem II releases O₂."},
{u:4,q:"A mutation destroys a membrane receptor's ligand-binding site. The most likely result is",c:["the signal molecule is destroyed","the cell cannot respond to that signal","the cell divides uncontrollably","the ligand enters the nucleus"],a:1,e:"Without reception there is no transduction, so the response never occurs."},
{u:5,q:"Two unaffected parents have an affected daughter. The trait is most likely",c:["autosomal dominant","autosomal recessive","X-linked recessive","X-linked dominant"],a:1,e:"An affected female from unaffected parents points to autosomal recessive; X-linked recessive would require an affected father."},
{u:5,q:"A dihybrid cross of two heterozygotes predicts a phenotype ratio of",c:["3:1","1:2:1","9:3:3:1","1:1:1:1"],a:2,e:"Independent assortment of two genes gives 9:3:3:1."},
{u:6,q:"An insertion of two nucleotides in a coding region most likely causes",c:["a silent mutation","a frameshift","a chromosomal deletion","no change"],a:1,e:"Two is not a multiple of three, so the reading frame shifts and all downstream codons change."},
{u:6,q:"In the lac operon, lactose ultimately",c:["activates the repressor","removes the repressor from the operator","binds RNA polymerase","methylates the promoter"],a:1,e:"Allolactose binds the repressor so it releases the operator, allowing transcription."},
{u:7,q:"In a population at equilibrium, 16% show the recessive phenotype. The frequency of the dominant allele is",c:["0.16","0.4","0.6","0.84"],a:2,e:"q² = 0.16 so q = 0.4 and p = 0.6."},
{u:7,q:"Analogous structures are evidence of",c:["common ancestry","convergent evolution","genetic drift","gene flow"],a:1,e:"Similar function without shared ancestry indicates independent adaptation to similar environments."},
{u:8,q:"A population grows fastest, in individuals per unit time, when",c:["N is very small","N is about half of K","N equals K","N exceeds K"],a:1,e:"Logistic growth rate peaks at N = K/2, where both N and the remaining capacity are substantial."},
{u:8,q:"Energy transfer between trophic levels is inefficient mainly because",c:["matter is destroyed","much energy is lost as heat through metabolism","predators eat too little","producers trap no light"],a:1,e:"Cellular respiration and movement dissipate most captured energy as heat."}
]

units:[
{title:"Atomic Structure and Properties",weight:[7,9],
 desc:"Moles, mass spectra, electron configuration, PES, and periodic trends.",
 notes:[
  {h:"Moles and composition",b:[
   "A mole is **6.022 × 10²³** particles. `n = m/M` converts mass to moles; this is the hinge of nearly every calculation.",
   "**Percent composition** and empirical formulas: convert each element's mass to moles, divide by the smallest, scale to whole numbers.",
   "A **mass spectrum** shows isotope abundances; average atomic mass is the weighted average of isotope masses.",
   "Always track significant figures and units — the FRQ rubric awards them separately."]},
  {h:"Electron configuration",b:[
   "Fill orbitals by increasing energy (1s 2s 2p 3s 3p 4s 3d 4p...). The **Aufbau principle**, **Pauli exclusion**, and **Hund's rule** govern filling.",
   "Valence electrons determine chemistry. Write configurations for ions by removing or adding electrons from the outermost subshell.",
   "**Coulomb's law** governs the attraction: energy depends on charge magnitude and distance. This single idea explains every periodic trend.",
   "**Effective nuclear charge (Z_eff)** is the net positive pull felt by a valence electron after inner-shell **shielding**."]},
  {h:"Photoelectron spectroscopy",b:[
   "Each peak in a **PES** spectrum is a subshell; peak **height** is proportional to the number of electrons, and binding energy increases toward the nucleus.",
   "Higher binding energy means the electrons are closer to the nucleus and more tightly held — so the leftmost peaks (conventionally) are core electrons.",
   "Use PES to identify an element: count electrons from the peak heights and match the configuration."]},
  {h:"Periodic trends",b:[
   "**Atomic radius** decreases left to right (Z_eff rises) and increases down a group (new shell).",
   "**Ionization energy** increases left to right and decreases down a group. Large jumps mark the removal of a core electron.",
   "**Electronegativity** increases toward fluorine. **Electron affinity** follows a similar pattern with exceptions.",
   "Cations are smaller than their parent atoms; anions are larger.",
   "Explain trends with Coulombic attraction, Z_eff, and shielding — never just 'because of the trend'."]}],
 tip:"Every periodic-trend explanation should mention charge and distance. 'Greater Z_eff pulls the valence electrons closer, so the radius is smaller' is the full-credit sentence.",
 terms:["mole","empirical formula","mass spectrum","Aufbau","Hund's rule","Coulomb's law","effective nuclear charge","shielding","PES","ionization energy","electronegativity"],
 cards:[
 ["Avogadro's number","6.022 × 10²³ particles per mole"],
 ["How do you find an empirical formula from percent composition?","Convert each percentage to grams, then to moles, divide all by the smallest, and scale to whole numbers."],
 ["What does peak height represent in a PES spectrum?","The relative number of electrons in that subshell."],
 ["In PES, what does higher binding energy mean?","The electrons are closer to the nucleus and held more tightly."],
 ["Why does atomic radius decrease across a period?","Effective nuclear charge increases while the shell stays the same, pulling electrons closer."],
 ["Why does atomic radius increase down a group?","Electrons occupy a new, larger shell farther from the nucleus."],
 ["What causes a large jump in successive ionization energies?","The next electron removed comes from a core shell, much closer to the nucleus."],
 ["Define effective nuclear charge","The net positive charge a valence electron experiences after accounting for shielding by inner electrons."],
 ["Is a cation larger or smaller than its parent atom?","Smaller — fewer electrons means less repulsion and often one fewer shell."],
 ["State Coulomb's law qualitatively","Attraction increases with larger charges and decreases with greater distance."]]},
{title:"Compound Structure and Properties",weight:[7,9],
 desc:"Bonding types, Lewis structures, VSEPR geometry, and resonance.",
 notes:[
  {h:"Types of bonding",b:[
   "**Ionic** bonding transfers electrons between a metal and a nonmetal, producing a lattice with high melting point and conductivity when molten or dissolved.",
   "**Covalent** bonding shares electrons; **polar covalent** when electronegativity differs noticeably.",
   "**Metallic** bonding is a lattice of cations in a sea of delocalized electrons — conductive, malleable, lustrous.",
   "Lattice energy increases with larger charges and smaller ions (Coulomb's law again).",
   "Bond length and bond energy are inversely related: shorter bonds are stronger. Triple < double < single in length; the reverse in strength."]},
  {h:"Lewis structures",b:[
   "Count total valence electrons, connect atoms, complete octets on outer atoms, then give the rest to the central atom.",
   "**Formal charge** helps choose among structures; prefer structures with minimal formal charges and negative charge on the more electronegative atom.",
   "**Resonance** averages equivalent structures; actual bond lengths are intermediate and identical.",
   "Exceptions: hydrogen (2 electrons), boron (6), and expanded octets for period-3 and beyond."]},
  {h:"VSEPR and molecular shape",b:[
   "Electron domains repel to maximize separation. 2 domains → linear (180°), 3 → trigonal planar (120°), 4 → tetrahedral (109.5°), 5 → trigonal bipyramidal, 6 → octahedral.",
   "**Lone pairs** occupy more space and compress bond angles: 4 domains with one lone pair gives trigonal pyramidal (~107°), with two gives bent (~104.5°).",
   "**Hybridization** follows the domain count: 2 → sp, 3 → sp², 4 → sp³.",
   "A molecule is **polar** if bond dipoles do not cancel by symmetry. CO₂ is nonpolar despite polar bonds; H₂O is polar."]},
  {h:"Solids and bonding models",b:[
   "Network covalent solids (diamond, SiO₂) have very high melting points because covalent bonds must break to melt them.",
   "Molecular solids melt at low temperatures because only intermolecular forces break.",
   "Alloys: **substitutional** alloys swap similar-size atoms; **interstitial** alloys fit small atoms into gaps and are harder because layers cannot slide.",
   "Link structure to property in every explanation — that is what the rubric rewards."]}],
 tip:"For 'why does X melt higher than Y' always identify the type of force being broken first: ionic lattice, network covalent bonds, metallic bonding, or intermolecular forces.",
 terms:["ionic bonding","covalent bonding","metallic bonding","lattice energy","formal charge","resonance","VSEPR","electron domain","hybridization","polarity","network covalent","alloy"],
 cards:[
 ["How does lattice energy change with ion charge and size?","It increases with larger charges and smaller ionic radii."],
 ["Relationship between bond length and bond strength","Shorter bonds are stronger; a triple bond is shortest and strongest."],
 ["What does resonance imply about bond lengths?","The actual bonds are identical and intermediate in length between single and double."],
 ["Electron-domain geometry for 4 domains with one lone pair","Trigonal pyramidal, with bond angles slightly less than 109.5°."],
 ["Why is CO₂ nonpolar though its bonds are polar?","Its linear symmetry makes the two bond dipoles cancel."],
 ["Hybridization for three electron domains","sp²"],
 ["Why does diamond melt at an extremely high temperature?","Melting requires breaking a network of strong covalent bonds throughout the solid."],
 ["Why are interstitial alloys harder than pure metals?","Small atoms in the gaps prevent layers of metal atoms from sliding past each other."],
 ["What makes a metal conduct electricity?","Delocalized valence electrons move freely through the lattice."],
 ["How do you choose between competing Lewis structures?","Prefer the one with formal charges closest to zero and negative formal charge on the more electronegative atom."]]},
{title:"Properties of Substances and Mixtures",weight:[18,22],
 desc:"Intermolecular forces, gases, solutions, separations, and spectroscopy. The heaviest unit.",
 notes:[
  {h:"Intermolecular forces",b:[
   "Strength order: **ion-dipole > hydrogen bonding > dipole-dipole > London dispersion**, though dispersion can dominate in very large molecules.",
   "**London dispersion forces** exist in everything and increase with more electrons and greater polarizability — which is why larger molecules boil higher.",
   "**Hydrogen bonding** requires H bonded to N, O, or F, with a lone pair on the acceptor. It explains water's anomalies and high boiling points of alcohols.",
   "IMF strength controls boiling point, vapor pressure, surface tension, viscosity, and solubility. 'Like dissolves like' is an IMF-compatibility statement.",
   "When comparing two substances, name the dominant force in each and say which is stronger and why."]},
  {h:"Gases",b:[
   "**Kinetic molecular theory**: particles in constant random motion, negligible volume, no attractions, elastic collisions, average kinetic energy proportional to absolute temperature.",
   "`PV = nRT`. Recognize the derived relationships: P ∝ 1/V at fixed T, V ∝ T at fixed P.",
   "**Partial pressures**: `P_total = ΣP_i` and `P_i = X_i P_total`.",
   "Maxwell-Boltzmann curves: higher temperature shifts the distribution right and flattens it; lighter gases have higher average speeds at the same temperature.",
   "Real gases deviate at **high pressure** (particle volume matters) and **low temperature** (attractions matter)."]},
  {h:"Solutions and separation",b:[
   "Molarity `M = mol/L`; dilution `M₁V₁ = M₂V₂`.",
   "Solvation: solvent-solute interactions must be comparable in strength to the interactions they replace.",
   "**Chromatography** separates by differing affinity for the stationary versus mobile phase; **distillation** separates by boiling point; **filtration** by particle size.",
   "Explain a separation by naming the property exploited and the interaction responsible."]},
  {h:"Spectroscopy and particulate views",b:[
   "**Beer's law** `A = εbc` makes absorbance proportional to concentration — the basis of a calibration curve.",
   "Different regions probe different things: microwave → rotation, infrared → bond vibration, ultraviolet-visible → electronic transitions.",
   "Particulate drawings must show correct relative numbers, correct phases, and ions drawn separately when dissociated.",
   "When asked to draw, label the species and keep stoichiometric ratios accurate — counts are scored."]}],
 tip:"Almost every 'explain the difference in boiling point' question is an IMF question. Identify both forces by name before comparing.",
 terms:["London dispersion","dipole-dipole","hydrogen bonding","ion-dipole","polarizability","kinetic molecular theory","partial pressure","Maxwell-Boltzmann","molarity","chromatography","Beer's law"],
 cards:[
 ["Rank the intermolecular forces from strongest to weakest","Ion-dipole, hydrogen bonding, dipole-dipole, London dispersion."],
 ["What does London dispersion strength depend on?","The number of electrons and polarizability — larger molecules have stronger dispersion forces."],
 ["Requirements for hydrogen bonding","A hydrogen atom bonded to N, O, or F, and a lone pair on an N, O, or F of a neighboring molecule."],
 ["Ideal gas law and the value of R in L·atm","PV = nRT with R = 0.08206 L·atm/(mol·K)"],
 ["Mole fraction and partial pressure relationship","P_i = X_i × P_total"],
 ["Five assumptions of kinetic molecular theory","Constant random motion, negligible particle volume, no intermolecular attraction, elastic collisions, and average kinetic energy proportional to absolute temperature."],
 ["When do real gases deviate most from ideal behavior?","At high pressure and low temperature."],
 ["Effect of raising temperature on a Maxwell-Boltzmann distribution","The curve broadens and shifts toward higher speeds, with a lower peak."],
 ["Beer's law","A = εbc — absorbance is proportional to concentration."],
 ["How does chromatography separate components?","Components differ in their relative affinity for the stationary and mobile phases, so they travel at different rates."],
 ["Dilution formula","M₁V₁ = M₂V₂"]]},
{title:"Chemical Reactions",weight:[7,9],
 desc:"Reaction types, net ionic equations, stoichiometry, and titration.",
 notes:[
  {h:"Classifying reactions",b:[
   "**Precipitation**: two solutions form an insoluble product. Know the basic solubility rules (nitrates and group 1 salts are soluble).",
   "**Acid-base**: proton transfer. **Redox**: electron transfer, identified by changing oxidation numbers.",
   "Assign oxidation numbers systematically: elements 0, monatomic ions their charge, O usually −2, H usually +1, and the sum equals the overall charge."]},
  {h:"Equations",b:[
   "Write **net ionic equations** by showing only species that change: dissociate strong electrolytes, keep solids, gases, weak acids, and water intact, cancel spectator ions.",
   "Balance by inspection for most reactions; balance redox by half-reactions when needed.",
   "Include states of matter — the rubric checks them."]},
  {h:"Stoichiometry",b:[
   "Convert to moles, use the mole ratio, convert to the requested unit. Identify the **limiting reactant** by comparing mole ratios, not masses.",
   "Percent yield = (actual / theoretical) × 100. Excess reactant remains.",
   "Gravimetric analysis finds an unknown by isolating and weighing a product."]},
  {h:"Titration",b:[
   "At the **equivalence point**, moles of acid equal moles of base adjusted by stoichiometry — not necessarily pH 7.",
   "Strong-strong titration: equivalence at pH 7. Weak acid with strong base: equivalence above 7, and the **half-equivalence point** has pH = pK_a.",
   "The sharp vertical region of a titration curve is the equivalence point; choose an indicator whose range spans it.",
   "Common errors to discuss: a wet burette rinsed with water dilutes the titrant; an air bubble gives a false volume; overshooting the endpoint overestimates."]}],
 tip:"Limiting reactant is decided by moles divided by coefficient — comparing grams directly is the classic mistake.",
 terms:["precipitation","net ionic equation","oxidation number","redox","limiting reactant","percent yield","titration","equivalence point","half-equivalence point"],
 cards:[
 ["What is a net ionic equation?","An equation showing only the species that actually change, with spectator ions removed."],
 ["Which species stay intact in a net ionic equation?","Solids, gases, pure liquids like water, and weak electrolytes."],
 ["How do you identify the limiting reactant?","Divide each reactant's moles by its coefficient; the smallest value limits the reaction."],
 ["How do you recognize a redox reaction?","Oxidation numbers change between reactants and products."],
 ["Oxidation number rules for O and H","Oxygen is usually −2 and hydrogen usually +1, except in peroxides and metal hydrides."],
 ["At the half-equivalence point of a weak acid titration, what is the pH?","pH = pK_a, because [HA] = [A⁻]."],
 ["Is the equivalence point always pH 7?","No — only for a strong acid with a strong base. A weak acid titration ends above 7."],
 ["Percent yield formula","(actual yield / theoretical yield) × 100"],
 ["Effect of an air bubble in a burette on measured titrant volume","It makes the recorded volume larger than the amount actually delivered, skewing the result."]]},
{title:"Kinetics",weight:[7,9],
 desc:"Rates, rate laws, mechanisms, and catalysis.",
 notes:[
  {h:"Rate and rate laws",b:[
   "Rate is the change in concentration per unit time, expressed consistently with stoichiometric coefficients.",
   "The **rate law** `rate = k[A]ᵐ[B]ⁿ` must be determined **experimentally**; orders are not the coefficients.",
   "Find orders by comparing experiments where one concentration changes: doubling [A] doubling the rate is first order; quadrupling it is second order; no change is zero order.",
   "Units of k depend on the overall order."]},
  {h:"Integrated rate laws",b:[
   "**Zero order**: `[A] = −kt + [A]₀`; a straight line when plotting [A] vs t.",
   "**First order**: `ln[A] = −kt + ln[A]₀`; straight when plotting ln[A] vs t; `t½ = 0.693/k`, independent of concentration.",
   "**Second order**: `1/[A] = kt + 1/[A]₀`; straight when plotting 1/[A] vs t.",
   "To determine order from data, test which plot is linear — this is a standard FRQ task."]},
  {h:"Mechanisms and collisions",b:[
   "An **elementary step**'s rate law comes directly from its coefficients. The **rate-determining step** is the slowest step, and the overall rate law must match it.",
   "A valid mechanism must sum to the overall equation and be consistent with the experimental rate law. **Intermediates** are produced then consumed.",
   "Collision theory: reaction requires collisions with sufficient energy and correct orientation. Only a fraction of collisions are effective.",
   "**Arrhenius**: k increases with temperature and decreases with larger activation energy. Raising temperature increases the fraction of molecules above Ea."]},
  {h:"Catalysis",b:[
   "A **catalyst** provides an alternative pathway with lower activation energy; it is not consumed and does not change ΔH or the equilibrium position.",
   "On an energy diagram, a catalyst lowers the barrier (and may add an intermediate well) but leaves reactant and product energies unchanged.",
   "Homogeneous catalysts are in the same phase; heterogeneous catalysts provide a surface.",
   "Enzymes are biological catalysts that work by stabilizing the transition state."]}],
 tip:"If a question gives concentration-time data and asks for the order, the answer is whichever of [A], ln[A], or 1/[A] plots as a straight line. Say which plot is linear.",
 terms:["rate law","reaction order","rate constant","half-life","integrated rate law","elementary step","rate-determining step","intermediate","activation energy","catalyst"],
 cards:[
 ["Can you read reaction orders from the balanced equation?","No — orders must be determined experimentally (except for an elementary step)."],
 ["Doubling [A] quadruples the rate. What is the order in A?","Second order."],
 ["Which plot is linear for a first-order reaction?","ln[A] versus time."],
 ["Which plot is linear for a second-order reaction?","1/[A] versus time."],
 ["First-order half-life formula","t½ = 0.693/k, independent of the starting concentration."],
 ["What determines the overall rate law in a mechanism?","The rate-determining (slowest) step."],
 ["What is a reaction intermediate?","A species formed in one step and consumed in a later step, so it does not appear in the overall equation."],
 ["How does a catalyst speed a reaction?","It provides a pathway with lower activation energy without being consumed."],
 ["Does a catalyst change ΔH or the equilibrium constant?","No — it only changes the rate at which equilibrium is reached."],
 ["Why does raising temperature increase rate?","A larger fraction of collisions has energy exceeding the activation energy."]]},
{title:"Thermodynamics",weight:[7,9],
 desc:"Energy transfer, calorimetry, enthalpy, and bond energies.",
 notes:[
  {h:"Heat and temperature",b:[
   "Temperature measures average kinetic energy; heat is energy transferred because of a temperature difference.",
   "`q = mcΔT`. A substance with a high specific heat changes temperature little for a given heat input.",
   "**Endothermic** processes absorb heat (positive ΔH, system feels cold); **exothermic** release it (negative ΔH)."]},
  {h:"Calorimetry",b:[
   "In a coffee-cup calorimeter, `q_reaction = −q_solution = −mcΔT`, assuming no heat escapes.",
   "Heat lost by a hot object equals heat gained by a cold one at thermal equilibrium.",
   "Poor insulation makes an exothermic ΔH appear less negative — a standard error-analysis answer."]},
  {h:"Enthalpy",b:[
   "**Hess's law**: ΔH is a state function, so sum the steps. Reversing a step flips the sign; scaling a step scales ΔH.",
   "From formation enthalpies: `ΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants)`. Elements in their standard states have ΔH°f = 0.",
   "From bond energies: `ΔH = (bonds broken) − (bonds formed)`. Breaking bonds always costs energy.",
   "Phase-change enthalpies are positive going toward the gas phase."]},
  {h:"Entropy preview",b:[
   "**Entropy** increases with more particles, more gas moles, higher temperature, and greater dispersal.",
   "Predict the sign of ΔS from the change in moles of gas and the change in phase.",
   "Full treatment of spontaneity is in Unit 9; here, know that energy disperses and that both ΔH and ΔS matter."]}],
 tip:"Sign conventions cost the most points here. Write whether the system absorbs or releases energy in words, then assign the sign.",
 terms:["specific heat","calorimetry","endothermic","exothermic","Hess's law","standard enthalpy of formation","bond enthalpy","entropy"],
 cards:[
 ["Heat equation for a temperature change","q = mcΔT"],
 ["Sign of ΔH for an exothermic process","Negative — the system releases energy."],
 ["State Hess's law","Enthalpy is a state function, so the ΔH of a reaction equals the sum of the ΔH values of any set of steps summing to it."],
 ["ΔH from formation enthalpies","ΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants)"],
 ["ΔH from bond enthalpies","ΔH = energy of bonds broken − energy of bonds formed"],
 ["ΔH°f of an element in its standard state","Zero."],
 ["Effect of heat loss to the surroundings on a measured exothermic ΔH","It makes the measured ΔH less negative than the true value."],
 ["Predict the sign of ΔS when a gas condenses","Negative — the particles become far more ordered and less dispersed."],
 ["Temperature vs heat","Temperature measures average kinetic energy; heat is the energy transferred between objects at different temperatures."]]},
{title:"Equilibrium",weight:[7,9],
 desc:"K, Q, Le Châtelier, ICE tables, and solubility equilibria.",
 notes:[
  {h:"The equilibrium state",b:[
   "At equilibrium, forward and reverse rates are equal and concentrations stop changing — it is **dynamic**, not static.",
   "`K = products/reactants`, each raised to its coefficient. Pure solids and liquids are omitted. `K_p` uses partial pressures.",
   "Large K means product-favored; small K means reactant-favored. K depends on **temperature only**.",
   "Reversing a reaction inverts K; multiplying coefficients raises K to that power; adding reactions multiplies their K values."]},
  {h:"Q and Le Châtelier",b:[
   "The **reaction quotient** Q has the same form as K but uses current concentrations. **Q < K** shifts right; **Q > K** shifts left; Q = K means equilibrium.",
   "Stresses: adding a reactant shifts right; removing a product shifts right; **decreasing volume** (raising pressure) shifts toward fewer moles of gas.",
   "Temperature is the only stress that changes K: heating shifts an endothermic reaction right (treat heat as a reactant).",
   "Adding an inert gas at constant volume, or a catalyst, does not shift the position of equilibrium."]},
  {h:"ICE calculations",b:[
   "Set up Initial, Change, Equilibrium rows; express changes with x and the coefficients.",
   "When K is very small, approximate by assuming x is negligible compared with the initial concentration, then check that x is under about 5%.",
   "Solve exactly with the quadratic formula when the approximation fails.",
   "Check the answer: plug back into the K expression."]},
  {h:"Solubility equilibria",b:[
   "`K_sp` is the product of ion concentrations of a saturated solution; a larger K_sp means greater solubility for comparable formulas.",
   "**Common ion effect**: adding an ion already in the equilibrium lowers solubility (Q rises above K and solid precipitates).",
   "pH affects the solubility of salts with basic or acidic ions — adding acid dissolves carbonates and hydroxides.",
   "Compare Q with K_sp to predict whether a precipitate forms when solutions are mixed."]}],
 tip:"Le Châtelier questions always ask for a direction plus a reason. Say which side Q is on relative to K, then name the shift.",
 terms:["dynamic equilibrium","equilibrium constant","reaction quotient","Le Châtelier's principle","ICE table","K_sp","common ion effect"],
 cards:[
 ["What makes equilibrium dynamic?","Forward and reverse reactions continue at equal rates, so concentrations stay constant while reactions proceed."],
 ["Which species are omitted from an equilibrium expression?","Pure solids and pure liquids, including water as a solvent."],
 ["What is the only factor that changes K?","Temperature."],
 ["Q < K means the reaction shifts which way?","Toward products (to the right)."],
 ["Effect of decreasing volume on a gas equilibrium","The equilibrium shifts toward the side with fewer moles of gas."],
 ["Effect of adding a catalyst on the equilibrium position","None — only the rate of reaching equilibrium changes."],
 ["Effect of heating an endothermic reaction at equilibrium","The equilibrium shifts toward products and K increases."],
 ["When can you neglect x in an ICE table?","When K is very small relative to the initial concentration; verify x is less than about 5% of it."],
 ["What is the common ion effect?","Adding an ion already present in a solubility equilibrium decreases the solubility of the salt."],
 ["How do you predict whether a precipitate forms?","Compute Q from the mixed concentrations and compare with K_sp; Q > K_sp means precipitation."]]},
{title:"Acids and Bases",weight:[11,15],
 desc:"pH, strength, buffers, and titration curves. The second-heaviest unit.",
 notes:[
  {h:"Definitions and pH",b:[
   "Brønsted-Lowry: an **acid donates H⁺**, a **base accepts H⁺**. Conjugate pairs differ by one proton.",
   "`pH = −log[H⁺]`, `pOH = −log[OH⁻]`, `pH + pOH = 14` at 25 °C, and `K_w = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴`.",
   "A change of one pH unit is a tenfold change in [H⁺].",
   "Strong acids and bases ionize completely; weak ones reach equilibrium, so [H⁺] is much smaller than the nominal concentration."]},
  {h:"Strength and structure",b:[
   "Memorize the strong acids (HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄) and the strong bases (group 1 and heavy group 2 hydroxides).",
   "`K_a` measures acid strength; larger K_a (smaller pK_a) means stronger. `K_a·K_b = K_w` for a conjugate pair.",
   "Within a series, more electronegative atoms or more oxygens on the central atom make an oxyacid stronger by stabilizing the conjugate base.",
   "The **stronger the acid, the weaker its conjugate base**. Strong acid conjugates are neutral spectators."]},
  {h:"Weak acid calculations and salts",b:[
   "For a weak acid, set up an ICE table with K_a; `[H⁺] ≈ √(K_a·C)` when the approximation is valid.",
   "Percent ionization increases as the solution becomes more dilute.",
   "Salt solutions: the cation of a weak base or the anion of a weak acid hydrolyzes. NH₄Cl is acidic, NaF is basic, NaCl is neutral.",
   "Amphiprotic species can act as either acid or base depending on the partner."]},
  {h:"Buffers and titration curves",b:[
   "A **buffer** contains comparable amounts of a weak acid and its conjugate base; it resists pH change because either added acid or base is consumed.",
   "`pH = pK_a + log([A⁻]/[HA])`. Buffer capacity is greatest when the ratio is 1, where **pH = pK_a**.",
   "Diluting a buffer barely changes pH because the ratio stays the same; exceeding the capacity destroys the buffer.",
   "Titration curve landmarks: initial pH, the gentle **buffer region**, the **half-equivalence point (pH = pK_a)**, the steep equivalence point, and the plateau of excess titrant.",
   "A polyprotic acid shows multiple equivalence points, one per ionizable proton."]}],
 tip:"Identify whether the solution is a strong acid, weak acid, buffer, or salt **before** choosing a method. Most wrong answers come from using the wrong approach, not bad arithmetic.",
 terms:["Brønsted-Lowry","conjugate pair","pH","K_w","K_a","percent ionization","hydrolysis","buffer","Henderson-Hasselbalch","half-equivalence point","polyprotic"],
 cards:[
 ["Brønsted-Lowry definitions","An acid donates a proton; a base accepts a proton."],
 ["K_w at 25 °C and the pH+pOH relationship","K_w = 1.0 × 10⁻¹⁴; pH + pOH = 14"],
 ["Relationship between K_a and K_b of a conjugate pair","K_a × K_b = K_w"],
 ["Name the six strong acids","HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄"],
 ["Why is HClO₃ a stronger acid than HClO₂?","More oxygens withdraw electron density and stabilize the conjugate base."],
 ["Is a solution of NH₄Cl acidic, basic, or neutral?","Acidic — NH₄⁺ is the conjugate acid of the weak base ammonia and hydrolyzes."],
 ["Two requirements for a buffer","Comparable amounts of a weak acid and its conjugate base."],
 ["Henderson-Hasselbalch equation","pH = pK_a + log([A⁻]/[HA])"],
 ["At the half-equivalence point, pH equals","pK_a"],
 ["Why does diluting a buffer leave the pH nearly unchanged?","Both components are diluted equally, so their ratio — which sets the pH — does not change."],
 ["How many equivalence points does a diprotic acid show?","Two, one for each ionizable proton."],
 ["How does percent ionization of a weak acid change with dilution?","It increases as the solution becomes more dilute."]]},
{title:"Applications of Thermodynamics",weight:[7,9],
 desc:"Entropy, Gibbs free energy, and electrochemistry.",
 notes:[
  {h:"Entropy",b:[
   "Entropy measures the dispersal of energy and matter. It increases when gas moles increase, a solid dissolves or melts, or temperature rises.",
   "`ΔS°rxn = ΣS°(products) − ΣS°(reactants)`.",
   "The second law: total entropy of system plus surroundings increases for any spontaneous process. A system can become more ordered if the surroundings gain more entropy."]},
  {h:"Gibbs free energy",b:[
   "`ΔG° = ΔH° − TΔS°`. **Negative ΔG means thermodynamically favorable** (spontaneous).",
   "Four cases: ΔH < 0 and ΔS > 0 is favorable at all temperatures; ΔH > 0 and ΔS < 0 never; the mixed cases are temperature-dependent, with the switch at `T = ΔH/ΔS`.",
   "`ΔG° = −RT ln K`, so K > 1 corresponds to negative ΔG°. `ΔG = ΔG° + RT ln Q` away from standard conditions.",
   "Thermodynamic favorability says nothing about **rate** — a favorable reaction can be immeasurably slow (kinetic control).",
   "Coupling an unfavorable reaction to a strongly favorable one makes the combination favorable."]},
  {h:"Electrochemistry",b:[
   "**Oxidation occurs at the anode, reduction at the cathode** (AN OX, RED CAT). Electrons flow through the wire from anode to cathode.",
   "`E°cell = E°cathode − E°anode`. A positive E°cell means a **galvanic (voltaic)** cell; negative means an **electrolytic** cell requiring applied voltage.",
   "`ΔG° = −nFE°` links the two worlds: positive E° ↔ negative ΔG° ↔ K > 1.",
   "Salt bridges maintain charge balance; anions migrate toward the anode.",
   "**Faraday's laws**: `q = It` and `mol e⁻ = q/96485`. Use the half-reaction to convert to moles of substance plated or produced.",
   "Concentration changes shift the cell potential — increasing reactant concentration raises E (a qualitative Nernst argument)."]}],
 tip:"Any question asking whether a reaction 'will happen' is asking for ΔG, not ΔH. And if it then asks 'how fast', that is kinetics — a separate answer.",
 terms:["entropy","second law","Gibbs free energy","thermodynamic favorability","ΔG° = −RT ln K","galvanic cell","electrolytic cell","anode","cathode","Faraday's law"],
 cards:[
 ["Gibbs free energy equation","ΔG° = ΔH° − TΔS°"],
 ["What does a negative ΔG indicate?","The process is thermodynamically favorable under those conditions."],
 ["Relationship between ΔG° and K","ΔG° = −RT ln K, so K > 1 gives a negative ΔG°."],
 ["When is a reaction with ΔH > 0 and ΔS > 0 favorable?","At high temperature, above T = ΔH/ΔS."],
 ["Does a negative ΔG guarantee a fast reaction?","No — favorability and rate are independent; activation energy controls rate."],
 ["Which electrode is oxidation and which is reduction?","Oxidation at the anode, reduction at the cathode."],
 ["Formula for standard cell potential","E°cell = E°cathode − E°anode"],
 ["Relationship between E° and ΔG°","ΔG° = −nFE°, so a positive cell potential means a negative ΔG°."],
 ["Galvanic vs electrolytic cell","Galvanic has a positive E°cell and runs spontaneously; electrolytic has a negative E°cell and requires applied voltage."],
 ["Faraday's constant and its use","96485 C per mole of electrons; combined with q = It it converts current and time into moles of electrons."],
 ["What does a salt bridge do?","Allows ion migration to maintain electrical neutrality in both half-cells."]]}
],

{u:1,q:"A PES spectrum shows three peaks with relative heights 2, 2, and 1. The element is",c:["Be","B","Li","Na"],a:1,e:"The peaks correspond to 1s², 2s², 2p¹ — five electrons in total, which is boron."},

{u:3,q:"A real gas deviates most from ideal behavior at",c:["high temperature and low pressure","low temperature and high pressure","standard conditions","large volume"],a:1,e:"Attractions matter at low temperature and particle volume matters at high pressure."},
{u:4,q:"2 mol Al reacts with 2 mol Cl₂ (2Al + 3Cl₂ → 2AlCl₃). The limiting reactant is",c:["Al","Cl₂","neither","both equally"],a:1,e:"Al: 2/2 = 1.0; Cl₂: 2/3 = 0.67. The smaller quotient, Cl₂, limits."},
{u:5,q:"Doubling [A] triples nothing and leaves the rate unchanged. The order in A is",c:["zero","first","second","one half"],a:0,e:"A rate independent of concentration is zero order in that species."},
{u:5,q:"A plot of 1/[A] versus time is linear. The reaction is",c:["zero order","first order","second order","third order"],a:2,e:"A linear 1/[A] plot is the signature of second-order kinetics."},
{u:6,q:"A coffee-cup calorimeter loses heat to the room during an exothermic reaction. The calculated ΔH will be",c:["too negative","less negative than the true value","unchanged","positive"],a:1,e:"Some released heat never warms the solution, so the measured temperature rise — and the magnitude of ΔH — is too small."},
{u:7,q:"For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), decreasing the volume shifts the equilibrium",c:["left","right","not at all","depends on K"],a:1,e:"Higher pressure favors the side with fewer moles of gas — the product side, with 2 mol versus 4."},
{u:8,q:"A buffer has its greatest capacity when",c:["pH = 7","pH = pK_a","the acid is fully ionized","the conjugate base is absent"],a:1,e:"Equal amounts of acid and conjugate base, which occurs when pH = pK_a, resist change in both directions best."},
{u:8,q:"A 0.10 M solution of NaF is",c:["acidic","basic","neutral","a buffer"],a:1,e:"F⁻ is the conjugate base of the weak acid HF, so it hydrolyzes and raises the pH."},
{u:9,q:"A reaction has ΔH > 0 and ΔS > 0. It is favorable",c:["at all temperatures","at no temperature","only at high temperature","only at low temperature"],a:2,e:"TΔS must exceed ΔH, which happens above T = ΔH/ΔS."},
{u:9,q:"If E°cell is positive, then",c:["ΔG° is positive and K < 1","ΔG° is negative and K > 1","ΔG° = 0","K cannot be determined"],a:1,e:"ΔG° = −nFE°, so a positive potential gives a negative ΔG° and K > 1."}
]
