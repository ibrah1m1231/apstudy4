      x.li.classList.toggle("ok", pass);
      if (!pass) ok = false;
    });
    var m = v.length > 0 && v === pin2.value;
    matchRow.classList.toggle("ok", m);
    btn.disabled = !(ok && m);
    return ok && m;
  }
  pin.addEventListener("input", validate);
  pin2.addEventListener("input", validate);

  var legacy = H.legacyData();

  var form = el("form", {
    onsubmit: function (e) {
      e.preventDefault();
      if (!validate()) return;
      btn.disabled = true; btn.textContent = "Setting up…";
      H.createProfile(pin.value, name.value.trim())
        .then(function () {
          if (legacy && confirmAdopt) return H.adoptLegacy();
        })
        .then(function () { clearShell(); done(); })
        .catch(function (e2) {
          err.textContent = e2.message || String(e2);
          btn.disabled = false; btn.textContent = "Create profile";
        });
    }
  }, [
    el("label", { for: "pinNew", text: "PIN" }), pin,
    el("label", { for: "pinNew2", text: "Confirm PIN" }), pin2,
    checks,
    el("label", { for: "pinLabel", text: "Nickname — optional, used to greet you" }), name,
    err,
    btn
  ]);

  var confirmAdopt = false;
  var adoptRow = null;
  if (legacy) {
    var cb = el("input", { type: "checkbox", id: "adoptLegacy", checked: true, onchange: function (e) { confirmAdopt = e.target.checked; } });
    confirmAdopt = true;
    adoptRow = el("label", { class: "lockadopt", for: "adoptLegacy" }, [cb, el("span", { text: "Move the progress already saved in this browser into this profile" })]);
    form.insertBefore(adoptRow, err);
  }

  shell([
    el("div", { class: "lockhead" }, [mark(), el("div", {}, [
      el("h1", { text: opts.extra ? "Add a profile" : "AP Study Hub" }),
      el("p", { text: opts.extra ? "A second person can keep their own progress on this computer." : "Set a PIN to save your progress on this device." })
    ])]),
    form,
    cryptoNote(),
    opts.extra ? el("button", { class: "btn btn-ghost", style: "width:100%;margin-top:.5rem", onclick: function () { clearShell(); unlockScreen(done); } }, ["Back to unlock"]) : null,
    el("p", { class: "lockfine", text: "There is no password reset — the PIN is the key. Export a backup from Settings once you have work worth keeping." })
  ]);
  setTimeout(function () { pin.focus(); }, 60);
}

/* ---------------------------------------------- unlock */
function unlockScreen(done) {
  clearShell();
  var pin = el("input", { type: "password", id: "pinUnlock", autocomplete: "current-password", placeholder: "Enter your PIN", "aria-label": "PIN" });
  var err = el("p", { class: "lockerr", role: "alert" });
  var btn = el("button", { class: "btn btn-primary btn-lg", type: "submit" }, ["Unlock"]);
  var n = H.profileCount();

  var form = el("form", {
    onsubmit: function (e) {
      e.preventDefault();
      if (!pin.value) return;
      btn.disabled = true; btn.textContent = "Checking…";
      H.unlock(pin.value)
        .then(function () { clearShell(); done(); })
        .catch(function (e2) {
          err.textContent = e2.message || "That PIN does not match.";
          pin.value = ""; pin.focus();
          btn.disabled = false; btn.textContent = "Unlock";
        });
    }
  }, [el("label", { for: "pinUnlock", text: "PIN" }), pin, err, btn]);

  shell([
    el("div", { class: "lockhead" }, [mark(), el("div", {}, [
      el("h1", { text: "Welcome back" }),
      el("p", { text: n > 1 ? n + " profiles are saved on this device. Enter yours." : "Enter your PIN to open your progress." })
    ])]),
    form,
    el("button", { class: "btn btn-ghost", style: "width:100%;margin-top:.6rem", onclick: function () { createScreen(done, { extra: true }); } }, [icon("plus"), "Set up a new profile"]),
    el("p", { class: "lockfine", text: "Forgotten it? There is no reset — a new profile starts fresh, and an exported backup can be imported into it." })
  ]);
  setTimeout(function () { pin.focus(); }, 60);
}

/* ---------------------------------------------- entry */
function start(done) {
  if (H.profileCount() === 0) createScreen(done);
  else unlockScreen(done);
}

window.LockUI = { start: start, createScreen: createScreen, unlockScreen: unlockScreen, RULES: RULES };
})();

/* ============================================================ boot */
(function () {
"use strict";
var H = window.H, el = H.el, icon = H.icon;

/* default route alias */
H.route("units", function () { H.go("home"); });

function chrome() {
  var app = el("div", { class: "app" }, [
    el("nav", { class: "rail", id: "rail", "aria-label": "Courses and sections" }, [
      el("div", { class: "brand" }, [
        (function () {
          var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          s.setAttribute("viewBox", "0 0 32 32"); s.setAttribute("class", "brand-mark"); s.setAttribute("aria-hidden", "true");
          s.innerHTML =
            '<rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="var(--accent)"/>' +
            '<circle cx="10" cy="11" r="2.3" fill="var(--on-accent)"/>' +
            '<circle cx="16" cy="11" r="2.3" fill="var(--on-accent)" opacity=".45"/>' +
            '<circle cx="22" cy="11" r="2.3" fill="var(--on-accent)" opacity=".45"/>' +
            '<circle cx="10" cy="17" r="2.3" fill="var(--on-accent)" opacity=".45"/>' +
            '<circle cx="16" cy="17" r="2.3" fill="var(--on-accent)"/>' +
            '<circle cx="22" cy="17" r="2.3" fill="var(--on-accent)" opacity=".45"/>' +
            '<path d="M8.5 23.5h15" stroke="var(--on-accent)" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>';
          return s;
        })(),
        el("div", {}, [
          el("span", { class: "brand-name", text: "AP Study Hub" }),
          el("span", { class: "brand-sub", text: "25 courses" })
        ])
      ]),
      el("div", { class: "rail-search" }, [
        icon("search", 13),
        el("input", { id: "railFilter", type: "search", placeholder: "Filter courses", "aria-label": "Filter courses", oninput: H.buildRail })
      ]),
      el("div", { class: "rail-nav", id: "railNav" }, [
        el("button", { class: "navitem", "data-route": "home", onclick: function () { H.go("home"); } }, [icon("home"), "Dashboard"]),
        el("button", { class: "navitem", "data-route": "courses", onclick: function () { H.go("courses"); } }, [icon("book"), "All courses"]),
        el("button", { class: "navitem", "data-route": "search", onclick: function () { H.go("search"); } }, [icon("search"), "Search"]),
        el("button", { class: "navitem", "data-route": "saved", onclick: function () { H.go("saved"); } }, [icon("star"), "Saved"])
      ]),
      el("div", { class: "rail-courses", id: "railCourses" }),
      el("div", { class: "rail-nav", style: "padding-bottom:8px" }, [
        el("button", { class: "navitem", "data-route": "timer", onclick: function () { H.go("timer"); } }, [icon("clock"), "Study timer"]),
        el("button", { class: "navitem", "data-route": "calculator", onclick: function () { H.go("calculator"); } }, [icon("calc"), "Score calculator"]),
        el("button", { class: "navitem", "data-route": "calendar", onclick: function () { H.go("calendar"); } }, [icon("cal"), "Exam dates"]),
        el("button", { class: "navitem", "data-route": "settings", onclick: function () { H.go("settings"); } }, [icon("gear"), "Settings"])
      ])
    ]),
    el("main", { class: "main" }, [
      el("header", { class: "topbar" }, [
        el("button", { class: "btn btn-ghost btn-icon menu-btn", "aria-label": "Open course list", onclick: H.openRail }, [icon("menu")]),
        el("div", { class: "crumbs", id: "crumbs" }, [el("b", { text: "Dashboard" })]),
        el("div", { class: "topbar-spacer" }),
        el("div", { id: "topright", style: "display:flex;gap:.4rem;align-items:center" }),
        el("button", { class: "btn btn-sm", "aria-label": "Command palette", title: "Jump to… (Ctrl+K)", onclick: H.openPalette }, [icon("search", 14), el("span", { class: "sr", text: "Search" })])
      ]),
      el("div", { class: "view", id: "view" }),
      el("footer", { class: "appfoot", style: "margin-top:auto;padding:1.2rem var(--gut) 2rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--faint)" }, [
        el("p", { style: "margin:0 0 .3rem", text: "AP Study Hub — an independent study site. Unit structures and exam weightings follow the College Board Course and Exam Descriptions; all notes, flashcards, and questions here are original study material." }),
        el("p", { style: "margin:0", text: "AP and Advanced Placement are registered trademarks of the College Board, which has not reviewed or endorsed this site. Confirm unit weightings, exam formats, and exam dates against the current official CED for your year." })
      ])
    ])
  ]);
  document.body.appendChild(app);
  document.body.appendChild(el("div", { class: "scrim", id: "scrim", onclick: function () { H.closeRail(); H.closeSheet(); H.closePalette(); } }));
  document.body.appendChild(el("div", { class: "toasts", id: "toasts" }));
  document.body.appendChild(el("button", {
    class: "verbadge", id: "verbadge",
    title: "AP Study Hub " + (window.APP_VERSION || "") + " — built " + (window.APP_BUILD || "") + ". Click for settings.",
    onclick: function () { H.go("settings"); }
  }, [window.APP_VERSION || "v?"]));
}

/* keyboard shortcuts */
document.addEventListener("keydown", function (e) {
  var typing = /input|textarea|select/i.test(e.target.tagName || "");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); H.openPalette(); return; }
  if (e.key === "Escape") { H.closePalette(); H.closeSheet(); H.closeRail(); return; }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); H.go("search"); }
  else if (e.key === "?") { H.go("settings"); }
});

window.addEventListener("hashchange", function () {
  if (window.Study) window.Study.detachKeys();
  var cr = H.$("#crumbs"); if (cr) { cr.innerHTML = ""; cr.appendChild(el("b", { text: titleFor() })); }
  var tr = H.$("#topright"); if (tr) tr.innerHTML = "";
  H.render();
});
function titleFor() {
  var p = H.CURRENT;
  return ({ home: "Dashboard", courses: "All courses", search: "Search", saved: "Saved", settings: "Settings", timer: "Study timer", calculator: "Score calculator", calendar: "Exam dates" })[p[0]] || "Dashboard";
}

function boot() {
  H.applySettings();
  if (!H.$(".app")) chrome();
  H.render();
}
window.LockUI.start(function () {
  boot();
  if (H.LOCK.label) H.toast("Welcome back, " + H.LOCK.label);
  setTimeout(function () { if (window.AISetup) window.AISetup.gate(); }, 350);
});
window.addEventListener("beforeunload", function () { H.writeProfile(); });
})();

</script>
