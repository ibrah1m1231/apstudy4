units:[
{title:"Polynomial and Rational Functions",weight:[30,40],
 desc:"Rates of change, zeros, end behavior, asymptotes, and equivalent forms.",
 notes:[
  {h:"Change in functions",b:[
   "**Average rate of change** over [a,b] is `(f(b) − f(a))/(b − a)` — the slope of the secant line.",
   "A function is **concave up** where the average rates of change are increasing, **concave down** where they are decreasing.",
   "Linear functions have constant first differences; quadratics have constant **second** differences. Use difference tables to identify degree from data.",
   "An inflection point is where concavity changes — where the rate of change stops increasing and starts decreasing, or vice versa."]},
  {h:"Polynomial functions",b:[
   "Degree n polynomials have at most n real zeros and at most n−1 extrema.",
   "**Multiplicity**: odd multiplicity crosses the axis, even multiplicity touches and turns around.",
   "End behavior depends on the degree's parity and the leading coefficient's sign — four cases.",
   "Complex zeros come in conjugate pairs; total zeros counted with multiplicity equals the degree.",
   "Even functions satisfy f(−x) = f(x) (symmetric about the y-axis); odd functions satisfy f(−x) = −f(x) (symmetric about the origin)."]},
  {h:"Rational functions",b:[
   "**Vertical asymptotes** at zeros of the denominator that do not cancel; canceled factors give **holes**.",
   "Horizontal asymptote: bottom-heavy → y = 0; equal degrees → ratio of leading coefficients; top-heavy → none (a slant asymptote when the degree difference is 1).",
   "Find a slant asymptote by polynomial long division; the quotient is the asymptote.",
   "Sign analysis on a number line determines where the function is positive or negative between zeros and asymptotes."]},
  {h:"Equivalent forms and modeling",b:[
   "Standard, factored, and vertex forms each reveal something different — zeros, intercepts, or the extremum.",
   "Binomial expansion and the Binomial Theorem give coefficients from Pascal's triangle.",
   "To model: check whether differences (polynomial) or ratios (exponential) are roughly constant, choose the family, then fit with regression and interpret the parameters in context.",
   "Always state the **domain restriction** a real-world context imposes on a model."]}],
 tip:"When asked to justify concavity from a table, compute the average rates of change over consecutive intervals and say whether they are increasing or decreasing.",
 terms:["average rate of change","concavity","multiplicity","end behavior","vertical asymptote","slant asymptote","even and odd functions"],
 cards:[
 ["Average rate of change of f on [a,b]","(f(b) − f(a))/(b − a) — the slope of the secant line."],
 ["How do you tell concave up from a table of values?","Compute average rates of change on consecutive intervals; increasing rates mean concave up."],
 ["What is constant for a quadratic data set?","The second differences."],
 ["Zero of even multiplicity: crosses or touches?","Touches the x-axis and turns around."],
 ["Maximum number of extrema for a degree-n polynomial","n − 1"],
 ["When does a rational function have a hole instead of a vertical asymptote?","When the factor causing the zero denominator cancels with the numerator."],
 ["Degree of numerator one more than denominator: what asymptote?","A slant (oblique) asymptote, found by long division."],
 ["Definition of an even function","f(−x) = f(x); the graph is symmetric about the y-axis."],
 ["Definition of an odd function","f(−x) = −f(x); the graph is symmetric about the origin."],
 ["How many complex zeros does a degree-5 polynomial have?","Five, counting multiplicity; non-real zeros come in conjugate pairs."]]},
{title:"Exponential and Logarithmic Functions",weight:[27,40],
 desc:"Proportional growth, inverses, log properties, and modeling with regression.",
 notes:[
  {h:"Sequences and exponential growth",b:[
   "**Arithmetic** sequences add a constant difference: `aₙ = a₀ + dn`. **Geometric** sequences multiply by a constant ratio: `gₙ = g₀rⁿ`.",
   "Exponential functions have **equal ratios over equal intervals** — that is the test that distinguishes them from polynomials.",
   "`f(x) = abˣ`: b > 1 grows, 0 < b < 1 decays; a is the initial value. Horizontal asymptote y = 0 (shifted by any vertical translation).",
   "Exponential growth eventually outpaces any polynomial."]},
  {h:"Logarithms",b:[
   "`log_b x = y` means `bʸ = x`. The log function is the **inverse** of the exponential, so their graphs reflect across y = x.",
   "Properties: `log(xy) = log x + log y`, `log(x/y) = log x − log y`, `log(xⁿ) = n log x`, `log_b b = 1`, `log_b 1 = 0`.",
   "Change of base: `log_b x = ln x / ln b`.",
   "Domain of log_b x is x > 0; the vertical asymptote is x = 0. Logarithmic functions grow without bound but ever more slowly — they are concave down."]},
  {h:"Solving and inverses",b:[
   "Solve exponential equations by taking a log of both sides; solve logarithmic equations by exponentiating — then **check for extraneous solutions** created by the domain.",
   "A function has an inverse only if it is one-to-one; restrict the domain when it is not.",
   "Inverse relationships swap domain and range, and f⁻¹(f(x)) = x on the appropriate domain."]},
  {h:"Modeling with logs and regression",b:[
   "Data that is linear when y is plotted on a **log scale** is exponential; linear on a log-log scale means a power function.",
   "Semi-log plots linearize exponential models: `ln y = ln a + x ln b`.",
   "Residuals should look random with no pattern; a curved residual plot means the model family is wrong.",
   "Interpret parameters in context: growth factor per unit time, doubling time, or percent change."]}],
 tip:"Extraneous solutions are tested constantly. After solving a log equation, substitute back and discard any answer that makes an argument non-positive.",
 terms:["geometric sequence","exponential function","logarithm","inverse function","semi-log plot","residual","extraneous solution"],
 cards:[
 ["What is constant for an exponential function over equal input intervals?","The ratio of outputs."],
 ["log_b x = y rewritten in exponential form","bʸ = x"],
 ["log(xy) =","log x + log y"],
 ["log(xⁿ) =","n log x"],
 ["Change-of-base formula","log_b x = ln x / ln b"],
 ["Domain and vertical asymptote of log_b x","Domain x > 0; vertical asymptote x = 0."],
 ["Why must you check solutions of logarithmic equations?","Algebra can produce values that make a logarithm's argument zero or negative — those are extraneous."],
 ["Arithmetic vs geometric sequence","Arithmetic adds a common difference; geometric multiplies by a common ratio."],
 ["Data is linear on a semi-log plot. What model fits?","An exponential model."],
 ["What does a patterned residual plot tell you?","The chosen function family is not appropriate for the data."],
 ["Condition for a function to have an inverse","It must be one-to-one (each output comes from exactly one input)."]]},
{title:"Trigonometric and Polar Functions",weight:[30,35],
 desc:"The unit circle, sinusoidal modeling, identities, and polar graphs.",
 notes:[
  {h:"Angles and the unit circle",b:[
   "Radian measure is arc length per unit radius; `s = rθ`. 180° = π radians.",
   "On the unit circle, `(cos θ, sin θ)` is the point at angle θ; `tan θ = sin θ/cos θ` is the slope of the terminal ray.",
   "Know the exact values at multiples of π/6 and π/4, and the signs in each quadrant.",
   "Coterminal angles differ by 2π; reference angles let you reduce any angle to the first quadrant."]},
  {h:"Sinusoidal functions and modeling",b:[
   "`y = a·sin(b(x − h)) + k`: **amplitude |a|**, **period 2π/|b|**, **phase shift h**, **midline y = k**.",
   "Amplitude = (max − min)/2; midline = (max + min)/2. Extract both from a data description before writing the model.",
   "Sine starts at the midline rising; cosine starts at a maximum. Either can model the same data with the right shift.",
   "Periodic rates of change: a sinusoid is steepest at the midline and flattest at the extremes."]},
  {h:"Inverse trig and equations",b:[
   "arcsin has range [−π/2, π/2]; arccos has range [0, π]; arctan has range (−π/2, π/2). Calculators return only these principal values.",
   "To solve a trig equation fully, find all solutions in one period, then add the period times any integer.",
   "Check the interval the question asks about — extra or missing solutions are the most common error."]},
  {h:"Identities and polar graphs",b:[
   "Pythagorean identity `sin²θ + cos²θ = 1` plus its tangent and cotangent versions.",
   "Double-angle: `sin2θ = 2 sinθ cosθ`, `cos2θ = cos²θ − sin²θ = 1 − 2sin²θ`. Sum and difference formulas follow.",
   "Polar: `r = f(θ)` with `x = r cos θ`, `y = r sin θ`. Where r is increasing and positive, the curve moves away from the origin.",
   "Recognize circles (r = a, r = a cos θ), limaçons and cardioids (r = a ± b cos θ), and roses (r = a cos nθ — n petals if n is odd, 2n if even)."]}],
 tip:"For a sinusoidal model from a word problem, write amplitude, midline, and period first; the phase shift is the only part that needs thought.",
 terms:["radian","unit circle","amplitude","period","midline","phase shift","arcsin","polar curve","cardioid"],
 cards:[
 ["Period of y = a sin(bx)","2π/|b|"],
 ["How do you find amplitude from a max and min?","Amplitude = (max − min)/2"],
 ["How do you find the midline from a max and min?","Midline = (max + min)/2"],
 ["Range of arcsin","[−π/2, π/2]"],
 ["Range of arccos","[0, π]"],
 ["sin²θ + cos²θ =","1"],
 ["sin 2θ =","2 sin θ cos θ"],
 ["cos 2θ =","cos²θ − sin²θ = 1 − 2sin²θ = 2cos²θ − 1"],
 ["Arc length formula in radians","s = rθ"],
 ["Number of petals of r = a cos(nθ)","n petals if n is odd, 2n petals if n is even."],
 ["Where is a sinusoid changing fastest?","At the midline."],
 ["How do you report all solutions to a trig equation?","Find every solution in one period, then add integer multiples of the period."]]},
{title:"Functions Involving Parameters, Vectors, and Matrices",weight:[0,0],
 desc:"Not assessed on the AP Exam, but taught as preparation for later courses.",
 notes:[
  {h:"Parametric functions",b:[
   "A parameter t drives both coordinates: `(x(t), y(t))`. The parameter adds direction and timing that a single equation cannot express.",
   "Implicitly defined curves (circles, ellipses) are naturally parametrized with sine and cosine.",
   "Eliminating the parameter recovers a Cartesian equation but loses orientation and speed information."]},
  {h:"Vectors",b:[
   "A vector has magnitude and direction: `⟨a,b⟩`, magnitude `√(a²+b²)`, direction `arctan(b/a)` adjusted by quadrant.",
   "Add componentwise; scalar multiplication scales magnitude and may reverse direction.",
   "Velocity and acceleration vectors describe planar motion; the dot product measures alignment."]},
  {h:"Matrices",b:[
   "A matrix encodes a linear transformation; multiplication composes transformations and is **not** commutative.",
   "The determinant of a 2×2 matrix `[[a,b],[c,d]]` is `ad − bc`; a zero determinant means no inverse.",
   "The inverse undoes the transformation and solves `Ax = b` when it exists.",
   "Matrices model transitions between states; repeated multiplication of a transition matrix projects a system forward."]}],
 tip:"Unit 4 is not on the exam. Study it last, and only if your class covers it.",
 terms:["parametric function","vector","magnitude","matrix","determinant","inverse matrix","transition matrix"],
 cards:[
 ["Magnitude of the vector ⟨a,b⟩","√(a² + b²)"],
 ["Determinant of [[a,b],[c,d]]","ad − bc"],
 ["What does a zero determinant mean?","The matrix has no inverse and the transformation collapses area to zero."],
 ["Is matrix multiplication commutative?","No — AB generally differs from BA."],
 ["What does eliminating the parameter lose?","Direction of travel and the timing/speed along the curve."]]}
],

units:[
{title:"Exploring One-Variable Data",weight:[15,23],
 desc:"Graphs and numerical summaries for a single variable, plus the normal model.",
 notes:[
  {h:"Variables and displays",b:[
   "**Categorical** variables place individuals in groups; **quantitative** variables take numerical values you can average.",
   "Categorical displays: bar chart, pie chart, two-way table. Quantitative: dotplot, stemplot, histogram, boxplot.",
   "A histogram's bin width changes its apparent shape — describe shape cautiously.",
   "Boxplots hide multimodality: two very different distributions can share a five-number summary."]},
  {h:"Describing a distribution — SOCS",b:[
   "**Shape** (symmetric, skewed left/right, uniform, bimodal), **Outliers/unusual features**, **Center**, **Spread** — and always in context with units.",
   "Skewed **right** means the long tail points toward large values, and pulls the mean above the median.",
   "Resistant measures (median, IQR) are barely affected by outliers; the mean and standard deviation are not.",
   "Use mean and standard deviation for roughly symmetric data; median and IQR for skewed data or data with outliers."]},
  {h:"Numerical summaries",b:[
   "Standard deviation measures typical distance from the mean; it is zero only if every value is identical.",
   "The **1.5 × IQR rule** flags outliers: below `Q1 − 1.5·IQR` or above `Q3 + 1.5·IQR`.",
   "Adding a constant to every value shifts the center but leaves spread unchanged; multiplying by a constant scales both center and spread.",
   "**Percentile** = the percent of values at or below a given value. A **z-score** `(x − μ)/σ` gives position in standard deviations."]},
  {h:"The normal distribution",b:[
   "Normal curves are symmetric and bell-shaped; the empirical rule gives about **68–95–99.7%** within 1, 2, 3 standard deviations.",
   "Convert to z-scores to compare values from different normal distributions.",
   "Work backwards from a percentile using invNorm: find z, then `x = μ + zσ`.",
   "Check normality with a dotplot or normal probability plot — a roughly straight line supports normality."]}],
 tip:"Every description of a distribution needs context. 'Skewed right' earns nothing; 'The distribution of commute times is skewed right' earns the point.",
 terms:["categorical","quantitative","SOCS","skew","resistant","IQR","z-score","empirical rule","percentile"],
 cards:[
 ["What does SOCS stand for?","Shape, Outliers, Center, Spread — plus context."],
 ["Skewed right: mean vs median","The mean is greater than the median; the long tail pulls the mean up."],
 ["Which measures of center and spread are resistant to outliers?","Median and IQR."],
 ["The 1.5 × IQR outlier rule","An outlier is below Q1 − 1.5(IQR) or above Q3 + 1.5(IQR)."],
 ["Empirical rule percentages","About 68% within 1 SD, 95% within 2 SD, 99.7% within 3 SD of the mean."],
 ["Formula for a z-score","z = (x − μ)/σ"],
 ["Add 5 to every value. What happens to the mean and the standard deviation?","The mean increases by 5; the standard deviation is unchanged."],
 ["Multiply every value by 3. What happens to the mean and SD?","Both are multiplied by 3."],
 ["When should you report median and IQR instead of mean and SD?","When the distribution is skewed or has outliers."],
 ["What does a standard deviation of 0 mean?","Every value in the data set is identical."],
 ["What does a normal probability plot show?","Roughly linear points support approximate normality; curvature indicates skew."]]},
{title:"Exploring Two-Variable Data",weight:[5,7],
 desc:"Scatterplots, correlation, least-squares regression, and residuals.",
 notes:[
  {h:"Two categorical variables",b:[
   "Two-way tables give **marginal** distributions (row/column totals) and **conditional** distributions (within one row or column).",
   "An association exists when the conditional distributions differ. Compare percentages, never raw counts.",
   "Segmented bar charts display conditional distributions side by side."]},
  {h:"Scatterplots and correlation",b:[
   "Describe a scatterplot with **direction, form, strength, and unusual features**, in context.",
   "**r** measures the strength and direction of a *linear* relationship only; −1 ≤ r ≤ 1, unitless, and unaffected by which variable is x.",
   "r is not resistant — one outlier can swing it dramatically.",
   "Correlation does not imply causation. Only a well-designed **experiment** supports a causal claim."]},
  {h:"Least-squares regression",b:[
   "The LSRL `ŷ = a + bx` minimizes the sum of squared residuals. Slope `b = r·(s_y/s_x)`; the line always passes through `(x̄, ȳ)`.",
   "Interpret the slope as a predicted change: 'For each additional hour studied, the predicted score increases by 4.2 points.'",
   "Interpret **r² ** as the proportion of variation in y explained by the linear model with x.",
   "Extrapolating far beyond the data is unreliable. Interpolate only."]},
  {h:"Residuals and influence",b:[
   "**Residual = observed − predicted.** A positive residual means the model underpredicted.",
   "A residual plot with no pattern supports a linear model; a curved pattern means a nonlinear model fits better.",
   "An **outlier** has a large residual. An **influential point** (often with extreme x) noticeably changes the slope when removed.",
   "Transform with logs or roots to linearize, then regress on the transformed variable and back-transform predictions."]}],
 tip:"Interpretations of slope, r², and intervals must name the variables and units. Generic sentences earn nothing.",
 terms:["marginal distribution","conditional distribution","correlation","LSRL","residual","r-squared","influential point","extrapolation"],
 cards:[
 ["What does r measure?","The strength and direction of a linear association between two quantitative variables."],
 ["Range of r and its units","−1 to 1, and it has no units."],
 ["LSRL slope formula","b = r(s_y/s_x)"],
 ["Which point does the LSRL always pass through?","(x̄, ȳ)"],
 ["How do you interpret r²?","The proportion of the variation in y that is explained by the linear relationship with x."],
 ["Definition of a residual","Observed y minus predicted y."],
 ["A residual is positive. What does that tell you?","The model underpredicted the actual value."],
 ["What does a curved residual plot indicate?","A linear model is not appropriate; a transformation or different model is needed."],
 ["Outlier vs influential point","An outlier has a large residual; an influential point (often extreme in x) substantially changes the regression line if removed."],
 ["Why is extrapolation risky?","The relationship is only verified over the observed range of x; it may not continue beyond it."],
 ["Does a high correlation prove causation?","No. Only a randomized experiment supports a causal conclusion."]]},
{title:"Collecting Data",weight:[12,15],
 desc:"Sampling methods, bias, and experimental design.",
 notes:[
  {h:"Samples and bias",b:[
   "A **population** is everyone of interest; a **sample** is who you actually measure. A **census** measures everyone.",
   "Random selection is what makes generalization possible; it controls **sampling bias**, not sampling variability.",
   "Sources of bias: **voluntary response** (self-selected, usually strong opinions), **undercoverage**, **nonresponse**, and **response bias** (question wording, interviewer effects).",
   "A larger sample reduces variability but does nothing to fix bias."]},
  {h:"Sampling methods",b:[
   "**Simple random sample (SRS)**: every group of size n is equally likely. Describe it procedurally: label, use a random number generator, ignore repeats, select n.",
   "**Stratified**: split into homogeneous strata and sample within each. Reduces variability when strata differ.",
   "**Cluster**: randomly choose whole heterogeneous groups and sample everyone in them. Chosen for convenience/cost.",
   "**Systematic**: take every kth individual after a random start.",
   "Convenience samples are not random and their bias is unknown."]},
  {h:"Experiments",b:[
   "An **observational study** measures; an **experiment** imposes a treatment. Only an experiment can establish causation.",
   "Four principles: **comparison** of treatments, **random assignment**, **control** of outside variables, and **replication** (enough subjects).",
   "**Confounding** occurs when another variable is linked to both the treatment and the response, so their effects cannot be separated.",
   "Blinding: single-blind (subjects don't know) and double-blind (neither subjects nor evaluators know). A **placebo** controls for expectation.",
   "**Blocking** groups similar subjects before random assignment — the experimental analogue of stratifying. **Matched pairs** is blocking with blocks of two (or the same subject twice)."]},
  {h:"Scope of conclusions",b:[
   "Random **sampling** → generalize to the population. Random **assignment** → infer causation within the study.",
   "Both → a causal conclusion that generalizes. Neither → describe the data only.",
   "Describe a randomization procedure concretely enough that another student could carry it out."]}],
 tip:"When asked to design an experiment, name the treatments, say how subjects are randomly assigned, state what is measured, and say how the groups will be compared.",
 terms:["SRS","stratified","cluster","voluntary response bias","nonresponse","confounding","random assignment","blocking","matched pairs","placebo"],
 cards:[
 ["What does random sampling let you do?","Generalize results to the population."],
 ["What does random assignment let you do?","Draw a cause-and-effect conclusion about the treatments."],
 ["Define a simple random sample","Every possible sample of size n has an equal chance of being selected."],
 ["Stratified vs cluster sampling","Stratified samples within homogeneous strata; cluster selects whole heterogeneous groups and measures everyone in them."],
 ["What is voluntary response bias?","Bias from letting people choose to participate — respondents tend to hold strong opinions."],
 ["Does increasing sample size reduce bias?","No. It reduces variability only."],
 ["Define confounding","A variable associated with both the explanatory variable and the response, making their effects impossible to separate."],
 ["Four principles of experimental design","Comparison, random assignment, control, replication."],
 ["What is a double-blind experiment?","Neither the subjects nor those measuring the response know which treatment each subject received."],
 ["Why block in an experiment?","To reduce variability by grouping similar subjects before randomly assigning treatments within each block."],
 ["Observational study vs experiment","An observational study measures existing conditions; an experiment imposes treatments and can show causation."]]},
{title:"Probability, Random Variables, and Probability Distributions",weight:[10,20],
 desc:"Probability rules, simulation, expected value, and the binomial and geometric models.",
 notes:[
  {h:"Probability rules",b:[
   "Probability is long-run relative frequency. `0 ≤ P(A) ≤ 1` and the probabilities of all outcomes sum to 1.",
   "Complement: `P(not A) = 1 − P(A)`. Addition: `P(A or B) = P(A) + P(B) − P(A and B)`.",
   "**Mutually exclusive** means they cannot both happen, so `P(A and B) = 0`. **Independent** means one does not change the other's probability.",
   "Conditional probability: `P(A|B) = P(A and B)/P(B)`. Independence check: `P(A|B) = P(A)`.",
   "Multiplication for independent events: `P(A and B) = P(A)·P(B)`. Tree diagrams and two-way tables organize conditional work."]},
  {h:"Simulation",b:[
   "Describe a simulation by specifying: what one trial is, how digits or random numbers map to outcomes, what you record, and how many trials.",
   "Estimate the probability as the proportion of trials with the event of interest.",
   "Simulation is the fallback for probability questions with no clean formula, and the basis of randomization tests."]},
  {h:"Random variables",b:[
   "A discrete random variable has a probability distribution; `μ_X = Σx·P(x)` is the **expected value** — a long-run average, not a prediction for one trial.",
   "`σ²_X = Σ(x − μ)²P(x)`; the standard deviation is its square root.",
   "Linear transformation: `μ_{a+bX} = a + bμ_X` and `σ_{a+bX} = |b|σ_X`.",
   "Sums of **independent** random variables: means add, and **variances add** — standard deviations never add. For a difference, the variances still add."]},
  {h:"Binomial and geometric",b:[
   "**Binomial** conditions (BINS): **B**inary outcomes, **I**ndependent trials, **N** fixed in advance, **S**ame probability p. Then `P(X = k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ`, `μ = np`, `σ = √(np(1−p))`.",
   "**Geometric** counts trials until the first success: `P(X = k) = (1−p)^{k−1}p`, `μ = 1/p`.",
   "Sampling without replacement violates independence, but the **10% condition** makes the binomial model acceptable when n < 0.10N.",
   "Use technology (binompdf/binomcdf) and show the setup — the numbers alone do not earn the point."]}],
 tip:"Standard deviations never add. Add variances, then take the square root — even for a difference of two random variables.",
 terms:["mutually exclusive","independent","conditional probability","expected value","binomial","geometric","10% condition"],
 cards:[
 ["P(A or B) for any two events","P(A) + P(B) − P(A and B)"],
 ["Mutually exclusive vs independent","Mutually exclusive: they cannot both occur, P(A and B) = 0. Independent: one occurring does not change the other's probability."],
 ["Conditional probability formula","P(A|B) = P(A and B)/P(B)"],
 ["How do you check independence with probabilities?","Verify P(A|B) = P(A), or equivalently P(A and B) = P(A)P(B)."],
 ["Expected value of a discrete random variable","μ = Σ x·P(x)"],
 ["How do variances combine for independent X and Y?","Variances add for both X + Y and X − Y; standard deviations do not add."],
 ["Binomial conditions (BINS)","Binary outcomes, Independent trials, fixed Number of trials, Same probability of success."],
 ["Binomial mean and standard deviation","μ = np and σ = √(np(1 − p))"],
 ["Geometric distribution mean","1/p"],
 ["The 10% condition","When sampling without replacement, treating trials as independent is acceptable if n < 10% of the population."],
 ["σ for 3X given σ_X = 4","12 — multiply the standard deviation by |b|."],
 ["What four things must a simulation description include?","What one trial is, how random digits map to outcomes, what is recorded, and the number of trials."]]},
{title:"Sampling Distributions",weight:[7,12],
 desc:"How statistics vary from sample to sample — the bridge to inference.",
 notes:[
  {h:"The core idea",b:[
   "A **parameter** describes a population (μ, p, σ); a **statistic** describes a sample (x̄, p̂, s).",
   "The **sampling distribution** of a statistic is the distribution of its values over all possible samples of size n.",
   "A statistic is **unbiased** if its sampling distribution is centered at the parameter. Larger n gives smaller variability, not less bias."]},
  {h:"Sampling distribution of p̂",b:[
   "Center: `μ_p̂ = p`. Spread: `σ_p̂ = √(p(1−p)/n)`, valid when n < 0.10N.",
   "Shape is approximately normal when `np ≥ 10` and `n(1−p) ≥ 10` (the large-counts condition).",
   "Quadrupling n halves the standard deviation — precision improves with √n, not n."]},
  {h:"Sampling distribution of x̄",b:[
   "Center: `μ_x̄ = μ`. Spread: `σ_x̄ = σ/√n` when n < 0.10N.",
   "If the population is normal, x̄ is normal for any n. Otherwise the **Central Limit Theorem** makes x̄ approximately normal when n is large (n ≥ 30 is the usual rule).",
   "CLT is about the sampling distribution, never about the shape of the population or of one sample."]},
  {h:"Differences of two statistics",b:[
   "`μ_{p̂₁−p̂₂} = p₁ − p₂` and `σ = √(p₁(1−p₁)/n₁ + p₂(1−p₂)/n₂)`.",
   "`μ_{x̄₁−x̄₂} = μ₁ − μ₂` and `σ = √(σ₁²/n₁ + σ₂²/n₂)`.",
   "Always check conditions for **both** samples separately."]}],
 tip:"Write 'sampling distribution of x̄', not 'distribution of the sample'. The AP readers distinguish the population distribution, the distribution of one sample, and the sampling distribution of a statistic.",
 terms:["parameter","statistic","sampling distribution","unbiased","standard error","Central Limit Theorem","large counts condition"],
 cards:[
 ["Parameter vs statistic","A parameter describes a population; a statistic is computed from a sample."],
 ["Mean and SD of the sampling distribution of p̂","μ = p and σ = √(p(1 − p)/n)"],
 ["Mean and SD of the sampling distribution of x̄","μ = μ and σ = σ/√n"],
 ["Large counts condition for proportions","np ≥ 10 and n(1 − p) ≥ 10"],
 ["State the Central Limit Theorem","For sufficiently large n, the sampling distribution of x̄ is approximately normal regardless of the population's shape."],
 ["What does unbiased mean for a statistic?","Its sampling distribution is centered at the population parameter."],
 ["You quadruple n. What happens to σ_x̄?","It is halved, since σ_x̄ = σ/√n."],
 ["SD of the difference of two sample means","√(σ₁²/n₁ + σ₂²/n₂)"],
 ["Three distributions students confuse","The population distribution, the distribution of one sample, and the sampling distribution of a statistic."]]},
{title:"Inference for Categorical Data: Proportions",weight:[12,15],
 desc:"Confidence intervals and significance tests for one and two proportions.",
 notes:[
  {h:"Confidence intervals for p",b:[
   "`p̂ ± z*√(p̂(1−p̂)/n)`. Conditions: random sample, 10% condition, and large counts using p̂ (`np̂ ≥ 10`, `n(1−p̂) ≥ 10`).",
   "**Interpretation of the interval**: 'We are 95% confident the true proportion of ___ is between ___ and ___.'",
   "**Interpretation of the confidence level**: 'If we repeated this sampling many times, about 95% of the intervals produced would capture the true proportion.'",
   "Margin of error shrinks with larger n and smaller confidence level. To cut the margin of error in half, quadruple n."]},
  {h:"Significance tests for p",b:[
   "State `H₀: p = p₀` and `Hₐ: p ≠ / < / > p₀`, defining p in context.",
   "Conditions use **p₀**, not p̂: `np₀ ≥ 10` and `n(1 − p₀) ≥ 10`.",
   "`z = (p̂ − p₀)/√(p₀(1−p₀)/n)`. The p-value is the probability of a statistic at least this extreme **assuming H₀ is true**.",
   "Decision: if p-value < α, reject H₀ and conclude there is convincing evidence for Hₐ. Otherwise fail to reject — never 'accept' H₀."]},
  {h:"Two proportions",b:[
   "Interval: `(p̂₁ − p̂₂) ± z*√(p̂₁(1−p̂₁)/n₁ + p̂₂(1−p̂₂)/n₂)`.",
   "Test: use the **pooled (combined) proportion** `p̂_c = (x₁+x₂)/(n₁+n₂)` in the standard error.",
   "Check conditions for both samples; both must be random (or randomly assigned) and satisfy large counts.",
   "If the interval for a difference contains 0, the data are consistent with no difference."]},
  {h:"Errors and power",b:[
   "**Type I error**: rejecting a true H₀ — probability α. **Type II error**: failing to reject a false H₀ — probability β.",
   "**Power** = 1 − β = the probability of correctly detecting a given true effect.",
   "Power increases with a larger sample, a larger true effect, a larger α, and less variability.",
   "Describe the consequence of each error type in the problem's context — that is what is scored."]}],
 tip:"A p-value is never the probability that H₀ is true. It is the probability of data this extreme given that H₀ is true.",
 terms:["confidence interval","margin of error","confidence level","p-value","Type I error","Type II error","power","pooled proportion"],
 cards:[
 ["One-proportion confidence interval","p̂ ± z*√(p̂(1 − p̂)/n)"],
 ["Interpret a 95% confidence interval","We are 95% confident that the true population proportion lies between the two endpoints."],
 ["Interpret a 95% confidence level","In repeated sampling, about 95% of the intervals constructed this way would contain the true parameter."],
 ["What does a p-value measure?","The probability of obtaining a statistic at least as extreme as observed, assuming the null hypothesis is true."],
 ["Which proportion do you use to check conditions for a one-proportion test?","The hypothesized p₀, not p̂."],
 ["Why pool the proportion in a two-proportion test?","Under H₀ the proportions are equal, so combining the samples gives the best estimate of that common value."],
 ["Define a Type I error","Rejecting a null hypothesis that is actually true. Its probability is α."],
 ["Define a Type II error","Failing to reject a null hypothesis that is actually false. Its probability is β."],
 ["Define power","The probability of correctly rejecting a false null hypothesis: 1 − β."],
 ["Three ways to increase power","Increase sample size, increase α, or have a larger true effect size."],
 ["To halve a margin of error, what must happen to n?","It must be multiplied by four."],
 ["Why never say you 'accept H₀'?","Failing to find convincing evidence against H₀ is not evidence that H₀ is true."]]},
{title:"Inference for Quantitative Data: Means",weight:[10,18],
 desc:"t-procedures for one mean, paired data, and two independent means.",
 notes:[
  {h:"Why t instead of z",b:[
   "When σ is unknown you estimate it with s, which adds variability — the **t distribution** has heavier tails.",
   "Degrees of freedom: `n − 1` for one sample. As df grows, t approaches z.",
   "Conditions: random sample, 10% condition, and **normal/large sample**: the population is normal, or n ≥ 30, or a graph of the sample shows no strong skew or outliers.",
   "With small n you must actually look at a graph of the data and comment on it."]},
  {h:"One-sample t procedures",b:[
   "Interval: `x̄ ± t*·s/√n`. Test: `t = (x̄ − μ₀)/(s/√n)` with df = n − 1.",
   "State hypotheses about μ, the **population mean**, in context — never about x̄.",
   "Interpretation of an interval for a mean mirrors the proportion case, with units."]},
  {h:"Matched pairs",b:[
   "Paired data arise from before/after measurements on the same subject or from naturally matched pairs.",
   "Compute the **differences** first, then run a one-sample t procedure on them with df = n − 1, where n is the number of pairs.",
   "`H₀: μ_diff = 0`. Define the direction of subtraction explicitly.",
   "Recognizing pairing is itself a scored decision — two columns of data from the same subjects are paired, not independent."]},
  {h:"Two independent means",b:[
   "Interval: `(x̄₁ − x̄₂) ± t*√(s₁²/n₁ + s₂²/n₂)`; use the df from technology (do not pool variances).",
   "Test: `t = (x̄₁ − x̄₂)/√(s₁²/n₁ + s₂²/n₂)`.",
   "Check conditions separately for both groups, including graphing both samples if they are small.",
   "If the data come from one randomized experiment, the conclusion is causal within the study."]}],
 tip:"Every inference FRQ is scored in four parts: name the procedure, check the conditions, compute correctly, and interpret in context. Write all four every time.",
 terms:["t distribution","degrees of freedom","matched pairs","two-sample t","normal/large sample condition"],
 cards:[
 ["When do you use t instead of z for a mean?","Whenever the population standard deviation σ is unknown and you estimate it with s."],
 ["Degrees of freedom for a one-sample t procedure","n − 1"],
 ["One-sample t confidence interval","x̄ ± t*·s/√n"],
 ["One-sample t test statistic","t = (x̄ − μ₀)/(s/√n)"],
 ["How do you analyze matched-pairs data?","Compute the differences, then perform a one-sample t procedure on those differences."],
 ["Conditions for a one-sample t procedure","Random sample, 10% condition, and normality: population normal, n ≥ 30, or a graph showing no strong skew or outliers."],
 ["Two-sample t standard error","√(s₁²/n₁ + s₂²/n₂)"],
 ["How can you tell paired data from two independent samples?","Paired data have a natural one-to-one correspondence — same subjects measured twice, or matched pairs."],
 ["What does the t distribution look like compared to z?","Same bell shape, centered at 0, but with heavier tails; it approaches z as df increases."]]},
{title:"Inference for Categorical Data: Chi-Square",weight:[2,5],
 desc:"Goodness of fit, homogeneity, and independence.",
 notes:[
  {h:"The chi-square statistic",b:[
   "`χ² = Σ(O − E)²/E`, summed over all cells. Large χ² means the observed counts are far from what the model expects.",
   "Chi-square distributions are right-skewed and determined by degrees of freedom; the p-value is always the **upper** tail.",
   "Conditions: random data, 10% condition, and **all expected counts ≥ 5** (expected, not observed).",
   "Chi-square tests use **counts**, never percentages."]},
  {h:"Three tests, three settings",b:[
   "**Goodness of fit**: one sample, one categorical variable compared to a claimed distribution. `E = n·(claimed proportion)`, df = (categories − 1).",
   "**Homogeneity**: several independent samples or treatment groups compared on one categorical variable.",
   "**Independence**: one sample classified by two categorical variables.",
   "For both two-way-table tests: `E = (row total × column total)/grand total` and `df = (rows − 1)(columns − 1)`."]},
  {h:"Interpreting results",b:[
   "A significant result says the distributions differ, not which category caused it. Examine the **largest contributions** `(O−E)²/E` to describe where.",
   "Compare observed and expected counts in words: 'More seniors than expected chose option B.'",
   "State hypotheses in words; chi-square hypotheses are about distributions, not single parameters."]}],
 tip:"If the question gives one sample with two variables, it is independence. Several groups compared on one variable is homogeneity.",
 terms:["chi-square","expected count","goodness of fit","homogeneity","independence","contribution to chi-square"],
 cards:[
 ["Chi-square statistic formula","χ² = Σ (O − E)²/E"],
 ["Expected count in a two-way table","(row total × column total)/grand total"],
 ["Degrees of freedom for a goodness-of-fit test","Number of categories minus 1."],
 ["Degrees of freedom for a two-way table test","(rows − 1)(columns − 1)"],
 ["Chi-square condition on expected counts","All expected counts must be at least 5."],
 ["When do you use a test of homogeneity?","When comparing the distribution of one categorical variable across two or more independent groups."],
 ["When do you use a test of independence?","When one sample is classified by two categorical variables."],
 ["Is a chi-square p-value one-tailed or two-tailed?","Always the upper tail of the chi-square distribution."],
 ["How do you identify which cell drives a significant chi-square result?","Find the cells with the largest individual contributions (O − E)²/E."]]},
{title:"Inference for Quantitative Data: Slopes",weight:[2,5],
 desc:"Testing and estimating the slope of a population regression line.",
 notes:[
  {h:"The regression model",b:[
   "The model is `y = α + βx + ε` with ε normal, mean 0, and constant standard deviation σ.",
   "Conditions (**LINER**): **L**inear relationship, **I**ndependent observations, **N**ormal residuals, **E**qual variance of residuals, **R**andom data.",
   "Check linearity and equal variance with the residual plot, normality with a histogram or dotplot of residuals."]},
  {h:"Reading computer output",b:[
   "A regression output table lists the intercept and slope estimates, their standard errors, the t statistic, and a two-sided p-value.",
   "`t = b/SE_b` with `df = n − 2`. The printed p-value is two-sided — halve it for a one-sided alternative.",
   "**s** in the output is the standard deviation of the residuals — typical prediction error in the units of y.",
   "R-sq is r²; take the square root and match the sign of the slope to recover r."]},
  {h:"Inference for β",b:[
   "Interval: `b ± t*·SE_b` with df = n − 2.",
   "`H₀: β = 0` means no linear relationship. Rejecting it gives evidence of a linear association.",
   "Interpret the interval in context: 'We are 95% confident that each additional hour is associated with a predicted increase of between 2.1 and 5.8 points.'"]}],
 tip:"Computer output questions are nearly free points. Practice locating b, SE_b, df = n − 2, s, and r² quickly.",
 terms:["population regression line","LINER","standard error of the slope","df = n − 2","residual standard deviation"],
 cards:[
 ["Conditions for inference about a slope (LINER)","Linear, Independent, Normal residuals, Equal variance, Random."],
 ["Test statistic for a slope","t = b/SE_b with df = n − 2"],
 ["Confidence interval for a population slope","b ± t*·SE_b, df = n − 2"],
 ["What does H₀: β = 0 mean?","There is no linear relationship between x and y in the population."],
 ["What is s in regression output?","The standard deviation of the residuals — the typical size of a prediction error, in the units of y."],
 ["How do you get r from regression output?","Take √(R-sq) and give it the sign of the slope."],
 ["Printed regression p-values are which kind?","Two-sided; halve them for a one-sided alternative."]]}
],

{u:1,q:"Scores are normal with μ = 70, σ = 8. Roughly what percent are above 86?",c:["2.5%","5%","16%","32%"],a:0,e:"86 is two standard deviations above the mean; about 2.5% of a normal distribution lies above +2 SD."},
{u:2,q:"r = 0.8 between hours studied and score. What fraction of the variation in scores is explained?",c:["0.8","0.64","0.4","0.9"],a:1,e:"r² = 0.64, so 64% of the variation in scores is explained by the linear relationship."},
{u:2,q:"A residual of −4.2 means",c:["the model predicted 4.2 too low","the model predicted 4.2 too high","the correlation is negative","the point is influential"],a:1,e:"Residual = observed − predicted, so a negative residual means the prediction exceeded the observed value."},
{u:3,q:"Researchers randomly assign volunteers to two diets. This design supports",c:["generalizing to all adults","a causal conclusion about the diets for these subjects","neither","a correlation only"],a:1,e:"Random assignment supports causation; without random sampling from a population, generalization is limited."},

{u:6,q:"A p-value of 0.03 means",c:["there is a 3% chance H₀ is true","if H₀ is true, data this extreme occur about 3% of the time","H₀ is false","the effect size is 3%"],a:1,e:"A p-value is conditional on H₀ being true; it is not the probability that H₀ is true."},
{u:7,q:"Twelve runners are timed before and after a training program. The correct procedure is",c:["two-sample t test","matched pairs t test","two-proportion z test","chi-square test"],a:1,e:"The same runners are measured twice, so the data are paired; analyze the differences with a one-sample t procedure."},
{u:8,q:"A two-way table has 4 rows and 3 columns. The chi-square degrees of freedom are",c:["12","7","6","5"],a:2,e:"df = (4 − 1)(3 − 1) = 6."},
{u:9,q:"In regression output with n = 20, the degrees of freedom for a test of the slope are",c:["18","19","20","2"],a:0,e:"df = n − 2 = 18."}

units:[
{title:"Using Objects and Methods",weight:[25,30],
 desc:"Primitive types, expressions, String and Math, objects, and calling methods.",
 notes:[
  {h:"Primitive types and expressions",b:[
   "Primitives on the exam: **int**, **double**, **boolean**. int is a 32-bit integer; double is floating point.",
   "**Integer division truncates**: `7 / 2` is 3, and `1 / 2` is 0. Multiply by 1.0 or cast to double to get a decimal result.",
   "The modulus `%` returns the remainder. `n % 2 == 0` tests even; `n % 10` extracts the last digit.",
   "Compound assignment (`+=`, `++`) and operator precedence: `*`, `/`, `%` before `+`, `-`.",
   "Casting `(int)` truncates toward zero — it does not round. `(int)(x + 0.5)` rounds a positive x."]},
  {h:"Objects and references",b:[
   "A **class** is a blueprint; an **object** is an instance created with `new`. A variable holds a **reference**, not the object itself.",
   "Two references can point to the same object — changing it through one changes it for both (aliasing).",
   "`null` means 'refers to nothing'; calling a method on null throws a **NullPointerException**.",
   "**==** compares references; **.equals()** compares contents. For Strings always use `.equals()`."]},
  {h:"Methods and parameters",b:[
   "A method signature is its name plus parameter types. **Overloading** means the same name with different parameter lists.",
   "Arguments are passed **by value**: reassigning a parameter inside a method does not affect the caller, but mutating the object a reference points to does.",
   "A method with a return type must return a value on every path; `void` methods return nothing.",
   "Static methods belong to the class (`Math.abs`); instance methods are called on an object."]},
  {h:"Strings",b:[
   "Strings are **immutable** — every operation returns a new String.",
   "`substring(i, j)` includes index i and excludes j, so its length is `j − i`. `substring(i)` runs to the end.",
   "`indexOf` returns −1 when the substring is absent — a standard 'not found' test.",
   "Concatenation with `+` converts other types to String. `\"\" + 5 + 3` gives \"53\", but `5 + 3 + \"\"` gives \"8\".",
   "Traverse a String with a loop over indices 0 to `length() - 1`, using `substring(i, i+1)` for one character."]}],
 tip:"Integer division and the exclusive upper bound of substring are the two most reliable sources of wrong answers on the MCQ. Trace them literally.",
 terms:["primitive type","integer division","modulus","reference","null","NullPointerException","immutable","overloading","pass by value"],
 cards:[
 ["What is the value of 7 / 2 in Java?","3 — integer division truncates the decimal part."],
 ["How do you get 3.5 from 7 and 2?","Force floating point: 7 / 2.0, or (double) 7 / 2."],
 ["What does n % 10 give you?","The last digit of n (for non-negative n)."],
 ["Why must you use .equals() for Strings instead of ==?","== compares references; .equals() compares the character contents."],
 ["How many characters does s.substring(2, 6) return?","Four — indices 2, 3, 4, and 5. The end index is exclusive."],
 ["What does indexOf return when the substring is absent?","−1"],
 ["What exception does calling a method on null throw?","NullPointerException"],
 ["Are Strings mutable in Java?","No — every String operation returns a new String object."],
 ["What does (int) 3.99 evaluate to?","3 — casting truncates toward zero rather than rounding."],
 ["What is method overloading?","Two methods in the same class with the same name but different parameter lists."],
 ["Expression for a random integer from 1 to 6","(int)(Math.random() * 6) + 1"],
 ["Does reassigning a parameter inside a method change the caller's variable?","No. Java passes arguments by value, so the caller's variable is unchanged."]]},
{title:"Selection and Iteration",weight:[20,25],
 desc:"Boolean expressions, if statements, loops, and tracing.",
 notes:[
  {h:"Boolean expressions",b:[
   "Relational operators `== != < > <= >=` produce booleans. Logical operators: `&&` (and), `||` (or), `!` (not).",
   "**Short circuit**: `&&` stops if the left side is false; `||` stops if the left side is true. Use this to guard against errors, e.g. `if (i < arr.length && arr[i] > 0)`.",
   "**De Morgan's laws**: `!(a && b)` equals `!a || !b`; `!(a || b)` equals `!a && !b`.",
   "Two expressions are **equivalent** if they produce the same value for every combination of inputs — build a truth table to check."]},
  {h:"Selection",b:[
   "`if`, `if/else`, and `else if` chains. Only the first true branch in a chain executes.",
   "Nested ifs test a condition inside another; an `else` always binds to the nearest unmatched `if`.",
   "Order conditions carefully — an earlier broad condition can make a later one unreachable.",
   "Boolean variables can be returned directly: `return count > 0;` is better style than an if/else returning true/false."]},
  {h:"Loops",b:[
   "`while` checks before each pass; a loop body that never changes the condition runs forever.",
   "`for (int i = 0; i < n; i++)` — initialization, condition, update. The counter's scope is the loop.",
   "**Off-by-one errors**: `i <= arr.length` throws ArrayIndexOutOfBoundsException. The last valid index is `length - 1`.",
   "Nested loops multiply iterations: the inner loop completes fully for each pass of the outer loop.",
   "Count **statement executions** by multiplying iteration counts; this is how informal runtime questions are asked."]},
  {h:"Tracing and testing",b:[
   "Trace with a table of variable values, one row per iteration. Do not predict — evaluate.",
   "Test boundary cases: empty input, one element, the first and last positions, and values at a threshold.",
   "`break` and `continue` are not part of the tested subset; restructure the loop condition instead.",
   "Common loop patterns: running total, running maximum, counting matches, and building a String."]}],
 tip:"On tracing questions, write the variable table. Mental tracing of nested loops is where almost everyone slips.",
 terms:["short circuit","De Morgan's laws","off-by-one","nested loop","boundary case","ArrayIndexOutOfBoundsException"],
 cards:[
 ["What does short-circuit evaluation of && mean?","If the left operand is false, the right operand is never evaluated."],
 ["De Morgan: !(a && b) is equivalent to","!a || !b"],
 ["Why does `for (int i = 0; i <= arr.length; i++)` fail?","The last valid index is arr.length − 1, so the final pass throws ArrayIndexOutOfBoundsException."],
 ["How many times does the inner body run for two nested loops of n and m iterations?","n × m times."],
 ["How do you safely check arr[i] > 0 when i might be out of range?","Guard with short circuit: if (i < arr.length && arr[i] > 0)."],
 ["Which boundary cases should you always test?","Empty input, a single element, the first and last elements, and values exactly at a threshold."],
 ["Rewrite `if (x > 0) return true; else return false;`","return x > 0;"],
 ["In an else-if chain, how many branches execute?","Exactly one — the first whose condition is true (or the final else)."],
 ["What makes a while loop infinite?","The body never changes the condition to false."]]},
{title:"Class Creation",weight:[20,25],
 desc:"Writing your own classes: state, constructors, methods, encapsulation, and inheritance.",
 notes:[
  {h:"Anatomy of a class",b:[
   "**Instance variables** are declared `private` and hold each object's state. **Methods** are `public` when they are part of the interface.",
   "A **constructor** has the class's name, no return type, and initializes every instance variable.",
   "Overloaded constructors let a class be built several ways; one can call another.",
   "The implicit parameter `this` refers to the object the method was called on — needed when a parameter shadows a field."]},
  {h:"Encapsulation",b:[
   "Keep data `private` and expose it through **accessors** (getters) and **mutators** (setters). This protects invariants.",
   "A mutator can validate: reject a negative price instead of storing it.",
   "Returning a reference to a mutable field breaks encapsulation — return a copy when it matters.",
   "`static` variables are shared by all instances; `final` values cannot be reassigned."]},
  {h:"Methods that objects need",b:[
   "`toString()` returns a String description and is called automatically by `System.out.println`.",
   "`equals(Object other)` should compare contents; inherited `equals` compares references.",
   "Write a **precondition** for anything the method assumes and a **postcondition** for what it guarantees.",
   "Keep methods short and single-purpose; helper methods can be private."]},
  {h:"Inheritance and polymorphism",b:[
   "`class Dog extends Animal` inherits the superclass's public methods. A subclass constructor calls `super(...)` first.",
   "**Overriding** replaces a superclass method with the same signature; `super.method()` calls the original.",
   "**Polymorphism**: a variable declared as the superclass type can reference a subclass object, and the **subclass's** overridden method runs at run time.",
   "The declared type determines which methods may be called; the actual object determines which version executes.",
   "An abstract class cannot be instantiated; an interface declares method headers a class promises to implement."]}],
 tip:"On a class FRQ, start by writing every private instance variable, then the constructor, then each method header from the problem. Structure earns points before logic does.",
 terms:["instance variable","constructor","encapsulation","accessor","mutator","this","static","toString","inheritance","override","polymorphism","abstract class","interface"],
 cards:[
 ["What three things define a constructor?","The class's name, no return type, and code that initializes the instance variables."],
 ["Why are instance variables declared private?","Encapsulation — outside code must use methods, so the class can enforce valid state."],
 ["Accessor vs mutator","An accessor returns information without changing state; a mutator changes state."],
 ["What does the keyword `this` refer to?","The object on which the method was called."],
 ["What does a static variable mean?","It belongs to the class and is shared by every instance."],
 ["When is toString() called automatically?","When an object is printed or concatenated with a String."],
 ["What must a subclass constructor do first?","Call a superclass constructor with super(...), explicitly or implicitly."],
 ["Define method overriding","A subclass defines a method with the same signature as the superclass, replacing its behavior."],
 ["Overriding vs overloading","Overriding redefines an inherited method with the same signature; overloading adds a same-named method with a different parameter list."],
 ["Animal a = new Dog(); a.speak() runs which version?","Dog's version — the actual object type determines the method executed at run time."],
 ["Can you instantiate an abstract class?","No. It can only be extended by a concrete subclass."],
 ["What is a precondition?","A condition the method assumes to be true when it is called; the method is not responsible for behavior if it is violated."]]},
{title:"Data Collections",weight:[25,30],
 desc:"Arrays, ArrayLists, 2D arrays, and the algorithms that traverse them.",
 notes:[
  {h:"Arrays",b:[
   "Declare and create: `int[] a = new int[10];` — fixed length, default values 0 / 0.0 / false / null.",
   "`a.length` is a field with **no parentheses**. Valid indices are 0 through `length - 1`.",
   "Enhanced for loop `for (int x : a)` reads each element but **cannot** modify the array. Use an indexed loop to write.",
   "Standard algorithms: sum and average, find max/min, count matches, search for a value, reverse, shift elements."]},
  {h:"ArrayList",b:[
   "`ArrayList<String> list = new ArrayList<String>();` — resizable and holds objects, never primitives directly (autoboxing wraps int as Integer).",
   "`size()`, `add(x)`, `add(i,x)`, `get(i)`, `set(i,x)`, `remove(i)`. Note `size()` has parentheses while `length` does not.",
   "**Removing while looping forward skips an element** because everything shifts left. Either decrement the index after removing, or loop backward from `size()-1` down to 0.",
   "`add(i, x)` shifts later elements right; `remove(i)` returns the removed element."]},
  {h:"2D arrays",b:[
   "`int[][] grid = new int[3][4];` gives 3 rows and 4 columns. `grid.length` is the number of rows; `grid[0].length` is the number of columns.",
   "**Row-major** traversal: outer loop over rows, inner over columns — `grid[r][c]`.",
   "Column-major traversal swaps the loops but still indexes `grid[r][c]`.",
   "Enhanced for over a 2D array: the outer variable is a whole row (`int[] row`), the inner iterates that row.",
   "Common tasks: row sums, column sums, finding a maximum with its position, building a transformed grid of the same or swapped dimensions."]},
  {h:"Searching and sorting",b:[
   "**Sequential (linear) search** checks each element; worst case n comparisons, works on unsorted data.",
   "**Binary search** requires sorted data and halves the range each step — about log₂n comparisons.",
   "**Selection sort** repeatedly moves the smallest remaining element into place; **insertion sort** grows a sorted prefix.",
   "Trace sorts by writing the array after each pass — MCQs frequently ask for the state partway through.",
   "Informal efficiency: linear traversal is proportional to n, nested traversal to n²."]}],
 tip:"When an FRQ asks you to remove items from an ArrayList, loop backward. It avoids the skipped-element bug entirely.",
 terms:["array","length vs size()","enhanced for loop","ArrayList","autoboxing","row-major","binary search","selection sort","insertion sort"],
 cards:[
 ["Difference between arr.length and list.size()","arr.length is a field with no parentheses; list.size() is a method call on an ArrayList."],
 ["Can an enhanced for loop modify array elements?","No — the loop variable is a copy. Use an indexed loop to write values."],
 ["Why does removing while looping forward through an ArrayList skip elements?","remove(i) shifts the remaining elements left, so the next index lands past the element that moved into position i."],
 ["Safest way to remove multiple items from an ArrayList","Loop backward from size() − 1 down to 0."],
 ["Number of rows and columns of a 2D array grid","grid.length rows; grid[0].length columns."],
 ["What does row-major traversal mean?","The outer loop runs over rows and the inner loop over columns."],
 ["In an enhanced for loop over int[][] grid, what type is the outer variable?","int[] — a whole row."],
 ["Requirement for binary search","The data must already be sorted."],
 ["Approximate comparisons for binary search on n elements","About log₂n."],
 ["How does selection sort work?","Repeatedly find the smallest element in the unsorted portion and swap it into the next position."],
 ["How does insertion sort work?","Take the next element and insert it into its correct place within the already-sorted prefix."],
 ["Default values in new int[5] and new String[5]","Zeros for int; nulls for String."]]},
{title:"Recursion (supplementary)",weight:[0,0],
 desc:"Not in the current exam subset, but still taught in many classes and useful for later courses.",
 notes:[
  {h:"How recursion works",b:[
   "A recursive method calls itself on a smaller input and has a **base case** that stops the chain.",
   "Each call gets its own copies of parameters and local variables on the call stack.",
   "Missing or unreachable base case ⇒ **StackOverflowError**.",
   "Trace recursion by writing the calls in order, then unwinding the returns from the bottom up."]},
  {h:"Classic examples",b:[
   "Factorial: `n == 0 ? 1 : n * fact(n-1)`.",
   "Fibonacci: two recursive calls per level, which is why the naive version is slow.",
   "Recursive binary search halves the range with each call.",
   "Merge sort splits, recursively sorts both halves, then merges — proportional to n log n."]}],
 tip:"Verify the base case first, then confirm each recursive call moves strictly closer to it.",
 terms:["base case","recursive call","call stack","StackOverflowError","merge sort"],
 cards:[
 ["Two required parts of a recursive method","A base case that returns without recursing, and a recursive call on a smaller input."],
 ["What error results from a missing base case?","StackOverflowError"],
 ["How do you trace a recursive method?","List the calls downward to the base case, then unwind the return values upward."],
 ["Why is naive recursive Fibonacci slow?","It makes two calls per level, recomputing the same subproblems exponentially many times."],
 ["Runtime of merge sort","Proportional to n log n."]]}
],

{u:1,q:"String s = \"computer\"; s.substring(2, 5) is",c:["\"mpu\"","\"mput\"","\"ompu\"","\"omp\""],a:0,e:"Indices 2, 3, 4 are 'm', 'p', 'u'. The end index 5 is excluded."},
{u:1,q:"Which correctly compares two String variables for equal contents?",c:["s1 == s2","s1.equals(s2)","s1.compareTo(s2)","s1 = s2"],a:1,e:"== compares references. equals() compares character contents. compareTo returns an ordering, not a boolean."},

{u:2,q:"!(a || b) is equivalent to",c:["!a || !b","!a && !b","a && b","!(a) && b"],a:1,e:"De Morgan's law: the negation of an or becomes an and of negations."},
{u:2,q:"for (int i = 0; i < 3; i++) for (int j = 0; j < 4; j++) count++;  Final count (initially 0)?",c:["7","12","9","16"],a:1,e:"The inner loop runs 4 times for each of 3 outer passes: 12."},
{u:3,q:"A subclass constructor that does not explicitly call super(...)",c:["fails to compile","implicitly calls the no-argument superclass constructor","skips superclass initialization","must be abstract"],a:1,e:"Java inserts an implicit call to the superclass's no-argument constructor, which must exist."},

units:[
{title:"Big Idea 1 — Creative Development",weight:[10,13],
 desc:"How programs get designed, built, tested, and debugged, usually in collaboration.",
 notes:[
  {h:"Collaboration and design",b:[
   "Collaboration produces better programs: more perspectives catch more errors and reduce bias in design choices.",
   "The development process is **iterative** — investigate, design, prototype, test, and refine, repeatedly rather than once.",
   "Program **requirements** come from user needs; document them before coding.",
   "Program **purpose** is what the program does for a user; **function** is how it behaves. A written response must state purpose clearly and briefly."]},
  {h:"Documentation and testing",b:[
   "Comments explain intent, not syntax. Document each procedure's purpose, parameters, and return value.",
   "Test with a range of inputs: typical values, boundary values, and invalid input.",
   "Error types: **syntax** (won't run), **runtime** (crashes during execution), **logic** (runs but gives a wrong answer), and **overflow**.",
   "Debug by tracing values, adding display statements, and testing small pieces in isolation."]}],
 tip:"In the Create written responses, describe the program's purpose in one or two sentences before anything else. Vague purpose statements cost the easiest point.",
 terms:["iterative development","program purpose","requirements","syntax error","runtime error","logic error","overflow error"],
 cards:[
 ["Why does collaboration improve a program?","Multiple perspectives catch more errors, broaden the design, and reduce built-in bias."],
 ["What does iterative development mean?","Repeatedly designing, implementing, and testing rather than building in one pass."],
 ["Syntax error vs logic error","A syntax error prevents the program from running; a logic error lets it run but produce incorrect results."],
 ["What is a runtime error?","An error that occurs while the program is executing, such as dividing by zero."],
 ["What should documentation include for a procedure?","Its purpose, its parameters, and what it returns."],
 ["Which inputs should you test?","Typical values, boundary values, and invalid input."]]},
{title:"Big Idea 2 — Data",weight:[17,22],
 desc:"Representing, compressing, cleaning, and extracting meaning from data.",
 notes:[
  {h:"Binary representation",b:[
   "Computers store everything as **bits**. n bits represent `2ⁿ` distinct values; a byte is 8 bits.",
   "Convert binary to decimal by summing place values: `1011` = 8 + 0 + 2 + 1 = 11.",
   "**Overflow** happens when a value needs more bits than are available; **round-off** error comes from limited precision for decimals.",
   "Analog data is continuous and must be **sampled** to become digital; more samples and more bits per sample give higher fidelity and larger files."]},
  {h:"Compression",b:[
   "**Lossless** compression restores the original exactly (run-length encoding, ZIP, PNG). Use it when every bit matters.",
   "**Lossy** compression discards information for a much smaller file (JPEG, MP3). Use it when approximate is acceptable.",
   "The trade-off is size against fidelity; you cannot recover what lossy compression removed."]},
  {h:"Information from data",b:[
   "**Metadata** is data about data — timestamps, file size, location. It enables search and can reveal more than intended.",
   "Cleaning data means handling duplicates, missing values, and inconsistent formats before analysis.",
   "Filtering and visualization reveal patterns and correlations; **correlation is not causation**.",
   "Bias enters through the data collected, not only the algorithm. A biased sample produces biased conclusions.",
   "Large data sets may require scalable systems and may make individuals identifiable when combined (the **aggregation** problem)."]}],
 tip:"Know the difference between lossy and lossless cold, and be ready to justify which is appropriate for a described situation.",
 terms:["bit","byte","overflow","round-off","sampling","lossless","lossy","metadata","data cleaning","bias","correlation"],
 cards:[
 ["How many distinct values can n bits represent?","2ⁿ"],
 ["Convert binary 1101 to decimal","13 (8 + 4 + 0 + 1)"],
 ["Lossless vs lossy compression","Lossless restores the original exactly; lossy discards data permanently for a smaller file."],
 ["What is metadata?","Data about data — such as a file's size, format, author, or timestamp."],
 ["What is an overflow error?","A value requires more bits than the representation provides."],
 ["What causes round-off error?","Limited bits cannot represent a real number exactly, so precision is lost."],
 ["What does sampling do?","Converts continuous analog data into discrete digital values at intervals."],
 ["Where does bias in a computing system most often originate?","In the data collected or the assumptions of the designers, not only the algorithm."],
 ["Does correlation in a data set prove causation?","No. A pattern may be explained by another variable entirely."]]},
{title:"Big Idea 3 — Algorithms and Programming",weight:[30,35],
 desc:"The largest idea: variables, control structures, procedures, lists, and algorithm efficiency.",
 notes:[
  {h:"Variables and data abstraction",b:[
   "A **variable** names a memory location holding a value; assignment replaces the old value.",
   "A **list** stores multiple values accessed by index (AP pseudocode lists start at index 1).",
   "Lists manage complexity: one named list plus a loop replaces dozens of separate variables and makes the program easier to change.",
   "Common list operations: append, insert, remove, access by index, and length."]},
  {h:"Control structures",b:[
   "**Sequencing** runs statements in order. **Selection** chooses a path with IF/ELSE. **Iteration** repeats with REPEAT or REPEAT UNTIL.",
   "Boolean expressions use AND, OR, NOT; build truth tables to test equivalence.",
   "**Traversal** visits every element of a list — complete traversal checks all, partial traversal stops early.",
   "Nested control structures combine: a conditional inside a loop is the standard filtering pattern."]},
  {h:"Procedures and abstraction",b:[
   "A **procedure** (function) is a named block with parameters and possibly a return value.",
   "Procedural abstraction lets you use a procedure by its name and purpose without knowing its implementation — this is what 'managing complexity' means.",
   "Parameters generalize a procedure so one definition handles many cases.",
   "Libraries and APIs are collections of procedures others wrote; using them is a form of abstraction."]},
  {h:"Algorithms and efficiency",b:[
   "Two algorithms are equivalent if they always produce the same result for the same input, even with different steps.",
   "**Linear search** checks items one by one; **binary search** requires sorted data and halves the range each step, so it is far faster.",
   "**Reasonable time** means the work grows polynomially with input size; **unreasonable time** means exponentially or factorially.",
   "A **heuristic** gives a good-enough answer quickly when an exact solution is impractical.",
   "Some problems are **undecidable** — no algorithm can give a correct yes/no answer for every possible input.",
   "**Parallel** computing splits work across processors; **distributed** computing spreads it across machines. **Speedup** = sequential time ÷ parallel time."]},
  {h:"Simulations and randomness",b:[
   "Simulations model real phenomena cheaply and safely but always simplify, so results may not transfer to reality.",
   "Randomness makes repeated simulation runs differ, which is how probability is estimated.",
   "Describe a simulation's assumptions when you interpret its output."]}],
 tip:"For the Create task, your student-developed procedure must contain a selection AND an iteration, and be called with an argument. Check all three before submitting.",
 terms:["variable","list","selection","iteration","traversal","procedure","procedural abstraction","parameter","linear search","binary search","heuristic","undecidable","parallel computing","speedup"],
 cards:[
 ["Three building blocks of any algorithm","Sequencing, selection, and iteration."],
 ["What is procedural abstraction?","Using a procedure by its name and purpose without needing to know how it works inside."],
 ["How does a list manage complexity?","One named list with a loop replaces many separate variables, so the program is shorter and easier to modify."],
 ["Linear search vs binary search","Linear checks each element in order; binary requires sorted data and halves the search range each step."],
 ["Reasonable vs unreasonable time","Reasonable: the work grows polynomially with input size. Unreasonable: it grows exponentially or factorially."],
 ["What is a heuristic?","An approach that produces a good-enough solution quickly when finding the exact one is impractical."],
 ["What is an undecidable problem?","One for which no algorithm can produce a correct answer for every possible input."],
 ["Formula for speedup from parallel computing","Speedup = sequential execution time ÷ parallel execution time."],
 ["Parallel vs distributed computing","Parallel uses multiple processors on one machine's workload; distributed spreads the work across multiple machines."],
 ["What makes two algorithms equivalent?","They always produce the same output for the same input, even if their steps differ."],
 ["Why might a simulation's results not match reality?","A simulation simplifies and makes assumptions about the real system."]]},
{title:"Big Idea 4 — Computer Systems and Networks",weight:[11,15],
 desc:"How the internet moves data, and how computing scales.",
 notes:[
  {h:"The internet",b:[
   "A **computing device** processes data; a **computing system** is devices and software working together; a **network** connects them.",
   "**Protocols** are agreed rules. **IP** addresses and routes, **TCP** guarantees ordered delivery with acknowledgments, **UDP** is faster without guarantees, **HTTP** carries web requests, **DNS** translates names to IP addresses.",
   "Data travels in **packets** that may take different routes and arrive out of order; the receiving system reassembles them.",
   "**Redundancy** — multiple paths between points — creates **fault tolerance**: the network keeps working when a link fails.",
   "**Bandwidth** is throughput (bits per second); **latency** is delay. A high-bandwidth link can still feel slow if latency is high."]},
  {h:"Scalability and the open internet",b:[
   "**Scalability** is the ability to grow without redesign — the internet scales because addressing and routing are decentralized.",
   "IPv6 exists because IPv4's address space ran out; more bits means vastly more addresses.",
   "The internet's **open standards** let any compliant device join, which is why it grew as it did.",
   "The **digital divide** is unequal access to computing by geography, income, and infrastructure — a systems issue with social consequences."]},
  {h:"Parallel and distributed systems",b:[
   "Sequential execution runs one step at a time; parallel execution splits a task across processors.",
   "Only the parallelizable portion speeds up, so speedup has a ceiling.",
   "Distributed computing lets problems too large for one machine be solved across many."]}],
 tip:"Bandwidth and latency get mixed up constantly. Bandwidth is how wide the pipe is; latency is how long before water arrives.",
 terms:["protocol","TCP","IP","DNS","packet","redundancy","fault tolerance","bandwidth","latency","scalability","digital divide"],
 cards:[
 ["What is a protocol?","An agreed-upon set of rules that lets devices communicate."],
 ["What does DNS do?","Translates human-readable domain names into IP addresses."],
 ["What does TCP add that UDP does not?","Ordered, acknowledged, reliable delivery of packets."],
 ["Bandwidth vs latency","Bandwidth is the amount of data per second; latency is the delay before data begins arriving."],
 ["How does redundancy create fault tolerance?","Multiple paths mean a failed connection can be routed around, so the network keeps working."],
 ["Why can packets arrive out of order?","They are routed independently and may take different paths of differing speed."],
 ["What is scalability?","The ability of a system to handle growth in demand without being redesigned."],
 ["What is the digital divide?","Unequal access to computing technology and the internet across regions and income levels."],
 ["Why was IPv6 created?","IPv4's 32-bit address space was exhausted; IPv6 uses 128 bits for vastly more addresses."]]},
{title:"Big Idea 5 — Impact of Computing",weight:[21,26],
 desc:"Beneficial and harmful effects, legal and ethical issues, privacy, and security.",
 notes:[
  {h:"Effects of computing innovations",b:[
   "Every innovation has both **beneficial and harmful** effects, often on different groups, and the harmful ones are frequently unintended.",
   "Computing enables **crowdsourcing** and **citizen science**, gathering contributions at a scale that was impossible before.",
   "Innovations change employment, social interaction, and access to information in ways designers do not fully control."]},
  {h:"Bias and equity",b:[
   "Bias can be embedded intentionally or unintentionally, through the training data, the design assumptions, or who was excluded from testing.",
   "Equal access matters: an innovation that assumes reliable broadband excludes people without it.",
   "The digital divide shapes who benefits from a computing innovation."]},
  {h:"Law, licensing, and ethics",b:[
   "Material is protected by **copyright** by default. **Creative Commons** licenses grant specific permissions; **open source** shares code and **open access** shares research.",
   "Using others' work requires permission or a license, plus attribution. Plagiarism in the Create task is an exam violation.",
   "**Personally identifiable information (PII)** can be combined from separate sources to identify someone, even when no single piece would."]},
  {h:"Privacy and security",b:[
   "Data collection is often invisible: cookies, location history, search records, and metadata.",
   "**Encryption** protects data in transit and at rest. **Symmetric** encryption uses one shared key; **public key** encryption uses a public key to encrypt and a private key to decrypt.",
   "Attacks to know: **phishing** (deceptive request for credentials), **keylogging**, **malware**, **rogue access points**, and **DDoS**.",
   "Strong authentication practice: long unique passwords and **multi-factor authentication**.",
   "Trade-off framing earns points: convenience and personalization against privacy and security."]}],
 tip:"Impact questions almost always want a trade-off, not a verdict. Name a benefit, name a harm, and say who is affected by each.",
 terms:["beneficial and harmful effects","crowdsourcing","bias","digital divide","copyright","Creative Commons","open source","PII","encryption","public key encryption","phishing","multi-factor authentication"],
 cards:[
 ["What must you assume about every computing innovation's effects?","It has both beneficial and harmful effects, often unintended and unevenly distributed."],
 ["What is crowdsourcing?","Obtaining input, data, or labor from a large group of people, usually online."],
 ["What is PII?","Personally identifiable information — data that can identify a specific individual, sometimes only when combined with other data."],
 ["Symmetric vs public key encryption","Symmetric uses one shared secret key for both directions; public key uses a public key to encrypt and a matching private key to decrypt."],
 ["What is phishing?","A deceptive message that tricks someone into revealing credentials or personal information."],
 ["What is multi-factor authentication?","Requiring two or more distinct kinds of evidence of identity, such as a password plus a code sent to a device."],
 ["What does a Creative Commons license do?","Grants specific, stated permissions to use copyrighted work, usually with attribution."],
 ["Why is combining data sets a privacy risk?","Separately anonymous data sets can together identify individuals."],
 ["What is a DDoS attack?","Flooding a system with requests from many sources so legitimate users cannot reach it."]]}
