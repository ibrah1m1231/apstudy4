units:[
{title:"Thinking Geographically",weight:[8,10],
 desc:"Maps, data, scale, and the core vocabulary of spatial analysis.",
 notes:[
  {h:"Maps and data",b:[
   "**Reference maps** show locations (political, physical); **thematic maps** show data — choropleth (shaded by value), dot density, graduated symbol, isoline, cartogram (area distorted by value).",
   "All **map projections** distort some combination of shape, area, distance, and direction. Mercator preserves direction and distorts high-latitude area; Robinson compromises; Gall-Peters preserves area and distorts shape.",
   "Geospatial data sources: GIS layers, remote sensing, GPS, census data, and field observation including photographs and interviews.",
   "Quantitative data are numerical and comparable; qualitative data capture meaning and perception."]},
  {h:"Core spatial concepts",b:[
   "**Absolute location** is coordinates; **relative location** is position in relation to other places. **Place** is meaning; **site** is physical characteristics; **situation** is relative position.",
   "**Distance decay**: interaction weakens with distance. **Space-time compression**: technology reduces the friction of distance.",
   "**Scale of analysis** changes the pattern you see — a county can look homogeneous nationally and diverse locally. Always name the scale in an FRQ answer.",
   "**Region** types: **formal** (uniform trait, like a state), **functional** (organized around a node, like a pizza delivery area), and **perceptual/vernacular** (defined by belief, like 'the South').",
   "**Environmental determinism** claimed the environment dictates culture; **possibilism** holds that the environment sets limits within which people choose — the accepted view."]}],
 tip:"Read the task verb and answer only that. 'Describe' questions lose points when students explain, and 'explain' questions lose points when students only describe.",
 terms:["reference map","choropleth","cartogram","map projection","GIS","remote sensing","site","situation","distance decay","space-time compression","scale of analysis","formal region","functional region","vernacular region","possibilism"],
 cards:[
 ["Difference between a reference map and a thematic map","A reference map shows locations and features; a thematic map displays data about a topic."],
 ["What does a cartogram distort and why?","Area is sized by a data value rather than land size, to show magnitude visually."],
 ["Why does every map projection distort something?","A curved surface cannot be flattened without altering shape, area, distance, or direction."],
 ["Site vs situation","Site is a place's physical characteristics; situation is its location relative to other places."],
 ["What is distance decay?","The decline in interaction between places as the distance between them increases."],
 ["What is space-time compression?","Improvements in transport and communication that reduce the effective distance between places."],
 ["Name the three types of regions","Formal (uniform characteristic), functional (organized around a node), and perceptual or vernacular (defined by perception)."],
 ["Environmental determinism vs possibilism","Determinism says the physical environment dictates culture; possibilism says it sets limits within which societies make choices."]]},
{title:"Population and Migration",weight:[12,17],
 desc:"Distribution, density, growth models, aging, and migration theory.",
 notes:[
  {h:"Distribution and density",b:[
   "Population clusters in mid-latitude, low-elevation, coastal, and fertile areas. **Physiological density** (people per arable land) often reveals pressure that arithmetic density hides.",
   "**Carrying capacity** and the Malthusian argument that population outruns food; critics note technology and falling fertility. Neo-Malthusians extend the concern to all resources.",
   "Population composition is read from a **population pyramid**: a wide base means high fertility and future growth; bulges and notches record booms, wars, and migration. A high **dependency ratio** strains working-age adults."]},
  {h:"Growth and decline",b:[
   "**Demographic Transition Model**: Stage 1 high birth and death rates; Stage 2 death rates fall and growth is rapid; Stage 3 birth rates fall; Stage 4 low and stable; Stage 5 (debated) birth below death, producing decline.",
   "The **Epidemiological Transition Model** pairs with it: infectious disease and famine give way to chronic and degenerative disease, with a possible re-emergence stage from resistance and new pathogens.",
   "Fertility falls with women's education and employment, urbanization, lower infant mortality, and access to contraception. **Replacement fertility** is about 2.1.",
   "Policy responses: **pronatalist** policies (incentives for children) in aging states, **antinatalist** policies where growth is seen as a burden. Aging populations strain pensions and healthcare and fuel immigration debates."]},
  {h:"Migration",b:[
   "**Push and pull factors** may be economic, political, environmental, social, or cultural. **Forced** migration includes refugees, asylum seekers, and internally displaced persons; **voluntary** migration is chosen.",
   "Types: international versus internal, **step migration**, **chain migration** following family and networks, **transhumance**, guest worker and transnational labor movement.",
   "**Ravenstein's laws**: most migrants move short distances, long-distance migrants head to cities, migration occurs in steps, each flow produces a counterflow, and economic motives dominate.",
   "Effects on origin areas: remittances, labor and 'brain drain', changed sex ratios. On destination areas: labor supply, ethnic enclaves, cultural change, and political reaction.",
   "**Intervening obstacles** (borders, cost, terrain) and **intervening opportunities** redirect flows."]}],
 tip:"Population pyramid questions almost always want a stage of the DTM plus a consequence. Name the stage, then name the policy or economic implication.",
 terms:["physiological density","carrying capacity","Malthus","population pyramid","dependency ratio","Demographic Transition Model","Epidemiological Transition","total fertility rate","pronatalist","push factor","forced migration","refugee","step migration","chain migration","Ravenstein","remittance","brain drain","intervening obstacle"],
 cards:[
 ["Arithmetic vs physiological vs agricultural density","Arithmetic is people per total land; physiological is people per arable land; agricultural is farmers per arable land."],
 ["What happens in Stage 2 of the demographic transition?","Death rates fall sharply while birth rates stay high, producing the fastest population growth."],
 ["What characterizes Stage 5 of the DTM?","Birth rates fall below death rates, so the population declines and ages."],
 ["Which factors most reliably lower total fertility rate?","Women's education and employment, urbanization, lower infant mortality, and access to contraception."],
 ["What does a high dependency ratio mean?","A large share of children and elderly relative to working-age adults, straining social support systems."],
 ["State two of Ravenstein's laws of migration","Most migrants travel short distances, and long-distance migrants tend to move to large cities. (Also: migration happens in steps; every flow has a counterflow; economic motives dominate.)"],
 ["Refugee vs internally displaced person","A refugee has crossed an international border; an IDP has been forced to move but remains within their own country."],
 ["What is chain migration?","Migration along paths established by family or community members who moved earlier."],
 ["What is a remittance and why does it matter?","Money migrants send home, which can be a major share of a sending country's economy."],
 ["What is an intervening obstacle?","A barrier — a border, cost, or physical feature — that hinders or redirects migration."]]},
{title:"Cultural Patterns and Processes",weight:[12,17],
 desc:"Culture, diffusion, language, religion, and cultural landscapes.",
 notes:[
  {h:"Culture and landscape",b:[
   "**Culture** is a shared set of beliefs, practices, and material traits; a **cultural landscape** is the visible imprint of culture on space — architecture, signage, land division, sacred sites.",
   "**Folk culture** is localized and traditionally transmitted; **popular culture** is widespread, rapidly changing, and mass-mediated. Popular culture can erode folk landscapes and create **placelessness**.",
   "**Ethnic enclaves** and **ethnic neighborhoods** show cultural persistence; **cultural appropriation** and commodification are contested processes.",
   "**Centripetal forces** bind a society together; **centrifugal forces** pull it apart — a concept used in both culture and politics units."]},
  {h:"Diffusion",b:[
   "**Relocation diffusion** spreads through the physical movement of people. **Expansion diffusion** spreads outward from a hearth while remaining there.",
   "Expansion subtypes: **contagious** (nearby, person-to-person), **hierarchical** (through nodes of influence — big cities first, or elites first), **stimulus** (the underlying idea spreads while the specific form changes), and **reverse hierarchical** (from small places upward).",
   "**Acculturation** adopts some traits while keeping an original identity; **assimilation** replaces the original culture; **syncretism** blends into something new; **multiculturalism** maintains diversity within a society.",
   "Lingua francas, creolization, and pidgins show language change under contact."]},
  {h:"Language and religion",b:[
   "Language families (Indo-European, Sino-Tibetan, Afro-Asiatic, Niger-Congo) branch into languages and dialects; **isoglosses** mark dialect boundaries. Languages die as speakers shift; revival efforts are political as well as cultural.",
   "**Universalizing religions** (Christianity, Islam, Buddhism) seek converts and diffuse widely; **ethnic religions** (Hinduism, Judaism, many indigenous traditions) are tied to a people and place and spread mainly by relocation.",
   "Religious landscapes differ: churches and cemeteries, mosques oriented to Mecca, Hindu temples and sacred rivers, Buddhist pagodas.",
   "Sacred space and religious conflict often concern territory (Jerusalem, Kashmir); **religious fundamentalism** can be a response to globalization."]}],
 tip:"Diffusion questions want the type named and the mechanism explained. 'Hierarchical diffusion, because the trend appeared first in large influential cities and then spread down the urban hierarchy.'",
 terms:["cultural landscape","folk culture","popular culture","placelessness","ethnic enclave","centripetal force","relocation diffusion","contagious diffusion","hierarchical diffusion","stimulus diffusion","acculturation","assimilation","syncretism","lingua franca","creole","universalizing religion","ethnic religion","fundamentalism"],
 cards:[
 ["What is a cultural landscape?","The visible human imprint on the environment — buildings, land division, signs, and sacred sites."],
 ["Folk culture vs popular culture","Folk culture is localized, traditional, and slow to change; popular culture is widespread, mass-mediated, and changes quickly."],
 ["Relocation vs expansion diffusion","Relocation spreads through the movement of people; expansion spreads outward from a hearth that retains the trait."],
 ["What is hierarchical diffusion?","Spread through nodes of influence — large cities or elite groups first — rather than by simple proximity."],
 ["What is stimulus diffusion?","The underlying idea diffuses while the specific form is adapted or changed."],
 ["Acculturation vs assimilation","Acculturation adopts some host traits while retaining original identity; assimilation replaces the original culture entirely."],
 ["Universalizing vs ethnic religion","Universalizing religions seek converts worldwide; ethnic religions are tied to a particular people and place."],
 ["What is a lingua franca?","A language adopted for communication between speakers of different native languages."],
 ["What are centripetal and centrifugal forces?","Centripetal forces unify a population; centrifugal forces divide it."]]},
{title:"Political Patterns and Processes",weight:[12,17],
 desc:"States, boundaries, sovereignty, and political fragmentation.",
 notes:[
  {h:"States and sovereignty",b:[
   "A **state** has defined territory, permanent population, a government, and recognized **sovereignty**. A **nation** is a people with shared identity; a **nation-state** aligns the two (Japan, Iceland are near-examples).",
   "**Multinational states** contain several nations (Russia, Belgium); **stateless nations** lack their own state (Kurds, Palestinians).",
   "**Colonialism** and **imperialism** created most modern borders; **neocolonialism** continues economic influence after formal independence.",
   "**Devolution** transfers power to sub-national units, driven by ethnic, economic, or territorial grievance — Scotland, Catalonia, Quebec. Extreme cases produce **balkanization**."]},
  {h:"Boundaries and organization",b:[
   "Boundary types: **geometric** (straight lines), **physical** (rivers, mountains), **cultural/ethnographic** (language, religion), **antecedent** (drawn before settlement), **subsequent** (drawn after and reflecting culture), **superimposed** (forced from outside), **relict** (no longer functioning but visible).",
   "Boundary processes: definition, delimitation (on a map), and demarcation (on the ground).",
   "Government structures: **unitary** states concentrate power centrally; **federal** states divide it among units. Federalism often suits large or diverse states.",
   "Electoral geography: **redistricting**, **gerrymandering** (packing and cracking), and malapportionment shape representation.",
   "**UNCLOS** defines territorial seas (12 nautical miles) and **exclusive economic zones** (200 nautical miles), generating maritime disputes.",
   "Supranational organizations (EU, NATO, UN, ASEAN) pool sovereignty for shared benefit, generating both cooperation and backlash."]}],
 tip:"Know at least one real example for every boundary and state type. FRQ parts routinely say 'identify an example'.",
 terms:["sovereignty","nation-state","multinational state","stateless nation","colonialism","neocolonialism","devolution","balkanization","geometric boundary","superimposed boundary","relict boundary","unitary state","federal state","gerrymandering","UNCLOS","exclusive economic zone","supranational organization"],
 cards:[
 ["Define a state in geographic terms","A territory with defined borders, a permanent population, a government, and recognized sovereignty."],
 ["What is a stateless nation? Give an example.","A people with a shared national identity but no sovereign state of their own — for example the Kurds."],
 ["What is devolution?","The transfer of political power from a central government to sub-national regions."],
 ["Superimposed vs subsequent boundary","A superimposed boundary is imposed by outsiders regardless of existing culture; a subsequent boundary develops with and reflects cultural patterns."],
 ["What is a relict boundary?","A former border that no longer functions politically but remains visible in the landscape."],
 ["Unitary vs federal government","Unitary concentrates authority in the central government; federal divides it between central and regional governments."],
 ["What is gerrymandering, and name two techniques","Drawing district boundaries for political advantage; packing concentrates opponents into few districts and cracking splits them across many."],
 ["What does UNCLOS establish?","Maritime zones including a 12-nautical-mile territorial sea and a 200-nautical-mile exclusive economic zone."],
 ["Why do supranational organizations create tension?","Members give up some sovereignty for shared benefits, which can provoke nationalist backlash."]]},
{title:"Agriculture and Rural Land Use",weight:[12,17],
 desc:"Agricultural origins, systems, settlement patterns, and the food system.",
 notes:[
  {h:"Origins and systems",b:[
   "Agriculture began independently in several **hearths** (Fertile Crescent, Mesoamerica, Southeast Asia, the Andes) and diffused outward. The **First Agricultural Revolution** was domestication; the **Second** accompanied industrialization; the **Green Revolution** brought high-yield seeds, fertilizer, and irrigation.",
   "**Subsistence** agriculture feeds the household: shifting cultivation with **slash-and-burn**, pastoral nomadism, intensive wet rice. **Commercial** agriculture sells to market: plantation, mixed crop and livestock, dairying, Mediterranean, market gardening, and ranching.",
   "**Intensive** agriculture uses much labor or capital on little land; **extensive** uses little input over large areas.",
   "Climate and terrain set the possibilities; **bid-rent** and transport costs set the economics."]},
  {h:"Patterns, settlement, and the food system",b:[
   "**Von Thünen's model**: perishable and heavy goods locate nearest market (market gardening and dairy), then forestry, then grain, then ranching — because transport cost outweighs land cost at distance. Refrigeration and highways distort the rings.",
   "Rural settlement patterns: **clustered (nucleated)**, **dispersed**, and **linear**. Survey systems: **township and range** (rectangular), **metes and bounds** (natural features), and **long lot** (narrow strips along a river or road).",
   "The modern food system features **agribusiness**, vertical integration, monoculture, commodity chains, and global supply. Consequences include soil degradation, aquifer depletion, fertilizer runoff, and loss of biodiversity.",
   "**Food insecurity** and **food deserts** arise from distribution and access, not only total production. Responses include community agriculture, organic and local food movements, fair trade, and **sustainable agriculture** practices such as crop rotation and terracing.",
   "Women do much of the world's agricultural labor, especially in subsistence systems, often without land rights."]}],
 tip:"For Von Thünen questions, explain with transport cost and perishability — and be ready to say how refrigeration or highways change the model.",
 terms:["agricultural hearth","Green Revolution","subsistence agriculture","shifting cultivation","slash-and-burn","pastoral nomadism","plantation","market gardening","intensive agriculture","Von Thünen model","bid-rent","clustered settlement","township and range","metes and bounds","long lot","agribusiness","monoculture","food desert","sustainable agriculture"],
 cards:[
 ["What did the Green Revolution involve and cost?","High-yield seed varieties, fertilizers, pesticides, and irrigation that raised output, at the cost of water use, soil degradation, and dependence on inputs."],
 ["Intensive vs extensive agriculture","Intensive uses high labor or capital per unit of land; extensive uses low inputs spread over large areas."],
 ["Explain the logic of Von Thünen's rings","Perishable and heavy products locate close to market because transport cost is high; less perishable, lighter, or land-hungry uses locate farther out."],
 ["What is market gardening?","Small-scale intensive production of fruits and vegetables for nearby urban markets — truck farming."],
 ["Describe the three main rural survey systems","Township and range uses a rectangular grid; metes and bounds follows natural features; long lots are narrow strips perpendicular to a river or road."],
 ["What is a food desert?","An area where residents have limited access to affordable, nutritious food."],
 ["Name two environmental consequences of industrial agriculture","Fertilizer runoff causing eutrophication and depletion of aquifers (also soil erosion and biodiversity loss)."],
 ["What is shifting cultivation?","Clearing a plot, often by slash-and-burn, farming it until fertility declines, then moving on while it regenerates."]]},
{title:"Cities and Urban Land Use",weight:[12,17],
 desc:"Urbanization, urban models, internal structure, and urban challenges.",
 notes:[
  {h:"Urbanization and systems",b:[
   "Drivers of urbanization: industrialization, rural push factors, and economic opportunity. **Megacities** exceed 10 million; **metacities** exceed 20 million.",
   "**World cities** command global finance and culture disproportionately to their size. **Primate cities** are more than twice the next largest and dominate national life.",
   "**Rank-size rule**: the nth largest city is 1/n the size of the largest — a sign of a balanced urban system.",
   "**Central place theory** (Christaller): settlements form a hierarchy with hexagonal hinterlands; **range** is how far people travel for a good and **threshold** is the minimum market needed to support it. High-order goods have large ranges and few locations.",
   "The **gravity model** predicts interaction as proportional to the product of populations divided by distance squared."]},
  {h:"Internal structure and challenges",b:[
   "Models of North American cities: **concentric zone** (rings outward from the CBD), **sector** (wedges along transport routes), **multiple nuclei** (several specialized centers), and **galactic/peripheral** (edge cities around a beltway).",
   "Elsewhere: Latin American cities have a spine of elite development from the center outward with peripheral informal settlements; Sub-Saharan African cities often show multiple CBDs from colonial history; Southeast Asian cities center on a port zone.",
   "**Bid-rent theory** explains why land is most expensive near the center and why use intensity falls with distance.",
   "Urban processes: **suburbanization**, sprawl, **urban sprawl** and **smart growth** responses, **gentrification** and displacement, **filtering**, **redlining** and **blockbusting** as historical discrimination, and **squatter settlements** in rapidly urbanizing regions.",
   "Urban sustainability: mixed-use zoning, transit-oriented development, greenbelts, New Urbanism, brownfield redevelopment, and the **urban heat island** effect.",
   "Quantitative data on cities come from the census: density, income, and housing measures by tract."]}],
 tip:"When a question asks about a city model, say what it explains and name one limitation. The critique is usually worth a point.",
 terms:["megacity","world city","primate city","rank-size rule","central place theory","range","threshold","gravity model","concentric zone model","sector model","multiple nuclei model","galactic city","bid-rent","suburbanization","sprawl","gentrification","redlining","blockbusting","squatter settlement","smart growth","New Urbanism","urban heat island"],
 cards:[
 ["What is a primate city?","A city more than twice the size of the next largest, dominating a country's economy and culture."],
 ["State the rank-size rule","The nth largest city has about 1/n the population of the largest city."],
 ["Define range and threshold in central place theory","Range is the maximum distance people will travel for a good; threshold is the minimum market size needed to support its sale."],
 ["What does the gravity model predict?","Interaction between two places is proportional to the product of their populations and inversely proportional to the square of the distance between them."],
 ["Contrast the concentric zone and sector models","Concentric zone has uniform rings around the CBD; the sector model has wedges extending outward along transportation corridors."],
 ["What is a galactic or peripheral city model?","A metropolitan area organized around edge cities along a ring road rather than a single dominant CBD."],
 ["Explain bid-rent theory","Competition for accessible land makes prices highest near the center, so land use becomes less intensive with distance."],
 ["What is gentrification and its main social cost?","Reinvestment that raises property values in a low-income neighborhood, often displacing existing residents."],
 ["What were redlining and blockbusting?","Redlining denied loans in neighborhoods marked risky; blockbusting pressured white owners to sell cheaply by predicting racial change."],
 ["Name three smart-growth strategies","Mixed-use zoning, transit-oriented development, and greenbelts or urban growth boundaries."]]},
{title:"Industrial and Economic Development",weight:[12,17],
 desc:"Industrialization, development measures, theories, and globalization.",
 notes:[
  {h:"Industry and location",b:[
   "The Industrial Revolution's diffusion from Britain reorganized where people lived and worked; **Fordist** mass production gave way to **post-Fordist** flexible, just-in-time production.",
   "**Weber's least cost theory**: firms locate to minimize transport, labor, and **agglomeration** costs. **Bulk-reducing** industries locate near inputs; **bulk-gaining** industries locate near markets.",
   "**Agglomeration** concentrates related firms for shared labor and suppliers; **deglomeration** follows when congestion costs outweigh benefits.",
   "**Break-of-bulk points** (ports, rail terminals) attract processing; **footloose** industries can locate anywhere.",
   "Economic sectors: primary (extraction), secondary (manufacturing), tertiary (services), quaternary (information), quinary (high-level decision making). Development shifts employment up this ladder."]},
  {h:"Measuring and explaining development",b:[
   "Measures: GDP and **GNI per capita** (often at purchasing power parity), sectoral employment, literacy, life expectancy, and the composite **Human Development Index**. Gender measures include the **Gender Inequality Index**.",
   "GDP alone hides distribution, informal work, unpaid labor, and environmental cost — a standard critique question.",
   "**Rostow's stages of growth** model a linear path from traditional society to mass consumption; criticized for assuming one path and ignoring external constraints.",
   "**Wallerstein's world-systems theory** divides the world into **core**, **semi-periphery**, and **periphery** linked by unequal exchange — a structural rather than linear explanation.",
   "**Dependency theory** argues colonial relationships left peripheral economies structurally disadvantaged."]},
  {h:"Globalization and development strategies",b:[
   "Trade strategies: **import substitution** versus **export-led** growth; **special economic zones**, **export processing zones**, and **maquiladoras** attract foreign investment with low wages and tax incentives.",
   "Institutions: WTO, IMF, World Bank, and trade blocs (EU, USMCA, ASEAN, Mercosur). **Microfinance** and **fair trade** target development at smaller scales.",
   "**Outsourcing** and offshoring shift production to low-cost regions, with deindustrialization in former industrial cores.",
   "Development and gender: women's education, employment, and property rights correlate strongly with measured development gains.",
   "**Sustainable development** seeks growth that does not foreclose future needs — ecotourism, renewable energy, and resource management are the usual examples."]}],
 tip:"Development FRQs usually ask for a measure, a limitation of that measure, and a strategy. Prepare one crisp answer for each.",
 terms:["Fordism","post-Fordism","Weber's least cost theory","bulk-reducing","bulk-gaining","agglomeration","break-of-bulk point","footloose industry","economic sectors","GNI per capita","Human Development Index","Gender Inequality Index","Rostow","world-systems theory","core and periphery","dependency theory","import substitution","export processing zone","maquiladora","microfinance","outsourcing","sustainable development"],
 cards:[
 ["What three costs does Weber's least cost theory balance?","Transportation, labor, and agglomeration."],
 ["Bulk-reducing vs bulk-gaining industry","Bulk-reducing industries locate near raw materials; bulk-gaining industries locate near markets."],
 ["What is agglomeration?","Clustering of related firms to share labor pools, suppliers, and infrastructure."],
 ["Name the five economic sectors","Primary extraction, secondary manufacturing, tertiary services, quaternary information, quinary high-level decision making."],
 ["What does the Human Development Index combine?","Income per capita, education measures, and life expectancy."],
 ["Give two limitations of GDP per capita as a development measure","It ignores income distribution and excludes informal and unpaid work (also environmental costs)."],
 ["Summarize Wallerstein's world-systems theory","The global economy consists of core, semi-periphery, and periphery regions tied together by unequal exchange that sustains the hierarchy."],
 ["Main criticism of Rostow's stages of growth","It assumes a single universal path and ignores colonial legacies and global constraints."],
 ["Import substitution vs export-led development","Import substitution builds domestic industry behind tariffs; export-led growth targets foreign markets to earn revenue."],
 ["What is a maquiladora?","A factory in a Mexican border zone assembling imported components for export, taking advantage of low labor costs and trade rules."],
 ["How does improving women's status affect development measures?","Education, employment, and property rights for women correlate with lower fertility, better child health, and higher measured development."]]}
],
qbank:[
{u:1,q:"A map shading counties by median income is a",c:["cartogram","choropleth map","isoline map","dot density map"],a:1,e:"Choropleth maps shade predefined areas by data value."},
{u:1,q:"'The South' in the United States is best described as a",c:["formal region","functional region","perceptual region","political region"],a:2,e:"Its boundaries depend on perception rather than a uniform measurable trait or a node."},
{u:2,q:"A country in Stage 4 of the demographic transition most likely faces",c:["rapid population growth","an aging population and labor shortages","famine","very high infant mortality"],a:1,e:"Low birth and death rates yield a stable but aging population."},
{u:2,q:"Physiological density differs from arithmetic density by dividing population by",c:["total land area","arable land","number of farmers","urban area"],a:1,e:"Physiological density measures pressure on farmable land."},
{u:3,q:"A fashion trend appearing first in New York and Paris before smaller cities illustrates",c:["contagious diffusion","hierarchical diffusion","relocation diffusion","stimulus diffusion"],a:1,e:"It spreads through influential nodes rather than by simple proximity."},
{u:3,q:"Christianity, Islam, and Buddhism are classified as",c:["ethnic religions","universalizing religions","syncretic religions","folk religions"],a:1,e:"They seek converts globally rather than being tied to one people and place."},
{u:4,q:"A boundary drawn by colonial powers without regard to existing ethnic groups is",c:["antecedent","subsequent","superimposed","relict"],a:2,e:"Superimposed boundaries are forced onto an existing cultural landscape."},
{u:4,q:"Scotland gaining its own parliament within the United Kingdom is an example of",c:["balkanization","devolution","supranationalism","irredentism"],a:1,e:"Power was transferred from the central government to a sub-national unit."},
{u:5,q:"In Von Thünen's model, dairy farming locates near the market because",c:["dairy requires poor soil","milk is perishable and costly to transport","land is cheap there","labor is scarce"],a:1,e:"Perishability and transport cost dominate the location decision."},
{u:5,q:"Long lot survey systems are most associated with",c:["the American Midwest grid","French settlement along rivers","colonial New England","Australian stations"],a:1,e:"Narrow strips perpendicular to a river gave each holding water access."},
{u:6,q:"A city more than twice as large as the next largest in its country is a",c:["megacity","world city","primate city","edge city"],a:2,e:"That size dominance defines a primate city."},
{u:6,q:"In central place theory, a good with a large range and high threshold will be sold in",c:["many small towns","few large cities","rural areas only","every settlement"],a:1,e:"High-order goods need big markets and draw customers from far away, so they cluster in few large places."},
{u:7,q:"A bulk-gaining industry such as beverage bottling locates near",c:["raw materials","the market","ports only","cheap land"],a:1,e:"The product becomes heavier or bulkier, so transport to consumers is the dominant cost."},
{u:7,q:"Wallerstein's theory explains global inequality primarily through",c:["a linear sequence of growth stages","structural unequal exchange between core and periphery","climate differences","population growth"],a:1,e:"World-systems theory is structural rather than stage-based."}
]

units:[
{title:"Biological Bases of Behavior",weight:[15,25],
 desc:"Research methods, genetics, the nervous system, the brain, sleep, and sensation.",
 notes:[
  {h:"Research methods and ethics",b:[
   "Only an **experiment** with a manipulated independent variable and **random assignment** can establish causation. Correlational studies show association only.",
   "**Operational definitions** state exactly how a variable was measured — the AAQ asks for these directly.",
   "Threats to validity: **confounding variables**, experimenter bias, demand characteristics, the placebo effect, and unrepresentative samples (WEIRD samples limit generalizability).",
   "Ethics: **informed consent**, protection from harm, **confidentiality**, **debriefing**, and institutional review board approval.",
   "Descriptive statistics summarize; inferential statistics generalize. A significant result (p < .05) means the finding is unlikely by chance, not that it is large or important."]},
  {h:"Neurons and neurotransmitters",b:[
   "A neuron fires when depolarization reaches **threshold**, producing an **all-or-none action potential** down the axon; the **myelin sheath** speeds conduction.",
   "Signals cross the **synapse** chemically; leftover neurotransmitter is broken down or **reuptaken**. **Agonists** mimic or enhance a transmitter; **antagonists** block it.",
   "Functions to know: acetylcholine (movement, memory), dopamine (reward and movement), serotonin (mood and sleep), GABA (inhibition), glutamate (excitation), endorphins (pain relief).",
   "The **nervous system** divides into central (brain, spinal cord) and peripheral; the peripheral into somatic (voluntary) and **autonomic**, which splits into **sympathetic** (arousal, fight-or-flight) and **parasympathetic** (calming).",
   "The **endocrine system** works more slowly through hormones — cortisol in stress, adrenaline in arousal, hormones in the hypothalamic-pituitary axis."]},
  {h:"Brain structures and plasticity",b:[
   "Brainstem and **medulla** (heartbeat, breathing), **cerebellum** (balance, coordination, procedural memory), **thalamus** (sensory relay), **reticular formation** (arousal).",
   "Limbic system: **amygdala** (fear and aggression), **hippocampus** (forming new memories), **hypothalamus** (hunger, thirst, temperature, reward).",
   "Cortex lobes: **frontal** (planning, judgment, personality, motor cortex, Broca's area for speech production), **parietal** (somatosensory), **occipital** (vision), **temporal** (hearing, Wernicke's area for comprehension).",
   "**Neuroplasticity** lets the brain reorganize after injury or practice; hemispheric specialization appears in split-brain research.",
   "Research tools: EEG (electrical timing), fMRI and PET (activity and blood flow), lesion and case studies (Phineas Gage, patient H.M.)."]},
  {h:"Consciousness and sensation",b:[
   "Sleep cycles through NREM stages and **REM**, where vivid dreaming and paradoxical sleep occur; circadian rhythms govern timing and are disrupted by light and shift work.",
   "Sleep disorders: insomnia, narcolepsy, sleep apnea, night terrors. Sleep consolidates memory and supports immune and cognitive function.",
   "Psychoactive drugs: depressants (alcohol, barbiturates), stimulants (caffeine, nicotine, cocaine), opioids, and hallucinogens; **tolerance**, withdrawal, and addiction follow from neuroadaptation.",
   "**Sensation** is detection, **perception** is interpretation. **Absolute threshold** is the minimum detectable stimulus; **difference threshold** (just noticeable difference) follows **Weber's law**; **sensory adaptation** reduces response to constant stimuli.",
   "Vision: transduction in rods and cones, **trichromatic** theory at the receptor level and **opponent-process** theory after; feature detectors and parallel processing. Hearing: **place** and **frequency** theories, conduction versus sensorineural deafness."]}],
 tip:"The AAQ asks the same three things nearly every time: name the research method, give an operational definition, and identify an ethical guideline that was followed.",
 terms:["experiment","random assignment","operational definition","confounding variable","informed consent","debriefing","action potential","all-or-none","reuptake","agonist","sympathetic nervous system","amygdala","hippocampus","frontal lobe","neuroplasticity","fMRI","REM sleep","circadian rhythm","tolerance","absolute threshold","Weber's law","sensory adaptation","opponent-process theory"],
 cards:[
 ["Which research design can establish causation, and why?","An experiment, because the researcher manipulates the independent variable and randomly assigns participants, ruling out alternative explanations."],
 ["What is an operational definition?","A precise statement of how a variable is measured or manipulated in a study."],
 ["What does random sampling accomplish that random assignment does not?","Random sampling supports generalizing to a population; random assignment supports causal claims."],
 ["Name four ethical requirements for human research","Informed consent, protection from harm, confidentiality, and debriefing."],
 ["What does 'all-or-none' mean for an action potential?","Once threshold is reached the neuron fires at full strength; stimulus intensity changes frequency, not size."],
 ["Agonist vs antagonist","An agonist mimics or enhances a neurotransmitter's effect; an antagonist blocks it."],
 ["Which neurotransmitter is most associated with reward and movement?","Dopamine."],
 ["Sympathetic vs parasympathetic nervous system","Sympathetic arouses the body for action; parasympathetic calms it and conserves energy."],
 ["What does the hippocampus do?","Forms new explicit memories; damage prevents new long-term memory formation."],
 ["What does the amygdala do?","Processes fear, threat detection, and aggression."],
 ["Which lobe contains Broca's area, and what does damage cause?","The frontal lobe; damage impairs speech production while comprehension remains."],
 ["What is neuroplasticity?","The brain's ability to reorganize its structure and function in response to experience or injury."],
 ["Sensation vs perception","Sensation is detecting physical stimuli; perception is organizing and interpreting them."],
 ["State Weber's law","The just noticeable difference is a constant proportion of the original stimulus intensity."],
 ["How do trichromatic and opponent-process theories fit together?","Trichromatic theory describes three cone types at the retina; opponent-process describes paired antagonistic channels after the retina, explaining afterimages."]]},
{title:"Cognition",weight:[15,25],
 desc:"Perception, memory, thinking, problem solving, intelligence, and language.",
 notes:[
  {h:"Perceptual organization",b:[
   "**Top-down processing** uses expectation and **schemas**; **bottom-up processing** builds from sensory features. **Perceptual set** biases interpretation.",
   "Gestalt principles: figure-ground, proximity, similarity, closure, continuity.",
   "Depth cues: **binocular** (retinal disparity, convergence) and **monocular** (relative size, interposition, linear perspective, texture gradient, motion parallax).",
   "Perceptual constancies keep size, shape, and color stable despite changing input; illusions reveal the underlying rules.",
   "**Selective attention** limits what reaches awareness — **inattentional blindness** and the cocktail party effect."]},
  {h:"Memory",b:[
   "Three-stage model: **encoding**, **storage**, **retrieval**. **Sensory memory** is brief, **short-term/working memory** holds about seven items for seconds, **long-term memory** is effectively unlimited.",
   "**Working memory** (Baddeley) includes a phonological loop, visuospatial sketchpad, and central executive.",
   "Encoding strategies: **chunking**, **mnemonics**, **hierarchies**, **elaborative rehearsal**, the **spacing effect** (distributed practice beats cramming), and **testing effect**.",
   "Long-term memory types: **explicit/declarative** (semantic and episodic, requiring the hippocampus) and **implicit/procedural** (skills and conditioning, involving the cerebellum and basal ganglia).",
   "Retrieval: **recall** versus **recognition**, **retrieval cues**, **priming**, **context-dependent** and **state-dependent** memory, and the **serial position effect** (primacy and recency).",
   "Forgetting: encoding failure, **storage decay**, retrieval failure, **proactive** and **retroactive interference**, and motivated forgetting. Memory is **reconstructive**, so **misinformation** can create false memories (Loftus)."]},
  {h:"Thinking and problem solving",b:[
   "**Concepts** and **prototypes** organize knowledge. **Algorithms** guarantee a solution; **heuristics** are fast but error-prone.",
   "Biases: **confirmation bias**, **availability** and **representativeness heuristics**, **anchoring**, **overconfidence**, **belief perseverance**, **framing**, **hindsight bias**, **mental set**, and **functional fixedness**.",
   "**Creativity** involves **divergent thinking**; expertise supports **convergent thinking** and insight.",
   "**Executive functions** — planning, inhibition, flexibility — develop through adolescence with the prefrontal cortex."]},
  {h:"Intelligence and language",b:[
   "Theories: Spearman's **g**, Thurstone's primary abilities, Gardner's multiple intelligences, Sternberg's triarchic theory (analytical, creative, practical), and emotional intelligence.",
   "Tests must be **standardized**, **reliable** (consistent), and **valid** (measuring what they claim). IQ scores form a normal curve with mean 100 and SD 15; the **Flynn effect** describes rising scores over generations.",
   "Group differences in test scores reflect environment, opportunity, **stereotype threat**, and test bias rather than innate capacity; heritability applies to variation within groups, not differences between them.",
   "Language has phonemes, morphemes, semantics, and syntax. Development runs from babbling to one-word to telegraphic speech, with **overgeneralization** of grammar rules. Chomsky argued for an innate capacity; **critical periods** shape acquisition.",
   "Language influences thought (linguistic relativity) without fully determining it."]}],
 tip:"Memory questions usually hinge on naming the right process. Practice distinguishing encoding failure from retrieval failure and proactive from retroactive interference.",
 terms:["top-down processing","schema","perceptual set","Gestalt principles","binocular cues","inattentional blindness","working memory","chunking","spacing effect","explicit memory","implicit memory","serial position effect","proactive interference","retroactive interference","misinformation effect","algorithm","heuristic","availability heuristic","representativeness heuristic","confirmation bias","functional fixedness","divergent thinking","general intelligence","reliability","validity","Flynn effect","stereotype threat","morpheme","overgeneralization","critical period"],
 cards:[
 ["Top-down vs bottom-up processing","Top-down interprets using prior knowledge and expectations; bottom-up builds perception from raw sensory data."],
 ["Name four Gestalt grouping principles","Figure-ground, proximity, similarity, and closure (also continuity)."],
 ["What are the two binocular depth cues?","Retinal disparity and convergence."],
 ["What is inattentional blindness?","Failing to notice a visible object because attention is directed elsewhere."],
 ["Three components of Baddeley's working memory","Phonological loop, visuospatial sketchpad, and central executive."],
 ["What is the spacing effect?","Distributed practice over time produces better long-term retention than massed cramming."],
 ["Explicit vs implicit memory","Explicit memory is consciously recalled facts and events; implicit memory includes skills and conditioned responses recalled without awareness."],
 ["Which brain structure is essential for forming new explicit memories?","The hippocampus."],
 ["What is the serial position effect?","Better recall of items at the beginning (primacy) and end (recency) of a list than in the middle."],
 ["Proactive vs retroactive interference","Proactive: old learning disrupts new. Retroactive: new learning disrupts recall of old."],
 ["What is the misinformation effect?","Exposure to misleading information after an event alters the memory of that event."],
 ["Algorithm vs heuristic","An algorithm is a step-by-step procedure guaranteed to work; a heuristic is a mental shortcut that is faster but can err."],
 ["Availability vs representativeness heuristic","Availability judges likelihood by how easily examples come to mind; representativeness judges by resemblance to a prototype."],
 ["What is functional fixedness?","Inability to see an object as useful for anything other than its customary function."],
 ["Reliability vs validity","Reliability is consistency of measurement; validity is whether it measures what it claims to."],
 ["What is stereotype threat?","Anxiety about confirming a negative stereotype about one's group, which can depress test performance."],
 ["What is overgeneralization in language development?","Applying a grammatical rule too broadly, as in saying 'goed' instead of 'went'."]]},
{title:"Development and Learning",weight:[15,25],
 desc:"Lifespan development plus classical, operant, and observational learning.",
 notes:[
  {h:"Developmental foundations",b:[
   "Themes: **nature and nurture**, continuity versus stages, and stability versus change. **Twin and adoption studies** separate genetic and environmental contributions.",
   "Prenatal development and **teratogens**; newborn reflexes and preferences; **maturation** as a genetically timed sequence.",
   "**Piaget's stages**: sensorimotor (object permanence), preoperational (egocentrism, lack of conservation), concrete operational (conservation, logical thought about concrete things), formal operational (abstract and hypothetical reasoning). Key processes are **assimilation** and **accommodation**.",
   "**Vygotsky** emphasized social learning, the **zone of proximal development**, and **scaffolding**.",
   "**Attachment**: Harlow's monkeys showed contact comfort matters; Ainsworth's Strange Situation identified secure, anxious, and avoidant patterns. Parenting styles (authoritative, authoritarian, permissive, neglectful) correlate with outcomes.",
   "**Erikson's psychosocial stages** run from trust versus mistrust to integrity versus despair, with **identity versus role confusion** central in adolescence. Adolescence brings puberty, abstract thought, and peer influence; adulthood brings changing social roles and, later, selective cognitive decline.",
   "Moral development: Kohlberg's preconventional, conventional, and postconventional reasoning, critiqued for cultural and gender bias."]},
  {h:"Classical conditioning",b:[
   "Pavlov: a **neutral stimulus** paired with an **unconditioned stimulus** becomes a **conditioned stimulus** producing a **conditioned response**.",
   "Processes: **acquisition**, **extinction**, **spontaneous recovery**, **generalization**, and **discrimination**.",
   "Classical conditioning explains learned fears (Watson's Little Albert), **taste aversion** (with biological predispositions), and some drug tolerance.",
   "The learning is about **association between stimuli**, and the response is involuntary."]},
  {h:"Operant and observational learning",b:[
   "**Thorndike's law of effect** and **Skinner's** operant conditioning: behavior is shaped by consequences.",
   "**Positive reinforcement** adds something desirable; **negative reinforcement** removes something aversive — both increase behavior. **Punishment** decreases behavior; positive punishment adds an aversive, negative punishment (omission) removes something desirable.",
   "**Shaping** reinforces successive approximations. **Primary** reinforcers satisfy biological needs; **secondary** reinforcers are learned.",
   "**Schedules of reinforcement**: continuous; then partial — **fixed-ratio**, **variable-ratio** (most resistant to extinction, like gambling), **fixed-interval**, **variable-interval**.",
   "Cognitive limits on conditioning: **latent learning**, cognitive maps, **insight learning**, **intrinsic** versus **extrinsic** motivation, and the **overjustification effect**.",
   "**Observational learning** (Bandura's Bobo doll) works through modeling, vicarious reinforcement, and mirror-neuron-related processes."]}],
 tip:"For conditioning questions, first decide whether the behavior is involuntary (classical) or voluntary and consequence-driven (operant). Then label the terms.",
 terms:["teratogen","maturation","Piaget","object permanence","conservation","assimilation","accommodation","zone of proximal development","scaffolding","attachment","Strange Situation","authoritative parenting","Erikson","identity versus role confusion","Kohlberg","unconditioned stimulus","conditioned response","extinction","spontaneous recovery","generalization","taste aversion","law of effect","negative reinforcement","punishment","shaping","variable-ratio schedule","latent learning","overjustification effect","observational learning","modeling"],
 cards:[
 ["What is object permanence and when does it develop?","Understanding that objects exist when out of sight; it develops during Piaget's sensorimotor stage."],
 ["What does a child in the preoperational stage lack?","Conservation and the ability to take another's perspective (egocentrism)."],
 ["Assimilation vs accommodation","Assimilation fits new information into an existing schema; accommodation changes the schema to fit new information."],
 ["What is the zone of proximal development?","The range of tasks a learner can accomplish with guidance but not yet alone."],
 ["What did Harlow's monkey studies demonstrate?","That attachment depends on contact comfort, not just feeding."],
 ["Which parenting style is associated with the best outcomes?","Authoritative — high warmth combined with firm, explained expectations."],
 ["What is Erikson's central adolescent conflict?","Identity versus role confusion."],
 ["In classical conditioning, what is the conditioned stimulus?","A previously neutral stimulus that, after pairing with the unconditioned stimulus, triggers the conditioned response."],
 ["What is spontaneous recovery?","Reappearance of an extinguished conditioned response after a rest period."],
 ["Negative reinforcement vs punishment","Negative reinforcement removes an aversive stimulus and increases behavior; punishment decreases behavior."],
 ["Which reinforcement schedule produces the most persistent behavior?","Variable-ratio, because reward timing is unpredictable."],
 ["What is shaping?","Reinforcing successively closer approximations of a target behavior."],
 ["What is latent learning?","Learning that occurs without reinforcement and is not demonstrated until there is reason to do so."],
 ["What is the overjustification effect?","Rewarding an already intrinsically motivated behavior can reduce the intrinsic motivation for it."],
 ["What did Bandura's Bobo doll study show?","Children imitate aggressive behavior they observe, demonstrating observational learning."]]},
{title:"Social Psychology and Personality",weight:[15,25],
 desc:"Attribution, conformity, group processes, attitudes, and theories of personality.",
 notes:[
  {h:"Social thinking and influence",b:[
   "**Fundamental attribution error**: we overweight disposition and underweight situation when explaining others' behavior (and do the reverse for ourselves — the **actor-observer bias**).",
   "**Cognitive dissonance**: conflicting attitudes and behavior create discomfort, usually resolved by changing the attitude. Related persuasion effects include **foot-in-the-door** and **central versus peripheral route** persuasion.",
   "**Conformity** (Asch's line study) increases with group size, unanimity, and ambiguity. **Obedience** (Milgram) rises with perceived authority, proximity of the authority, and distance from the victim.",
   "Group processes: **social facilitation** (better on easy tasks when observed), **social loafing**, **deindividuation**, **group polarization**, and **groupthink**.",
   "Prejudice involves stereotypes (cognitive), prejudice (affective), and discrimination (behavioral); **in-group bias**, **out-group homogeneity**, **scapegoating**, and the **just-world hypothesis** sustain it. Contact under cooperative, equal-status conditions reduces it.",
   "Prosocial behavior: **bystander effect** and **diffusion of responsibility**, altruism, reciprocity, and social norms. **Social traps** and the prisoner's dilemma frame conflict."]},
  {h:"Personality",b:[
   "**Psychodynamic**: Freud's unconscious, id-ego-superego, defense mechanisms (repression, projection, displacement, rationalization, reaction formation), and psychosexual stages. Neo-Freudians (Adler, Horney, Jung) emphasized social and cultural factors.",
   "**Humanistic**: Maslow's hierarchy of needs and self-actualization; **Rogers'** unconditional positive regard, genuineness, and empathy; self-concept and the ideal self.",
   "**Trait**: the **Big Five** — openness, conscientiousness, extraversion, agreeableness, neuroticism — with good predictive validity across cultures.",
   "**Social-cognitive**: Bandura's **reciprocal determinism**, **self-efficacy**, and **locus of control**; Seligman's **learned helplessness**.",
   "Assessment: self-report inventories (MMPI) are standardized and objective; **projective tests** (Rorschach, TAT) have weak reliability and validity.",
   "Motivation and emotion: drive reduction, arousal theory and the **Yerkes-Dodson** optimum, **self-determination theory**; theories of emotion (James-Lange, Cannon-Bard, Schachter-Singer two-factor), facial feedback, and cultural variation in display rules."]}],
 tip:"Social psychology questions are scenario-based. Read for the situational pressure being described, then name the matching phenomenon.",
 terms:["fundamental attribution error","cognitive dissonance","foot-in-the-door","conformity","Asch","Milgram","social facilitation","social loafing","deindividuation","group polarization","groupthink","in-group bias","just-world hypothesis","bystander effect","diffusion of responsibility","defense mechanism","self-actualization","unconditional positive regard","Big Five","reciprocal determinism","self-efficacy","locus of control","learned helplessness","projective test","Yerkes-Dodson law","two-factor theory of emotion"],
 cards:[
 ["What is the fundamental attribution error?","Overestimating personality and underestimating situational causes when explaining other people's behavior."],
 ["What is cognitive dissonance and how is it resolved?","Discomfort from inconsistency between attitudes and behavior, usually resolved by changing the attitude to match the behavior."],
 ["What did Asch's experiments demonstrate?","People often conform to an obviously wrong group judgment, especially when the group is unanimous."],
 ["What conditions increased obedience in Milgram's studies?","A legitimate-seeming authority nearby, physical distance from the victim, and gradual escalation."],
 ["Social facilitation vs social loafing","Being observed improves performance on easy, well-learned tasks; working in a group where individual effort is hidden reduces effort."],
 ["What is groupthink?","Suppression of dissent in a cohesive group seeking harmony, leading to poor decisions."],
 ["What is the bystander effect and its mechanism?","People are less likely to help when others are present, because responsibility diffuses among the group."],
 ["Name four Freudian defense mechanisms","Repression, projection, displacement, and rationalization (also reaction formation and regression)."],
 ["What did Rogers say people need to grow?","Unconditional positive regard, genuineness, and empathy."],
 ["Name the Big Five personality traits","Openness, conscientiousness, extraversion, agreeableness, and neuroticism."],
 ["What is self-efficacy?","A person's belief in their own capability to accomplish a specific task."],
 ["Internal vs external locus of control","Internal: outcomes result from one's own actions. External: outcomes result from luck or outside forces."],
 ["Why are projective tests criticized?","They have low reliability and validity and depend heavily on the examiner's interpretation."],
 ["State the Yerkes-Dodson law","Performance is best at a moderate level of arousal, lower when arousal is too low or too high."],
 ["Summarize the two-factor theory of emotion","Emotion requires physiological arousal plus a cognitive label for that arousal."]]},
{title:"Mental and Physical Health",weight:[15,25],
 desc:"Stress and health, psychological disorders, and treatment.",
 notes:[
  {h:"Stress and health",b:[
   "Stressors can be catastrophic, significant life changes, or daily hassles. Appraisal determines the response (Lazarus).",
   "**General adaptation syndrome**: alarm, resistance, exhaustion. Chronic stress raises cortisol and is linked to immune suppression, cardiovascular disease, and poor sleep.",
   "Coping: **problem-focused** coping addresses the stressor; **emotion-focused** coping manages the reaction. Social support, exercise, mindfulness, and adequate sleep buffer stress.",
   "Positive psychology studies well-being, gratitude, flow, resilience, and post-traumatic growth."]},
  {h:"Psychological disorders",b:[
   "Defining disorder: distress, dysfunction, and deviation from norms, diagnosed using the DSM. A diagnosis describes behavior, not a person; **labeling** has real social consequences (Rosenhan).",
   "The **biopsychosocial model** integrates biological vulnerability, psychological processes, and social context; the **diathesis-stress model** pairs predisposition with triggering stress.",
   "**Anxiety disorders**: generalized anxiety, panic disorder, specific phobias, agoraphobia. Related: **obsessive-compulsive disorder** and **PTSD**.",
   "**Depressive and bipolar disorders**: major depressive disorder, persistent depressive disorder, bipolar I and II with manic or hypomanic episodes.",
   "**Schizophrenia spectrum**: positive symptoms (hallucinations, delusions, disorganized speech) and negative symptoms (flat affect, avolition); dopamine involvement and structural brain differences.",
   "Also assessed: dissociative disorders, feeding and eating disorders, neurodevelopmental disorders such as ADHD and autism spectrum disorder, and personality disorders."]},
  {h:"Treatment",b:[
   "**Psychodynamic** therapy explores unconscious conflict; **humanistic** (client-centered) therapy provides unconditional positive regard and active listening.",
   "**Behavioral** therapies apply conditioning: **systematic desensitization**, exposure, aversion therapy, token economies.",
   "**Cognitive** therapy targets maladaptive thought patterns; **cognitive-behavioral therapy** combines both and has the broadest empirical support across disorders.",
   "**Biomedical** treatments: antidepressants (often SSRIs), antianxiety drugs, mood stabilizers such as lithium, antipsychotics, plus ECT and newer brain stimulation methods for treatment-resistant cases.",
   "Evidence matters: the **therapeutic alliance** predicts outcome, and evaluating therapy requires controlled research because spontaneous improvement and regression to the mean mimic effectiveness.",
   "Context and access: cultural competence, stigma, deinstitutionalization, and the community mental health model shape who actually receives care."]}],
 tip:"If a question names a treatment, be ready to name its theoretical tradition. Matching therapy to perspective is the most commonly tested link in this unit.",
 terms:["stressor","general adaptation syndrome","problem-focused coping","biopsychosocial model","diathesis-stress model","DSM","generalized anxiety disorder","obsessive-compulsive disorder","PTSD","major depressive disorder","bipolar disorder","positive symptoms","negative symptoms","systematic desensitization","cognitive-behavioral therapy","SSRI","lithium","therapeutic alliance","deinstitutionalization"],
 cards:[
 ["Name the three stages of the general adaptation syndrome","Alarm, resistance, and exhaustion."],
 ["Problem-focused vs emotion-focused coping","Problem-focused changes the stressor itself; emotion-focused manages one's emotional reaction to it."],
 ["What is the biopsychosocial model?","An approach explaining disorder through interacting biological, psychological, and sociocultural factors."],
 ["What is the diathesis-stress model?","Disorders emerge when a predisposition (diathesis) is combined with environmental stress."],
 ["Positive vs negative symptoms of schizophrenia","Positive symptoms add experiences such as hallucinations and delusions; negative symptoms subtract normal function, such as flat affect and avolition."],
 ["What distinguishes bipolar I from bipolar II?","Bipolar I includes full manic episodes; bipolar II includes hypomania with depressive episodes."],
 ["What is systematic desensitization and which tradition does it come from?","Gradual exposure to a feared stimulus paired with relaxation, from behavioral therapy."],
 ["Which therapy has the broadest empirical support across disorders?","Cognitive-behavioral therapy."],
 ["What do SSRIs do?","Block reuptake of serotonin, increasing its availability in the synapse."],
 ["Which drug is a standard mood stabilizer for bipolar disorder?","Lithium."],
 ["What is the therapeutic alliance and why does it matter?","The trusting collaborative relationship between therapist and client; it is one of the strongest predictors of therapy outcome."],
 ["Why do controlled studies matter for evaluating therapy?","Spontaneous remission, placebo effects, and regression to the mean can make any treatment look effective."]]}
],

{u:1,q:"Damage to the hippocampus would most likely impair",c:["balance","forming new long-term memories","speech production","vision"],a:1,e:"The hippocampus is essential to encoding new explicit memories."},

{u:2,q:"Judging an event as likely because vivid examples come easily to mind is the",c:["representativeness heuristic","availability heuristic","anchoring bias","framing effect"],a:1,e:"Ease of recall substitutes for actual frequency."},
{u:2,q:"A test that yields consistent scores across administrations is",c:["valid","reliable","standardized","normed"],a:1,e:"Consistency is reliability; measuring the right construct is validity."},
{u:3,q:"A child says 'I goed to the store.' This illustrates",c:["telegraphic speech","overgeneralization","babbling","a critical period"],a:1,e:"The regular past-tense rule is applied too broadly."},
{u:3,q:"Removing a loud alarm when a driver buckles their seatbelt is",c:["positive reinforcement","negative reinforcement","positive punishment","negative punishment"],a:1,e:"An aversive stimulus is removed, increasing the behavior."},
{u:3,q:"Slot machines keep players engaged because they use a",c:["fixed-ratio schedule","variable-ratio schedule","fixed-interval schedule","continuous schedule"],a:1,e:"Unpredictable reward timing produces the most persistent responding."},
{u:4,q:"Assuming a driver who cut you off is rude rather than rushing to an emergency is",c:["the just-world hypothesis","the fundamental attribution error","deindividuation","social loafing"],a:1,e:"Disposition is overweighted relative to situation."},
{u:4,q:"Conscientiousness, agreeableness, and neuroticism belong to",c:["Freud's structure of personality","the Big Five trait model","Maslow's hierarchy","Sternberg's triarchic theory"],a:1,e:"They are three of the five broad dimensions in the five-factor model."},
{u:5,q:"Flat affect and reduced motivation in schizophrenia are",c:["positive symptoms","negative symptoms","manic symptoms","dissociative symptoms"],a:1,e:"Negative symptoms involve the absence of typical functioning."},
{u:5,q:"Gradual exposure to a feared object paired with relaxation is",c:["cognitive restructuring","systematic desensitization","free association","a token economy"],a:1,e:"It is a classic behavioral technique based on counterconditioning."}
]
