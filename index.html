units:[
{title:"Foundations of American Democracy",weight:[15,22],
 desc:"Democratic theory, the Constitution's design, and federalism.",
 notes:[
  {h:"Democratic ideals and theories",b:[
   "**Natural rights**, popular sovereignty, **social contract**, republicanism, and limited government are the foundational ideals, drawn from Locke and asserted in the **Declaration of Independence**.",
   "Models of democracy: **participatory** (broad direct involvement), **pluralist** (competing organized groups), and **elite** (a small influential group shapes outcomes). The Constitution contains elements supporting each.",
   "**Federalist No. 10** argues a large republic controls factions by multiplying interests. **Brutus No. 1** warns a republic that large cannot represent or remain free.",
   "The **Articles of Confederation** failed on taxation, commerce, and enforcement; **Shays' Rebellion** prompted the Constitutional Convention."]},
  {h:"Constitutional design",b:[
   "Compromises: the **Great Compromise**, **Three-Fifths Compromise**, the Electoral College, and the slave-trade clause.",
   "**Separation of powers** and **checks and balances** (Federalist No. 51) distribute and restrain authority so that 'ambition must be made to counteract ambition'.",
   "Amending the Constitution requires supermajorities at two levels — deliberately difficult, which preserves stability and frustrates change.",
   "Federalists wanted an energetic national government; Anti-Federalists demanded a bill of rights, which became the price of ratification."]},
  {h:"Federalism",b:[
   "**Enumerated powers** are listed (Article I, Section 8); **implied powers** come from the **necessary and proper clause**; **reserved powers** belong to states via the **Tenth Amendment**; **concurrent powers** are shared.",
   "The **commerce clause** and **supremacy clause** are the main tools of national expansion; *McCulloch* upheld implied powers and *Lopez* marked a limit.",
   "Evolution: **dual ('layer cake') federalism**, then **cooperative ('marble cake') federalism** with grants, then **devolution** through **block grants** compared with **categorical grants**.",
   "**Mandates**, especially unfunded ones, and conditions on federal funding (such as highway money tied to drinking age) let Congress influence state policy indirectly.",
   "Federalism produces policy variation among states — a standard quantitative-analysis and argument-essay topic."]}],
 tip:"The argument essay requires at least one required document. Memorize a one-line summary of Federalist 10, Brutus 1, Federalist 51, 70, and 78 — you can deploy any of them.",
 terms:["natural rights","social contract","participatory democracy","pluralist democracy","elite democracy","Federalist No. 10","Brutus No. 1","Articles of Confederation","Great Compromise","separation of powers","checks and balances","enumerated powers","necessary and proper clause","Tenth Amendment","commerce clause","supremacy clause","cooperative federalism","categorical grant","block grant","unfunded mandate"],
 cards:[
 ["What is Madison's argument in Federalist No. 10?","A large republic with many competing factions prevents any single faction from dominating."],
 ["What does Brutus No. 1 warn against?","A national government too large and powerful to represent its citizens or remain accountable."],
 ["What is the central argument of Federalist No. 51?","Separation of powers and checks and balances let ambition counteract ambition, preventing tyranny."],
 ["Compare participatory, pluralist, and elite democracy","Participatory emphasizes broad citizen involvement; pluralist emphasizes competition among organized groups; elite emphasizes influence by a small, well-positioned few."],
 ["What is the necessary and proper clause used for?","It grants Congress implied powers to carry out its enumerated powers."],
 ["What did McCulloch v. Maryland establish?","Implied powers under the necessary and proper clause and federal supremacy over conflicting state law."],
 ["What did U.S. v. Lopez establish?","A limit on the commerce clause — carrying a gun near a school was not interstate commerce."],
 ["Categorical vs block grants","Categorical grants come with specific requirements; block grants give states broad discretion."],
 ["What is an unfunded mandate?","A federal requirement imposed on states without providing the money to comply."],
 ["What does the Tenth Amendment do?","Reserves to the states and the people all powers not delegated to the federal government."]]},
{title:"Interactions Among Branches of Government",weight:[25,36],
 desc:"Congress, the presidency, the courts, and the bureaucracy. The largest unit by far.",
 notes:[
  {h:"Congress",b:[
   "Structure: the **House** (435 members, two-year terms, Rules Committee, Speaker, more centralized) and the **Senate** (100 members, six-year terms, **filibuster** and **cloture**, unanimous consent, confirmation and treaty powers).",
   "Powers: taxing and spending, declaring war, oversight, impeachment, and the **power of the purse** — the strongest practical check on the executive.",
   "Process: committees do the real work, conference committees reconcile versions, **discharge petitions** bypass committees, and most bills die.",
   "Budget politics: **mandatory spending** (entitlements, interest) crowds out **discretionary spending**; deficits and the debt shape every policy debate.",
   "Representation models: **trustee**, **delegate**, and **politico**. **Gerrymandering**, incumbency advantage, partisan polarization, and divided government explain **gridlock**.",
   "*Baker v. Carr* established one person, one vote; *Shaw v. Reno* limited race-based districting."]},
  {h:"The presidency",b:[
   "Formal powers: veto, **pocket veto**, commander in chief, appointments, treaty negotiation, pardons, and the State of the Union.",
   "Informal powers: **executive orders**, **executive agreements**, signing statements, **bully pulpit**, agenda setting, and party leadership.",
   "**Federalist No. 70** defends a single energetic executive; critics point to the growth of presidential power beyond what the framers envisioned.",
   "Checks on the president: Senate confirmation, veto override, appropriations, judicial review, impeachment, and the **War Powers Resolution**.",
   "Modern communication — from fireside chats to social media — has made direct appeals to the public a central tool, and has tied presidential influence to approval ratings."]},
  {h:"The judiciary",b:[
   "**Federalist No. 78** describes the judiciary as the least dangerous branch and defends **judicial review**, established in *Marbury v. Madison*.",
   "Structure: district courts, courts of appeals, and the Supreme Court, which controls its docket by granting **certiorari**; **stare decisis** and **precedent** guide decisions.",
   "**Judicial activism** versus **judicial restraint**; originalism versus living-constitution interpretation.",
   "Checks on courts: appointment and confirmation, constitutional amendment, legislation rewriting statutes, jurisdiction changes, and dependence on the executive for enforcement.",
   "Life tenure insulates judges from politics, which is both the design's strength and the basis of criticism about democratic accountability."]},
  {h:"The bureaucracy",b:[
   "Cabinet departments, independent regulatory agencies, government corporations, and independent executive agencies carry out policy.",
   "Bureaucratic power comes from **discretionary authority** and **rule making** — agencies fill in the details of vague statutes, effectively making policy.",
   "Accountability tools: congressional oversight hearings, appropriations, the appointment process, and judicial review. **Iron triangles** and **issue networks** describe alliances among agencies, committees, and interest groups.",
   "The **merit system** (civil service) replaced patronage, trading responsiveness for expertise and continuity."]}],
 tip:"Concept application questions almost always ask for an 'interaction' between institutions. Practice naming a specific power one branch uses against another.",
 terms:["filibuster","cloture","power of the purse","discharge petition","mandatory spending","trustee model","gerrymandering","gridlock","Baker v. Carr","Shaw v. Reno","pocket veto","executive order","executive agreement","bully pulpit","Federalist No. 70","War Powers Resolution","judicial review","Marbury v. Madison","certiorari","stare decisis","judicial activism","judicial restraint","discretionary authority","rule making","iron triangle","merit system"],
 cards:[
 ["Name three powers unique to the Senate","Confirming appointments, ratifying treaties, and trying impeachments."],
 ["What is a filibuster and how is it ended?","Extended Senate debate to block a vote; it is ended by cloture, which requires 60 votes."],
 ["What is the power of the purse and why does it matter?","Congress's exclusive control over appropriations — the most effective practical check on the executive branch."],
 ["Mandatory vs discretionary spending","Mandatory spending is required by existing law, such as Social Security and interest; discretionary spending is set annually through appropriations."],
 ["Trustee vs delegate model of representation","A trustee uses independent judgment; a delegate votes according to constituents' expressed preferences."],
 ["What did Baker v. Carr establish?","That redistricting is justiciable, leading to the one person, one vote standard."],
 ["What did Shaw v. Reno hold?","Districts drawn predominantly on racial lines are subject to strict scrutiny and may violate equal protection."],
 ["Executive order vs executive agreement","An executive order directs the federal bureaucracy; an executive agreement is an international deal that does not require Senate ratification."],
 ["What is the main argument of Federalist No. 70?","A single, energetic executive provides the decisiveness and accountability that a plural executive cannot."],
 ["What does the War Powers Resolution require?","The president must notify Congress within 48 hours of deploying forces and withdraw within 60 days absent authorization."],
 ["What did Marbury v. Madison establish?","Judicial review — the Court's authority to strike down unconstitutional acts."],
 ["What is stare decisis?","The principle that courts follow precedent in deciding similar cases."],
 ["Name three checks on the judiciary","Appointment and confirmation of judges, constitutional amendment, and legislation that rewrites a statute the Court interpreted."],
 ["What is bureaucratic rule making?","Agencies issuing detailed regulations that carry the force of law, filling in the specifics Congress left open."],
 ["What is an iron triangle?","A mutually supportive relationship among a congressional committee, a bureaucratic agency, and an interest group."]]},
{title:"Civil Liberties and Civil Rights",weight:[13,18],
 desc:"The Bill of Rights, incorporation, equal protection, and the rights movements.",
 notes:[
  {h:"Civil liberties",b:[
   "The **Bill of Rights** limits government; **selective incorporation** applies most protections to the states through the **Fourteenth Amendment's** due process clause (*Gideon*, *McDonald*).",
   "Religion: the **establishment clause** (*Engel v. Vitale* barred school-sponsored prayer) and the **free exercise clause** (*Wisconsin v. Yoder* protected Amish parents from compulsory schooling laws).",
   "Speech: generally protected, with limits for incitement (*Schenck*'s clear and present danger, later narrowed), true threats, and obscenity. **Symbolic speech** is protected (*Tinker*). **Prior restraint** faces a heavy presumption against it (*NY Times v. United States*).",
   "Second Amendment incorporated in *McDonald v. Chicago*. Criminal procedure: exclusionary rule, *Miranda* warnings, right to counsel, and the Eighth Amendment.",
   "Privacy is not named in the Constitution but was inferred in *Griswold* and *Roe*; *Roe* was overturned by *Dobbs* in 2022, returning abortion regulation to the states — a clear example of precedent changing."]},
  {h:"Civil rights",b:[
   "The **equal protection clause** grounds antidiscrimination law. *Brown v. Board* overturned *Plessy* in education; implementation required further litigation and federal enforcement.",
   "Legislation: the **Civil Rights Act of 1964**, **Voting Rights Act of 1965**, Title IX, and the Americans with Disabilities Act.",
   "**Letter from Birmingham Jail** defends civil disobedience against unjust laws and criticizes gradualism — the required document most often used in rights arguments.",
   "Movements for women's rights, disability rights, LGBTQ rights, and Latino and Native rights have each used a mix of litigation, legislation, and mass mobilization.",
   "Ongoing debates: **affirmative action**, voting access and identification requirements, and the balance between liberty and order or equality and individual freedom."]}],
 tip:"For SCOTUS comparison questions, always name the specific clause first. The clause is the link between the required case and the new one.",
 terms:["Bill of Rights","selective incorporation","Fourteenth Amendment","establishment clause","free exercise clause","Engel v. Vitale","Wisconsin v. Yoder","Schenck v. United States","Tinker v. Des Moines","prior restraint","NY Times v. United States","McDonald v. Chicago","Miranda rights","right to privacy","equal protection clause","Brown v. Board","Civil Rights Act of 1964","Voting Rights Act","Letter from Birmingham Jail","affirmative action"],
 cards:[
 ["What is selective incorporation?","Applying protections in the Bill of Rights to state governments case by case through the Fourteenth Amendment's due process clause."],
 ["What did Engel v. Vitale decide?","School-sponsored prayer in public schools violates the establishment clause."],
 ["What did Wisconsin v. Yoder decide?","Compelling Amish children to attend school past eighth grade violated the free exercise clause."],
 ["What standard came from Schenck v. United States?","Speech creating a clear and present danger may be restricted, especially in wartime."],
 ["What did Tinker v. Des Moines protect?","Students' symbolic speech at school, absent substantial disruption of the educational process."],
 ["What principle was at stake in NY Times v. United States?","Prior restraint — the government faces a heavy burden to block publication in advance."],
 ["What did Gideon v. Wainwright require?","States must provide an attorney to defendants who cannot afford one in felony cases."],
 ["What did McDonald v. Chicago do?","Incorporated the Second Amendment, applying the right to bear arms against state and local governments."],
 ["What did Brown v. Board of Education hold?","Segregated public schools are inherently unequal and violate the equal protection clause."],
 ["What is the central argument of Letter from Birmingham Jail?","Unjust laws create a moral obligation to resist nonviolently, and waiting for gradual change perpetuates injustice."],
 ["Which clause grounds most civil rights claims?","The equal protection clause of the Fourteenth Amendment."]]},
{title:"American Political Ideologies and Beliefs",weight:[10,15],
 desc:"Political socialization, public opinion measurement, and ideology in policy.",
 notes:[
  {h:"Socialization and public opinion",b:[
   "**Political socialization** agents: family, school, peers, media, religion, and major events. **Generational** and **life-cycle** effects shape cohorts differently.",
   "Polling requires a **representative sample** — random selection, adequate size, and neutral question wording. Report the **margin of error** and beware **sampling bias**, house effects, and social desirability.",
   "Types of polls: benchmark, tracking, entrance and **exit polls**. Exit polls predict but also shape narratives.",
   "Polls influence policy, campaigns, and perceptions of legitimacy, but low response rates and nonresponse bias have made accurate polling harder."]},
  {h:"Ideology and policy",b:[
   "**Liberal** positions generally favor an active government role in the economy and broad individual social freedoms; **conservative** positions generally favor limited economic regulation and traditional social arrangements. **Libertarians** want minimal government in both spheres.",
   "Parties do not map perfectly onto ideology; coalitions contain internal disagreement and shift over time.",
   "Economic policy: **fiscal policy** (taxing and spending, Congress and the president) versus **monetary policy** (the Federal Reserve). **Keynesian** demand management versus **supply-side** tax reduction.",
   "Social policy debates — entitlements, healthcare, education, environmental regulation — divide along both ideological and regional lines.",
   "Ideology also shapes views of federalism: whether a given problem belongs to the national government or the states."]}],
 tip:"Quantitative analysis questions about opinion data want you to connect a number to a course concept — socialization, ideology, or party coalition. Name the concept explicitly.",
 terms:["political socialization","generational effect","representative sample","margin of error","sampling bias","exit poll","liberal","conservative","libertarian","fiscal policy","monetary policy","Keynesian economics","supply-side economics","entitlement"],
 cards:[
 ["Name four agents of political socialization","Family, schools, peers, and media (also religion and major political events)."],
 ["What makes a poll scientifically reliable?","A randomly selected representative sample, sufficient size, neutral question wording, and a reported margin of error."],
 ["What is a margin of error?","The range within which the true population value likely falls, given the sample size."],
 ["What is an exit poll and a risk of using one?","A survey of voters as they leave polling places; early reporting can influence turnout and public perception."],
 ["Fiscal vs monetary policy","Fiscal policy is taxing and spending by Congress and the president; monetary policy is control of money supply and interest rates by the Federal Reserve."],
 ["Contrast Keynesian and supply-side approaches","Keynesians stimulate demand through government spending; supply-siders cut taxes and regulation to spur production and investment."],
 ["How does ideology shape views of federalism?","Beliefs about government's proper role determine whether a policy problem is seen as national or better left to the states."]]},
{title:"Political Participation",weight:[20,27],
 desc:"Voting, parties, interest groups, elections, and media.",
 notes:[
  {h:"Voting and turnout",b:[
   "Expanding suffrage: **Fifteenth**, **Nineteenth**, **Twenty-Fourth**, and **Twenty-Sixth Amendments**, plus the **Voting Rights Act of 1965**.",
   "Turnout predictors: education, income, age, and partisan attachment. Structural factors matter too — registration requirements, voter ID laws, early and mail voting, and whether elections are competitive.",
   "Models of voting behavior: **rational choice**, **retrospective**, **prospective**, and **party-line** voting.",
   "**Linkage institutions** — parties, interest groups, elections, and media — connect citizens to government."]},
  {h:"Parties and interest groups",b:[
   "Party functions: recruiting candidates, mobilizing voters, writing platforms, organizing government, and providing information shortcuts.",
   "**Critical elections** and realignments reshape coalitions; **party dealignment** describes weaker attachment and more independents. Candidate-centered campaigns and primaries have reduced party control.",
   "The **winner-take-all single-member district** system and ballot access rules sustain two parties and marginalize third parties, which mainly influence by pushing issues onto major-party agendas.",
   "Interest groups lobby, litigate (amicus briefs), fund campaigns, mobilize members, and provide expertise. **Free rider** problems and unequal resources mean representation is uneven.",
   "**Iron triangles** and issue networks link groups to agencies and committees."]},
  {h:"Elections and money",b:[
   "Stages: **invisible primary**, primaries and caucuses, national convention, general election, and the **Electoral College**, where a candidate needs 270 electoral votes and can lose the popular vote.",
   "Criticisms of the Electoral College include swing-state focus and small-state overrepresentation; defenses include federalism and coalition building.",
   "Campaign finance: **FECA** and the **Bipartisan Campaign Reform Act** sought limits; **Citizens United v. FEC** held independent political spending is protected speech, enabling **super PACs** and increasing the role of outside money.",
   "Incumbency advantage comes from name recognition, constituent service, fundraising, and districting."]},
  {h:"Media",b:[
   "Media functions: gatekeeping, **agenda setting**, framing, scorekeeping, and watchdog investigation.",
   "Change from broadcast networks to cable, then to social media and algorithmic feeds, has fragmented audiences and enabled **selective exposure** and echo chambers.",
   "**Horse-race coverage** emphasizes polls over policy. Consolidation of ownership, partisan outlets, and the decline of local news all affect what citizens learn.",
   "Media also shape participation — mobilizing, informing, and sometimes discouraging engagement through cynicism."]}],
 tip:"This unit supplies most argument-essay topics. Have a prepared position on the Electoral College, campaign finance, and the two-party system, each with one required document you can cite.",
 terms:["Fifteenth Amendment","Nineteenth Amendment","Twenty-Sixth Amendment","voter turnout","rational choice voting","retrospective voting","linkage institution","critical election","dealignment","single-member district","third party","free rider problem","amicus brief","invisible primary","Electoral College","FECA","Citizens United v. FEC","super PAC","incumbency advantage","agenda setting","horse-race journalism","selective exposure"],
 cards:[
 ["Which amendments expanded suffrage, and to whom?","Fifteenth (race), Nineteenth (women), Twenty-Fourth (banned poll taxes), Twenty-Sixth (age 18)."],
 ["Name three demographic predictors of higher voter turnout","Higher education, higher income, and older age."],
 ["What is retrospective voting?","Voting based on an evaluation of the incumbent's past performance."],
 ["What are linkage institutions?","Parties, interest groups, elections, and the media — the channels connecting citizens to government."],
 ["Why does the American system sustain only two major parties?","Winner-take-all single-member districts, plus ballot access and debate rules, leave little reward for finishing third."],
 ["How do third parties actually influence politics?","By pushing issues onto the agenda, which major parties then adopt."],
 ["What is the free rider problem for interest groups?","People enjoy a group's collective benefits without joining or contributing, making recruitment difficult."],
 ["What did Citizens United v. FEC decide?","Independent political spending by corporations and unions is protected speech and cannot be limited."],
 ["What is a super PAC?","An organization that can raise and spend unlimited money on independent political advocacy but cannot coordinate with a campaign."],
 ["Name three sources of incumbency advantage","Name recognition, constituent casework, and superior fundraising (also favorable districting)."],
 ["What is agenda setting by the media?","Influencing which issues the public and policymakers consider important by choosing what to cover."],
 ["What is horse-race journalism and why is it criticized?","Coverage focused on polling and who is winning rather than policy, which leaves voters less informed about substance."]]}
],

{u:1,q:"A federal law requiring states to meet emissions standards without providing funding is",c:["a block grant","a categorical grant","an unfunded mandate","a concurrent power"],a:2,e:"A requirement imposed without funding is by definition an unfunded mandate."},

{u:5,q:"When media coverage makes an issue seem important to the public, this is",c:["framing","agenda setting","gatekeeping","horse-race journalism"],a:1,e:"Agenda setting shapes which issues the public regards as significant."}

units:[
{title:"Basic Economic Concepts",weight:[5,10],
 desc:"Scarcity, opportunity cost, comparative advantage, and the PPC.",
 notes:[
  {h:"Scarcity and choice",b:[
   "Economics studies choices under **scarcity**. Every choice has an **opportunity cost** — the value of the next best alternative forgone.",
   "Rational decision makers compare **marginal benefit** with **marginal cost** and act when MB ≥ MC.",
   "The **production possibilities curve** shows maximum combinations of two goods. Points inside are inefficient, points on the curve are efficient, and points outside are unattainable.",
   "The PPC bows outward because resources are not equally suited to both goods — **increasing opportunity cost**. Growth shifts the whole curve outward."]},
  {h:"Trade and comparative advantage",b:[
   "**Absolute advantage** means producing more with the same resources. **Comparative advantage** means a lower opportunity cost — this is what determines the gains from trade.",
   "Compute opportunity cost per unit from an output or input table, then specialize where it is lowest and trade.",
   "Terms of trade must fall between the two countries' opportunity costs for both to benefit.",
   "Specialization and trade let both countries consume beyond their own production possibilities."]}],
 tip:"Comparative advantage questions are fast points once you set up the opportunity cost ratio. Write 'to produce 1 X, country A gives up ___ Y' for both countries.",
 terms:["scarcity","opportunity cost","marginal analysis","production possibilities curve","increasing opportunity cost","absolute advantage","comparative advantage","terms of trade"],
 cards:[
 ["Define opportunity cost","The value of the next best alternative given up when a choice is made."],
 ["What does a point inside the production possibilities curve represent?","Inefficient use of resources — unemployment or underutilization."],
 ["Why is the PPC typically bowed outward?","Resources are not equally productive in both uses, so opportunity cost increases as production of one good expands."],
 ["Absolute vs comparative advantage","Absolute advantage is producing more output with the same resources; comparative advantage is producing at a lower opportunity cost."],
 ["Which advantage determines the gains from trade?","Comparative advantage."],
 ["What is the marginal decision rule?","Undertake an activity as long as its marginal benefit is at least as great as its marginal cost."]]},
{title:"Economic Indicators and the Business Cycle",weight:[12,17],
 desc:"GDP, unemployment, inflation, and the phases of the cycle.",
 notes:[
  {h:"Measuring output",b:[
   "`GDP = C + I + G + (X − M)` — the market value of all final goods and services produced within a country in a year.",
   "Excluded from GDP: intermediate goods, used goods, purely financial transactions, transfer payments, and unreported or household production.",
   "**Real GDP** adjusts for price changes and is the measure used to judge growth; **nominal GDP** does not. Real GDP per capita is the standard living-standard proxy.",
   "Limitations: GDP ignores distribution, leisure, environmental damage, and nonmarket activity."]},
  {h:"Unemployment and inflation",b:[
   "`Unemployment rate = unemployed ÷ labor force × 100`. The labor force excludes those not actively seeking work, so **discouraged workers** make the official rate understate the problem.",
   "Types: **frictional** (between jobs), **structural** (skills mismatch), **cyclical** (recession-driven). The **natural rate** equals frictional plus structural; full employment means cyclical unemployment is zero.",
   "**CPI** tracks a fixed basket; inflation is the percent change in the index. Problems include substitution bias and quality change.",
   "Inflation types: **demand-pull** (AD shifts right) and **cost-push** (SRAS shifts left). **Real interest rate = nominal − inflation**.",
   "Unanticipated inflation hurts lenders and fixed-income earners and helps borrowers; **deflation** is worse, discouraging spending and raising real debt burdens."]},
  {h:"The business cycle",b:[
   "Phases: expansion, peak, contraction (recession), trough, and recovery. A recession is conventionally two consecutive quarters of falling real GDP.",
   "**Output gaps**: a recessionary gap means actual output is below potential; an inflationary gap means it is above.",
   "Long-run growth comes from more capital, better technology, more human capital, and better institutions — not from stimulating demand."]}],
 tip:"Distinguish real from nominal every time. Many free response points hinge on noticing the question asked about real GDP or the real interest rate.",
 terms:["GDP","real GDP","nominal GDP","transfer payment","unemployment rate","labor force","discouraged worker","frictional unemployment","structural unemployment","cyclical unemployment","natural rate of unemployment","CPI","demand-pull inflation","cost-push inflation","real interest rate","deflation","business cycle","recessionary gap"],
 cards:[
 ["Expenditure formula for GDP","GDP = C + I + G + (X − M)"],
 ["Name four things excluded from GDP","Intermediate goods, used goods, financial transactions, and transfer payments."],
 ["Formula for the unemployment rate","Unemployed ÷ labor force × 100"],
 ["Why does the official unemployment rate understate joblessness?","Discouraged workers who stop looking are not counted in the labor force."],
 ["What makes up the natural rate of unemployment?","Frictional plus structural unemployment; cyclical unemployment is zero at full employment."],
 ["Demand-pull vs cost-push inflation","Demand-pull comes from rising aggregate demand; cost-push comes from rising input costs shifting short-run aggregate supply left."],
 ["Formula for the real interest rate","Nominal interest rate minus the inflation rate."],
 ["Who gains and who loses from unanticipated inflation?","Borrowers and those with fixed debts gain; lenders and people on fixed incomes lose."],
 ["What is a recessionary gap?","Actual real GDP is below potential output, so unemployment exceeds the natural rate."],
 ["What drives long-run economic growth?","Increases in physical capital, human capital, technology, and supportive institutions."]]},
{title:"National Income and Price Determination",weight:[17,27],
 desc:"Aggregate demand, aggregate supply, multipliers, and fiscal policy.",
 notes:[
  {h:"The AD-AS model",b:[
   "**Aggregate demand** slopes down because of the wealth effect, the interest rate effect, and the net exports effect. Shifters: consumption, investment, government spending, and net exports (plus expectations and taxes).",
   "**Short-run aggregate supply** slopes up because some input prices, especially nominal wages, are sticky. Shifters: resource prices, productivity, business taxes and subsidies, and supply shocks.",
   "**Long-run aggregate supply** is vertical at **full-employment output** — determined by resources and technology, not by prices.",
   "Short-run equilibrium can sit left of LRAS (recessionary gap) or right of it (inflationary gap). **Self-correction** happens as wages adjust, shifting SRAS back toward LRAS."]},
  {h:"Multipliers and fiscal policy",b:[
   "**MPC + MPS = 1.** The **spending multiplier** is `1/MPS`; the **tax multiplier** is `−MPC/MPS` and is smaller in magnitude because part of a tax cut is saved.",
   "Total change in real GDP equals the initial change in spending times the multiplier.",
   "**Expansionary fiscal policy** (more spending or lower taxes) shifts AD right to close a recessionary gap; **contractionary fiscal policy** shifts AD left to close an inflationary gap.",
   "**Automatic stabilizers** — progressive taxes and transfer payments — moderate the cycle without new legislation.",
   "Limits: recognition, decision, and implementation **lags**, political constraints, and **crowding out** when government borrowing raises real interest rates and reduces private investment."]}],
 tip:"Every graph point requires correct labels: axes, curve names, equilibrium points, and arrows showing the shift. An unlabeled correct shift usually earns nothing.",
 terms:["aggregate demand","wealth effect","short-run aggregate supply","sticky wages","long-run aggregate supply","full-employment output","self-correction","marginal propensity to consume","spending multiplier","tax multiplier","expansionary fiscal policy","automatic stabilizer","policy lag","crowding out"],
 cards:[
 ["Why does aggregate demand slope downward?","The wealth effect, the interest rate effect, and the net exports effect all reduce spending as the price level rises."],
 ["Why does short-run aggregate supply slope upward?","Some input prices, especially nominal wages, are sticky, so higher output prices raise profit margins and output."],
 ["Why is long-run aggregate supply vertical?","In the long run all prices adjust, so output is determined by resources and technology rather than the price level."],
 ["Spending multiplier formula","1 ÷ MPS, which equals 1 ÷ (1 − MPC)."],
 ["Tax multiplier formula and why it is smaller","−MPC ÷ MPS; part of any tax change is saved rather than spent."],
 ["MPC of 0.8: what is the spending multiplier?","MPS = 0.2, so the multiplier is 5."],
 ["How does an economy self-correct from a recessionary gap?","Unemployment puts downward pressure on wages, shifting SRAS right until output returns to full employment."],
 ["Give two automatic stabilizers","Progressive income taxes and unemployment insurance transfers."],
 ["Explain crowding out","Government borrowing raises the real interest rate, which reduces private investment spending."],
 ["Three lags that limit fiscal policy","Recognition, decision (legislative), and implementation lags."]]},
{title:"Financial Sector",weight:[18,23],
 desc:"Money, banking, the money market, loanable funds, and monetary policy.",
 notes:[
  {h:"Money and banking",b:[
   "Functions of money: medium of exchange, unit of account, store of value. **M1** is currency plus checkable deposits; **M2** adds savings and near-money.",
   "Banks create money through **fractional reserve** lending. The **money multiplier** is `1/reserve requirement`, and actual expansion is smaller because of excess reserves and cash leakage.",
   "Read a simplified **bank balance sheet**: assets are reserves and loans; liabilities are deposits.",
   "Bond prices and interest rates move **inversely** — this is the mechanism behind open market operations."]},
  {h:"Money market and loanable funds",b:[
   "**Money market**: money demand slopes down against the **nominal interest rate**; money supply is vertical and set by the central bank. Increasing the money supply lowers the nominal rate.",
   "**Loanable funds market**: supply comes from national saving, demand from borrowing for investment, and the price is the **real interest rate**. Government deficits shift demand for loanable funds right, raising real rates — crowding out.",
   "Do not mix the two markets: monetary policy moves the money market directly; fiscal deficits move loanable funds.",
   "**Quantity theory** `MV = PQ`: in the long run, money growth beyond real output growth shows up as inflation."]},
  {h:"Monetary policy",b:[
   "Tools: **open market operations** (buying bonds expands the money supply, selling contracts it), the **policy interest rate** paid on reserves or charged for borrowing, and **reserve requirements**.",
   "**Expansionary monetary policy** lowers interest rates, raises investment and interest-sensitive consumption, and shifts AD right. **Contractionary** does the reverse to fight inflation.",
   "Transmission chain to write out fully: policy action → money supply → nominal interest rate → investment → aggregate demand → output and price level. FRQ rubrics follow this chain.",
   "Limits: the zero lower bound, uncertain lags, and expectations. Central bank independence is valued for credibility on inflation."]}],
 tip:"Label the money market with the nominal interest rate and loanable funds with the real interest rate. Mislabeling is a common and avoidable loss.",
 terms:["medium of exchange","M1","M2","fractional reserve banking","money multiplier","bank balance sheet","bond prices","money demand","nominal interest rate","loanable funds market","real interest rate","quantity theory of money","open market operations","policy rate","expansionary monetary policy","central bank independence"],
 cards:[
 ["Name the three functions of money","Medium of exchange, unit of account, and store of value."],
 ["What does M1 include?","Currency in circulation plus checkable deposits (and traveler's checks)."],
 ["Money multiplier formula","1 ÷ the required reserve ratio."],
 ["Relationship between bond prices and interest rates","They move inversely — when bond prices rise, yields fall."],
 ["Which interest rate is on the money market graph, and which on loanable funds?","Nominal on the money market; real on the loanable funds market."],
 ["How does the central bank expand the money supply with open market operations?","It buys government bonds, paying banks and increasing their reserves."],
 ["Write the full transmission chain for expansionary monetary policy","Buy bonds → money supply rises → nominal interest rate falls → investment rises → aggregate demand shifts right → real GDP and price level rise."],
 ["How does a large government deficit affect the loanable funds market?","Demand for loanable funds increases, raising the real interest rate and crowding out private investment."],
 ["State the quantity theory equation and its long-run implication","MV = PQ; money growth beyond real output growth raises the price level."]]},
{title:"Long-Run Consequences of Stabilization Policies",weight:[20,30],
 desc:"The Phillips curve, growth, deficits, and policy tradeoffs. The heaviest unit.",
 notes:[
  {h:"The Phillips curve",b:[
   "The **short-run Phillips curve** shows an inverse relationship between inflation and unemployment: moving along it corresponds to shifting AD.",
   "The **long-run Phillips curve** is vertical at the **natural rate of unemployment** — there is no permanent tradeoff.",
   "A supply shock shifts the short-run Phillips curve outward, producing **stagflation**: higher inflation and higher unemployment together.",
   "Changes in the natural rate (demographics, labor market institutions, technology) shift the long-run curve."]},
  {h:"Growth, expectations, and debt",b:[
   "Long-run growth shifts **LRAS** right: investment in physical capital, education and human capital, research and technology, property rights and stable institutions.",
   "Saving funds investment; a higher saving rate lowers real interest rates in loanable funds and supports capital accumulation.",
   "**Inflationary expectations** matter: expected inflation gets built into wages and contracts, shifting SRAS and making disinflation costly.",
   "Deficits add to the national **debt**. Concerns: interest costs, crowding out, and reduced future flexibility. Counterarguments: borrowing for productive investment and the role of deficits in recessions.",
   "Policy mix matters: expansionary fiscal with contractionary monetary produces offsetting effects on interest rates and output — a standard multi-market FRQ.",
   "Economic schools disagree on how much discretionary stabilization helps: Keynesian activism, monetarist rules, and classical emphasis on supply-side determinants."]}],
 tip:"Long FRQs often end by asking about the long run. Remember: demand-side policy cannot change long-run output; only LRAS shifts can.",
 terms:["short-run Phillips curve","long-run Phillips curve","natural rate of unemployment","stagflation","supply shock","LRAS growth","human capital","inflationary expectations","national debt","policy mix"],
 cards:[
 ["What does the short-run Phillips curve show?","An inverse relationship between the inflation rate and the unemployment rate."],
 ["Why is the long-run Phillips curve vertical?","In the long run expectations adjust, so unemployment returns to its natural rate regardless of the inflation rate."],
 ["What causes stagflation on a Phillips curve diagram?","A negative supply shock shifts the short-run Phillips curve outward, raising both inflation and unemployment."],
 ["Name four sources of long-run economic growth","Physical capital investment, human capital, technological progress, and stable institutions and property rights."],
 ["Why do inflationary expectations make disinflation costly?","Expected inflation is built into wages and contracts, so reducing inflation requires a period of higher unemployment."],
 ["Two concerns about a rising national debt","Growing interest costs and crowding out of private investment."],
 ["What happens with expansionary fiscal policy combined with contractionary monetary policy?","The effects on output partly offset, and real interest rates rise from both directions of pressure."]]},
{title:"Open Economy: International Trade and Finance",weight:[10,13],
 desc:"The balance of payments, exchange rates, and capital flows.",
 notes:[
  {h:"Balance of payments",b:[
   "The **current account** records trade in goods and services, income, and transfers. The **financial (capital) account** records asset purchases.",
   "The two accounts offset: a current account deficit corresponds to a financial account surplus — a country importing more than it exports is attracting net foreign investment.",
   "Trade policy: tariffs and quotas protect domestic producers at the cost of higher prices and lost efficiency; free trade raises total output through comparative advantage."]},
  {h:"Exchange rates",b:[
   "In a **floating** system, a currency's value is set by supply and demand in the foreign exchange market. **Appreciation** means the currency buys more foreign currency; **depreciation** the reverse.",
   "Drivers of demand for a currency: demand for its exports, relative real interest rates attracting financial capital, speculation, and relative inflation rates.",
   "A currency **appreciates** when domestic real interest rates rise, because financial capital flows in. Appreciation makes exports more expensive and imports cheaper, reducing net exports.",
   "Link the markets explicitly on FRQs: contractionary monetary policy → higher real rates → capital inflow → currency appreciation → exports fall → AD shifts left.",
   "Drawing the foreign exchange graph: label which currency's market it is, and whether the price axis is in units of foreign currency per domestic unit."]}],
 tip:"The final part of a long FRQ often asks about the exchange rate. Run the chain from interest rates to capital flows to currency value to net exports.",
 terms:["current account","financial account","tariff","quota","floating exchange rate","appreciation","depreciation","foreign exchange market","capital flows","net exports"],
 cards:[
 ["What does the current account record?","Trade in goods and services, net income from abroad, and transfers."],
 ["How do the current and financial accounts relate?","They offset each other: a current account deficit is matched by a financial account surplus."],
 ["What happens to a currency when domestic real interest rates rise?","It appreciates, because foreign financial capital flows in seeking higher returns."],
 ["How does currency appreciation affect net exports?","Exports become more expensive abroad and imports cheaper, so net exports fall."],
 ["Write the chain from contractionary monetary policy to net exports","Higher real interest rates → financial capital inflow → currency appreciation → exports fall and imports rise → net exports and AD decline."],
 ["Who gains and who loses from a tariff?","Domestic producers and the government gain; domestic consumers lose through higher prices, and total efficiency falls."]]}
],

units:[
{title:"Basic Economic Concepts",weight:[12,15],
 desc:"Scarcity, opportunity cost, marginal analysis, and comparative advantage.",
 notes:[
  {h:"Choice and the PPC",b:[
   "Scarcity forces choices; every choice carries an **opportunity cost**.",
   "Rational agents act where **marginal benefit ≥ marginal cost**; the optimal quantity is where MB = MC.",
   "The **production possibilities curve** illustrates efficiency, opportunity cost, and growth. Bowing outward reflects increasing opportunity cost.",
   "Absolute versus **comparative advantage**: specialization follows comparative advantage, and the terms of trade must lie between the two opportunity costs."]},
  {h:"Economic systems and incentives",b:[
   "Every system answers what to produce, how, and for whom. Market systems use prices as signals; command systems use central direction.",
   "Prices carry information and **incentives**; interfering with them changes behavior, which is the basis of every policy analysis in this course.",
   "**Marginal utility** falls as consumption increases; a consumer maximizes utility by equalizing marginal utility per dollar across goods."]}],
 tip:"Write opportunity cost as a ratio with units. Most comparative advantage errors are setup errors, not arithmetic.",
 terms:["scarcity","opportunity cost","marginal benefit","production possibilities curve","comparative advantage","marginal utility","utility maximization"],
 cards:[
 ["What condition defines the optimal quantity of an activity?","Marginal benefit equals marginal cost."],
 ["What does a bowed-outward PPC indicate?","Increasing opportunity cost as production of one good expands."],
 ["Which type of advantage governs specialization and trade?","Comparative advantage — the lower opportunity cost."],
 ["State the utility-maximizing rule for two goods","Allocate spending so that marginal utility per dollar is equal across goods."],
 ["What is the law of diminishing marginal utility?","Each additional unit consumed adds less satisfaction than the previous one."]]},
{title:"Supply and Demand",weight:[20,25],
 desc:"Markets, elasticity, surplus, and government intervention.",
 notes:[
  {h:"Demand, supply, and equilibrium",b:[
   "A **change in quantity demanded** moves along the curve (price changed); a **change in demand** shifts the curve. Demand shifters: income, tastes, prices of substitutes and complements, expectations, number of buyers.",
   "Supply shifters: input prices, technology, taxes and subsidies, expectations, number of sellers.",
   "Equilibrium is where quantity supplied equals quantity demanded. A **surplus** pushes price down; a **shortage** pushes it up.",
   "Double shifts leave one of price or quantity **indeterminate** — say which, and why."]},
  {h:"Elasticity",b:[
   "**Price elasticity of demand** = %ΔQd ÷ %ΔP in absolute value. Greater than 1 is **elastic**, less than 1 **inelastic**, exactly 1 unit elastic.",
   "Determinants: availability of substitutes, necessity versus luxury, share of budget, and time horizon. More substitutes and more time mean more elastic.",
   "**Total revenue test**: with elastic demand, a price increase lowers total revenue; with inelastic demand, it raises it.",
   "**Cross-price elasticity** is positive for substitutes and negative for complements. **Income elasticity** is positive for normal goods and negative for inferior goods.",
   "**Price elasticity of supply** rises with time and input flexibility."]},
  {h:"Surplus and intervention",b:[
   "**Consumer surplus** is the area under demand above price; **producer surplus** is the area above supply below price. **Total surplus** is maximized at the competitive equilibrium.",
   "**Price ceiling** below equilibrium causes shortages, queues, and **deadweight loss**; a **price floor** above equilibrium causes surpluses (minimum wage, agricultural supports).",
   "**Excise taxes** create a wedge: the burden falls more heavily on the **less elastic** side of the market. Tax revenue is the wedge times quantity, and deadweight loss is the triangle.",
   "**Subsidies** increase quantity above the efficient level absent an externality, also creating deadweight loss.",
   "Quotas and tariffs in international trade shift the analysis but use the same surplus logic."]}],
 tip:"Label every area you claim: CS, PS, tax revenue, DWL. Graders award specific labeled areas, not the general shape.",
 terms:["change in demand","change in quantity demanded","equilibrium","shortage","price elasticity of demand","elastic","inelastic","total revenue test","cross-price elasticity","income elasticity","consumer surplus","producer surplus","price ceiling","price floor","excise tax","tax incidence","deadweight loss","subsidy"],
 cards:[
 ["Difference between a change in demand and a change in quantity demanded","A change in demand shifts the whole curve; a change in quantity demanded is a movement along it caused by a price change."],
 ["Formula for price elasticity of demand","Percent change in quantity demanded divided by percent change in price, in absolute value."],
 ["What does the total revenue test say about elastic demand?","Price and total revenue move in opposite directions."],
 ["Positive cross-price elasticity means the goods are","Substitutes."],
 ["Negative income elasticity means the good is","Inferior."],
 ["Where does the burden of an excise tax fall more heavily?","On the side of the market — buyers or sellers — that is less elastic."],
 ["What does a binding price ceiling cause?","A persistent shortage, nonprice rationing, and deadweight loss."],
 ["What does a binding price floor cause?","A persistent surplus, such as unemployment from a minimum wage above equilibrium."],
 ["Define consumer surplus","The area below the demand curve and above the market price — value received beyond what was paid."],
 ["What is deadweight loss?","The loss of total surplus when output differs from the efficient quantity."]]},
{title:"Production, Cost, and Perfect Competition",weight:[22,25],
 desc:"Cost curves, profit maximization, and the competitive model.",
 notes:[
  {h:"Production and costs",b:[
   "**Diminishing marginal returns**: adding a variable input to fixed inputs eventually raises output by less each time, which is why MC rises.",
   "`TC = FC + VC`; averages are each total divided by Q. `MC = ΔTC/ΔQ`.",
   "**MC intersects ATC and AVC at their minimum points** — a relationship graders look for.",
   "**Accounting profit** subtracts explicit costs; **economic profit** also subtracts **implicit costs** (opportunity cost of the owner's resources). Zero economic profit is a normal return.",
   "Long run: **economies of scale** lower long-run ATC as output grows; diseconomies raise it. Constant returns give a flat region."]},
  {h:"Perfect competition",b:[
   "Assumptions: many buyers and sellers, identical products, free entry and exit, perfect information. The firm is a **price taker**, so `P = MR = demand` and its demand curve is horizontal.",
   "Profit maximization at **MR = MC** for every market structure. For the competitive firm this is `P = MC`.",
   "Profit is `(P − ATC) × Q`. The firm shuts down in the short run if `P < AVC`, since it cannot cover variable cost.",
   "The short-run supply curve is the MC curve above AVC.",
   "**Long-run equilibrium**: entry and exit drive economic profit to zero, so `P = MR = MC = minimum ATC`. The outcome is both **allocatively efficient** (P = MC) and **productively efficient** (minimum ATC) — the benchmark against which other structures are judged."]}],
 tip:"Draw the competitive firm and the market side by side. Many long FRQs move between the two, and the link is that the market determines the price the firm takes.",
 terms:["diminishing marginal returns","total cost","average total cost","marginal cost","accounting profit","economic profit","implicit cost","economies of scale","price taker","MR = MC","shutdown rule","allocative efficiency","productive efficiency","long-run equilibrium"],
 cards:[
 ["Why does marginal cost eventually rise?","Diminishing marginal returns to the variable input mean each extra unit of output requires more input."],
 ["Where does MC intersect ATC?","At the minimum point of ATC."],
 ["Accounting profit vs economic profit","Accounting profit subtracts only explicit costs; economic profit also subtracts implicit opportunity costs."],
 ["What does the perfectly competitive firm's demand curve look like?","Horizontal at the market price, so P = MR."],
 ["Profit-maximizing rule for any firm","Produce where marginal revenue equals marginal cost."],
 ["When should a firm shut down in the short run?","When price is below average variable cost."],
 ["Describe long-run equilibrium in perfect competition","P = MR = MC = minimum ATC, with zero economic profit."],
 ["Allocative vs productive efficiency","Allocative efficiency means P = MC; productive efficiency means producing at minimum ATC."],
 ["What is the perfectly competitive firm's short-run supply curve?","Its marginal cost curve above average variable cost."]]},
{title:"Imperfect Competition",weight:[15,22],
 desc:"Monopoly, monopolistic competition, oligopoly, and game theory.",
 notes:[
  {h:"Monopoly",b:[
   "A single seller with a unique product and barriers to entry is a **price maker**; **marginal revenue lies below demand** because selling more requires lowering the price on all units.",
   "Profit maximization at MR = MC, then price read up to the demand curve. Because `P > MC`, output is below the efficient level and there is **deadweight loss**.",
   "Barriers: economies of scale (**natural monopoly**), control of a resource, patents, licensing, and network effects.",
   "Regulation: **socially optimal price** sets `P = MC` (which may mean losses for a natural monopoly); **fair return price** sets `P = ATC`.",
   "**Price discrimination** charges different prices by willingness to pay; perfect price discrimination eliminates consumer surplus and deadweight loss while raising output."]},
  {h:"Monopolistic competition and oligopoly",b:[
   "**Monopolistic competition**: many firms, **differentiated products**, easy entry. Short-run profits attract entry, so long-run economic profit is zero — but at `P > MC` and with **excess capacity**, so it is not allocatively efficient.",
   "Non-price competition (advertising, branding, quality) is the defining behavior.",
   "**Oligopoly**: few interdependent firms. Outcomes depend on strategic behavior — collusion and cartels, price leadership, or price wars.",
   "**Game theory**: read a payoff matrix, find each player's best response, identify **dominant strategies** and **Nash equilibrium**. The **prisoner's dilemma** explains why cartels break down even when cooperation would pay.",
   "Antitrust policy addresses collusion and mergers; concentration ratios measure market power."]}],
 tip:"For any monopoly graph, mark MR = MC first, then go up to demand for the price. Reading price off MC is the most common error in the unit.",
 terms:["price maker","marginal revenue below demand","deadweight loss","natural monopoly","barrier to entry","socially optimal price","fair return price","price discrimination","product differentiation","excess capacity","oligopoly","collusion","game theory","dominant strategy","Nash equilibrium","prisoner's dilemma","antitrust"],
 cards:[
 ["Why does a monopolist's marginal revenue lie below its demand curve?","Selling an additional unit requires lowering the price on all units sold."],
 ["How do you find a monopolist's price on a graph?","Find the quantity where MR = MC, then read the price up on the demand curve."],
 ["Why does monopoly create deadweight loss?","Output is restricted to where P exceeds MC, so mutually beneficial transactions go unmade."],
 ["What is a natural monopoly?","An industry where economies of scale make one large producer the lowest-cost supplier."],
 ["Socially optimal vs fair return regulated price","Socially optimal sets P = MC for efficiency; fair return sets P = ATC so the firm breaks even."],
 ["Why can price discrimination increase total output?","Charging lower prices to more elastic buyers allows sales that a single price would prevent."],
 ["Describe long-run equilibrium in monopolistic competition","Zero economic profit with price above marginal cost and production below minimum ATC — excess capacity."],
 ["What is a dominant strategy?","A strategy that gives a player a better payoff regardless of what the other player does."],
 ["What does the prisoner's dilemma explain about cartels?","Each member's individual incentive is to cheat, so collusive agreements tend to break down."]]},
{title:"Factor Markets",weight:[10,13],
 desc:"Labor and other input markets, derived demand, and wage determination.",
 notes:[
  {h:"Demand for factors",b:[
   "Factor demand is **derived demand** — it comes from demand for the output the factor produces.",
   "**Marginal revenue product (MRP)** = marginal physical product × marginal revenue (or price in competitive output markets). A firm hires where `MRP = MRC` (wage in a competitive labor market).",
   "MRP falls because of diminishing marginal returns, which makes labor demand slope downward.",
   "Shifters of labor demand: product price, productivity, and prices of substitute or complementary inputs.",
   "Least-cost hiring across two inputs: equalize `MP/price` for each input."]},
  {h:"Labor supply and market structures",b:[
   "In a **perfectly competitive labor market** the firm is a wage taker, facing a horizontal supply of labor at the market wage; the market supply slopes up.",
   "A **monopsony** is a single buyer of labor: MRC lies above the supply curve, so the firm hires fewer workers at a lower wage than a competitive market would, creating deadweight loss.",
   "Unions and minimum wages raise wages above equilibrium in competitive markets, reducing employment, but can raise both in monopsony.",
   "Wage differentials arise from human capital, compensating differentials for unpleasant work, discrimination, and geographic immobility."]}],
 tip:"Draw MRC above the supply curve for monopsony and read the wage off the supply curve at the hiring quantity. That single step is where the points are.",
 terms:["derived demand","marginal revenue product","marginal resource cost","diminishing marginal returns","least-cost rule","monopsony","wage differential","human capital"],
 cards:[
 ["Why is factor demand called derived demand?","It depends on the demand for the output that the factor helps produce."],
 ["How do you compute marginal revenue product?","Marginal physical product times the output's marginal revenue (the price in a competitive output market)."],
 ["Hiring rule for a profit-maximizing firm","Hire until marginal revenue product equals marginal resource cost."],
 ["Why does labor demand slope downward?","Diminishing marginal returns reduce each additional worker's marginal revenue product."],
 ["What is the least-cost combination rule for two inputs?","Equalize the ratio of marginal product to input price across inputs."],
 ["What is a monopsony?","A labor market with a single buyer of labor, which hires fewer workers at a lower wage than a competitive market."],
 ["Where does MRC lie relative to labor supply in a monopsony?","Above the supply curve, because hiring one more worker raises the wage paid to all."]]},
{title:"Market Failure and the Role of Government",weight:[8,13],
 desc:"Externalities, public goods, and inequality.",
 notes:[
  {h:"Externalities and public goods",b:[
   "A **negative externality** (pollution) means social cost exceeds private cost, so the market overproduces; a **positive externality** (vaccination, education) means social benefit exceeds private benefit, so the market underproduces.",
   "The efficient quantity is where **marginal social benefit = marginal social cost**. Deadweight loss is the triangle between the private and social optimum.",
   "Corrections: **Pigouvian taxes** on negative externalities, **subsidies** for positive ones, tradable permits, regulation, and assigning property rights (the Coase approach).",
   "**Public goods** are **non-rival** and **non-excludable**, producing a **free rider problem** and under-provision by markets; government provision is the standard response.",
   "**Common resources** are rival but non-excludable, leading to overuse — the tragedy of the commons."]},
  {h:"Inequality and government action",b:[
   "Measuring inequality: the **Lorenz curve** and the **Gini coefficient** (0 perfect equality, 1 perfect inequality).",
   "Tax structures: **progressive** (rate rises with income), **proportional**, and **regressive** (a larger burden on lower incomes, as with many sales taxes).",
   "Redistribution through transfers, in-kind benefits, and public services trades off against incentive effects — the core normative debate.",
   "Government failure matters too: imperfect information, political incentives, and unintended consequences can make intervention worse than the failure it targets."]}],
 tip:"When you see an externality, draw both the private and social curve and label the efficient quantity. Then name the correction — a per-unit tax equal to the external cost.",
 terms:["negative externality","positive externality","marginal social cost","marginal social benefit","Pigouvian tax","tradable permit","public good","non-rival","non-excludable","free rider problem","common resource","Lorenz curve","Gini coefficient","progressive tax","regressive tax"],
 cards:[
 ["What happens to market output with a negative externality?","The market overproduces, because private cost is below social cost."],
 ["What is the efficient quantity in the presence of an externality?","Where marginal social benefit equals marginal social cost."],
 ["What is a Pigouvian tax?","A per-unit tax set equal to the external cost, which internalizes the externality and restores efficiency."],
 ["Two defining features of a public good","Non-rival in consumption and non-excludable."],
 ["What is the free rider problem?","People can consume a non-excludable good without paying, so private markets under-provide it."],
 ["What is a common resource and its characteristic problem?","Rival but non-excludable — overuse, the tragedy of the commons."],
 ["What does the Gini coefficient measure?","Income inequality, from 0 for perfect equality to 1 for maximum inequality."],
 ["Progressive vs regressive tax","A progressive tax takes a larger percentage as income rises; a regressive tax takes a larger percentage from lower incomes."]]}
],
qbank:[
{u:2,q:"A 10% price increase causes a 25% drop in quantity demanded. Demand is",c:["inelastic","unit elastic","elastic","perfectly inelastic"],a:2,e:"Elasticity is 2.5, greater than 1, so demand is elastic."},
{u:2,q:"A binding price ceiling in a competitive market causes",c:["a surplus","a shortage and deadweight loss","higher producer surplus","no change"],a:1,e:"Quantity demanded exceeds quantity supplied at the capped price."},
{u:2,q:"An excise tax on a good with very inelastic demand falls mostly on",c:["producers","consumers","the government","neither"],a:1,e:"The less elastic side bears more of the burden, and here that is consumers."},
{u:3,q:"Marginal cost intersects average total cost",c:["at ATC's maximum","at ATC's minimum","where MC = 0","never"],a:1,e:"MC passes through the minimum of both ATC and AVC."},
{u:3,q:"A competitive firm should shut down in the short run when",c:["P < ATC","P < AVC","profit is zero","MR = MC"],a:1,e:"Below AVC the firm cannot even cover variable costs, so producing worsens losses."},
{u:3,q:"In long-run competitive equilibrium, economic profit is",c:["positive","zero","negative","indeterminate"],a:1,e:"Free entry and exit eliminate economic profit."},
{u:4,q:"To find a monopolist's price, you",c:["read up from MR = MC to the demand curve","read MR = MC directly","use minimum ATC","use the supply curve"],a:0,e:"Quantity comes from MR = MC; price comes from demand at that quantity."},
{u:4,q:"Long-run monopolistic competition features",c:["zero profit with P = MC","zero profit with P > MC and excess capacity","positive profit","allocative efficiency"],a:1,e:"Entry drives profit to zero, but differentiation keeps price above marginal cost."},
{u:4,q:"A strategy that is best regardless of the rival's choice is",c:["a Nash equilibrium","a dominant strategy","collusion","tit for tat"],a:1,e:"Dominance means it beats the alternatives against every opposing choice."},
{u:5,q:"A firm hires labor until",c:["MP is maximized","MRP equals MRC","wage equals ATC","MP equals zero"],a:1,e:"Profit maximization in a factor market equates marginal revenue product to marginal resource cost."},
{u:5,q:"Compared with a competitive labor market, a monopsonist hires",c:["more workers at a higher wage","fewer workers at a lower wage","the same number at a lower wage","more workers at a lower wage"],a:1,e:"MRC above supply leads the single buyer to restrict hiring and pay less."},
{u:6,q:"A factory's pollution is an example of",c:["a public good","a negative externality","a common resource problem only","a price floor"],a:1,e:"Social cost exceeds private cost, so the market overproduces."},
{u:6,q:"National defense is a classic public good because it is",c:["rival and excludable","non-rival and non-excludable","rival and non-excludable","produced privately"],a:1,e:"One person's protection does not reduce another's, and no one can be excluded."}
