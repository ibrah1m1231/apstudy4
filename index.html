units:[
{title:"Kinematics",weight:[10,15],
 desc:"Describing motion in one and two dimensions with graphs and equations.",
 notes:[
  {h:"Position, velocity, acceleration",b:[
   "**Displacement** is a vector (change in position); **distance** is the total path length. Average velocity uses displacement; average speed uses distance.",
   "Acceleration is the rate of change of velocity. Speeding up means a and v point the same way; slowing down means they oppose.",
   "A negative acceleration does not mean slowing down — it means the acceleration vector points in the negative direction."]},
  {h:"Reading motion graphs",b:[
   "**Slope of position vs time = velocity.** Slope of velocity vs time = acceleration.",
   "**Area under velocity vs time = displacement.** Area under acceleration vs time = change in velocity.",
   "A curved position graph means nonzero acceleration; a straight velocity graph means constant acceleration.",
   "Graph-matching questions are free points once you apply slope and area consistently."]},
  {h:"Free fall and projectiles",b:[
   "In free fall near Earth, `a = g ≈ 9.8 m/s²` downward regardless of mass (ignoring air resistance).",
   "At the top of a vertical trajectory, velocity is zero but acceleration is still g downward.",
   "**Projectile motion** separates into independent components: horizontal velocity is constant, vertical motion is free fall. **Time links them.**",
   "Symmetry: for a projectile returning to its launch height, the rise and fall times are equal and the speeds match."]},
  {h:"Relative motion and experiments",b:[
   "Velocities add as vectors when switching reference frames.",
   "To find g experimentally from a dropped object, graph so the plot is linear — for instance Δy vs t² gives slope g/2.",
   "Linearizing is the heart of AP experimental questions: decide what to plot so that slope carries the quantity you want."]}],
 tip:"Write separate x and y tables for every projectile problem. Mixing components is the single most common kinematics error.",
 terms:["displacement","average velocity","acceleration","free fall","projectile motion","linearization"],
 cards:[
 ["What does the slope of a position-time graph give?","Instantaneous velocity."],
 ["What does the area under a velocity-time graph give?","Displacement."],
 ["At the top of a projectile's arc, what are v and a?","Vertical velocity is zero; acceleration is still g downward."],
 ["Why does horizontal velocity stay constant in projectile motion?","No horizontal force acts (ignoring air resistance), so there is no horizontal acceleration."],
 ["What quantity links the horizontal and vertical parts of a projectile problem?","Time."],
 ["Displacement vs distance","Displacement is the vector change in position; distance is the total path length traveled."],
 ["Does negative acceleration always mean slowing down?","No — it means the acceleration points in the negative direction. The object slows only if velocity is positive."],
 ["To find g from drop data, what should you graph for a straight line?","Δy versus t², whose slope is g/2."]]},
{title:"Force and Translational Dynamics",weight:[18,23],
 desc:"Newton's laws, friction, circular motion, and gravitation. The heaviest unit alongside energy.",
 notes:[
  {h:"Newton's laws and free-body diagrams",b:[
   "**First law**: an object's velocity changes only if a net external force acts. **Second law**: `ΣF = ma`, applied component by component. **Third law**: forces come in equal, opposite pairs on *different* objects.",
   "Draw a **free-body diagram** for each object showing only forces acting **on** it, with lengths roughly proportional.",
   "Choose axes along the motion; on an incline tilt the axes so gravity splits into `mg sin θ` (along) and `mg cos θ` (perpendicular).",
   "Normal force is whatever the surface must supply — it equals mg only for a level surface with no vertical acceleration."]},
  {h:"Friction, tension, and systems",b:[
   "`F_f = μN`. Static friction adjusts up to a maximum; kinetic friction is roughly constant and opposes sliding.",
   "For connected objects, either analyze the whole system (internal forces cancel) to get a, then one object to get the tension.",
   "An ideal pulley changes a force's direction without changing its magnitude; tension is the same throughout a massless string.",
   "Apparent weight in an elevator: `N = m(g + a)` — heavier accelerating up, lighter accelerating down."]},
  {h:"Circular motion",b:[
   "Uniform circular motion has constant speed but changing velocity, so there is acceleration directed **toward the center**: `a_c = v²/r`.",
   "Centripetal force is not a new force — it is the net inward force supplied by tension, gravity, friction, or a normal force. Name the actual force.",
   "At the top of a vertical loop the minimum speed occurs when gravity alone supplies the centripetal force: `v_min = √(gr)`.",
   "Banked curves and conical pendulums are resolved by splitting the normal force or tension into components."]},
  {h:"Gravitation",b:[
   "`F = Gm₁m₂/r²`, measured center to center. The force is mutual and equal on both bodies by the third law.",
   "Gravitational field strength `g = GM/r²` falls with the square of distance; at twice the radius it is one quarter.",
   "Orbits: set gravitation equal to the centripetal requirement, giving `v = √(GM/r)` — farther orbits are slower.",
   "An orbiting astronaut feels weightless because the normal force is zero, not because gravity is absent."]}],
 tip:"Start every dynamics problem with a labeled free-body diagram. Rubrics award the diagram directly, and the equations fall out of it.",
 terms:["free-body diagram","net force","normal force","static friction","kinetic friction","tension","centripetal acceleration","universal gravitation","orbital velocity","apparent weight"],
 cards:[
 ["Newton's second law in component form","ΣF_x = ma_x and ΣF_y = ma_y"],
 ["What does Newton's third law pair require?","The two forces are equal in magnitude, opposite in direction, and act on two different objects."],
 ["Components of gravity on an incline of angle θ","mg sin θ along the incline, mg cos θ perpendicular to it."],
 ["Is the normal force always equal to mg?","No — only on a horizontal surface with no vertical acceleration and no other vertical forces."],
 ["Centripetal acceleration formula","a_c = v²/r, directed toward the center."],
 ["Is centripetal force a new kind of force?","No — it is the net inward force supplied by a real force such as tension, friction, gravity, or a normal force."],
 ["Minimum speed at the top of a vertical loop","v = √(gr), where gravity alone supplies the centripetal force."],
 ["Newton's law of universal gravitation","F = Gm₁m₂/r², measured between centers."],
 ["If the distance between two masses triples, the gravitational force becomes","One ninth of the original."],
 ["Apparent weight in an elevator accelerating upward","N = m(g + a) — greater than mg."]]},
{title:"Work, Energy, and Power",weight:[18,23],
 desc:"Energy as a bookkeeping tool for systems.",
 notes:[
  {h:"Work and the work-energy theorem",b:[
   "`W = Fd cos θ` — only the force component along the displacement does work. A perpendicular force (like centripetal force) does zero work.",
   "Work is the **area under a force-displacement graph**, which handles varying forces such as springs.",
   "**Work-energy theorem**: `W_net = ΔKE`. This is often the fastest route when forces are constant and time is irrelevant."]},
  {h:"Energy forms and conservation",b:[
   "`KE = ½mv²`, `PE_grav = mgh`, `PE_spring = ½kx²`. Potential energy belongs to a **system**, not to a single object.",
   "Mechanical energy is conserved when only conservative forces act: `KE₁ + PE₁ = KE₂ + PE₂`.",
   "Friction and air resistance convert mechanical energy into thermal energy: `ΔE_mech = −F_f·d`.",
   "Energy bar charts (LOL diagrams) show initial energy, work added or removed, and final energy. Define the system first."]},
  {h:"Power and problem strategy",b:[
   "`P = W/t = Fv` for a constant force along the velocity. Power is a rate, measured in watts.",
   "Choose energy methods when the question involves speeds and distances but not time; choose forces when it involves acceleration.",
   "Doubling speed quadruples kinetic energy — which is why stopping distance scales with v².",
   "Always state the system and the reference height for PE; rubrics check it."]}],
 tip:"Ask 'is there friction?' before writing conservation of energy. If yes, add a thermal-energy term rather than assuming conservation.",
 terms:["work","work-energy theorem","kinetic energy","potential energy","conservative force","mechanical energy","power","system"],
 cards:[
 ["Work done by a force at angle θ to displacement","W = Fd cos θ"],
 ["Why does centripetal force do no work in uniform circular motion?","It is always perpendicular to the velocity, so cos θ = 0."],
 ["State the work-energy theorem","The net work done on an object equals its change in kinetic energy."],
 ["Elastic potential energy of a spring","PE = ½kx²"],
 ["How does friction appear in an energy equation?","As energy converted to thermal energy, equal in magnitude to F_f × d."],
 ["When is mechanical energy conserved?","When only conservative forces (gravity, ideal springs) do work on the system."],
 ["Power in terms of force and velocity","P = Fv for a constant force along the direction of motion."],
 ["If speed doubles, kinetic energy becomes","Four times as large, since KE ∝ v²."],
 ["What does the area under a force-versus-position graph represent?","The work done by that force."]]},
{title:"Linear Momentum",weight:[10,15],
 desc:"Impulse, conservation of momentum, and collisions.",
 notes:[
  {h:"Momentum and impulse",b:[
   "`p = mv`, a vector. **Impulse** `J = FΔt = Δp` is the area under a force-time graph.",
   "Extending the collision time reduces the force for the same change in momentum — the physics of airbags, crumple zones, and bending your knees.",
   "Momentum is conserved for a system when the **net external force is zero**; internal forces always cancel in pairs."]},
  {h:"Collisions",b:[
   "**Elastic** collisions conserve both momentum and kinetic energy. **Inelastic** collisions conserve momentum only; **perfectly inelastic** means the objects stick together.",
   "Set up conservation with signs for direction: `m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′`.",
   "In two dimensions, conserve momentum **component by component**.",
   "Explosions are collisions run backwards: total momentum starts at zero and stays zero."]},
  {h:"Center of mass and strategy",b:[
   "The center of mass of a system moves as though all mass were concentrated there and only external forces acted.",
   "Check whether kinetic energy was lost to decide whether a collision was elastic — compute it before and after.",
   "Momentum or energy? Collisions and short-duration interactions call for momentum; height and speed changes call for energy. Many problems need both in sequence."]}],
 tip:"Momentum conservation needs a stated system and a stated reason the external forces are negligible during the interaction. Say it explicitly on FRQs.",
 terms:["momentum","impulse","conservation of momentum","elastic collision","perfectly inelastic","center of mass"],
 cards:[
 ["Definition of impulse and its two equivalent forms","J = FΔt = Δp — also the area under a force-time graph."],
 ["Why does a longer collision time reduce the force?","For the same change in momentum, F = Δp/Δt is smaller when Δt is larger."],
 ["When is a system's momentum conserved?","When the net external force on the system is zero."],
 ["Elastic vs inelastic collision","Elastic conserves kinetic energy as well as momentum; inelastic conserves momentum only."],
 ["What is a perfectly inelastic collision?","One in which the objects stick together and move with a common final velocity."],
 ["How do you handle a two-dimensional collision?","Conserve momentum separately in the x and y directions."],
 ["Total momentum before an explosion at rest","Zero, and it remains zero afterward."],
 ["How do you test whether a collision was elastic?","Compare total kinetic energy before and after; if it is unchanged, the collision was elastic."]]},
{title:"Torque and Rotational Dynamics",weight:[10,15],
 desc:"The rotational analogues of force and Newton's second law.",
 notes:[
  {h:"Rotational kinematics",b:[
   "Angular position θ, angular velocity ω, angular acceleration α follow the same equations as linear motion with the symbols swapped.",
   "Link rotation to translation: `v = rω` and `a_t = rα`. Points farther from the axis move faster.",
   "Rolling without slipping connects the center's speed to the rotation: `v_cm = Rω`."]},
  {h:"Torque",b:[
   "`τ = rF sin θ` — only the perpendicular component of force produces torque, and a longer lever arm gives more torque.",
   "Torque has a sign: choose a positive rotational direction and stay consistent.",
   "**Static equilibrium** requires `ΣF = 0` **and** `Στ = 0`. Choose the pivot to eliminate an unknown force from the torque equation.",
   "Balanced-beam problems (a plank on a fulcrum, a sign on a bracket) are pure torque-equilibrium exercises."]},
  {h:"Rotational inertia and Newton's second law",b:[
   "**Rotational inertia** I depends on mass *and* how it is distributed: mass farther from the axis contributes more (`I = Σmr²`).",
   "`Στ = Iα` is the rotational second law. Larger I means more torque is needed for the same angular acceleration.",
   "A hollow cylinder has larger I than a solid one of the same mass, so it angularly accelerates less and rolls down a ramp more slowly.",
   "Changing the axis changes I — always identify the axis."]}],
 tip:"For equilibrium problems, pick the pivot at an unknown force. That force's torque becomes zero and the algebra shrinks.",
 terms:["angular velocity","angular acceleration","torque","lever arm","rotational inertia","static equilibrium","rolling without slipping"],
 cards:[
 ["Torque formula","τ = rF sin θ — only the perpendicular force component creates torque."],
 ["Two conditions for static equilibrium","Net force is zero and net torque is zero."],
 ["Rotational form of Newton's second law","Στ = Iα"],
 ["What does rotational inertia depend on?","Total mass and how far that mass lies from the axis of rotation."],
 ["Relationship between tangential and angular speed","v = rω"],
 ["Why does a hollow cylinder roll downhill more slowly than a solid one of equal mass?","Its mass is farther from the axis, giving larger rotational inertia, so more of the energy goes into rotation."],
 ["Condition for rolling without slipping","v_cm = Rω"],
 ["Smart choice of pivot for a torque problem","At the location of an unknown force, so that force contributes no torque."]]},
{title:"Energy and Momentum of Rotating Systems",weight:[5,8],
 desc:"Rotational kinetic energy and angular momentum conservation.",
 notes:[
  {h:"Rotational kinetic energy",b:[
   "`KE_rot = ½Iω²`. A rolling object has both translational and rotational kinetic energy: `½mv² + ½Iω²`.",
   "In a rolling race down a ramp, the object with the smaller I relative to mR² wins, because less energy is diverted into rotation.",
   "Work done by a torque: `W = τθ`, and rotational power is `P = τω`."]},
  {h:"Angular momentum",b:[
   "`L = Iω` for a rotating body; for a point mass, `L = mvr_⊥`.",
   "**Angular momentum is conserved when the net external torque is zero.** Decreasing I increases ω — the spinning skater pulling in her arms.",
   "Kinetic energy is *not* conserved in that process: the skater does work pulling her arms in, so KE increases.",
   "A person walking on a rotating platform changes the system's I, so ω adjusts to keep L constant."]}],
 tip:"Distinguish the two conservation statements carefully: momentum conservation needs zero net force, angular momentum conservation needs zero net torque.",
 terms:["rotational kinetic energy","angular momentum","conservation of angular momentum","rolling race"],
 cards:[
 ["Rotational kinetic energy","KE = ½Iω²"],
 ["Total kinetic energy of a rolling object","½mv² + ½Iω²"],
 ["Angular momentum of a rotating rigid body","L = Iω"],
 ["When is angular momentum conserved?","When the net external torque on the system is zero."],
 ["Why does a skater spin faster when pulling in her arms?","Rotational inertia decreases, so angular velocity increases to keep Iω constant."],
 ["Does kinetic energy stay constant when the skater pulls her arms in?","No — she does work, so rotational kinetic energy increases."],
 ["Work done by a constant torque through angle θ","W = τθ"]]},
{title:"Oscillations",weight:[10,15],
 desc:"Simple harmonic motion in springs and pendulums.",
 notes:[
  {h:"Simple harmonic motion",b:[
   "SHM occurs when the restoring force is **proportional to displacement and opposite in direction** — `F = −kx` for a spring.",
   "Acceleration is maximum at the extremes (maximum displacement) and zero at equilibrium; speed is the opposite.",
   "Position, velocity, and acceleration are sinusoidal and out of phase: velocity lags position by a quarter period.",
   "**Amplitude does not affect the period** for an ideal oscillator — a counterintuitive result the exam loves."]},
  {h:"Periods and energy",b:[
   "`T_spring = 2π√(m/k)` — heavier mass or weaker spring gives a longer period, and gravity does not appear.",
   "`T_pendulum = 2π√(L/g)` for small angles — mass does not appear, but g does, so the period changes on the Moon.",
   "Energy oscillates between kinetic and potential; total energy is `½kA²` for a spring, proportional to amplitude squared.",
   "Frequency `f = 1/T`, measured in hertz; angular frequency `ω = 2πf`."]},
  {h:"Experiments with oscillators",b:[
   "To find k from data, graph F vs x — the slope is k. To find k from periods, graph T² vs m, whose slope is 4π²/k.",
   "To measure g with a pendulum, graph T² vs L, whose slope is 4π²/g.",
   "Timing many oscillations and dividing reduces random error."]}],
 tip:"If a question varies the amplitude and asks about the period, the answer is 'no change' for an ideal spring or small-angle pendulum.",
 terms:["simple harmonic motion","restoring force","amplitude","period","frequency","angular frequency"],
 cards:[
 ["What condition produces simple harmonic motion?","A restoring force proportional to displacement and directed back toward equilibrium."],
 ["Period of a mass on a spring","T = 2π√(m/k)"],
 ["Period of a simple pendulum","T = 2π√(L/g)"],
 ["Does amplitude affect the period of an ideal oscillator?","No."],
 ["Does the mass affect the period of a simple pendulum?","No — only the length and g."],
 ["Where is acceleration greatest in SHM?","At maximum displacement, where the restoring force is largest."],
 ["Where is speed greatest in SHM?","At the equilibrium position."],
 ["Total energy of a spring oscillator in terms of amplitude","E = ½kA²"],
 ["To measure g with a pendulum, what should you graph?","T² versus L; the slope is 4π²/g."]]},
{title:"Fluids",weight:[10,15],
 desc:"Density, pressure, buoyancy, and fluid flow.",
 notes:[
  {h:"Density and pressure",b:[
   "`ρ = m/V`. Pressure is force per area: `P = F/A`, measured in pascals.",
   "**Gauge pressure with depth**: `P = P₀ + ρgh`. Pressure depends on depth, not on the shape or total volume of the container.",
   "Pressure acts equally in all directions at a point in a static fluid, and is transmitted undiminished (Pascal's principle) — the basis of hydraulic lifts: `F₁/A₁ = F₂/A₂`."]},
  {h:"Buoyancy",b:[
   "**Archimedes' principle**: `F_b = ρ_fluid·V_displaced·g` — the buoyant force equals the weight of displaced fluid.",
   "An object floats when its average density is less than the fluid's; the **fraction submerged** equals `ρ_object/ρ_fluid`.",
   "A floating object displaces fluid equal to its own weight; a fully submerged object displaces its own volume.",
   "Apparent weight when submerged is `mg − F_b`."]},
  {h:"Fluid flow",b:[
   "**Continuity** for an incompressible fluid: `A₁v₁ = A₂v₂`. Narrower pipe means faster flow — volume flow rate is constant.",
   "**Bernoulli's equation**: `P + ½ρv² + ρgy = constant` along a streamline — a statement of energy conservation per unit volume.",
   "Where speed is higher, pressure is lower (at the same height). This explains lift, a curving ball, and why a shower curtain pulls inward.",
   "Bernoulli assumes steady, non-viscous, incompressible flow — say so when you use it."]}],
 tip:"For a floating object, go straight to 'fraction submerged = density ratio'. It collapses most buoyancy questions into one line.",
 terms:["density","pressure","Pascal's principle","Archimedes' principle","buoyant force","continuity equation","Bernoulli's equation"],
 cards:[
 ["Pressure as a function of depth","P = P₀ + ρgh"],
 ["Does the shape of a container affect pressure at a given depth?","No — only depth, fluid density, and the pressure at the surface matter."],
 ["Archimedes' principle","The buoyant force equals the weight of the fluid displaced: F_b = ρ_fluid V_displaced g."],
 ["Fraction of a floating object submerged","ρ_object / ρ_fluid"],
 ["Condition for an object to float","Its average density must be less than the fluid's density."],
 ["Continuity equation for incompressible flow","A₁v₁ = A₂v₂"],
 ["Bernoulli's equation","P + ½ρv² + ρgy = constant along a streamline."],
 ["Where flow is faster, pressure is","Lower, at the same elevation."],
 ["Hydraulic lift relationship","F₁/A₁ = F₂/A₂ — a small force on a small piston lifts a large load on a large piston."]]}
],
qbank:[
{u:1,q:"A ball is thrown straight up. At its highest point,",c:["v = 0 and a = 0","v = 0 and a = g downward","v is maximum and a = 0","v = 0 and a = g upward"],a:1,e:"Velocity passes through zero but gravity still acts, so acceleration remains g downward."},
{u:1,q:"Area under a velocity-time graph gives",c:["acceleration","displacement","jerk","force"],a:1,e:"Summing v·Δt over the interval gives displacement."},
{u:2,q:"A 5 kg box sits on a 30° incline. The component of gravity along the incline is",c:["5g","5g sin30°","5g cos30°","5g tan30°"],a:1,e:"The along-incline component is mg sin θ."},
{u:2,q:"A car rounds a flat curve. The centripetal force is supplied by",c:["the normal force","friction between tires and road","gravity","the engine"],a:1,e:"On a flat curve, only friction points toward the center."},
{u:2,q:"If the distance between two masses doubles, the gravitational force becomes",c:["half","one quarter","double","four times"],a:1,e:"Force follows an inverse-square law."},
{u:3,q:"A 2 kg object is lifted 3 m at constant speed. The work done against gravity is about",c:["6 J","19.6 J","58.8 J","0 J"],a:2,e:"W = mgh = 2(9.8)(3) ≈ 58.8 J."},
{u:3,q:"Doubling a car's speed changes its stopping distance by a factor of about",c:["2","3","4","1"],a:2,e:"Kinetic energy scales with v², and constant braking force means distance scales with KE."},
{u:4,q:"An airbag reduces injury mainly because it",c:["reduces the change in momentum","increases the collision time, lowering the force","absorbs all the momentum","adds an external force"],a:1,e:"Δp is fixed by the crash; spreading it over a longer time lowers the average force."},
{u:4,q:"Two carts stick together after colliding. This collision is",c:["elastic","perfectly inelastic","frictionless","explosive"],a:1,e:"Sticking together with a common final velocity defines a perfectly inelastic collision."},
{u:5,q:"To maximize torque on a wrench you should",c:["push toward the bolt","push perpendicular to the handle as far from the bolt as possible","push along the handle","use a shorter handle"],a:1,e:"τ = rF sin θ is largest when r is large and the force is perpendicular."},
{u:6,q:"A skater pulls in her arms while spinning. Her angular momentum and angular velocity",c:["both increase","L stays constant, ω increases","both stay constant","L increases, ω decreases"],a:1,e:"With no external torque, L = Iω is constant, so reducing I increases ω."},
{u:7,q:"Doubling the amplitude of an ideal spring oscillator changes the period by",c:["a factor of 2","a factor of √2","no change","a factor of 4"],a:2,e:"T = 2π√(m/k) is independent of amplitude."},
{u:7,q:"A pendulum is taken to the Moon. Its period",c:["decreases","increases","is unchanged","becomes zero"],a:1,e:"T = 2π√(L/g); smaller g gives a longer period."},
{u:8,q:"An object floats with 60% of its volume submerged. Its density relative to the fluid is",c:["0.4","0.6","1.0","1.67"],a:1,e:"Fraction submerged equals the density ratio, so ρ_object = 0.6ρ_fluid."},
{u:8,q:"Water flows from a wide pipe into a narrow one. In the narrow section the speed and pressure",c:["both increase","speed increases, pressure decreases","both decrease","speed decreases, pressure increases"],a:1,e:"Continuity raises the speed; Bernoulli then requires lower pressure."}
]

units:[
{title:"Thermodynamics",weight:[15,18],
 desc:"Kinetic theory, the ideal gas law, PV diagrams, and the laws of thermodynamics.",
 notes:[
  {h:"Kinetic theory and temperature",b:[
   "Temperature measures the **average translational kinetic energy** of particles: `KE_avg = (3/2)k_BT`. It does not depend on the gas's identity.",
   "At the same temperature, lighter molecules move faster: `v_rms = √(3k_BT/m)`.",
   "Pressure arises from particle collisions with the walls; more frequent or more forceful collisions raise pressure.",
   "`PV = nRT = Nk_BT`. Maxwell-Boltzmann distributions broaden and shift right as temperature rises."]},
  {h:"Heat transfer and the first law",b:[
   "Conduction needs contact, convection needs bulk fluid motion, radiation needs no medium.",
   "`ΔU = Q + W`, with W the work done **on** the gas. Compressing a gas does positive work on it.",
   "Internal energy of an ideal monatomic gas depends only on temperature: `U = (3/2)nRT`.",
   "Thermal equilibrium: energy flows from hot to cold until temperatures match. `q = mcΔT` still applies."]},
  {h:"PV diagrams and processes",b:[
   "**Area under a PV curve is the magnitude of the work.** Moving right (expansion) means the gas does work on its surroundings.",
   "Isobaric (constant P), isochoric (constant V, no work), isothermal (constant T, ΔU = 0), adiabatic (Q = 0).",
   "A closed cycle returns to the same state, so ΔU = 0 over the cycle and the enclosed area is the net work.",
   "Label the direction of a cycle: clockwise is a heat engine producing net work."]},
  {h:"Second law and efficiency",b:[
   "Entropy of an isolated system never decreases; heat spontaneously flows hot to cold.",
   "Heat engine efficiency `e = W_net/Q_H`, always less than 1. The **Carnot limit** is `e = 1 − T_C/T_H` with absolute temperatures.",
   "No engine can convert all absorbed heat into work; some must be rejected to a cold reservoir.",
   "Irreversible processes (friction, free expansion, mixing) increase total entropy."]}],
 tip:"When a PV problem asks for work, check the direction along the path. Expansion means the gas does work and W on the gas is negative.",
 terms:["kinetic theory","rms speed","ideal gas law","first law of thermodynamics","isothermal","adiabatic","PV diagram","entropy","Carnot efficiency"],
 cards:[
 ["What does temperature measure microscopically?","The average translational kinetic energy of the particles."],
 ["Average kinetic energy per particle at temperature T","(3/2)k_BT"],
 ["Why do lighter gas molecules move faster at the same temperature?","Equal average kinetic energy with smaller mass requires greater speed: v_rms = √(3k_BT/m)."],
 ["First law of thermodynamics","ΔU = Q + W, where W is the work done on the system."],
 ["What does the area under a PV curve represent?","The magnitude of the work done during the process."],
 ["In an isothermal process for an ideal gas, what is ΔU?","Zero, since internal energy depends only on temperature."],
 ["In an adiabatic process, what is Q?","Zero — no heat is exchanged with the surroundings."],
 ["Net work over a complete cycle on a PV diagram","The enclosed area; ΔU for the cycle is zero."],
 ["Maximum possible efficiency of a heat engine","e = 1 − T_C/T_H with temperatures in kelvin."],
 ["Why can't a heat engine be 100% efficient?","The second law requires some heat to be rejected to a colder reservoir."]]},
{title:"Electric Force, Field, and Potential",weight:[15,18],
 desc:"Charge, Coulomb's law, fields, and potential.",
 notes:[
  {h:"Charge and conductors",b:[
   "Charge is **conserved** and **quantized** (multiples of e = 1.6 × 10⁻¹⁹ C). Like charges repel, unlike attract.",
   "Charging by friction transfers electrons; by **conduction** requires contact; by **induction** works at a distance and can be made permanent by grounding.",
   "In a conductor, excess charge moves to the outer surface and the interior field is zero in electrostatic equilibrium.",
   "A **polarized** insulator has shifted charge within molecules but no net charge — which is why a charged rod attracts neutral paper."]},
  {h:"Coulomb's law and fields",b:[
   "`F = kq₁q₂/r²` with k = 8.99 × 10⁹ N·m²/C². Forces from multiple charges add as **vectors**.",
   "`E = F/q` defines the field as force per unit positive charge; from a point charge `E = kQ/r²`.",
   "Field lines start on positive and end on negative charge; closer lines mean a stronger field, and they never cross.",
   "Between parallel plates the field is uniform: `E = V/d`, pointing from the positive toward the negative plate."]},
  {h:"Potential and potential energy",b:[
   "Electric potential `V = kQ/r` is a **scalar** — add potentials arithmetically with their signs.",
   "`ΔU = qΔV`. A positive charge released from rest moves toward lower potential; a negative charge moves toward higher potential.",
   "Equipotential surfaces are perpendicular to field lines; no work is needed to move along one.",
   "Electric field points from high to low potential and equals the negative rate of change of V with distance."]},
  {h:"Capacitors",b:[
   "`C = Q/V = ε₀A/d` for parallel plates: larger area or smaller separation stores more charge per volt.",
   "A **dielectric** increases capacitance by reducing the field for the same charge.",
   "`U = ½CV² = ½QV = Q²/(2C)`.",
   "Capacitors in **parallel add** (C_eq = ΣC); in **series** reciprocals add — the opposite of resistors."]}],
 tip:"Fields and forces are vectors; potentials and energies are scalars. Choose the scalar route whenever the question allows it.",
 terms:["quantized charge","induction","polarization","Coulomb's law","electric field","field lines","electric potential","equipotential","capacitance","dielectric"],
 cards:[
 ["Coulomb's law","F = kq₁q₂/r² with k = 8.99 × 10⁹ N·m²/C²"],
 ["Electric field of a point charge","E = kQ/r², directed away from positive charge."],
 ["Field between parallel plates","Uniform, with magnitude E = V/d."],
 ["Is electric potential a scalar or a vector?","A scalar — potentials from several charges add algebraically."],
 ["Electric potential energy of a charge at potential V","U = qV, so ΔU = qΔV."],
 ["Why is the field zero inside a conductor in equilibrium?","Charges rearrange on the surface until the interior field cancels."],
 ["What is charging by induction?","Rearranging charge in a neutral object using a nearby charge, then grounding to make the imbalance permanent."],
 ["Capacitance of parallel plates","C = ε₀A/d"],
 ["Energy stored in a capacitor","U = ½CV² = ½QV = Q²/2C"],
 ["Do capacitors add directly in series or in parallel?","In parallel. In series, reciprocals add."]]},
{title:"Electric Circuits",weight:[15,18],
 desc:"Current, resistance, Kirchhoff's rules, power, and RC behavior.",
 notes:[
  {h:"Current, resistance, and power",b:[
   "`I = ΔQ/Δt`, measured in amperes. Conventional current flows from + to − outside the battery.",
   "`V = IR`. Resistance `R = ρL/A`: longer wires resist more, thicker wires less.",
   "`P = IV = I²R = V²/R`. A larger resistor in **series** dissipates more power; in **parallel** the smaller one does.",
   "Real batteries have **internal resistance**, so terminal voltage drops as current increases."]},
  {h:"Series and parallel",b:[
   "**Series**: one path, same current through all elements, resistances add, voltages add to the source.",
   "**Parallel**: multiple paths, same voltage across each branch, reciprocals of resistance add, currents add.",
   "Adding a resistor in parallel **lowers** total resistance and increases total current.",
   "Analyze by collapsing the network to one equivalent resistance, find the total current, then expand back step by step."]},
  {h:"Kirchhoff's rules",b:[
   "**Junction rule** (charge conservation): current in equals current out.",
   "**Loop rule** (energy conservation): the sum of potential changes around any closed loop is zero.",
   "Assign a current direction, be consistent with signs (drop across a resistor in the direction of current), and accept a negative answer as 'opposite to assumed'.",
   "An **ammeter** goes in series and ideally has zero resistance; a **voltmeter** goes in parallel and ideally has infinite resistance."]},
  {h:"Capacitors in circuits",b:[
   "Immediately after a switch closes, an uncharged capacitor behaves like a **wire** (zero voltage, maximum current).",
   "After a long time, a fully charged capacitor behaves like a **break** (no current through that branch).",
   "These two limits answer most RC questions without solving an exponential.",
   "The time constant `τ = RC` sets how quickly the transition happens."]}],
 tip:"For any 'just after' / 'long after' circuit question, replace each capacitor with a wire or a gap respectively. That converts it into a simple resistor problem.",
 terms:["current","resistivity","Ohm's law","series","parallel","junction rule","loop rule","internal resistance","time constant"],
 cards:[
 ["Ohm's law and the three power expressions","V = IR; P = IV = I²R = V²/R"],
 ["How does resistance depend on length and cross-sectional area?","R = ρL/A — proportional to length, inversely proportional to area."],
 ["What is the same for all elements in series?","The current."],
 ["What is the same for all branches in parallel?","The voltage across them."],
 ["Effect of adding a resistor in parallel on total resistance","It decreases the equivalent resistance."],
 ["Kirchhoff's junction rule","The total current entering a junction equals the total current leaving it."],
 ["Kirchhoff's loop rule","The algebraic sum of potential differences around any closed loop is zero."],
 ["How does an uncharged capacitor behave the instant a switch closes?","Like a wire — zero voltage across it and maximum current through that branch."],
 ["How does a fully charged capacitor behave in a steady-state DC circuit?","Like a break — no current flows through it."],
 ["How are ideal ammeters and voltmeters connected?","Ammeter in series with zero resistance; voltmeter in parallel with infinite resistance."]]},
{title:"Magnetism and Electromagnetism",weight:[12,15],
 desc:"Magnetic fields, forces on charges and currents, and induction.",
 notes:[
  {h:"Magnetic fields and forces",b:[
   "Magnetic fields come from **moving charges**; there are no magnetic monopoles, so field lines form closed loops.",
   "`F = qvB sin θ` — the force is **perpendicular** to both v and B, given by the right-hand rule (reverse it for negative charges).",
   "Because the force is always perpendicular to velocity, a magnetic field does **no work** and changes direction, not speed. A charge moving perpendicular to a uniform field travels in a circle: `qvB = mv²/r`.",
   "A charge moving parallel to B feels no force."]},
  {h:"Currents and fields",b:[
   "A straight wire produces `B = μ₀I/(2πr)` in circles around it; curl your right hand with the thumb along the current.",
   "Force on a current-carrying wire: `F = BIL sin θ`. Parallel currents in the same direction attract; opposite currents repel.",
   "Solenoids produce a nearly uniform interior field; loops behave like small bar magnets.",
   "Ferromagnetic materials have aligned domains; heating or hammering randomizes them."]},
  {h:"Electromagnetic induction",b:[
   "**Magnetic flux** `Φ = BA cos θ`. Flux changes when B changes, the area changes, or the orientation changes.",
   "**Faraday's law**: `ε = −ΔΦ/Δt`. A faster change induces a larger emf.",
   "**Lenz's law**: the induced current opposes the change in flux. A magnet falling through a coil is slowed because the induced current opposes its approach and departure.",
   "Applications: generators convert rotation into alternating emf; transformers change voltage using flux shared between coils; a sliding rod in a field gives `ε = BLv`."]}],
 tip:"Lenz's law answers direction questions: ask what the flux is doing, then say the induced current opposes it. Name the direction of the induced field first.",
 terms:["magnetic field","right-hand rule","magnetic force","solenoid","magnetic flux","Faraday's law","Lenz's law","generator","transformer"],
 cards:[
 ["Magnetic force on a moving charge","F = qvB sin θ, perpendicular to both v and B."],
 ["Why does a magnetic field do no work on a moving charge?","The force is always perpendicular to the velocity, so it changes direction but not speed."],
 ["Radius of a charged particle's circular path in a uniform field","From qvB = mv²/r, r = mv/(qB)."],
 ["Magnetic field around a long straight wire","B = μ₀I/(2πr), circling the wire."],
 ["Do parallel currents in the same direction attract or repel?","Attract."],
 ["Magnetic flux definition","Φ = BA cos θ, where θ is between B and the area's normal."],
 ["Faraday's law of induction","ε = −ΔΦ/Δt — an emf is induced by a changing magnetic flux."],
 ["State Lenz's law","The induced current flows so as to oppose the change in magnetic flux that produced it."],
 ["emf of a rod of length L sliding at speed v through field B","ε = BLv"],
 ["Force on a current-carrying wire in a magnetic field","F = BIL sin θ"]]},
{title:"Geometric Optics",weight:[12,15],
 desc:"Reflection, refraction, mirrors, and lenses.",
 notes:[
  {h:"Reflection and refraction",b:[
   "Law of reflection: angle of incidence equals angle of reflection, measured from the **normal**.",
   "**Snell's law** `n₁sinθ₁ = n₂sinθ₂`, where `n = c/v`. Light slows and bends toward the normal entering a denser medium.",
   "Frequency is unchanged on refraction; wavelength and speed both change.",
   "**Total internal reflection** occurs going from denser to less dense beyond the critical angle `sin θ_c = n₂/n₁` — the basis of fiber optics."]},
  {h:"Mirrors and lenses",b:[
   "`1/f = 1/d_o + 1/d_i` and `m = −d_i/d_o = h_i/h_o`.",
   "Sign conventions: converging (concave mirror, convex lens) has **positive f**; diverging (convex mirror, concave lens) has negative f. Positive d_i means a **real** image on the same side as outgoing light; negative d_i means a **virtual** image.",
   "Negative magnification means inverted; |m| > 1 means enlarged.",
   "A diverging lens or convex mirror always produces a virtual, upright, reduced image — a useful check."]},
  {h:"Ray diagrams",b:[
   "For a lens: one ray parallel to the axis bends through the focal point; one ray through the center continues straight; one through the near focal point emerges parallel.",
   "For a mirror: a ray parallel to the axis reflects through the focus; a ray through the focus reflects parallel; a ray to the vertex reflects symmetrically.",
   "Where the rays converge is the image. If they diverge, extend backwards to locate a virtual image.",
   "Draw to scale and label f, d_o, and d_i — rubrics award the diagram."]}],
 tip:"Do the sign conventions once, carefully, then let the equation tell you whether the image is real or virtual. Do not decide first and force the algebra.",
 terms:["index of refraction","Snell's law","total internal reflection","critical angle","focal length","real image","virtual image","magnification"],
 cards:[
 ["Snell's law","n₁ sin θ₁ = n₂ sin θ₂"],
 ["Index of refraction definition","n = c/v, the ratio of light's speed in vacuum to its speed in the medium."],
 ["What happens to frequency and wavelength during refraction?","Frequency is unchanged; wavelength and speed change."],
 ["Condition for total internal reflection","Light travels from a denser to a less dense medium at an angle beyond the critical angle, sin θ_c = n₂/n₁."],
 ["Thin lens / mirror equation","1/f = 1/d_o + 1/d_i"],
 ["Magnification formula","m = −d_i/d_o = h_i/h_o"],
 ["What does a negative image distance mean?","The image is virtual."],
 ["What does a negative magnification mean?","The image is inverted."],
 ["What kind of image does a diverging lens always form?","Virtual, upright, and reduced."]]},
{title:"Waves, Sound, and Physical Optics",weight:[12,15],
 desc:"Wave behavior, superposition, standing waves, and interference.",
 notes:[
  {h:"Wave properties",b:[
   "`v = fλ`. Wave speed is set by the **medium**; frequency is set by the source. Entering a new medium changes λ, not f.",
   "Transverse waves oscillate perpendicular to travel (light, waves on a string); longitudinal waves oscillate along it (sound).",
   "Intensity falls as 1/r² for a spherical wave. The **Doppler effect** raises observed frequency for approach and lowers it for recession."]},
  {h:"Superposition and standing waves",b:[
   "Overlapping waves add displacement by **superposition**: constructive where in phase, destructive where out of phase.",
   "**Standing waves** form from reflection and interference, with fixed nodes and antinodes.",
   "String or pipe open at both ends: `L = nλ/2`, so `f_n = nv/2L`. A pipe closed at one end: `L = nλ/4` with odd n only, so its fundamental is half that of an open pipe of the same length.",
   "**Beats** occur when two close frequencies interfere: `f_beat = |f₁ − f₂|`."]},
  {h:"Interference and diffraction",b:[
   "**Double slit**: constructive interference at `d sin θ = mλ`. Smaller slit spacing or longer wavelength spreads the pattern.",
   "Diffraction spreads waves through an opening; the effect is pronounced when the opening is comparable to the wavelength.",
   "Thin-film interference depends on path difference and on phase inversion at a reflection into a denser medium.",
   "Interference patterns are direct evidence of the **wave nature** of light."]}],
 tip:"Standing-wave questions come down to fitting half or quarter wavelengths into the length. Sketch the pattern before reaching for a formula.",
 terms:["wave speed","transverse","longitudinal","Doppler effect","superposition","standing wave","node","antinode","beats","double-slit interference","diffraction"],
 cards:[
 ["Wave equation relating speed, frequency, wavelength","v = fλ"],
 ["When a wave enters a new medium, what stays the same?","Frequency. Speed and wavelength change."],
 ["Transverse vs longitudinal wave","Transverse oscillates perpendicular to propagation; longitudinal oscillates parallel to it."],
 ["Harmonic frequencies of a string fixed at both ends","f_n = nv/2L"],
 ["Why is the fundamental of a closed pipe half that of an open pipe of equal length?","A closed pipe fits only a quarter wavelength in its fundamental rather than a half."],
 ["Beat frequency formula","f_beat = |f₁ − f₂|"],
 ["Double-slit condition for constructive interference","d sin θ = mλ"],
 ["What does an interference pattern demonstrate about light?","That light behaves as a wave."],
 ["Doppler effect for an approaching source","The observed frequency is higher than the emitted frequency."]]},
{title:"Modern Physics",weight:[12,15],
 desc:"Quantization, the photoelectric effect, wave-particle duality, and the nucleus.",
 notes:[
  {h:"Photons and the photoelectric effect",b:[
   "Light is quantized into **photons** of energy `E = hf = hc/λ`.",
   "**Photoelectric effect**: electrons are emitted only above a **threshold frequency**, regardless of intensity. `KE_max = hf − φ`, where φ is the work function.",
   "Increasing intensity increases the **number** of electrons, not their maximum kinetic energy. Increasing frequency raises the kinetic energy.",
   "A graph of KE_max versus f is a straight line with slope h and intercept −φ — the classic experimental question."]},
  {h:"Atomic spectra and duality",b:[
   "Electrons occupy **discrete energy levels**; a photon is absorbed or emitted when an electron changes level, with `E_photon = ΔE`.",
   "Emission spectra are bright lines on dark; absorption spectra are dark lines on a continuous background. Both are fingerprints of the element.",
   "**de Broglie**: matter has a wavelength `λ = h/p`, confirmed by electron diffraction. Wave and particle descriptions are complementary.",
   "Energy and momentum quantization explain why classical physics fails at atomic scales."]},
  {h:"Nuclear physics",b:[
   "Notation `ᴬ_Z X`: A is the mass number, Z the atomic number. Isotopes differ in neutron count.",
   "Radioactive decay: **alpha** (emits a helium nucleus), **beta-minus** (a neutron becomes a proton, emitting an electron), **gamma** (a photon, no change in A or Z). Nucleon number and charge are conserved in every nuclear equation.",
   "**Mass defect** and binding energy: `E = mc²` accounts for the missing mass that holds the nucleus together.",
   "**Half-life** is the time for half of a sample to decay; after n half-lives, `(1/2)ⁿ` remains.",
   "Fission splits a heavy nucleus; fusion joins light nuclei. Both release energy because the products are more tightly bound."]}],
 tip:"For photoelectric questions, separate what intensity controls (number of electrons) from what frequency controls (their energy). Most distractors confuse the two.",
 terms:["photon","photoelectric effect","work function","threshold frequency","energy level","emission spectrum","de Broglie wavelength","mass defect","binding energy","half-life","fission","fusion"],
 cards:[
 ["Energy of a photon","E = hf = hc/λ"],
 ["Photoelectric equation","KE_max = hf − φ, where φ is the work function."],
 ["Effect of increasing light intensity in the photoelectric effect","More electrons are emitted, but their maximum kinetic energy is unchanged."],
 ["Effect of increasing light frequency above threshold","The maximum kinetic energy of emitted electrons increases."],
 ["Slope and intercept of a KE_max versus frequency graph","Slope is Planck's constant h; the vertical intercept is −φ."],
 ["de Broglie wavelength","λ = h/p"],
 ["Why are atomic spectra discrete lines?","Electrons can only occupy specific energy levels, so only photons matching the level differences are emitted or absorbed."],
 ["What changes in alpha decay?","A decreases by 4 and Z decreases by 2."],
 ["What changes in beta-minus decay?","Z increases by 1 while A stays the same; an electron and antineutrino are emitted."],
 ["What fraction remains after 3 half-lives?","One eighth."],
 ["Where does the energy released in fission and fusion come from?","Mass defect — the products are more tightly bound, and the missing mass appears as energy via E = mc²."]]}
],

units:[
{title:"Kinematics",weight:[10,15],sameAs:["phys1",1],
 add:[{h:"Calculus in kinematics",b:[
  "`v = dx/dt` and `a = dv/dt`; going the other way, `Δx = ∫v dt` and `Δv = ∫a dt`. Constant-acceleration formulas are just the special case.",
  "When a is given as a function of **time**, integrate directly. When a is a function of **position**, use `a dx = v dv` to separate variables.",
  "Non-uniform acceleration problems are standard on Physics C: expect to integrate a polynomial and apply an initial condition.",
  "Differentiating a position function twice answers most 'describe the motion' questions instantly."]}],
 addCards:[["Relationship between a, v, and x using calculus","v = dx/dt and a = dv/dt; conversely Δx = ∫v dt and Δv = ∫a dt."],["Which substitution handles acceleration given as a function of position?","a dx = v dv, which separates into integrable pieces."],["How do you get velocity from a(t)?","Integrate a with respect to time and apply the initial velocity as the constant."]]},
{title:"Force and Translational Dynamics",weight:[14,20],sameAs:["phys1",2],
 add:[{h:"Calculus-based dynamics",b:[
  "`ΣF = dp/dt` is the general second law; it reduces to ma only when mass is constant.",
  "**Velocity-dependent drag**: `m dv/dt = mg − bv`. At **terminal velocity** the acceleration is zero, so `v_t = mg/b`. The approach to terminal velocity is exponential.",
  "Set up Newton's second law as a differential equation, separate variables, and integrate with the initial condition.",
  "Gravitation: `U = −GMm/r` (zero at infinity), and escape speed comes from setting total energy to zero: `v = √(2GM/r)`.",
  "Kepler's third law follows from equating gravitation to the centripetal requirement: `T² = 4π²r³/(GM)`."]}],
 addCards:[["General form of Newton's second law","ΣF = dp/dt, which reduces to ma only for constant mass."],["Terminal velocity with linear drag F = bv","v_t = mg/b, where acceleration has fallen to zero."],["Gravitational potential energy in general form","U = −GMm/r, taking U = 0 at infinite separation."],["Escape speed from a body of mass M at radius r","v = √(2GM/r)"],["Kepler's third law in derived form","T² = 4π²r³/(GM)"]]},
{title:"Work, Energy, and Power",weight:[15,25],sameAs:["phys1",3],
 add:[{h:"Variable forces and potential energy functions",b:[
  "`W = ∫F·dx` handles any variable force; the spring result ½kx² is just this integral.",
  "`F = −dU/dx`: force is the negative slope of the potential energy curve. This is how Physics C asks energy questions.",
  "On a U(x) graph, equilibrium is where the slope is zero; it is **stable** in a well (U is a minimum) and **unstable** at a peak.",
  "**Turning points** occur where total energy equals U(x); the allowed region is where E ≥ U.",
  "Power is `P = dW/dt = F·v`, and work can be recovered by integrating power over time."]}],
 addCards:[["Work by a variable force","W = ∫F·dx — the area under the force-position curve."],["Relationship between force and potential energy","F = −dU/dx, the negative slope of the potential energy curve."],["How do you identify stable equilibrium on a U(x) graph?","At a minimum of U, where the slope is zero and curvature is positive."],["What are turning points on a U(x) graph?","Positions where total energy equals U(x), so kinetic energy is zero."],["Power in calculus form","P = dW/dt = F·v"]]},
{title:"Linear Momentum",weight:[10,20],sameAs:["phys1",4],
 add:[{h:"Impulse and center of mass with calculus",b:[
  "`J = ∫F dt` — the integral of a time-varying force, equal to Δp.",
  "Center of mass: `x_cm = (Σmᵢxᵢ)/M` for particles, or `x_cm = (1/M)∫x dm` for a continuous body.",
  "The center of mass accelerates according to the **net external force only**: `ΣF_ext = Ma_cm`.",
  "For a system with changing mass (a rocket, a falling chain), return to `ΣF = dp/dt` rather than ma."]}],
 addCards:[["Impulse for a time-varying force","J = ∫F dt = Δp"],["Center of mass of a continuous body","x_cm = (1/M)∫x dm"],["What governs the acceleration of a system's center of mass?","Only the net external force: ΣF_ext = Ma_cm."]]},
{title:"Torque and Rotational Dynamics",weight:[10,15],sameAs:["phys1",5],
 add:[{h:"Rotational inertia by integration",b:[
  "`I = ∫r²dm` for a continuous body. Set up dm in terms of a linear, area, or volume density and integrate over the geometry.",
  "**Parallel axis theorem**: `I = I_cm + Md²` shifts a known rotational inertia to a parallel axis a distance d away.",
  "Memorize the standard results (disk ½MR², hoop MR², solid sphere ⅖MR², rod about end ⅓ML²) — derivations appear but the values save time.",
  "Rolling without slipping: friction provides the torque, does no work, and the acceleration down an incline is `a = g sin θ/(1 + I_cm/MR²)`."]}],
 addCards:[["Rotational inertia by integration","I = ∫r²dm"],["Parallel axis theorem","I = I_cm + Md², where d is the distance between the parallel axes."],["Rotational inertia of a solid disk about its central axis","½MR²"],["Rotational inertia of a solid sphere about a diameter","⅖MR²"],["Rotational inertia of a uniform rod about one end","⅓ML²"],["Acceleration of a rolling object down an incline","a = g sin θ / (1 + I_cm/MR²)"]]},
{title:"Energy and Momentum of Rotating Systems",weight:[5,15],sameAs:["phys1",6],
 add:[{h:"Angular momentum as a rate law",b:[
  "`τ = dL/dt` — the rotational analogue of ΣF = dp/dt. Zero net torque means constant L.",
  "Angular momentum of a point particle about an origin: `L = r × p`, magnitude `rmv sin θ`. A particle moving in a straight line still has angular momentum about an off-axis point.",
  "Collisions involving rotation (a ball striking a pivoted rod) conserve angular momentum about the pivot even though linear momentum is not conserved there.",

units:[
{title:"Electric Force, Field, and Potential",weight:[18,22],
 desc:"Coulomb's law, continuous charge distributions, Gauss's law, and potential.",
 notes:[
  {h:"Charge and Coulomb's law",b:[
   "`F = (1/4πε₀)q₁q₂/r²`; superpose forces as vectors. ε₀ = 8.85 × 10⁻¹² C²/(N·m²).",
   "For continuous distributions, break the object into dq, write dE, and integrate — exploiting symmetry to cancel components.",
   "Standard results worth knowing: an infinite line gives `E = λ/(2πε₀r)`; an infinite sheet gives `E = σ/(2ε₀)`, independent of distance; a ring on its axis gives `E = kQx/(x²+R²)^{3/2}`."]},
  {h:"Gauss's law",b:[
   "`∮E·dA = Q_enclosed/ε₀`. It is exact always but **useful** only with spherical, cylindrical, or planar symmetry.",
   "Strategy: pick a Gaussian surface matching the symmetry so E is constant and either parallel or perpendicular to dA, then solve for E.",
   "Inside a uniformly charged **insulating** sphere, E grows linearly with r; outside, it falls as 1/r² as if all charge were at the center.",
   "Inside a **conductor** in electrostatic equilibrium, E = 0 and all excess charge sits on the surface. A cavity inside a conductor is shielded.",
   "Field just outside a conductor's surface is `σ/ε₀` and perpendicular to the surface."]},
  {h:"Potential",b:[
   "`ΔV = −∫E·dr`, and conversely `E_x = −dV/dx`. Potential is a scalar, so summing over charges is easier than summing fields.",
   "For a point charge `V = kQ/r`, taking V = 0 at infinity. Inside a conductor V is **constant** (an equipotential volume).",
   "Work done by an external agent moving charge q between two points is `qΔV`; along an equipotential it is zero.",
   "Energy stored in assembling a charge distribution is the sum of pairwise qᵢqⱼ/(4πε₀rᵢⱼ) terms."]}],
 tip:"Gauss's law problems follow a fixed script: state the symmetry, name the surface, evaluate the flux, set it equal to Q_enc/ε₀, solve. Write the script and the points follow.",
 terms:["Coulomb's law","charge distribution","Gauss's law","Gaussian surface","conductor shielding","electric potential","equipotential"],
 cards:[
 ["Gauss's law","∮E·dA = Q_enclosed/ε₀"],
 ["When is Gauss's law practically useful?","When the charge distribution has spherical, cylindrical, or planar symmetry."],
 ["Field of an infinite charged sheet","E = σ/(2ε₀), independent of distance."],
 ["Field of an infinite line of charge","E = λ/(2πε₀r)"],
 ["Field inside a uniformly charged insulating sphere","It increases linearly with r: E = ρr/(3ε₀)."],
 ["Field inside a conductor in electrostatic equilibrium","Zero, with all excess charge on the outer surface."],
 ["Relationship between E and V","ΔV = −∫E·dr, and E_x = −dV/dx."],
 ["Potential inside a charged conductor","Constant throughout — the conductor is an equipotential volume."],
 ["Field just outside a conductor's surface","σ/ε₀, perpendicular to the surface."]]},
{title:"Conductors and Capacitors",weight:[12,17],
 desc:"Capacitance from geometry, dielectrics, and stored energy.",
 notes:[
  {h:"Capacitance from geometry",b:[
   "`C = Q/V`. Derive C by assuming charge Q, finding E with Gauss's law, integrating for V, then dividing.",
   "Parallel plates: `C = ε₀A/d`. Cylindrical and spherical capacitors come out of the same procedure with a logarithm or a difference of reciprocals.",
   "C depends only on geometry and the material between the conductors — not on the charge placed on it."]},
  {h:"Dielectrics and energy",b:[
   "A dielectric of constant κ multiplies capacitance by κ by reducing the internal field through polarization.",
   "With the battery **connected** (constant V), inserting a dielectric increases Q and stored energy. **Disconnected** (constant Q), it lowers V and the stored energy.",
   "`U = ½CV² = ½QV = Q²/(2C)`. Energy density in a field is `u = ½ε₀E²`.",
   "Combinations: parallel capacitors add; series capacitors add reciprocally. Series capacitors carry the **same charge**."]}],
 tip:"Before answering a dielectric question, decide whether Q or V is held constant. That single choice determines every other answer.",
 terms:["capacitance","dielectric constant","polarization","energy density","series and parallel capacitors"],
 cards:[
 ["General procedure for finding capacitance","Assume charge Q, find E with Gauss's law, integrate E to get V, then C = Q/V."],
 ["Capacitance of parallel plates with a dielectric","C = κε₀A/d"],
 ["Inserting a dielectric with the battery connected: what happens?","V is fixed, C increases, so Q and stored energy increase."],
 ["Inserting a dielectric after disconnecting the battery: what happens?","Q is fixed, C increases, so V and stored energy decrease."],
 ["Energy stored in a capacitor (three forms)","U = ½CV² = ½QV = Q²/(2C)"],
 ["Electric field energy density","u = ½ε₀E²"],
 ["What do series capacitors share?","The same charge on each."]]},
{title:"Electric Circuits",weight:[17,23],
 desc:"Resistive circuits, Kirchhoff's rules, and RC transients.",
 notes:[
  {h:"Resistive circuits",b:[
   "`I = dQ/dt`; `V = IR`; `R = ρL/A`. Power `P = IV = I²R = V²/R`.",
   "Series resistors add; parallel resistors add reciprocally. Reduce, find total current, then expand.",
   "**Kirchhoff's rules**: junction (charge conservation) and loop (energy conservation). Write one loop equation per independent loop.",
   "Real batteries: `V_terminal = ε − Ir`, so terminal voltage falls as current rises. Maximum power transfer occurs when load resistance equals internal resistance."]},
  {h:"RC circuits",b:[
   "Charging: `q(t) = Cε(1 − e^{−t/RC})` and `I(t) = (ε/R)e^{−t/RC}`. Discharging: `q = q₀e^{−t/RC}`.",
   "Time constant `τ = RC`: after one τ the capacitor reaches about 63% of its final charge.",
   "**Limits do most of the work**: at t = 0 an uncharged capacitor is a short circuit; as t → ∞ it is an open circuit.",
   "Energy accounting while charging: the battery supplies Qε, the capacitor stores ½Qε, and the resistor dissipates the other half."]},
  {h:"Inductors in circuits",b:[
   "`ε = −L dI/dt`: an inductor opposes **changes** in current. `U = ½LI²`.",
   "At t = 0 an inductor acts like an open circuit (no current yet); after a long time it behaves like a plain wire.",
   "**RL circuit**: `I(t) = (ε/R)(1 − e^{−Rt/L})` with time constant `L/R`. Note this is the reverse of the capacitor's limiting behavior.",
   "LC circuits oscillate with `ω = 1/√(LC)`, exchanging energy between the capacitor and the inductor."]}],
 tip:"Memorize the four limiting behaviors: capacitor at t=0 is a wire, at t=∞ is a gap; inductor at t=0 is a gap, at t=∞ is a wire.",
 terms:["Kirchhoff's rules","internal resistance","time constant","RC circuit","inductance","RL circuit","LC oscillation"],
 cards:[
 ["Charge on a charging capacitor as a function of time","q(t) = Cε(1 − e^{−t/RC})"],
 ["Time constant of an RC circuit and what happens after one τ","τ = RC; the capacitor reaches about 63% of its final charge."],
 ["How does a capacitor behave at t = 0 and at t = ∞?","At t = 0 like a wire; at t = ∞ like an open circuit."],
 ["How does an inductor behave at t = 0 and at t = ∞?","At t = 0 like an open circuit; at t = ∞ like a plain wire."],
 ["Induced emf across an inductor","ε = −L dI/dt"],
 ["Energy stored in an inductor","U = ½LI²"],
 ["Time constant of an RL circuit","τ = L/R"],
 ["Angular frequency of an LC oscillator","ω = 1/√(LC)"],
 ["Terminal voltage of a real battery","V = ε − Ir, where r is the internal resistance."],
 ["Fraction of battery energy stored in a capacitor while charging through a resistor","Half; the resistor dissipates the other half."]]},
{title:"Magnetic Fields and Electromagnetism",weight:[17,23],
 desc:"Forces on charges and currents, Biot-Savart, and Ampère's law.",
 notes:[
  {h:"Magnetic force",b:[
   "`F = qv × B` — perpendicular to both, so it does **no work**. Magnitude `qvB sin θ`.",
   "A charge perpendicular to a uniform field moves in a circle of radius `r = mv/(qB)` with period `T = 2πm/(qB)`, independent of speed — the cyclotron principle.",
   "A **velocity selector** balances electric and magnetic forces: `v = E/B`.",
   "Force on a current: `F = ∫I dl × B`, reducing to BIL sin θ for a straight segment in a uniform field. Net force on a closed loop in a uniform field is zero, but the **torque** is `τ = μ × B` with `μ = NIA`."]},
  {h:"Sources of magnetic field",b:[
   "**Biot-Savart**: `dB = (μ₀/4π)(I dl × r̂)/r²`. Integrate for loops and finite segments; a circular loop gives `B = μ₀I/(2R)` at its center.",
   "**Ampère's law**: `∮B·dl = μ₀I_enclosed`. Use it with symmetry exactly as you use Gauss's law.",
   "Long straight wire: `B = μ₀I/(2πr)`. Inside a uniform current-carrying wire, B grows linearly with r.",
   "Solenoid: `B = μ₀nI` inside, approximately uniform, and nearly zero outside. Toroid: `B = μ₀NI/(2πr)`.",
   "Parallel currents attract; antiparallel repel. The force per length between two wires is `μ₀I₁I₂/(2πd)`."]}],
 tip:"Ampère's law and Gauss's law share one script: identify symmetry, choose the loop or surface, evaluate the integral, set it equal to the enclosed source.",
 terms:["magnetic force","cyclotron radius","velocity selector","magnetic dipole moment","Biot-Savart law","Ampère's law","solenoid","toroid"],
 cards:[
 ["Magnetic force on a moving charge in vector form","F = qv × B, always perpendicular to v and B."],
 ["Radius and period of circular motion in a uniform magnetic field","r = mv/(qB); T = 2πm/(qB), independent of speed."],
 ["Velocity selected by crossed E and B fields","v = E/B"],
 ["Biot-Savart law","dB = (μ₀/4π)(I dl × r̂)/r²"],
 ["Ampère's law","∮B·dl = μ₀I_enclosed"],
 ["Magnetic field inside an ideal solenoid","B = μ₀nI, where n is turns per unit length."],
 ["Magnetic field at the center of a circular current loop","B = μ₀I/(2R)"],
 ["Torque on a current loop in a uniform field","τ = μ × B with μ = NIA"],
 ["Force per unit length between two parallel wires","μ₀I₁I₂/(2πd) — attractive for parallel currents."]]},
{title:"Electromagnetic Induction",weight:[17,23],
 desc:"Faraday's law, Lenz's law, motional emf, and inductance.",
 notes:[
  {h:"Faraday's and Lenz's laws",b:[
   "`Φ = ∫B·dA`, and `ε = −dΦ/dt`. For N turns, multiply by N.",
   "Flux changes three ways: B changes, A changes, or the orientation changes (a rotating loop gives `ε = NBAω sin ωt`, the generator).",
   "**Lenz's law** is the minus sign: the induced current opposes the change. Determine the induced field direction first, then use the right-hand rule for the current.",
   "Induced currents always act to oppose the motion producing them — this is why eddy-current braking works and why it costs work to pull a loop out of a field."]},
  {h:"Motional emf and energy",b:[
   "A rod of length L moving at speed v perpendicular to B develops `ε = BLv`; with a closed circuit of resistance R, `I = BLv/R` and the retarding force is `F = B²L²v/R`.",
   "Power dissipated equals the mechanical power you supply — a clean energy-conservation check.",
   "A loop falling through a nonuniform field reaches a terminal speed when the magnetic retarding force balances gravity."]},
  {h:"Inductance",b:[
   "**Self-inductance** `L = NΦ/I`; for a solenoid `L = μ₀n²Al`. `ε = −L dI/dt`.",
   "Mutual inductance couples two circuits — the transformer principle.",
   "Energy is stored in the magnetic field with density `u = B²/(2μ₀)`.",
   "In an LC circuit, energy sloshes between ½CV² and ½LI²; adding resistance damps the oscillation."]}],
 tip:"Always justify an induced-current direction in two steps: state whether the flux is increasing or decreasing, then state which way the induced field must point to oppose it.",
 terms:["magnetic flux","Faraday's law","Lenz's law","motional emf","eddy currents","self-inductance","mutual inductance","magnetic energy density"],
 cards:[
 ["Faraday's law of induction","ε = −N dΦ/dt"],
 ["Three ways magnetic flux through a loop can change","The field strength changes, the area changes, or the orientation changes."],
 ["emf of a loop rotating at angular frequency ω in field B","ε = NBAω sin ωt"],
 ["Motional emf of a rod of length L moving at speed v","ε = BLv"],
 ["Retarding force on a rod sliding on rails with resistance R","F = B²L²v/R, opposing the motion."],
 ["Self-inductance of a solenoid","L = μ₀n²Al"],
 ["Magnetic energy density","u = B²/(2μ₀)"],
 ["How do you determine the direction of an induced current?","Decide whether flux is increasing or decreasing, find the direction the induced field must point to oppose it, then apply the right-hand rule."]]}
],
qbank:[
{u:1,q:"The electric field a distance r from an infinite charged sheet of surface density σ is",c:["σ/ε₀","σ/(2ε₀)","σ/(2πε₀r)","σr/ε₀"],a:1,e:"Gauss's law with a pillbox gives σ/(2ε₀), independent of r."},
{u:1,q:"Inside a uniformly charged insulating sphere, E varies as",c:["1/r²","1/r","r","constant"],a:2,e:"Enclosed charge grows as r³ while area grows as r², so E ∝ r."},

{u:3,q:"A long time after a switch closes, an inductor behaves like",c:["an open circuit","a plain wire","a capacitor","a battery"],a:1,e:"With dI/dt = 0 there is no induced emf, so only its (ideal zero) resistance remains."},
{u:3,q:"The time constant of an RL circuit is",c:["RC","RL","L/R","R/L"],a:2,e:"τ = L/R for an RL circuit."},
{u:4,q:"The period of a charged particle's circular motion in a uniform magnetic field depends on",c:["its speed","its mass-to-charge ratio and B","the radius only","nothing"],a:1,e:"T = 2πm/(qB) — independent of speed and radius."},
{u:4,q:"Ampère's law applied to a long straight wire gives",c:["μ₀I/(2R)","μ₀I/(2πr)","μ₀nI","μ₀I/(4πr²)"],a:1,e:"A circular loop of radius r encloses I, giving B(2πr) = μ₀I."},
{u:5,q:"A loop is pulled out of a magnetic field. The induced current",c:["aids the pulling","opposes the motion","is zero","reverses B"],a:1,e:"Lenz's law requires the induced effects to oppose the change, so a retarding force appears."},
{u:5,q:"A rod of length L slides at speed v on rails of resistance R in field B. The current is",c:["BLv","BLv/R","B²L²v/R","BL/vR"],a:1,e:"The motional emf BLv drives a current BLv/R through the circuit."}
]

units:[
{title:"The Living World: Ecosystems",weight:[6,8],
 desc:"Energy flow, biogeochemical cycles, and ecosystem structure.",
 notes:[
  {h:"Ecosystem structure and productivity",b:[
   "Biotic and abiotic factors together define a **biome**; climate — especially temperature and precipitation — determines which biome occurs where.",
   "**Gross primary productivity (GPP)** is total energy captured; **net primary productivity (NPP)** is GPP minus respiration — the energy actually available to consumers.",
   "Only about **10%** of energy transfers between trophic levels, so food chains are short and top predator populations are small.",
   "Species interactions: competition, predation, mutualism (+/+), commensalism (+/0), parasitism (+/−). **Symbiosis** covers the close ones."]},
  {h:"Biogeochemical cycles",b:[
   "**Carbon**: photosynthesis and respiration move it quickly; burning fossil fuels transfers long-buried carbon to the atmosphere.",
   "**Nitrogen**: fixation (bacteria or lightning) → nitrification → assimilation → ammonification → denitrification. Synthetic fertilizer is now a major fixation source.",
   "**Phosphorus** has **no atmospheric phase** — it cycles slowly through rock weathering and is often the limiting nutrient in freshwater.",
   "**Water** cycles through evaporation, transpiration, condensation, precipitation, and infiltration; human withdrawal and impervious surfaces alter it.",
   "Cycle questions usually ask which human activity increases a flux; name the activity and the reservoir it moves material into."]}],
 tip:"Know which reservoir each cycle's pollution problem comes from: carbon from fossil fuels, nitrogen and phosphorus from fertilizer and waste.",
