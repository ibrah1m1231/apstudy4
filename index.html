/* ============================================================
   AP Study Hub — design tokens
   Palette: "answer sheet & graphite" — pine-teal accent on a
   faintly green-biased paper neutral; graphite ink.
   Type: Spectral (display) / IBM Plex Sans (body) / IBM Plex Mono (data)
   ============================================================ */

:root {
  /* ground + surfaces */
  --paper:        #F2F4F1;
  --surface:      #FBFCFA;
  --surface-2:    #EAEDE8;
  --surface-3:    #E0E4DE;
  --line:         #D3D8D1;
  --line-strong:  #B8BFB6;

  /* ink */
  --ink:          #14181A;
  --ink-2:        #3C443F;
  --muted:        #697268;
  --faint:        #8B948A;

  /* accent — deep pine teal */
  --accent:       #0D6E63;
  --accent-deep:  #094C45;
  --accent-soft:  #DCEAE6;
  --accent-line:  #A9CCC4;
  --on-accent:    #FFFFFF;

  /* semantic (separate from accent) */
  --good:         #2C7A50;
  --good-soft:    #DEEDE2;
  --warn:         #9A6310;
  --warn-soft:    #F4E9D4;
  --bad:          #AB3A2C;
  --bad-soft:     #F5E2DE;
  --star:         #B07C12;

  /* elevation */
  --shadow-sm: 0 1px 2px rgba(20,24,26,.06), 0 1px 1px rgba(20,24,26,.04);
  --shadow-md: 0 4px 14px rgba(20,24,26,.09), 0 1px 3px rgba(20,24,26,.05);
  --shadow-lg: 0 18px 46px rgba(20,24,26,.18), 0 2px 8px rgba(20,24,26,.08);

  /* type */
  --display: "Spectral", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-root: 16px;

  /* metrics */
  --rail: 272px;
  --col: 1240px;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --gut: 24px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:       #0E1211;
    --surface:     #161B19;
    --surface-2:   #1D2422;
    --surface-3:   #262E2B;
    --line:        #2C3532;
    --line-strong: #3E4845;

    --ink:         #E9EDE9;
    --ink-2:       #C3CBC5;
    --muted:       #939C95;
    --faint:       #6F7872;

    --accent:      #49B3A2;
    --accent-deep: #7FD3C4;
    --accent-soft: #17302C;
    --accent-line: #2C5A52;
    --on-accent:   #06211D;

    --good:        #5EC186;
    --good-soft:   #17301F;
    --warn:        #D9A443;
    --warn-soft:   #32270F;
    --bad:         #E8857A;
    --bad-soft:    #34201C;
    --star:        #DEB24B;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
    --shadow-md: 0 4px 16px rgba(0,0,0,.5);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.62);
  }
}

:root[data-theme="dark"] {
  --paper:       #0E1211;
  --surface:     #161B19;
  --surface-2:   #1D2422;
  --surface-3:   #262E2B;
  --line:        #2C3532;
  --line-strong: #3E4845;

  --ink:         #E9EDE9;
  --ink-2:       #C3CBC5;
  --muted:       #939C95;
  --faint:       #6F7872;

  --accent:      #49B3A2;
  --accent-deep: #7FD3C4;
  --accent-soft: #17302C;
  --accent-line: #2C5A52;
  --on-accent:   #06211D;

  --good:        #5EC186;
  --good-soft:   #17301F;
  --warn:        #D9A443;
  --warn-soft:   #32270F;
  --bad:         #E8857A;
  --bad-soft:    #34201C;
  --star:        #DEB24B;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  --shadow-md: 0 4px 16px rgba(0,0,0,.5);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.62);
}

/* accent overrides chosen in Settings */
:root[data-accent="indigo"] { --accent:#3F4FA8; --accent-deep:#2C3880; --accent-soft:#E2E5F4; --accent-line:#B4BCE2; }
:root[data-accent="plum"]   { --accent:#8A3C6B; --accent-deep:#652A4E; --accent-soft:#F2E3EC; --accent-line:#DCB8CE; }
:root[data-accent="rust"]   { --accent:#A8502A; --accent-deep:#7D3A1E; --accent-soft:#F6E5DC; --accent-line:#E0BDAA; }
:root[data-accent="slate"]  { --accent:#3B5566; --accent-deep:#2A3F4C; --accent-soft:#E2E9EE; --accent-line:#B6C6D0; }

:root[data-theme="dark"][data-accent="indigo"] { --accent:#8B98E8; --accent-deep:#AEB8F2; --accent-soft:#1C2140; --accent-line:#3B4480; --on-accent:#0D1130; }
:root[data-theme="dark"][data-accent="plum"]   { --accent:#D98DBC; --accent-deep:#EBB3D6; --accent-soft:#331F2C; --accent-line:#6B3C58; --on-accent:#2A1020; }
:root[data-theme="dark"][data-accent="rust"]   { --accent:#E39166; --accent-deep:#F2B38F; --accent-soft:#352116; --accent-line:#6E4129; --on-accent:#2C1408; }
:root[data-theme="dark"][data-accent="slate"]  { --accent:#8FB3C8; --accent-deep:#B3CEDC; --accent-soft:#1B2730; --accent-line:#3C5566; --on-accent:#0B1820; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="indigo"] { --accent:#8B98E8; --accent-deep:#AEB8F2; --accent-soft:#1C2140; --accent-line:#3B4480; --on-accent:#0D1130; }
  :root:not([data-theme="light"])[data-accent="plum"]   { --accent:#D98DBC; --accent-deep:#EBB3D6; --accent-soft:#331F2C; --accent-line:#6B3C58; --on-accent:#2A1020; }
  :root:not([data-theme="light"])[data-accent="rust"]   { --accent:#E39166; --accent-deep:#F2B38F; --accent-soft:#352116; --accent-line:#6E4129; --on-accent:#2C1408; }
  :root:not([data-theme="light"])[data-accent="slate"]  { --accent:#8FB3C8; --accent-deep:#B3CEDC; --accent-soft:#1B2730; --accent-line:#3C5566; --on-accent:#0B1820; }
}

/* reading width / density / font prefs */
:root[data-density="roomy"]  { --gut: 32px; }
:root[data-density="tight"]  { --gut: 14px; }
:root[data-typeface="sans"]  { --display: var(--body); }
:root[data-typeface="mono"]  { --display: var(--body); --body: var(--mono); }
:root[data-typeface="legible"] {
  --display: "Atkinson Hyperlegible", "Verdana", sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", sans-serif;
}

/* ============================================================ base */
* { box-sizing: border-box; }
html { font-size: var(--fs-root); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
:root[data-motion="off"] * { animation-duration: .001ms !important; transition-duration: .001ms !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1,h2,h3,h4 { font-family: var(--display); font-weight: 600; line-height: 1.18; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
h4 { font-size: .97rem; }
p { margin: 0 0 .85em; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
strong { font-weight: 600; color: var(--ink); }
code, kbd, samp { font-family: var(--mono); font-size: .88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--accent-soft); color: var(--ink); }
img, svg { max-width: 100%; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1.4rem 0; }

.eyebrow {
  font-family: var(--mono); font-size: .68rem; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.num { font-variant-numeric: tabular-nums; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ============================================================ controls */
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; gap: .45em; justify-content: center;
  padding: .5em .9em; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: .9rem; font-weight: 500; line-height: 1.3;
  transition: background .14s, border-color .14s, transform .08s;
}
.btn:hover { background: var(--surface-2); border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { padding: .32em .6em; font-size: .8rem; }
.btn-lg { padding: .65em 1.25em; font-size: 1rem; }
.btn-icon { padding: .45em; width: 2.1em; height: 2.1em; }
.btn-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

input, select, textarea {
  font-family: inherit; font-size: .92rem; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); padding: .5em .7em; width: 100%;
}
textarea { line-height: 1.55; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
label { font-size: .86rem; font-weight: 500; }
select { appearance: none; padding-right: 2em;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 1.05em) 1.07em, calc(100% - .72em) 1.07em;
  background-size: .34em .34em, .34em .34em; background-repeat: no-repeat; }

.switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 999px; transition: background .16s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .16s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.chip {
  display: inline-flex; align-items: center; gap: .35em;
  font-family: var(--mono); font-size: .7rem; font-weight: 500; letter-spacing: .04em;
  padding: .22em .5em; border-radius: 4px; background: var(--surface-2);
  color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-line); }
.chip-good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip-bad  { background: var(--bad-soft);  color: var(--bad);  border-color: transparent; }

/* ============================================================ app shell */
.app { display: grid; grid-template-columns: var(--rail) minmax(0,1fr); min-height: 100vh; }

/* ---- rail */
.rail {
  grid-column: 1; background: var(--surface-2); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
}
.brand { display: flex; align-items: center; gap: .6rem; padding: 16px 16px 12px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--display); font-weight: 600; font-size: 1.02rem; letter-spacing: -.015em; }
.brand-sub { font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display:block; margin-top:-2px;}
.rail-search { padding: 0 14px 10px; position: relative; }
.rail-search input { padding-left: 2em; font-size: .86rem; }
.rail-search svg { position: absolute; left: 22px; top: 50%; transform: translateY(-60%); color: var(--faint); pointer-events: none; }
.rail-nav { padding: 0 10px 6px; display: flex; flex-direction: column; gap: 1px; flex: none; }
.rail-nav + .rail-courses { border-bottom: 1px solid var(--line); }
.rail-courses { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 10px 16px; scrollbar-width: thin; }
.rail > .rail-nav:last-child { border-top: 1px solid var(--line); padding-top: 8px; background: var(--surface-2); }
.rail-foot { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; gap: 4px; }

.navitem {
  display: flex; align-items: center; gap: .55rem; width: 100%; text-align: left;
  padding: .42em .6em; border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--ink-2); font-size: .88rem; font-weight: 500;
}
.navitem:hover { background: var(--surface-3); color: var(--ink); }
.navitem[aria-current="page"] { background: var(--accent-soft); color: var(--accent-deep); }
.navitem svg { flex: none; opacity: .8; }
.navitem .tail { margin-left: auto; font-family: var(--mono); font-size: .68rem; color: var(--faint); }

.railgroup { margin-top: 12px; }
.railgroup > .eyebrow { padding: 0 .6em 4px; display: block; }
.courselink {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .5rem;
  width: 100%; text-align: left; padding: .36em .6em; border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--ink-2); font-size: .855rem; line-height: 1.35;
}
.courselink:hover { background: var(--surface-3); color: var(--ink); }
.courselink[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.courselink[aria-current="page"] .cl-meter i { background: var(--on-accent); }
.courselink span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-meter { display: flex; gap: 2px; align-items: center; }
.cl-meter i { display: block; width: 3px; height: 9px; border-radius: 1px; background: var(--line-strong); }
.cl-meter i.on { background: var(--accent); }

/* ---- main */
.main { grid-column: 2; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: .6rem;
  padding-block: 10px; background: var(--paper);
  padding-inline: max(var(--gut), calc((100% - var(--col)) / 2 + var(--gut)));
  border-bottom: 1px solid var(--line); min-height: 54px;
}
.crumbs { display: flex; align-items: center; gap: .4rem; font-size: .84rem; color: var(--muted); min-width: 0; }
.crumbs b { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-spacer { flex: 1; }
.menu-btn { display: none; }

.view { padding: var(--gut) var(--gut) 72px; max-width: var(--col); width: 100%; margin-inline: auto; }
.view-narrow { max-width: 820px; }
.appfoot { max-width: var(--col); width: 100%; margin-inline: auto; }
.notes { max-width: 80ch; }
.pagehead .lede { max-width: 68ch; }
.stack { display: flex; flex-direction: column; gap: 1.15rem; }
.stack-lg { display: flex; flex-direction: column; gap: 2rem; }

/* ---- page head */
.pagehead { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1.4rem; }
.pagehead h1 { margin: 0; }
.pagehead .lede { color: var(--muted); font-size: 1rem; max-width: 62ch; margin: 0; }
.pagehead-row { display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }

/* ---- tabs */
.tabs {
  display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 1.4rem;
  overflow-x: auto; scrollbar-width: none; position: sticky; top: 54px; z-index: 20;
  background: var(--paper); padding-top: 2px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; color: var(--muted); padding: .6em .85em;
  font-size: .88rem; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent;
  display: flex; align-items: center; gap: .4em;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* ---- cards & panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.15rem; }
.panel-flush { padding: 0; overflow: hidden; }
.panel h2, .panel h3 { margin-bottom: .5rem; }
.panel-head { display: flex; align-items: center; gap: .6rem; padding: .8rem 1.05rem; border-bottom: 1px solid var(--line); }
.panel-head h3 { margin: 0; }
.panel-body { padding: 1.05rem; }
.grid { display: grid; gap: 1rem; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }

.stat { display: flex; flex-direction: column; gap: .15rem; padding: .85rem .95rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.stat .k { font-family: var(--mono); font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--display); font-size: 1.55rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .s { font-size: .76rem; color: var(--faint); }

/* ---- unit list */
.units { display: flex; flex-direction: column; }
.unit { border-top: 1px solid var(--line); }
.unit:first-child { border-top: 0; }
.unit-head {
  display: grid; grid-template-columns: 2.6rem 1fr auto; align-items: center; gap: .85rem;
  width: 100%; text-align: left; border: 0; background: transparent; padding: .85rem 1.05rem;
}
.unit-head:hover { background: var(--surface-2); }
.unit-no { font-family: var(--mono); font-size: .78rem; color: var(--muted); display:flex; flex-direction:column; gap:4px; }
.unit-no b { color: var(--accent); font-weight: 600; font-size: .95rem; }
.unit-title { min-width: 0; }
.unit-title .t { font-weight: 500; font-size: .97rem; display: block; }
.unit-title .d { font-size: .8rem; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-meta { display: flex; align-items: center; gap: .6rem; }
.wbar { width: 54px; height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--accent); }
.unit-body { padding: 0 1.05rem 1.3rem 3.6rem; }
.unit-body[hidden] { display: none !important; }
@media (max-width: 640px) { .unit-body { padding-left: 1.05rem; } }

/* ---- notes typography */
.notes { font-size: .95rem; }
.notes h4 {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; margin: 1.3rem 0 .5rem; padding-bottom: .3rem;
  border-bottom: 1px solid var(--accent-line);
}
.notes h4:first-child { margin-top: .2rem; }
.notes ul { margin: 0; padding-left: 1.15rem; display: flex; flex-direction: column; gap: .38rem; }
.notes li { line-height: 1.58; }
.notes li > b, .notes li > strong { color: var(--accent-deep); }
.notes .kt { color: var(--accent-deep); font-weight: 600; }
.notes .fx { font-family: var(--mono); font-size: .87em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: .08em .35em; white-space: nowrap; }
.callout { margin: 1rem 0 0; padding: .7rem .85rem; border-radius: var(--radius-sm); background: var(--warn-soft); border-left: 3px solid var(--warn); font-size: .88rem; }
.callout b { color: var(--warn); }
.callout.tip { background: var(--accent-soft); border-left-color: var(--accent); }
.callout.tip b { color: var(--accent-deep); }

.taglist { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: 1rem; }

/* ---- flashcards */
.fc-stage { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
.fc-card {
  width: 100%; max-width: 620px; min-height: 260px; perspective: 1400px;
  background: transparent; border: 0; padding: 0; display: block;
}
.fc-inner {
  position: relative; width: 100%; min-height: 260px; transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.2,.8,.25,1);
}
.fc-card.flipped .fc-inner { transform: rotateY(180deg); }
:root[data-flip="off"] .fc-inner { transition: none; transform: none !important; }
:root[data-flip="off"] .fc-face-b { display: none; }
:root[data-flip="off"] .fc-card.flipped .fc-face-a { display: none; }
:root[data-flip="off"] .fc-card.flipped .fc-face-b { display: flex; transform: none; }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: center; gap: .8rem;
  padding: 1.8rem 1.6rem; border-radius: var(--radius-lg); border: 1px solid var(--line);
  background: var(--surface); box-shadow: var(--shadow-md); text-align: center;
  min-height: 260px; overflow: auto;
}
.fc-face-b { transform: rotateY(180deg); background: var(--surface); border-color: var(--accent-line); }
.fc-q { font-family: var(--display); font-size: 1.3rem; font-weight: 500; line-height: 1.3; }
.fc-a { font-size: 1rem; line-height: 1.55; text-align: left; }
.fc-a ul { text-align: left; }
.fc-hint { font-family: var(--mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.fc-bar { display: flex; align-items: center; gap: .6rem; width: 100%; max-width: 620px; }
.fc-prog { flex: 1; height: 4px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.fc-prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.fc-grade { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
.fc-grade .btn { min-width: 96px; flex-direction: column; gap: 0; padding: .4em .7em; }
.fc-grade .btn small { font-family: var(--mono); font-size: .62rem; color: var(--faint); }
.fc-star { color: var(--faint); }
.fc-star.on { color: var(--star); }

/* ---- quiz */
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.15rem 1.2rem; }
.q-stem { font-size: 1.02rem; line-height: 1.55; margin-bottom: 1rem; }
.q-stem .fx { font-family: var(--mono); }
.choices { display: flex; flex-direction: column; gap: .5rem; }
.choice {
  display: grid; grid-template-columns: 1.7rem 1fr; gap: .6rem; align-items: start;
  text-align: left; padding: .7rem .85rem; border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); background: var(--surface); font-size: .94rem; line-height: 1.5;
  transition: border-color .12s, background .12s;
}
.choice:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.choice .ltr { font-family: var(--mono); font-weight: 600; color: var(--muted); }
.choice[data-state="picked"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[data-state="right"] { border-color: var(--good); background: var(--good-soft); }
.choice[data-state="wrong"] { border-color: var(--bad); background: var(--bad-soft); }
.choice[data-state="right"] .ltr { color: var(--good); }
.choice[data-state="wrong"] .ltr { color: var(--bad); }
.explain { margin-top: .9rem; padding: .75rem .9rem; border-radius: var(--radius-sm); background: var(--surface-2); border-left: 3px solid var(--accent); font-size: .89rem; }
.explain b { color: var(--accent-deep); }

.score-ring { display: grid; place-items: center; position: relative; width: 132px; height: 132px; }
.score-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.score-ring .big { font-family: var(--display); font-size: 2.4rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.score-ring .cap { font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---- chat */
.chat-wrap { display: flex; flex-direction: column; height: min(calc(100vh - 210px), 720px); min-height: 420px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.chat-log { flex: 1; overflow-y: auto; padding: 1.1rem; display: flex; flex-direction: column; gap: 1rem; }
.msg { display: grid; grid-template-columns: 1.7rem 1fr; gap: .65rem; }
.msg .who { width: 1.7rem; height: 1.7rem; border-radius: 5px; display: grid; place-items: center; font-family: var(--mono); font-size: .62rem; font-weight: 600; }
.msg.me .who { background: var(--surface-3); color: var(--muted); }
.msg.ai .who { background: var(--accent); color: var(--on-accent); }
.msg .bubble { font-size: .94rem; line-height: 1.62; min-width: 0; padding-top: .12rem; }
.msg .bubble p { margin: 0 0 .6em; }
.msg .bubble ul, .msg .bubble ol { margin: .2em 0 .7em; padding-left: 1.2rem; }
.msg .bubble li { margin-bottom: .25em; }
.msg .bubble h4 { font-family: var(--body); font-size: .95rem; margin: .8em 0 .35em; color: var(--accent-deep); }
.msg .bubble pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .65rem .8rem; overflow-x: auto; font-size: .82rem; }
.chat-form { border-top: 1px solid var(--line); padding: .7rem; display: flex; gap: .5rem; align-items: flex-end; background: var(--surface); }
.chat-form textarea { min-height: 42px; max-height: 160px; }
.suggests { display: flex; gap: .4rem; flex-wrap: wrap; padding: 0 1.1rem .8rem; }
.suggests button { font-size: .8rem; padding: .35em .7em; border: 1px dashed var(--line-strong); border-radius: 999px; background: transparent; color: var(--muted); }
.suggests button:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
.typing i { display:inline-block; width:5px; height:5px; border-radius:50%; background: var(--faint); margin-right:3px; animation: bounce 1.1s infinite; }
.typing i:nth-child(2){ animation-delay:.15s } .typing i:nth-child(3){ animation-delay:.3s }
@keyframes bounce { 0%,80%,100%{ transform: translateY(0); opacity:.4 } 40%{ transform: translateY(-4px); opacity:1 } }

/* ---- tables */
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th { text-align: left; font-family: var(--mono); font-size: .66rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
.tbl td { padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-family: var(--mono); }
.tbl-wrap { overflow-x: auto; }

/* ---- progress meter row */
.meter { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.meter.good i { background: var(--good); }
.meter.warn i { background: var(--warn); }

/* ---- empty state */
.empty { text-align: center; padding: 2.6rem 1.2rem; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: .4rem; }
.empty p { max-width: 46ch; margin: 0 auto .9rem; font-size: .92rem; }

/* ---- modal / drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,14,13,.5); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 100; background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
}
.sheet-right { top: 0; right: 0; height: 100vh; width: min(440px, 100%); border-radius: 0; transform: translateX(102%); transition: transform .22s cubic-bezier(.2,.8,.25,1); }
.sheet-right.on { transform: none; }
.sheet-head { display: flex; align-items: center; gap: .6rem; padding: .9rem 1.05rem; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 1.1rem; margin: 0; flex: 1; }
.sheet-body { overflow-y: auto; padding: 1.05rem; flex: 1; }
.palette { position: fixed; z-index: 100; top: 12vh; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); border-radius: var(--radius); overflow: hidden; }
.palette input { border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: .85em 1em; font-size: 1rem; }
.palette input:focus { outline: 0; }
.palette-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
.palette-list button { display: flex; width: 100%; gap: .6rem; align-items: center; text-align: left; border: 0; background: transparent; padding: .5em .6em; border-radius: var(--radius-sm); font-size: .9rem; color: var(--ink-2); }
.palette-list button:hover, .palette-list button.sel { background: var(--accent-soft); color: var(--accent-deep); }
.palette-list .kind { margin-left: auto; font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

/* ---- settings rows */
.setrow { display: flex; align-items: center; gap: 1rem; padding: .75rem 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow .lbl { flex: 1; min-width: 0; }
.setrow .lbl b { display: block; font-weight: 500; font-size: .92rem; }
.setrow .lbl small { color: var(--muted); font-size: .8rem; display: block; line-height: 1.45; }
.setrow .ctl { flex: none; width: 170px; max-width: 48%; }
.segmented { display: flex; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; }
.segmented button { flex: 1; border: 0; background: var(--surface); padding: .38em .2em; font-size: .78rem; color: var(--muted); border-right: 1px solid var(--line); }
.segmented button:last-child { border-right: 0; }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 500; }
.swatches { display: flex; gap: .4rem; }
.swatches button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.swatches button[aria-pressed="true"] { border-color: var(--ink); }

/* ---- countdown pill */
.cd {
  display: inline-flex; align-items: baseline; gap: .35rem; font-family: var(--mono);
  font-size: .74rem; padding: .3em .6em; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted);
}
.cd b { font-size: .88rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.cd.soon { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.cd.soon b { color: var(--warn); }

/* ---- sparkline row */
.spark { display: flex; align-items: flex-end; gap: 3px; height: 38px; }
.spark i { flex: 1; min-width: 3px; background: var(--accent-line); border-radius: 2px 2px 0 0; }
.spark i.hi { background: var(--accent); }
.spark-x { display: flex; gap: 3px; font-family: var(--mono); font-size: .56rem; color: var(--faint); margin-top: 3px; }
.spark-x span { flex: 1; text-align: center; min-width: 3px; }

/* ---- toast */
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: .4rem; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); font-size: .86rem; padding: .55em .95em; border-radius: 999px; box-shadow: var(--shadow-lg); animation: rise .2s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---- planner */
.plan-day { display: grid; grid-template-columns: 4.6rem 1fr auto; gap: .8rem; align-items: center; padding: .6rem .8rem; border-bottom: 1px solid var(--line); font-size: .9rem; }
.plan-day:last-child { border-bottom: 0; }
.plan-day .dt { font-family: var(--mono); font-size: .74rem; color: var(--muted); }
.plan-day.done { opacity: .55; }
.plan-day.done .lbl { text-decoration: line-through; }

/* ---- timer */
.timer-face { font-family: var(--mono); font-size: 3.2rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }

/* ---- responsive */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    position: fixed; z-index: 100; top: 0; left: 0; width: min(300px, 86vw);
    transform: translateX(-102%); transition: transform .22s cubic-bezier(.2,.8,.25,1);
    box-shadow: var(--shadow-lg);
  }
  .rail.on { transform: none; }
  .main { grid-column: 1; }
  .menu-btn { display: inline-flex; }
  .tabs { top: 54px; }
}
@media (max-width: 560px) {
  :root { --gut: 16px; }
  .setrow { flex-direction: column; align-items: stretch; gap: .5rem; }
  .setrow .ctl { width: 100%; max-width: none; }
  .fc-grade .btn { min-width: 72px; flex: 1; }
  .unit-head { grid-template-columns: 2.1rem 1fr; }
  .unit-meta { grid-column: 1 / -1; padding-left: 2.95rem; }
}

/* ---- print */
@media print {
  .rail, .topbar, .tabs, .no-print { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; }
  .panel, .unit { border-color: #bbb; box-shadow: none; }
  .unit-body[hidden] { display: block !important; }
}

/* ============================================================ lock screen */
.lockwrap {
  position: fixed; inset: 0; z-index: 300; background: var(--paper);
  display: grid; place-items: center; padding: 24px 16px; overflow-y: auto;
}
.lockcard {
  width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 1.6rem 1.5rem;
}
.lockhead { display: flex; gap: .85rem; align-items: flex-start; margin-bottom: 1.3rem; }
.lockhead h1 { font-size: 1.35rem; margin: 0 0 .2rem; }
.lockhead p { margin: 0; font-size: .89rem; color: var(--muted); line-height: 1.5; }
.lockcard form { display: flex; flex-direction: column; gap: .45rem; }
.lockcard label { font-size: .78rem; font-weight: 500; color: var(--muted); margin-top: .35rem; }
.lockcard input[type="password"], .lockcard input[type="text"] { font-size: 1rem; padding: .6em .7em; }
.lockcard .btn-lg { margin-top: .9rem; width: 100%; }
.lockrules { list-style: none; margin: .7rem 0 .2rem; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .3rem .6rem; }
.lockrules li { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--muted); }
.lockrules .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; position: relative; transition: background .15s, border-color .15s; }
.lockrules li.ok { color: var(--good); }
.lockrules li.ok .dot { background: var(--good); border-color: var(--good); }
.lockrules li.ok .dot::after { content: ""; position: absolute; left: 3px; top: 1px; width: 3px; height: 6px; border: solid var(--surface); border-width: 0 1.5px 1.5px 0; transform: rotate(42deg); }
.lockerr { color: var(--bad); font-size: .83rem; margin: .5rem 0 0; min-height: 1em; }
.locknote { display: flex; gap: .45rem; align-items: flex-start; font-size: .78rem; color: var(--muted); line-height: 1.5; margin: 1.1rem 0 0; padding-top: .9rem; border-top: 1px solid var(--line); }
.locknote svg { flex: none; margin-top: .15rem; color: var(--good); }
.locknote.warn svg { color: var(--warn); }
.lockfine { font-size: .75rem; color: var(--faint); line-height: 1.5; margin: .8rem 0 0; }
.lockadopt { display: flex !important; gap: .5rem; align-items: flex-start; font-size: .82rem; color: var(--ink-2) !important; margin-top: .8rem !important; font-weight: 400 !important; cursor: pointer; }
.lockadopt input { width: auto; margin-top: .15rem; }
@media (max-width: 420px) { .lockrules { grid-template-columns: 1fr; } }

/* ============================================================ version badge */
.verbadge {
  position: fixed; right: 10px; bottom: 8px; z-index: 60;
  font-family: var(--mono); font-size: .66rem; letter-spacing: .04em;
  color: var(--faint); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: .2em .6em; line-height: 1.4;
  opacity: .55; transition: opacity .15s, color .15s;
}
.verbadge:hover, .verbadge:focus-visible { opacity: 1; color: var(--muted); }
@media print { .verbadge { display: none; } }

/* gate dialog bullet list */
.gatepoints { list-style: none; margin: .9rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
.gatepoints li { position: relative; padding-left: 1.15rem; font-size: .88rem; color: var(--ink-2); line-height: 1.5; }
.gatepoints li::before { content: ""; position: absolute; left: 0; top: .52em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
#gatewrap .lockhead svg { color: var(--accent); flex: none; }

</style>

units:[
{title:"Limits and Continuity", weight:[10,12],
 desc:"What a function approaches, how to compute it, and what continuity guarantees.",
 notes:[
  {h:"The idea of a limit",b:[
   "**lim f(x) = L as x→c** means f(x) gets arbitrarily close to L for x near c — the value **at** c is irrelevant and may not exist.",
   "A two-sided limit exists only if both one-sided limits exist and agree: `lim x→c⁻ = lim x→c⁺`.",
   "Limits fail to exist in three classic ways: the one-sided limits disagree (jump), the function grows without bound (vertical asymptote), or the function oscillates forever (like `sin(1/x)` at 0).",
   "A graph or table can **suggest** a limit but never proves it — an FRQ asking for justification wants algebra or a theorem."]},
  {h:"Computing limits",b:[
   "Try **direct substitution** first. If you get a real number, that is the limit.",
   "`0/0` is indeterminate — it is a signal to do algebra, not an answer. Tools: factor and cancel, rationalize with the conjugate, combine complex fractions, expand.",
   "Limits of the form `k/0` with k ≠ 0 mean a vertical asymptote; determine the sign from each side separately.",
   "**Squeeze Theorem**: if g(x) ≤ f(x) ≤ h(x) near c and g, h both approach L, then f does too. Standard use: `x²sin(1/x) → 0`.",
   "Memorize `lim (sin x)/x = 1` and `lim (1−cos x)/x = 0` as x→0."]},
  {h:"Limits at infinity and asymptotes",b:[
   "Compare degrees of a rational function: bottom-heavy → limit 0; equal degrees → ratio of leading coefficients; top-heavy → ±∞ (no horizontal asymptote).",
   "Horizontal asymptotes describe **end behavior**; a graph may cross one.",
   "For `√` expressions divide by the highest power of x inside the radical, and remember √(x²) = |x| — this gives two different horizontal asymptotes as x→±∞.",
   "Exponential growth beats any polynomial: `lim x/eˣ = 0` as x→∞."]},
  {h:"Continuity",b:[
   "f is continuous at c when all three hold: f(c) is defined, `lim x→c f(x)` exists, and the two are equal.",
   "Discontinuity types: **removable** (hole — limit exists but disagrees with f(c)), **jump** (one-sided limits differ), **infinite** (asymptote).",
   "Piecewise functions with an unknown constant: set the one-sided limits equal to each other and to the function value, then solve.",
   "**IVT**: if f is continuous on [a,b] and k is between f(a) and f(b), some c in (a,b) has f(c) = k. Always say 'f is continuous' when you invoke it."]}],
 tip:"On free response, writing 'lim' without 'x→c' loses the communication point. Always include the approach.",
 terms:["limit","one-sided limit","indeterminate form","Squeeze Theorem","removable discontinuity","IVT","horizontal asymptote"],
 cards:[
 ["What does lim f(x) = L as x→c actually claim?","f(x) can be made arbitrarily close to L by taking x close enough to c (but not equal to c). It says nothing about f(c)."],
 ["When does a two-sided limit fail to exist?","When the left and right limits disagree, the function is unbounded, or the function oscillates without settling."],
 ["You substitute and get 0/0. What does that mean?","The form is indeterminate — it tells you nothing yet. Factor, rationalize, or simplify and try again."],
 ["lim (sin x)/x as x→0","1"],
 ["lim (1 − cos x)/x as x→0","0"],
 ["State the Squeeze Theorem.","If g(x) ≤ f(x) ≤ h(x) near c, and lim g = lim h = L, then lim f = L."],
 ["Rational function, degree of numerator < degree of denominator. Limit at infinity?","0 — there is a horizontal asymptote at y = 0."],
 ["Rational function, equal degrees. Limit at infinity?","The ratio of the leading coefficients."],
 ["Three conditions for continuity at x = c","f(c) exists; lim x→c f(x) exists; the limit equals f(c)."],
 ["Difference between a removable and a jump discontinuity","Removable: the limit exists but ≠ f(c) (a hole). Jump: the one-sided limits exist but differ."],
 ["State the Intermediate Value Theorem.","If f is continuous on [a,b] and k lies between f(a) and f(b), then f(c) = k for some c in (a,b)."],
 ["Why must you say 'f is continuous' when using IVT?","Continuity is a hypothesis of the theorem; without stating it the justification is incomplete and earns no point."]]},

{title:"Differentiation: Definition and Fundamental Properties", weight:[10,12],
 desc:"The derivative as a limit, as a slope, and as a rate — plus the basic rules.",
 notes:[
  {h:"Definitions of the derivative",b:[
   "**f′(x) = lim h→0 [f(x+h) − f(x)]/h** — the limit of the difference quotient.",
   "Alternate form at a point: **f′(a) = lim x→a [f(x) − f(a)]/(x − a)**. Recognize both; MCQs disguise derivatives as limits.",
   "Geometrically f′(a) is the slope of the **tangent line** at x = a; physically it is an **instantaneous rate of change**.",
   "Tangent line at a: `y = f(a) + f′(a)(x − a)`. This is also the linearization used for approximation."]},
  {h:"Differentiability",b:[
   "Differentiable ⇒ continuous. The converse is false.",
   "Non-differentiable points: corners (|x| at 0), cusps, vertical tangents (slope → ∞), and any discontinuity.",
   "To check differentiability of a piecewise function at the seam: the pieces must be continuous there **and** the derivatives from both sides must match."]},
  {h:"Basic rules",b:[
   "Power: `d/dx xⁿ = nxⁿ⁻¹`. Rewrite radicals and fractions as powers before differentiating.",
   "Constant multiple and sum rules let you differentiate term by term.",
   "**Product**: `(fg)′ = f′g + fg′`.  **Quotient**: `(f/g)′ = (f′g − fg′)/g²` — 'low d-high minus high d-low over low squared'.",
   "Trig: sin→cos, cos→−sin, tan→sec²x, cot→−csc²x, sec→sec x tan x, csc→−csc x cot x.",
   "Exponential and log: `(eˣ)′ = eˣ`, `(aˣ)′ = aˣ ln a`, `(ln x)′ = 1/x`, `(log_a x)′ = 1/(x ln a)`."]},
  {h:"Reading derivatives from tables and graphs",b:[
   "Estimate f′ from a table with a symmetric difference quotient when possible: `[f(a+h) − f(a−h)]/(2h)`.",
   "Where f has a horizontal tangent, f′ = 0. Where f is steeply increasing, f′ is large and positive.",
   "Derivative units are (units of f) per (unit of x) — state them in context on FRQs."]}],
 tip:"If a multiple-choice problem is a limit of a quotient with a recognizable f, it is asking for a derivative. Identify f and a, then differentiate.",
 terms:["difference quotient","tangent line","differentiability","product rule","quotient rule","linearization"],
 cards:[
 ["Limit definition of f′(x)","f′(x) = lim h→0 [f(x+h) − f(x)] / h"],
 ["Alternate definition of f′(a)","f′(a) = lim x→a [f(x) − f(a)] / (x − a)"],
 ["Equation of the tangent line to f at x = a","y = f(a) + f′(a)(x − a)"],
 ["Does differentiable imply continuous? Converse?","Differentiable ⇒ continuous. The converse is false: |x| is continuous but not differentiable at 0."],
 ["Four ways a function can fail to be differentiable at a point","Corner, cusp, vertical tangent, or discontinuity."],
 ["Product rule","(fg)′ = f′g + fg′"],
 ["Quotient rule","(f/g)′ = (f′g − fg′)/g²"],
 ["d/dx tan x and d/dx sec x","sec²x and sec x · tan x"],
 ["d/dx aˣ","aˣ · ln a"],
 ["d/dx log_a x","1 / (x ln a)"],
 ["How do you check that a piecewise function is differentiable at the seam?","Show the pieces are continuous there, then show the left and right derivatives are equal."],
 ["What are the units of f′ if f is gallons and x is minutes?","Gallons per minute."]]},

{title:"Differentiation: Composite, Implicit, and Inverse Functions", weight:[9,13],
 desc:"The chain rule and everything that depends on it.",
 notes:[
  {h:"Chain rule",b:[
   "`d/dx f(g(x)) = f′(g(x)) · g′(x)` — differentiate the outside, leave the inside alone, multiply by the inside's derivative.",
   "Nested compositions chain again: peel one layer at a time and keep the factors.",
   "Chain rule with a table: `h(x) = f(g(x))` ⇒ `h′(2) = f′(g(2))·g′(2)`. Look up g(2) first."]},
  {h:"Implicit differentiation",b:[
   "Differentiate both sides with respect to x, treating y as a function of x so every y picks up a **dy/dx** by the chain rule.",
   "Collect all dy/dx terms on one side and factor.",
   "The answer usually contains both x and y — substitute a point only at the end.",
   "For a horizontal tangent set the numerator of dy/dx to 0; for a vertical tangent set the denominator to 0 (and check the point is on the curve).",
   "Second derivative implicitly: differentiate dy/dx again, then substitute the expression for dy/dx back in."]},
  {h:"Inverse functions",b:[
   "If g is the inverse of f, then `g′(x) = 1 / f′(g(x))`. In words: reciprocal of the derivative of f at the matching point.",
   "Find the matching point by reading the pairing backwards: g(5) = 2 exactly when f(2) = 5.",
   "Derive arcsin/arctan derivatives from this relation if you forget them."]},
  {h:"Higher-order derivatives",b:[
   "f″ is the derivative of f′; notation f″(x), d²y/dx², or y″.",
   "Position → velocity → acceleration is the standard physical chain.",
   "Applying the chain rule twice produces a product — don't drop the inner factor."]}],
 tip:"In implicit differentiation, forgetting the dy/dx on a y-term is the single most common error. Circle every y before you start.",
 terms:["chain rule","implicit differentiation","inverse function derivative","second derivative"],
 cards:[
 ["Chain rule","d/dx f(g(x)) = f′(g(x)) · g′(x)"],
 ["Why does y pick up dy/dx during implicit differentiation?","Because y is a function of x, so differentiating any expression in y requires the chain rule."],
 ["How do you find a horizontal tangent on an implicit curve?","Set the numerator of dy/dx equal to 0 and solve together with the original equation."],
 ["How do you find a vertical tangent on an implicit curve?","Set the denominator of dy/dx equal to 0 (numerator nonzero) and solve with the original equation."],
 ["Derivative of an inverse function g = f⁻¹","g′(x) = 1 / f′(g(x))"],
 ["f(2) = 5 and f′(2) = 3. What is (f⁻¹)′(5)?","1/3"],
 ["d/dx arcsin x","1/√(1 − x²)"],
 ["d/dx arctan x","1/(1 + x²)"],
 ["d/dx sin(3x²)","cos(3x²) · 6x"],
 ["What does f″ tell you about f?","The rate at which the slope is changing — it determines concavity."]]},

{title:"Contextual Applications of Differentiation", weight:[10,15],
 desc:"Rates in context: motion, related rates, approximation, L'Hospital.",
 notes:[
  {h:"Interpreting rates",b:[
   "Always report units and a sentence: 'At t = 4 the water level is rising at 2.1 cm per minute.'",
   "Positive derivative = quantity increasing; negative = decreasing. Second derivative tells whether the rate itself is growing.",
   "A **negative** derivative that is increasing toward zero means the quantity is still decreasing, but more slowly."]},
  {h:"Straight-line motion",b:[
   "x(t) position, v(t) = x′(t), a(t) = v′(t) = x″(t).",
   "**Speed = |v(t)|.** The particle is **speeding up** when v and a have the same sign, **slowing down** when signs differ.",
   "Direction changes where v changes sign (not merely where v = 0).",
   "Displacement over [a,b] = ∫v dt; **total distance** = ∫|v| dt — split at the zeros of v."]},
  {h:"Related rates",b:[
   "Write an equation relating the quantities, differentiate both sides with respect to **t**, then substitute the instantaneous values.",
   "Substitute numbers **after** differentiating — anything you plug in early becomes a constant and loses its rate.",
   "Use geometry to eliminate variables first (similar triangles, a fixed ratio in a cone) so you only need the rates you were given.",
   "Label what you want: 'Find dV/dt when h = 3.'"]},
  {h:"Approximation and L'Hospital",b:[
   "**Linearization**: `L(x) = f(a) + f′(a)(x − a)` approximates f near a. It overestimates where f is concave down and underestimates where f is concave up.",
   "**L'Hospital's Rule**: if `lim f/g` is 0/0 or ∞/∞ and both are differentiable, the limit equals `lim f′/g′`. Verify the indeterminate form before using it, and say so on an FRQ.",
   "L'Hospital can be applied repeatedly, but simplify between rounds."]}],
 tip:"'Speeding up' is never the same as 'accelerating in the positive direction'. Compare the signs of v and a.",
 terms:["related rates","speed","total distance","linearization","L'Hospital's Rule"],
 cards:[
 ["When is a particle speeding up?","When velocity and acceleration have the same sign."],
 ["Speed vs velocity","Speed is |v(t)|, always non-negative. Velocity carries direction."],
 ["Displacement vs total distance on [a,b]","Displacement = ∫ₐᵇ v dt. Total distance = ∫ₐᵇ |v| dt, splitting at sign changes of v."],
 ["How do you know a particle changed direction?","v(t) changes sign there — v = 0 alone is not enough."],
 ["First step of any related-rates problem","Write an equation relating the quantities, then differentiate with respect to time."],
 ["Why substitute numbers only after differentiating in related rates?","A value substituted early becomes a constant, and its rate of change disappears from the equation."],
 ["Linearization of f at a","L(x) = f(a) + f′(a)(x − a)"],
 ["When does a tangent-line approximation overestimate?","When f is concave down near a (the curve lies below its tangent)."],
 ["Conditions required to apply L'Hospital's Rule","The limit must be of the form 0/0 or ∞/∞, and f and g must be differentiable near the point with g′ ≠ 0."],
 ["a(t) < 0 and v(t) < 0. Speeding up or slowing down?","Speeding up — the signs match."]]},

{title:"Analytical Applications of Differentiation", weight:[15,18],
 desc:"Using f′ and f″ to describe and optimize f. The heaviest-weighted derivative unit.",
 notes:[
  {h:"Mean Value Theorem and Rolle",b:[
   "**MVT**: if f is continuous on [a,b] and differentiable on (a,b), some c in (a,b) has `f′(c) = (f(b) − f(a))/(b − a)` — the instantaneous rate equals the average rate somewhere.",
   "Rolle is the special case f(a) = f(b), giving f′(c) = 0.",
   "State both hypotheses explicitly when you use MVT on an FRQ."]},
  {h:"Increasing, decreasing, extrema",b:[
   "f′ > 0 ⇒ f increasing; f′ < 0 ⇒ f decreasing. Critical points occur where f′ = 0 or f′ is undefined.",
   "**First derivative test**: f′ changing + to − gives a local max; − to + gives a local min.",
   "**Second derivative test**: at a critical point, f″ < 0 ⇒ local max, f″ > 0 ⇒ local min, f″ = 0 ⇒ inconclusive.",
   "**Candidates test** for absolute extrema on a closed interval: evaluate f at all critical points and both endpoints, then compare values.",
   "Justification must reference f′ **changing sign**, not just f′ = 0."]},
  {h:"Concavity and inflection",b:[
   "f″ > 0 ⇒ concave up (f′ increasing); f″ < 0 ⇒ concave down (f′ decreasing).",
   "An **inflection point** is where concavity changes — f″ must change sign **and** f must be defined there.",
   "On a graph of f′: f is concave up where f′ is rising; inflection points of f are the local extrema of f′."]},
  {h:"Optimization and graph sketching",b:[
   "Optimization recipe: define variables, write the objective, use a constraint to reduce to one variable, state the domain, find critical points, justify with a sign chart or second derivative.",
   "Always answer the question asked — sometimes the dimension, sometimes the maximum value.",
   "Sketching from f′: zeros of f′ are candidates for extrema; sign of f′ gives direction; sign of f″ gives curvature."]}],
 tip:"Most lost FRQ points in this unit are justification points. Write 'f′ changes from positive to negative at x = 3, so f has a local maximum there.'",
 terms:["MVT","critical point","first derivative test","second derivative test","candidates test","concavity","inflection point","optimization"],
 cards:[
 ["State the Mean Value Theorem.","If f is continuous on [a,b] and differentiable on (a,b), then f′(c) = (f(b) − f(a))/(b − a) for some c in (a,b)."],
 ["What is a critical point?","A point in the domain where f′ = 0 or f′ does not exist."],
 ["First derivative test for a local maximum","f′ changes from positive to negative at that point."],
 ["Second derivative test","At a critical point: f″ < 0 ⇒ local max; f″ > 0 ⇒ local min; f″ = 0 ⇒ test fails."],
 ["How do you find absolute extrema on a closed interval?","Candidates test: evaluate f at every critical point and at both endpoints, then compare."],
 ["What does f″ > 0 mean about f and about f′?","f is concave up and f′ is increasing."],
 ["Requirement for an inflection point","f″ changes sign there and f is defined there."],
 ["Given the graph of f′, where is f concave down?","Where f′ is decreasing."],
 ["Given the graph of f′, where are the inflection points of f?","At the local maxima and minima of f′."],
 ["Why is 'f′(3) = 0' not a sufficient justification for a maximum?","f′ can be zero without a sign change (e.g. y = x³ at 0). The sign change is what matters."],
 ["Steps of an optimization problem","Write the objective, use the constraint to reduce to one variable, state the domain, find critical points, justify the extremum, answer in context."]]},

{title:"Integration and Accumulation of Change", weight:[17,20],
 desc:"Riemann sums, antiderivatives, and the Fundamental Theorem. The largest single unit.",
 notes:[
  {h:"Riemann sums and definite integrals",b:[
   "A definite integral is the limit of Riemann sums: `∫ₐᵇ f(x)dx = lim n→∞ Σ f(xᵢ*)Δx`.",
   "Left sums underestimate and right sums overestimate an increasing function (reverse for decreasing).",
   "Midpoint is usually most accurate; **trapezoidal** sums average left and right: `Δx/2 · (y₀ + 2y₁ + ... + 2yₙ₋₁ + yₙ)` for uniform width.",
   "With unequal widths (a table), compute each trapezoid separately: `Σ ½(yᵢ + yᵢ₊₁)(xᵢ₊₁ − xᵢ)`.",
   "Trapezoidal sums overestimate when f is concave up, underestimate when concave down."]},
  {h:"Properties of definite integrals",b:[
   "`∫ₐᵃ f = 0` and `∫ᵇₐ f = −∫ₐᵇ f`.",
   "Additivity: `∫ₐᶜ f = ∫ₐᵇ f + ∫ᵇᶜ f`.",
   "Integrals are signed areas: area below the axis counts as negative.",
   "Evaluate geometric integrals (lines, semicircles) by area rather than antiderivatives."]},
  {h:"Fundamental Theorem of Calculus",b:[
   "**Part 2 (evaluation)**: `∫ₐᵇ f′(x)dx = f(b) − f(a)` — the net change of f.",
   "**Part 1 (accumulation)**: if `g(x) = ∫ₐˣ f(t)dt` then `g′(x) = f(x)`. With a variable upper limit u(x): `g′(x) = f(u(x))·u′(x)`.",
   "Accumulation sentence for FRQs: `f(b) = f(a) + ∫ₐᵇ f′(x)dx`. This is how you find a value from a rate plus an initial condition.",
   "For g(x) = ∫ₐˣ f(t)dt, the graph of f is the derivative of g: g increases where f > 0, g is concave up where f is increasing."]},
  {h:"Antiderivatives and u-substitution",b:[
   "Reverse the basic derivative rules; include **+C** on every indefinite integral.",
   "`∫1/x dx = ln|x| + C` — absolute value matters.",
   "**u-substitution**: choose u so that du appears (up to a constant) in the integrand; change the limits when the integral is definite, or convert back at the end.",
   "Long division first if a rational integrand is top-heavy; complete the square for arctan forms."]}],
 tip:"Every 'rate in, rate out' FRQ reduces to: amount = initial amount + ∫(rate in − rate out) dt.",
 terms:["Riemann sum","trapezoidal sum","definite integral","FTC","accumulation function","u-substitution","net change"],
 cards:[
 ["For an increasing function, does a left Riemann sum over- or underestimate?","Underestimate."],
 ["Trapezoidal sum formula with uniform width Δx","Δx/2 · (y₀ + 2y₁ + 2y₂ + ... + 2yₙ₋₁ + yₙ)"],
 ["When does a trapezoidal sum overestimate the integral?","When the function is concave up."],
 ["FTC Part 2","∫ₐᵇ f′(x) dx = f(b) − f(a)"],
 ["FTC Part 1 with a variable upper limit u(x)","d/dx ∫ₐ^{u(x)} f(t) dt = f(u(x)) · u′(x)"],
 ["Accumulation sentence: find f(b) from a rate","f(b) = f(a) + ∫ₐᵇ f′(x) dx"],
 ["g(x) = ∫₀ˣ f(t) dt. Where is g increasing?","Where f(x) > 0."],
 ["g(x) = ∫₀ˣ f(t) dt. Where is g concave up?","Where f is increasing."],
 ["∫ 1/x dx","ln|x| + C"],
 ["How do you handle limits of integration during u-substitution?","Either convert them to u-values, or convert back to x before evaluating. Never mix."],
 ["∫ᵇₐ f dx in terms of ∫ₐᵇ f dx","The negative of it."],
 ["Amount of water in a tank with rate in R(t) and rate out D(t)","A(t) = A(0) + ∫₀ᵗ (R(s) − D(s)) ds"]]},

{title:"Differential Equations", weight:[6,12],
 desc:"Slope fields, separable equations, and exponential models.",
 notes:[
  {h:"Reading differential equations",b:[
   "A differential equation gives dy/dx as a function of x, y, or both; a **solution** is a function satisfying it.",
   "Verify a proposed solution by substituting it and its derivative into the equation.",
   "A **particular solution** uses an initial condition; a **general solution** carries +C."]},
  {h:"Slope fields",b:[
   "Plot short segments with slope dy/dx at sample points. Equal slopes along a line or curve reveal structure.",
   "Sketch a solution curve by following the segments from the given initial point without crossing other solution curves.",
   "If dy/dx depends only on y, the slope field has horizontal rows of identical slopes; only on x gives vertical columns."]},
  {h:"Separation of variables",b:[
   "Write the equation as `g(y)dy = h(x)dx`, integrate both sides, add C to one side, then apply the initial condition.",
   "Solve for y explicitly if asked, and state the **domain** of the particular solution — it must be an interval containing the initial x and avoiding division by zero.",
   "Watch sign and absolute-value issues when exponentiating `ln|y|`; the initial condition resolves them."]},
  {h:"Exponential and logistic models",b:[
   "`dy/dt = ky` ⇒ `y = y₀e^{kt}`: exponential growth (k>0) or decay (k<0). Half-life and doubling time come from this.",
   "Newton's law of cooling: `dT/dt = k(T − Tₐ)` ⇒ `T = Tₐ + (T₀ − Tₐ)e^{kt}`.",
   "Logistic growth (BC): `dP/dt = kP(1 − P/L)` grows fastest at P = L/2 and approaches the carrying capacity L.",
   "Euler's method (BC): step forward with `yₙ₊₁ = yₙ + f(xₙ,yₙ)·Δx`."]}],
 tip:"Separable-equation FRQs award a point for the +C and a point for using the initial condition. Never skip either.",
 terms:["slope field","separable equation","particular solution","exponential model","logistic growth"],
 cards:[
 ["What does a slope field show?","The slope dy/dx of solution curves at sample points in the plane."],
 ["Steps to solve a separable differential equation","Separate variables, integrate both sides, add C, apply the initial condition, solve for y, state the domain."],
 ["Solution of dy/dt = ky","y = y₀e^{kt}"],
 ["Why state the domain of a particular solution?","The solution is only valid on the largest interval containing the initial x-value where the function is defined and differentiable."],
 ["dy/dx depends only on y. What does the slope field look like?","Slopes are constant along horizontal lines."],
 ["Newton's law of cooling solution","T(t) = Tₐ + (T₀ − Tₐ)e^{kt}"],
 ["How do you verify a given function solves a differential equation?","Differentiate it and substitute into both sides; the equation must hold identically."]]},

{title:"Applications of Integration", weight:[10,15],
 desc:"Average value, area between curves, and volume.",
 notes:[
  {h:"Average value and net change",b:[
   "**Average value** of f on [a,b] is `(1/(b−a))∫ₐᵇ f dx`. Do not confuse it with the average rate of change (a slope).",
   "MVT for integrals: a continuous f attains its average value somewhere on [a,b].",
   "Net change of a quantity = integral of its rate. Units: (rate units) × (units of the variable)."]},
  {h:"Area between curves",b:[
   "Vertical slices: `∫(top − bottom)dx`. Horizontal slices: `∫(right − left)dy`.",
   "Find intersections first to set limits; split the integral where the top and bottom functions swap.",
   "Choose dy when the region's left and right boundaries are single functions of y — it often avoids splitting."]},
  {h:"Volumes of revolution",b:[
   "**Disks**: radius R(x) from the axis, `V = π∫R² dx`.",

qbank:[
{u:1,q:"If f(x) = (x² − 9)/(x − 3) for x ≠ 3, what value of f(3) makes f continuous at x = 3?",c:["0","3","6","The function cannot be made continuous"],a:2,e:"Factor: (x−3)(x+3)/(x−3) = x + 3 for x ≠ 3, so the limit at 3 is 6. Defining f(3) = 6 removes the discontinuity."},
{u:1,q:"lim x→∞ (3x² − 5)/(2x² + 7x) =",c:["0","3/2","3/7","∞"],a:1,e:"Degrees are equal, so the limit is the ratio of leading coefficients, 3/2."},
{u:2,q:"If f(x) = x³ln x, then f′(x) =",c:["3x²ln x","x² + 3x²ln x","3x² + x²","x²(1 + 3ln x)"],a:3,e:"Product rule: 3x²ln x + x³(1/x) = 3x²ln x + x² = x²(1 + 3ln x). Choices B and D are the same value; D is the factored form written correctly."},
{u:3,q:"If x² + xy = 6, then dy/dx =",c:["(−2x − y)/x","(2x + y)/x","−2x/y","(6 − 2x)/x"],a:0,e:"Differentiate: 2x + y + x·dy/dx = 0, so dy/dx = (−2x − y)/x."},
{u:4,q:"A particle moves with v(t) = t² − 4t. At t = 1 the particle is",c:["moving right and speeding up","moving left and speeding up","moving left and slowing down","at rest"],a:1,e:"v(1) = 1 − 4 = −3 < 0, so the particle moves left. a(t) = 2t − 4, so a(1) = −2 < 0. Velocity and acceleration share a sign, so the particle is speeding up."},
{u:4,q:"The radius of a circle increases at 2 cm/s. How fast is the area increasing when r = 5 cm?",c:["10π cm²/s","20π cm²/s","25π cm²/s","4π cm²/s"],a:1,e:"A = πr², dA/dt = 2πr·dr/dt = 2π(5)(2) = 20π cm²/s."},
{u:5,q:"If f′(x) = (x − 2)²(x + 1), then f has",c:["a local max at x = −1 only","a local min at x = −1 only","local extrema at both x = −1 and x = 2","no local extrema"],a:1,e:"f′ changes − to + at x = −1 (local min). At x = 2 the factor is squared, so f′ does not change sign — no extremum."},
{u:5,q:"The graph of f″ is positive on (0,4) and negative on (4,7). What happens at x = 4?",c:["f has a local maximum","f has a local minimum","f has an inflection point","f is not differentiable"],a:2,e:"Concavity changes from up to down, so x = 4 is an inflection point of f."},
{u:6,q:"If g(x) = ∫₁^{x²} sin t dt, then g′(x) =",c:["sin(x²)","2x·sin(x²)","cos(x²) − cos 1","2x·cos(x²)"],a:1,e:"FTC Part 1 with the chain rule: g′(x) = sin(x²)·d/dx(x²) = 2x sin(x²)."},
{u:6,q:"∫₀² (3x² + 2) dx =",c:["8","10","12","14"],a:2,e:"x³ + 2x evaluated from 0 to 2 gives 8 + 4 = 12."},
{u:6,q:"A table gives f at x = 0, 2, 5, 6. A trapezoidal approximation of ∫₀⁶ f dx uses",c:["three trapezoids of equal width","three trapezoids of widths 2, 3, 1","six rectangles","two trapezoids"],a:1,e:"The subintervals are [0,2], [2,5], [5,6], so the widths are 2, 3, and 1. Compute each trapezoid separately."},
{u:7,q:"Which is the general solution of dy/dx = 2xy?",c:["y = x² + C","y = Ce^{x²}","y = Ce^{2x}","y = x²y + C"],a:1,e:"Separate: dy/y = 2x dx → ln|y| = x² + C → y = Ce^{x²}."},
{u:8,q:"The region bounded by y = x² and y = 4 is revolved about y = 4. The volume is",c:["π∫₋₂² (4 − x²)² dx","π∫₋₂² (4 − x²) dx","π∫₋₂² (16 − x⁴) dx","2π∫₀² x(4 − x²) dx"],a:0,e:"Revolving about y = 4 makes the radius 4 − x², so V = π∫(4 − x²)² dx from −2 to 2."},
{u:8,q:"The average value of f(x) = 6x on [0,4] is",c:["6","12","24","48"],a:1,e:"(1/4)∫₀⁴ 6x dx = (1/4)(3x²)|₀⁴ = (1/4)(48) = 12."}
]

{title:"Parametric Equations, Polar Coordinates, and Vector-Valued Functions",weight:[11,12],
 desc:"Curves described by a parameter or an angle, and motion in the plane.",
 notes:[
  {h:"Parametric curves",b:[
   "x and y are both functions of t. **`dy/dx = (dy/dt)/(dx/dt)`** whenever dx/dt ≠ 0.",
   "Second derivative: `d²y/dx² = [d/dt(dy/dx)] / (dx/dt)` — differentiate the slope with respect to t, then divide by dx/dt again. Do **not** divide the second derivatives.",
   "Horizontal tangent: dy/dt = 0 with dx/dt ≠ 0. Vertical tangent: dx/dt = 0 with dy/dt ≠ 0.",
   "Eliminate the parameter to identify a familiar curve when the algebra is easy."]},
  {h:"Vector-valued functions and planar motion",b:[
   "Position `⟨x(t), y(t)⟩`, velocity `⟨x′, y′⟩`, acceleration `⟨x″, y″⟩`.",
   "**Speed = |v| = √((dx/dt)² + (dy/dt)²)** — a scalar. Velocity is the vector.",
   "**Total distance traveled** = `∫√((dx/dt)² + (dy/dt)²)dt`; displacement is the vector `⟨∫x′dt, ∫y′dt⟩`.",
   "Recover position from velocity with an initial condition: `x(t) = x(0) + ∫₀ᵗ x′(s)ds`, componentwise."]},
  {h:"Polar coordinates",b:[
   "`x = r cos θ`, `y = r sin θ`, `r² = x² + y²`. A point has many polar names; negative r reflects through the origin.",
   "Slope on a polar curve: convert to parametric in θ and use `dy/dx = (dy/dθ)/(dx/dθ)` where `y = r(θ)sin θ`, `x = r(θ)cos θ`.",
   "Common curves: `r = a` circle, `r = a cos θ` circle through the origin, `r = a ± b cos θ` limaçon/cardioid, `r = a cos(nθ)` rose."]},
  {h:"Polar area",b:[

   "Region **between** two polar curves: `A = ½∫(r_outer² − r_inner²)dθ` — find the θ-values where they intersect first.",
   "Getting the limits right is most of the work: sketch the curve, and use symmetry (double a half-region) when it is clean.",
   "For a rose petal, find consecutive θ where r = 0 to bound one petal."]}],

{title:"Infinite Sequences and Series",weight:[17,18],
 desc:"Convergence tests, power series, Taylor polynomials, and error bounds. The largest BC-only unit.",
 notes:[
  {h:"Sequences and basic series",b:[
   "A series converges when its sequence of **partial sums** has a finite limit.",
   "**nth-term test**: if aₙ does not approach 0, the series diverges. If aₙ → 0 the test says nothing.",
   "**Geometric** `Σarⁿ` converges iff `|r| < 1`, with sum `a/(1−r)` (a is the first term).",
   "**p-series** `Σ1/nᵖ` converges iff `p > 1`. The harmonic series (p = 1) diverges.",
   "**Telescoping** series: write partial fractions and watch terms cancel."]},
  {h:"Convergence tests",b:[
   "**Integral test**: for positive, decreasing, continuous f with aₙ = f(n), the series and `∫₁^∞ f` converge or diverge together.",
   "**Direct comparison**: if 0 ≤ aₙ ≤ bₙ and Σbₙ converges, so does Σaₙ; if aₙ ≥ bₙ ≥ 0 and Σbₙ diverges, so does Σaₙ.",
   "**Limit comparison**: if `lim aₙ/bₙ` is a finite positive number, the two series behave alike. Best for messy algebraic terms.",
   "**Alternating series test**: Σ(−1)ⁿbₙ converges if bₙ is eventually decreasing and bₙ → 0.",
   "**Ratio test**: compute `L = lim|aₙ₊₁/aₙ|`. L < 1 converges absolutely, L > 1 diverges, L = 1 inconclusive. This is the go-to test for factorials and powers.",
   "**Absolute vs conditional**: Σ|aₙ| converges ⇒ absolute convergence. If Σaₙ converges but Σ|aₙ| does not, convergence is conditional."]},
  {h:"Power series and radius of convergence",b:[
   "A power series `Σcₙ(x − a)ⁿ` converges on an interval centered at a. Use the **ratio test** to find the radius R, then **test both endpoints separately**.",
   "Endpoints often produce a p-series or an alternating series — that is where the interval becomes half-open.",
   "Differentiate and integrate power series term by term inside the interval; the radius is unchanged (endpoints may change).",
   "Build new series from known ones by substitution, multiplication by a power of x, differentiation, or integration — faster than computing derivatives."]},
  {h:"Taylor polynomials and error",b:[
   "**Taylor polynomial** about a: `Pₙ(x) = Σ f⁽ᵏ⁾(a)(x−a)ᵏ/k!`. Maclaurin means a = 0.",
   "Memorize the Maclaurin series for eˣ, sin x, cos x, and 1/(1−x); most series FRQs start from one of them.",
   "**Alternating series error bound**: the error after n terms is at most the absolute value of the **first omitted term**.",
   "**Lagrange error bound**: `|Rₙ(x)| ≤ M|x − a|ⁿ⁺¹/(n+1)!` where M bounds `|f⁽ⁿ⁺¹⁾|` on the interval between a and x. State what M is and why."]}],
 tip:"For a series FRQ, name the test you are using and verify its hypotheses out loud. 'By the ratio test, lim = 0 < 1, so the series converges for all x.'",
 terms:["partial sum","geometric series","p-series","ratio test","alternating series","radius of convergence","Taylor polynomial","Lagrange error bound"],
 cards:[
 ["Geometric series Σar^n: convergence and sum","Converges iff |r| < 1, with sum a/(1 − r)."],
 ["p-series Σ1/nᵖ converges when","p > 1"],
 ["What can the nth-term test prove?","Only divergence. If aₙ → 0 it gives no information."],
 ["Ratio test conclusions","L = lim|aₙ₊₁/aₙ|: L < 1 absolutely convergent, L > 1 divergent, L = 1 inconclusive."],
 ["Alternating series test conditions","Terms alternate, |aₙ| is eventually decreasing, and aₙ → 0."],
 ["Alternating series error bound","The error is at most the absolute value of the first omitted term."],
 ["Lagrange error bound","|Rₙ(x)| ≤ M|x − a|ⁿ⁺¹/(n+1)!, where M ≥ |f⁽ⁿ⁺¹⁾| on the interval."],
 ["Maclaurin series for eˣ","1 + x + x²/2! + x³/3! + ... = Σ xⁿ/n!"],
 ["Maclaurin series for sin x","x − x³/3! + x⁵/5! − ... = Σ(−1)ⁿx^{2n+1}/(2n+1)!"],
 ["Maclaurin series for cos x","1 − x²/2! + x⁴/4! − ... = Σ(−1)ⁿx^{2n}/(2n)!"],
 ["Maclaurin series for 1/(1 − x)","1 + x + x² + x³ + ... for |x| < 1"],
 ["Conditional vs absolute convergence","Absolute: Σ|aₙ| converges. Conditional: Σaₙ converges but Σ|aₙ| diverges."],
 ["How do you find the interval of convergence?","Use the ratio test for the radius, then test each endpoint separately by substitution."],
 ["Taylor polynomial of degree n about a","Pₙ(x) = Σ_{k=0}^{n} f⁽ᵏ⁾(a)(x − a)ᵏ / k!"],
 ["Which test handles factorials best?","The ratio test."]]}
],

{u:9,q:"A curve is given by x = t² and y = t³ − 3t. At t = 1, dy/dx =",c:["0","1/2","3/2","undefined"],a:0,e:"dy/dt = 3t² − 3 = 0 at t = 1; dx/dt = 2t = 2. So dy/dx = 0/2 = 0 — a horizontal tangent."},
{u:9,q:"The area enclosed by one petal of r = 2 sin(2θ) is",c:["π/2","π","2π","π/4"],a:0,e:"One petal runs from θ = 0 to π/2. A = ½∫₀^{π/2} 4sin²(2θ)dθ = 2∫₀^{π/2} sin²(2θ)dθ = 2(π/4) = π/2."},

{u:10,q:"Which series converges?",c:["Σ 1/√n","Σ 1/n","Σ (−1)ⁿ/n","Σ n/(n+1)"],a:2,e:"Σ(−1)ⁿ/n converges by the alternating series test (conditionally). The first two are p-series with p ≤ 1; the last has terms approaching 1."},
{u:10,q:"The radius of convergence of Σ xⁿ/n! is",c:["1","e","0","∞"],a:3,e:"Ratio test: |x|/(n+1) → 0 < 1 for every x, so the series converges everywhere and R = ∞."},
{u:10,q:"The third-degree Maclaurin polynomial for cos x is",c:["1 − x²/2","1 − x²/2 + x³/6","x − x³/6","1 − x²/2 + x⁴/24"],a:0,e:"cos x has only even powers; through degree 3 the polynomial is 1 − x²/2 (the x³ coefficient is 0)."},
{u:6,q:"∫ x·eˣ dx =",c:["xeˣ + C","xeˣ − eˣ + C","eˣ(x + 1) + C","x²eˣ/2 + C"],a:1,e:"By parts with u = x, dv = eˣdx: xeˣ − ∫eˣdx = xeˣ − eˣ + C."},
{u:7,q:"For dP/dt = 0.5P(1 − P/200) with P(0) = 50, P grows fastest when P =",c:["50","100","150","200"],a:1,e:"Logistic growth is fastest at half the carrying capacity, P = 100."},
{u:8,q:"The length of the curve y = x^{3/2} from x = 0 to x = 1 is",c:["∫₀¹ √(1 + 9x/4) dx","∫₀¹ √(1 + x³) dx","∫₀¹ (3/2)√x dx","∫₀¹ √(1 + 3x/2) dx"],a:0,e:"f′ = (3/2)x^{1/2}, so (f′)² = 9x/4 and L = ∫₀¹√(1 + 9x/4)dx."}
