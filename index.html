units:[
{title:"The Rhetorical Situation",weight:[20,25],
 desc:"Reading nonfiction for exigence, audience, purpose, and the writer's position.",
 notes:[
  {h:"Elements of the rhetorical situation",b:[
   "**Exigence** is the circumstance that makes the text necessary — the problem, event, or occasion the writer is responding to.",
   "**Audience** is specific. Identify not just who is listening but what they already believe, value, and fear. Writers adapt to that.",
   "**Purpose** is what the writer wants to happen: to persuade, to defend, to call to action, to reframe, to unify.",
   "**Context** includes the historical moment and the genre's conventions — a eulogy, a commencement address, a letter of protest, and an op-ed each carry different expectations."]},
  {h:"Writer, persona, and tone",b:[
   "The **speaker** is a constructed persona, not simply the author. A writer may present themselves as humble, outraged, reasonable, or prophetic depending on what the audience requires.",
   "**Tone** is attitude, and it must be named precisely: 'indignant', 'wry', 'conciliatory', 'elegiac'. 'Negative' and 'interesting' earn nothing.",
   "Tone can shift mid-text; noticing the shift and explaining why it occurs is strong analysis.",
   "Identify the relationship the writer builds with the audience — ally, critic, insider, outsider — and how word choice signals it."]},
  {h:"Analyzing choices, not cataloguing devices",b:[
   "The rhetorical analysis essay rewards **why**, not **what**. Naming a device without explaining its effect earns nothing.",
   "The sentence pattern to use: 'Because the audience is ___, the writer ___, which ___ in order to ___.'",
   "Select two or three substantial choices rather than listing eight devices shallowly. Depth beats coverage.",
   "Consider structural choices too — where the writer concedes, where they shift from the general to the personal, and what they save for last."]}],
 tip:"Never write 'the author uses pathos to appeal to emotions.' Name the specific choice, the specific audience, and the specific effect.",
 terms:["exigence","audience","purpose","context","persona","tone","rhetorical choice","kairos","ethos","logos","pathos"],
 cards:[
 ["What is exigence?","The circumstance, problem, or event that prompts a writer to write."],
 ["Why is audience more than 'who is reading'?","Effective analysis identifies what the audience already believes and values, because that determines the writer's choices."],
 ["Difference between the author and the speaker","The speaker is the persona the author constructs for a particular purpose and audience."],
 ["What makes a tone word strong in an essay?","Precision — 'indignant' or 'conciliatory' rather than vague labels like 'negative'."],
 ["Define ethos, logos, and pathos","Ethos appeals to credibility and shared values, logos to reasoning and evidence, pathos to emotion and identification."],
 ["What is kairos?","The timeliness of an appeal — why this argument works at this particular moment."],
 ["What sentence frame produces real rhetorical analysis?","'Because the audience is ___, the writer ___, which ___ in order to ___.'"],
 ["Why does naming a device without explanation earn no credit?","The rubric rewards explaining how a choice advances the writer's purpose, not identification alone."]]},
{title:"Claims and Evidence",weight:[20,25],
 desc:"Finding and evaluating claims, then building your own with evidence.",
 notes:[
  {h:"Reading for claims",b:[
   "A **claim** is an assertion requiring support. Distinguish the **thesis** (the central claim) from supporting claims and from evidence.",
   "Claims may be **claims of fact**, **value**, or **policy**. Identify which, because each demands a different kind of support.",
   "**Qualifiers** ('often', 'in most cases', 'arguably') narrow a claim and make it more defensible. Unqualified absolutes are easy to refute.",
   "Identify the **assumptions** linking evidence to claim. Unstated assumptions are where arguments are strongest or weakest."]},
  {h:"Evidence and its evaluation",b:[
   "Kinds of evidence: statistics and data, expert testimony, anecdote and personal experience, historical example, analogy, and hypothetical illustration.",
   "Evaluate evidence on **relevance**, **sufficiency**, **accuracy**, and **representativeness** — not merely whether it exists.",
   "Common fallacies: **hasty generalization**, **false dilemma**, **straw man**, **ad hominem**, **post hoc**, **slippery slope**, and appeals to improper authority.",
   "Counterargument handled well strengthens a position: **concede** what is true, then **refute** or **qualify**."]},
  {h:"Writing a defensible thesis",b:[
   "A thesis must be **defensible** — a position someone could reasonably dispute. A summary of the prompt is not a thesis.",
   "The strongest theses preview a **line of reasoning** without becoming a three-item list: they state the position and the basis for it.",
   "Avoid hedging into vagueness ('there are many sides to this issue'). Commit.",
   "For the synthesis essay, your thesis answers the prompt's question; the sources serve your argument rather than structuring it."]}],
 tip:"Row A is one point you should never lose. Write a clear, arguable, prompt-responsive thesis in the first paragraph, every time.",
 terms:["claim","thesis","qualifier","assumption","relevance","sufficiency","hasty generalization","false dilemma","straw man","post hoc","concession","refutation","defensible thesis","line of reasoning"],
 cards:[
 ["What makes a thesis defensible?","It takes a position that a reasonable person could dispute, rather than stating a fact or restating the prompt."],
 ["What does a qualifier do to a claim?","It narrows the claim's scope, making it harder to refute and more credible."],
 ["Four criteria for evaluating evidence","Relevance, sufficiency, accuracy, and representativeness."],
 ["What is a straw man fallacy?","Misrepresenting an opposing position in a weakened form in order to refute it easily."],
 ["What is a false dilemma?","Presenting only two options when more exist."],
 ["What is a post hoc fallacy?","Assuming that because one event followed another, the first caused the second."],
 ["How should a writer handle counterargument?","Concede what is legitimate, then refute or qualify it — which strengthens rather than weakens the argument."],
 ["What is the role of sources in the synthesis essay?","They serve as evidence for your own argument, not as the organizing structure of the essay."]]},
{title:"Reasoning and Organization",weight:[20,25],
 desc:"Building a line of reasoning and structuring paragraphs and whole essays.",
 notes:[
  {h:"Line of reasoning",b:[
   "A **line of reasoning** is the logical sequence of claims that leads the reader to your thesis. Each paragraph should advance it, not restate it.",
   "Organizational patterns: least to most important, chronological, problem-solution, cause-effect, comparison, concession-then-refutation.",
   "Paragraph structure: a **topic sentence** making a claim, evidence, then **commentary** explaining how the evidence supports the claim and connects to the thesis.",
   "The commentary is where most points live. Aim for at least two sentences of explanation for every piece of evidence."]},
  {h:"Coherence and transitions",b:[
   "**Transitions** signal relationships — addition, contrast, concession, cause, consequence — and make the reasoning visible.",
   "Repeating key terms from the thesis keeps the essay unified; repeating whole sentences does not.",
   "Introductions should be brief: establish the issue and state the thesis. Long windups waste time you need for commentary.",
   "Conclusions should extend rather than repeat: name a broader implication, a limit of the argument, or what follows from it."]},
  {h:"Sophistication (Row C)",b:[
   "The sophistication point goes to essays that do one of: explore the **complexity** of the issue, place the argument in a **broader context**, articulate **tensions** within the evidence, or sustain a **vivid and persuasive style**.",
   "Cheap routes do not work: a single 'however' or a final sentence about human nature will not earn it.",
   "A reliable method is to identify a genuine tension — between two goods, between the writer's aim and the audience's resistance, between short- and long-term effects — and carry it through the essay.",
   "Consistent control of sentence variety and precise diction can earn the point on style alone, but only if the argument is already sound."]}],
 tip:"Budget time: about 40 minutes per essay, with 5 minutes of planning. A clear plan is worth more than an extra paragraph.",
 terms:["line of reasoning","topic sentence","commentary","transition","coherence","concession-refutation structure","sophistication","complexity"],
 cards:[
 ["What is a line of reasoning?","The logical progression of claims and evidence that leads the reader from the first paragraph to the thesis."],
 ["What three parts should a body paragraph contain?","A claim in a topic sentence, specific evidence, and commentary explaining how the evidence supports the claim."],
 ["Where do most Row B points come from?","Commentary — the explanation connecting evidence to the claim and to the thesis."],
 ["Name four ways to earn the sophistication point","Explore complexity, situate the argument in a broader context, articulate tensions in the evidence, or sustain a vivid and persuasive style."],
 ["What should a conclusion do?","Extend the argument — state an implication, a limit, or a consequence — rather than restate it."],
 ["How much time should each essay get?","About 40 minutes, including roughly 5 minutes of planning."]]},
{title:"Style",weight:[15,20],
 desc:"Diction, syntax, and the grammar tested in the writing multiple choice.",
 notes:[
  {h:"Diction and syntax",b:[
   "**Diction** is word choice. Describe it precisely: concrete versus abstract, formal versus colloquial, technical, archaic, euphemistic, loaded.",
   "**Syntax** is sentence construction. Short sentences create emphasis and urgency; long accumulating sentences create sweep or overwhelm; fragments punctuate.",
   "**Periodic sentences** delay the main clause for suspense; **cumulative sentences** lead with it and add detail.",
   "**Parallelism**, **antithesis**, **anaphora**, **asyndeton**, and **polysyndeton** are syntactic choices with predictable effects — name the effect, not just the term.",
   "**Figurative language** (metaphor, simile, personification, metonymy) and **irony** shape how an audience feels about a subject."]},
  {h:"The writing multiple choice",b:[
   "Roughly half the multiple choice asks you to revise a draft. Questions test thesis and claim quality, evidence relevance, transitions, sentence combination, modifier placement, punctuation, and consistency of tone.",
   "Read the **question stem** carefully: 'which revision best accomplishes the writer's goal' means the purpose stated in the stem governs, not general elegance.",
   "Prefer the option that is both grammatical and purposeful. Eliminate choices that add irrelevant information, however fluent.",
   "Common conventions tested: subject-verb agreement, pronoun clarity, parallel structure in a series, comma splices, colon and semicolon use, and dangling modifiers."]},
  {h:"The reading multiple choice",b:[
   "Questions ask about the rhetorical function of a sentence or paragraph, the effect of a word choice, the writer's likely audience, and the relationship between parts of the passage.",
   "Answer from the passage, not from plausibility. The correct option can always be located in the text.",
   "Watch for options that are true but do not answer the question asked — the most common trap.",
   "Line-reference questions reward reading two sentences before and after the cited line."]}],
 tip:"In multiple choice, the stem's stated goal is the whole question. If it says 'to emphasize the contrast', the answer is the one that creates contrast, even if another choice sounds better.",
 terms:["diction","syntax","periodic sentence","cumulative sentence","parallelism","antithesis","anaphora","asyndeton","polysyndeton","juxtaposition","irony","metaphor","dangling modifier","comma splice"],
 cards:[
 ["Periodic vs cumulative sentence","A periodic sentence delays the main clause to the end; a cumulative sentence begins with it and adds detail after."],
 ["What is anaphora and its typical effect?","Repetition of a word or phrase at the beginning of successive clauses, which builds rhythm and emphasis."],
 ["Asyndeton vs polysyndeton","Asyndeton omits conjunctions for speed and starkness; polysyndeton piles them up for accumulation and weight."],
 ["What is antithesis?","Parallel grammatical structure expressing contrasting ideas."],
 ["What is juxtaposition?","Placing two contrasting elements side by side so the contrast itself carries meaning."],
 ["What does the writing multiple choice mainly test?","Revision for purpose: thesis quality, evidence relevance, transitions, sentence combination, and conventions."],
 ["What is the most common multiple-choice trap?","An option that is true about the passage but does not answer the question that was asked."],
 ["What is a dangling modifier?","A modifying phrase whose intended subject does not appear in the sentence, so it appears to modify the wrong thing."]]},
{title:"The Three Essays in Practice",weight:[0,0],
 desc:"Concrete process for Q1, Q2, and Q3 under time pressure.",
 notes:[
  {h:"Q1 Synthesis",b:[
   "Read the prompt first, then the sources with your position forming as you go. Annotate each source with one phrase: what it claims and how you could use it.",
   "Write a thesis that answers the prompt. Then build paragraphs around **your** claims, citing sources as support (at least three).",
   "Cite by letter or author: 'As Source C argues, ...' Never organize paragraphs source by source — that produces summary.",
   "Use a source against itself or in tension with another for the sophistication point."]},
  {h:"Q2 Rhetorical Analysis",b:[
   "Read the italicized introduction — it gives you speaker, occasion, and audience, which are most of the rhetorical situation.",
   "Mark two or three substantial choices and a structural shift. Write the thesis as a claim about the writer's purpose and strategy, not a list of devices.",
   "Each paragraph: the choice, a short quoted piece of evidence, then commentary about the effect on that audience and the advancement of that purpose.",
   "Quote briefly — a few words, not whole sentences. Long quotations crowd out commentary."]},
  {h:"Q3 Argument",b:[
   "Take a clear position quickly; the prompt is designed to be arguable either way. A nuanced position is fine as long as it is a position.",
   "Evidence can come from history, literature, current events, science, or personal observation. Specific beats general every time — one developed example is worth three vague gestures.",
   "Build in a concession paragraph: state the strongest opposing view honestly, then answer it.",
   "Avoid manufactured statistics and invented quotations; graders notice, and it undermines credibility."]}],
 tip:"Write legibly and in ink. Spend the first five minutes planning each essay — essays that are planned almost always score higher than essays that are longer.",
 terms:["synthesis","source citation","rhetorical analysis","structural shift","concession paragraph","specificity"],
 cards:[

units:[
{title:"Short Fiction: Character, Setting, and Conflict",weight:[20,25],
 desc:"Reading a story closely — who people are, where they are, and what they want.",
 notes:[
  {h:"Character",b:[
   "Characters are revealed by what they say, what they do, what others say about them, and what the narrator withholds. **Indirect characterization** is usually more interesting to analyze than direct description.",
   "A **round** character has complexity and can change; a **flat** character serves a function. A **foil** highlights another character by contrast.",
   "Character **inconsistency** is often the point: contradictions signal internal conflict, which is where meaning usually lives.",
   "Track **change**: what a character believes at the start, what happens, what they believe at the end. If nothing changes, that is also meaningful."]},
  {h:"Setting and atmosphere",b:[
   "Setting is place, time, and social world. It constrains what characters can do and want, and it often externalizes their state.",
   "Shifts in setting usually mark shifts in the story's argument — a character leaves home, enters a different class world, moves indoors.",
   "**Atmosphere** comes from the sensory details selected. Ask what the narration chooses to notice, because selection is interpretation."]},
  {h:"Conflict and plot structure",b:[
   "External conflict pits a character against another person, a society, or nature; **internal conflict** divides a character against themselves. Strong essays usually find the internal one.",
   "Structural choices carry meaning: **in medias res** openings, **flashback**, **foreshadowing**, a **frame narrative**, and where the story chooses to end.",
   "The **climax** is the point of greatest tension or decision, not necessarily the loudest event.",
   "Unresolved endings are choices. Ask what an ambiguity invites the reader to weigh."]}],
 tip:"For prose passages, decide the relationship or tension the passage is really about before you start writing. The thesis should name it.",
 terms:["indirect characterization","round character","flat character","foil","internal conflict","atmosphere","in medias res","frame narrative","foreshadowing","climax"],
 cards:[
 ["What is indirect characterization?","Revealing character through speech, action, thought, and others' reactions rather than direct description."],
 ["What is a foil?","A character whose contrast illuminates the qualities of another character."],
 ["Round vs flat character","A round character is complex and capable of change; a flat character serves a limited narrative function."],
 ["Why does character inconsistency matter in analysis?","Contradictions usually reveal internal conflict, which is where the work's meaning tends to reside."],
 ["How does setting do more than locate a story?","It constrains what characters can want and do, and it often externalizes their inner state."],
 ["What does 'in medias res' mean?","Beginning in the middle of the action rather than at the chronological start."],
 ["Where is the climax of a story?","At the point of greatest tension or decisive choice, which is not always the most dramatic event."]]},
{title:"Poetry: Figurative Language, Structure, and Sound",weight:[20,25],
 desc:"Reading poems for speaker, image, form, and turn.",
 notes:[
  {h:"Speaker and situation",b:[
   "Begin with the dramatic situation: who is speaking, to whom, in what circumstance, and why now. This prevents the most common error — paraphrasing without interpreting.",
   "The speaker is not the poet. An **apostrophe** addresses an absent person, the dead, or an abstraction, which creates a particular intimacy or desperation.",
   "Identify the poem's **attitude** toward its subject, and whether that attitude changes."]},
  {h:"Figurative language and imagery",b:[
   "**Metaphor** and **simile** claim a likeness; ask what the comparison **gains and costs** — what it reveals and what it suppresses.",
   "**Imagery** works in patterns. One image is detail; a pattern of images is an argument. Track the pattern and note where it breaks.",
   "**Personification**, **metonymy**, and **synecdoche** redistribute agency and scale. **Paradox** and **oxymoron** hold contradictions open rather than resolving them.",
   "**Symbol** differs from image by accruing meaning across the poem; **allusion** imports meaning from outside it."]},
  {h:"Form, structure, and sound",b:[
   "Note the **form**: sonnet (with its expected turn), villanelle (with obsessive repetition), ballad, ode, elegy, or free verse. Form creates expectations a poem can fulfill or violate.",
   "The **volta** or shift — often at a stanza break, a 'but', or a change of tense — is usually the center of the poem's argument and the best place to anchor a thesis.",
   "**Enjambment** creates momentum or ambiguity across a line break; **caesura** and end-stops create pause and finality. Notice where the syntax and the lineation disagree.",
   "Sound: **meter** and departures from it, **rhyme** (full, slant, internal), **alliteration**, **assonance**, and **consonance**. Always connect sound to sense — say what the sound does to the meaning."]}],
 tip:"Anchor the poetry essay at the shift. Describe the poem before the turn, the turn itself, and the poem after it — that structure produces a line of reasoning almost automatically.",
 terms:["speaker","apostrophe","metaphor","simile","imagery","personification","metonymy","synecdoche","paradox","symbol","allusion","sonnet","volta","enjambment","caesura","meter","slant rhyme","alliteration","assonance"],
 cards:[
 ["What should you establish first in reading a poem?","The dramatic situation: who speaks, to whom, in what circumstance, and why."],
 ["What is apostrophe in poetry?","Direct address to an absent person, the dead, or an abstraction."],
 ["What question makes metaphor analysis substantive?","What the comparison reveals and what it suppresses — what it gains and costs."],
 ["Difference between an image and a symbol","An image is a single sensory detail; a symbol accumulates meaning across the work."],
 ["What is the volta?","The turn in a poem where the argument or feeling shifts, classically in a sonnet."],
 ["What is enjambment and what does it do?","A line continuing without pause into the next, creating momentum or momentary ambiguity."],
 ["What is a caesura?","A distinct pause within a line of verse."],
 ["What is slant rhyme?","An approximate rhyme in which the sounds are similar but not identical."],
 ["What must you always do after identifying a sound device?","Connect it to meaning — explain what the sound accomplishes for the poem's sense."]]},
{title:"Longer Fiction and Drama",weight:[20,25],
 desc:"Narration, structure at scale, and preparing works for the open question.",
 notes:[
  {h:"Narration and point of view",b:[
   "**First person** gives intimacy and limits knowledge. **Third limited** filters through one consciousness. **Third omniscient** can judge and compare. Each controls what the reader can know and therefore what they can conclude.",
   "An **unreliable narrator** invites the reader to read past the narration. Look for gaps between what the narrator claims and what the scene shows.",
   "**Free indirect discourse** colors narration with a character's idiom without quoting them, which blurs sympathy and judgment.",
   "Narrative **distance** can shift within a work; shifts in distance usually track shifts in sympathy."]},
  {h:"Structure at scale",b:[
   "In long works, meaning emerges from **pattern**: repeated scenes, parallel plots, recurring **motifs**, and the arrangement of contrasts.",
   "Drama adds staging, soliloquy, **dramatic irony** (the audience knows what a character does not), and the pressure of scene and act divisions.",
   "The ending reinterprets everything before it. Ask what the resolution endorses, refuses, or leaves open.",
   "**Theme** should be phrased as a claim the work makes, not a topic. 'Ambition' is a topic; 'the novel presents ambition as inseparable from self-deception' is a theme."]},
  {h:"Preparing works for Q3",b:[
   "Choose two or three works you know deeply rather than many you know vaguely — ideally one novel, one drama, and one of your own choosing.",
   "For each, prepare: the central conflict, three or four specific scenes with details you can recall accurately, the arc of the protagonist, major motifs, and two or three defensible themes.",
   "Specific evidence means named characters, concrete actions, and particular moments — not plot summary. Graders reward precision of recall.",
   "Practice bending a prepared work to an unexpected prompt. The skill is matching the prompt's concept to a scene you already know."]}],
 tip:"For Q3, never retell the plot. Choose three scenes, state what each shows, and explain how each supports your interpretive claim.",
 terms:["first person","third limited","omniscient narrator","unreliable narrator","free indirect discourse","narrative distance","motif","parallel plot","dramatic irony","soliloquy","theme"],
 cards:[
 ["How does point of view shape interpretation?","It determines what the reader can know and therefore what conclusions are available."],
 ["How do you detect an unreliable narrator?","Look for gaps between what the narrator asserts and what the scene actually shows."],
 ["What is free indirect discourse?","Third-person narration inflected with a character's own idiom and perspective without direct quotation."],
 ["What is dramatic irony?","The audience knows something a character does not, which charges their words and actions with extra meaning."],
 ["What is a motif?","A recurring image, phrase, or situation that accumulates significance across a work."],
 ["How should a theme be phrased?","As a claim the work makes about its subject, not as a one-word topic."],
 ["How should you prepare works for the literary argument essay?","Know two or three works deeply: central conflict, several specific scenes with accurate details, the protagonist's arc, motifs, and a few defensible themes."]]},
{title:"Literary Argument and the Multiple Choice",weight:[15,20],
 desc:"Writing the interpretive essay, and reading the five MCQ passages efficiently.",
 notes:[
  {h:"Writing the interpretive essay",b:[
   "Row A requires a **defensible interpretive claim about meaning** — not an observation about technique, and not a plot summary. 'The poem uses imagery' is not a thesis; 'the poem's garden imagery exposes the speaker's nostalgia as a refusal to grieve' is.",
   "Row B rewards specific evidence plus **commentary** that explains how each piece advances the claim. Aim for two or more sentences of commentary per quotation.",
   "Row C rewards complexity: a tension the text does not resolve, an ambiguity you hold open, a relevant broader context, or sustained controlled prose.",
   "Structure that works: claim, then three paragraphs each taking up one element of the text that builds the claim, then a conclusion naming the implication."]},
  {h:"Common essay errors",b:[
   "**Device listing** without interpretation. The device is never the point; the meaning it produces is.",
   "**Paraphrase** masquerading as analysis. If a sentence only restates what happens, cut it.",
   "Thesis that names technique instead of meaning. Start from what the text means, then show how it gets there.",
   "Quoting at length. Short quotations, extensively discussed, score better than long ones lightly touched.",
   "Beginning with generalities about literature or humanity. Start with the text."]},
  {h:"Multiple choice strategy",b:[
   "Five passages: typically two or three prose, two or three poetry. Budget about 12 minutes each and do not linger.",
   "Question types: literal comprehension, inference, the function of a line or paragraph, tone and attitude, figurative meaning, speaker and audience, structure, and occasionally a term.",
   "Every correct answer is supported by specific text. Eliminate options that are too strong, too broad, or outside the passage.",
   "Do the easier passage first if one is unfamiliar and dense; there is no penalty for order.",
   "Read the poem twice before answering: once for situation, once for argument."]}],
 tip:"Read the whole poem or passage before the questions. Answering as you read causes the misreadings that cost several questions at once.",
 terms:["interpretive claim","commentary","device listing","paraphrase","inference question","function question","tone question"],
 cards:[
 ["What must a literature essay thesis claim?","Something defensible about the text's meaning, not about which devices appear in it."],
 ["Why is device listing ineffective?","The rubric rewards explaining how choices create meaning; naming a device accomplishes nothing on its own."],
 ["How do you know a sentence is paraphrase rather than analysis?","It restates what happens without explaining what the choice accomplishes."],
 ["How should you budget time on the multiple choice?","Roughly 12 minutes per passage across five passages in 60 minutes."],
 ["What is the test for any multiple-choice answer?","It must be supportable by specific language in the passage."],
 ["How many times should you read a poem before answering questions?","Twice — once for the dramatic situation, once for its argument and shifts."]]}
],

{u:1,q:"A character whose contrast illuminates the protagonist is a",c:["foil","flat character","narrator","antagonist by definition"],a:0,e:"A foil exists to highlight qualities in another character through contrast."},
{u:1,q:"Beginning a narrative in the middle of the action is",c:["a frame narrative","in medias res","foreshadowing","stream of consciousness"],a:1,e:"The phrase means 'into the middle of things'."},
{u:2,q:"Direct address to an absent or abstract listener is",c:["allusion","apostrophe","metonymy","paradox"],a:1,e:"Apostrophe addresses someone or something that cannot answer."},
{u:2,q:"A line that continues without pause into the next line is",c:["end-stopped","enjambed","a caesura","blank verse"],a:1,e:"Enjambment carries syntax across the line break."},
{u:2,q:"The volta of a sonnet is",c:["its final couplet always","the turn in argument or feeling","its rhyme scheme","its meter"],a:1,e:"The volta is the shift, which may fall at different places depending on the sonnet's form."},
{u:3,q:"Narration inflected with a character's own idiom without quotation is",c:["dramatic monologue","free indirect discourse","soliloquy","omniscient narration"],a:1,e:"Free indirect discourse blends narrator and character voice."},
{u:3,q:"Dramatic irony occurs when",c:["a character speaks sarcastically","the audience knows something a character does not","the ending is unexpected","two images contrast"],a:1,e:"The gap between audience knowledge and character knowledge generates the irony."},
{u:4,q:"Which is a defensible thesis for a poetry analysis?",c:["The poem uses vivid imagery and metaphor.","The poet was writing in the nineteenth century.","The poem's recurring images of enclosure reveal the speaker's comfort in her own confinement.","The poem has three stanzas."],a:2,e:"Only this option makes an arguable claim about meaning rather than describing features."},
{u:4,q:"The most common weakness in literature essays is",c:["overly long quotations and device listing without interpretation","too much commentary","choosing an unusual text","writing too clearly"],a:0,e:"Points live in commentary, so summary and unexplained device identification waste the essay."}
]

units:[
{title:"Question and Explore",weight:[20,20],
 desc:"Turning curiosity into a researchable question and finding the right sources.",
 notes:[
  {h:"Framing a research question",b:[
   "A strong research question is **focused**, **arguable**, and **researchable** with the sources you can actually obtain. 'Is climate change real?' fails all three; 'How effective have municipal congestion charges been at reducing urban emissions?' succeeds.",
   "Start from a topic, narrow by scale (local, national, global), by population, by time period, or by one disputed mechanism.",
   "Distinguish questions of **fact**, **value**, and **policy**. Each requires a different kind of evidence.",
   "Expect to revise the question as you read. A question that survives contact with sources unchanged was probably too safe."]},
  {h:"Finding and reading sources",b:[
   "Use the school's database subscriptions and scholarly search rather than general web search alone; follow citation chains backward from a good article.",
   "**Primary sources** provide original evidence (data sets, interviews, documents, artworks); **secondary sources** interpret. You need both.",
   "Read strategically: abstract, introduction, conclusion, then methods and results. Decide quickly whether a source belongs in your argument.",
   "Keep an annotated working bibliography from the start — source, claim, how you will use it. Reconstructing citations later wastes hours."]},
  {h:"Methods and evidence types",b:[
   "Know the difference between **qualitative** (interviews, observation, textual analysis) and **quantitative** (surveys, experiments, statistics) methods, and what each can and cannot show.",
   "If you collect your own data, follow ethical practice: informed consent, no deception, anonymity, and appropriate permission for minors.",
   "Statistical claims require scrutiny: sample size, sampling method, correlation versus causation, and whether the measure actually captures the concept.",
   "Record limitations honestly. Naming what your evidence cannot establish strengthens your credibility with the reader and the rubric."]}],
 tip:"Write your research question as a single sentence and keep it visible. Every paragraph you write should be answerable to it.",
 terms:["research question","question of fact","question of value","question of policy","primary source","secondary source","annotated bibliography","qualitative method","quantitative method","informed consent","limitation"],
 cards:[
 ["Three qualities of a strong research question","Focused, arguable, and researchable with available sources."],
 ["Questions of fact, value, and policy","Fact asks what is true; value asks what is good or right; policy asks what should be done."],
 ["Primary vs secondary source","A primary source provides original evidence; a secondary source interprets or analyzes it."],
 ["What belongs in an annotated bibliography entry?","The citation, the source's central claim, and a note on how you intend to use it."],
 ["What can qualitative research show that quantitative cannot?","Meaning, context, and mechanism — why and how people experience something."],
 ["Name three ethical requirements for collecting your own data","Informed consent, anonymity or confidentiality, and appropriate permission when participants are minors."],
 ["Why should you state your research's limitations?","It demonstrates honest understanding of the evidence and is explicitly rewarded by the rubric."]]},
{title:"Understand, Analyze, and Evaluate Arguments",weight:[30,30],
 desc:"Reading a single argument well — the core skill on the end-of-course exam.",
 notes:[
  {h:"Identifying the argument",b:[
   "Separate the **claim** (what the author wants you to accept), the **line of reasoning** (the sequence of supporting claims), and the **evidence** (what each claim rests on).",
   "The thesis is often not in the first paragraph. Look for the sentence the rest of the text exists to support.",
   "Map the structure: what the author concedes, where they define terms, where they shift from diagnosis to prescription.",
   "Identify the **implications and consequences** the author draws, and whether they follow from what came before."]},
  {h:"Evaluating reasoning and evidence",b:[
   "Ask of each piece of evidence: is it **relevant**, **sufficient**, **accurate**, and **representative**? Most weak arguments fail on sufficiency or representativeness, not accuracy.",
   "Identify unstated **assumptions**. An argument is only as strong as the assumption linking its evidence to its claim.",
   "Name **fallacies** specifically when they occur: hasty generalization, false dilemma, straw man, ad hominem, post hoc, appeal to improper authority, slippery slope, circular reasoning.",
   "Evaluate the author's credibility and **bias** without dismissing them for it. Bias is a reason to scrutinize evidence, not a refutation."]},
  {h:"Multiple perspectives",b:[
   "A **perspective** is a point of view shaped by discipline, position, interest, and values — not merely an opinion. Use the lenses (economic, ethical, scientific, cultural, political, environmental, artistic, futuristic) to find perspectives you would otherwise miss.",
   "Identify where perspectives **genuinely conflict** and where they only appear to, because they answer different questions or use the same word differently.",
   "Resolving an apparent conflict by clarifying definitions is a sophisticated move that rubrics reward.",
   "Seek out the strongest version of the view you disagree with. Refuting a weak version is a straw man and costs credit."]}],
 tip:"On Part A of the exam, answer exactly what each of the three questions asks: the argument and line of reasoning, then the use of evidence, then an evaluation. Do not merge them.",
 terms:["claim","line of reasoning","evidence","assumption","relevance","sufficiency","representativeness","fallacy","bias","perspective","lens","apparent conflict"],
 cards:[
 ["What three things should you separate when analyzing an argument?","The claim, the line of reasoning, and the evidence."],
 ["Four criteria for evaluating evidence","Relevance, sufficiency, accuracy, and representativeness."],
 ["Why are unstated assumptions important?","An argument is only as strong as the assumption connecting its evidence to its conclusion."],
 ["Is identifying bias the same as refuting an argument?","No — bias is a reason to examine the evidence more carefully, not a refutation in itself."],
 ["What is a perspective, as distinct from an opinion?","A viewpoint shaped by discipline, position, interest, and values, which explains why someone reasons as they do."],
 ["Name four lenses used to identify perspectives","Economic, ethical, scientific, and cultural (also political, historical, environmental, artistic, futuristic)."],
 ["Why seek the strongest version of an opposing view?","Refuting a weakened version is a straw man and undermines your own argument's credibility."]]},
{title:"Synthesize and Build Your Own Argument",weight:[30,30],
 desc:"Writing the research-based essay and the exam essay.",
 notes:[
  {h:"From sources to your argument",b:[

  if (L.gen && L.gen.dispose) { try { L.gen.dispose(); } catch (e) { } }
  L.engine = null; L.gen = null; L.status = "idle"; L.progress = 0; L.text = "";

/* ---- generation -------------------------------------------- */
function chat(turns, opts) {
  opts = opts || {};
  return load().then(function () {
    return L.runtime === "webgpu" ? genWebLLM(turns, opts) : genTFJS(turns, opts);
  });
}

function genWebLLM(turns, opts) {
  var engine = L.engine;
  var msgs = turns.map(function (t) { return { role: t.role, content: t.content }; });
  if (opts.system) msgs.unshift({ role: "system", content: opts.system });
  return engine.chat.completions.create({
    messages: msgs,
    temperature: opts.json ? 0.15 : 0.6,
    max_tokens: opts.maxTokens || (opts.json ? 1600 : 700),
    stream: true
  }).then(function (stream) {
    var full = "";
    var it = stream[Symbol.asyncIterator] ? stream[Symbol.asyncIterator]() : stream;
    function pump() {
      if (opts.signal && opts.signal.aborted) {
        try { engine.interruptGenerate && engine.interruptGenerate(); } catch (e) { }
        var err = new Error("cancelled"); err.code = "cancelled"; err.text = full; throw err;
      }
      return it.next().then(function (step) {
        if (step.done) return full;
        var ch = step.value && step.value.choices && step.value.choices[0];
        var piece = ch && ch.delta && ch.delta.content;
        if (piece) { full += piece; if (opts.onText) opts.onText(full); }
        return pump();
      });
    }
    return pump();
  });
}

function genTFJS(turns, opts) {
  var gen = L.gen;
  var msgs = turns.map(function (t) { return { role: t.role, content: t.content }; });
  if (opts.system) msgs.unshift({ role: "system", content: opts.system });

  var full = "", aborted = false;
  var streamer = null;
  if (L.streamerCls && gen.tokenizer) {
    try {
      streamer = new L.streamerCls(gen.tokenizer, {
        skip_prompt: true, skip_special_tokens: true,
        callback_function: function (t) {
          if (aborted) return;
          if (opts.signal && opts.signal.aborted) { aborted = true; return; }
          full += t;
          if (opts.onText) opts.onText(full);
        }
      });
    } catch (e) { streamer = null; }
  }
  var args = {
    max_new_tokens: opts.maxTokens || (opts.json ? 1200 : 460),
    do_sample: !opts.json,
    temperature: opts.json ? 0.15 : 0.6,
    top_p: 0.9,
    return_full_text: false
  };
  if (streamer) args.streamer = streamer;

  return gen(msgs, args).then(function (out) {
    if (opts.signal && opts.signal.aborted) {
      var err = new Error("cancelled"); err.code = "cancelled"; err.text = full; throw err;
    }
    if (full.trim()) return full;
    /* no streamer available: dig the reply out of the returned structure */
    var g = out && out[0] && out[0].generated_text;
    if (typeof g === "string") return g;
    if (Array.isArray(g) && g.length) {
      var last = g[g.length - 1];
      return (last && last.content) || "";
    }
    return "";
  });
}

/* ============================================================
   Setup gate — a blocking dialog shown straight after the PIN,
   whose main action is downloading the tutor. It has no close
   button and ignores Escape and background clicks. An escape
   appears only if the download fails, or after a short delay,
   so a slow network or a locked-down school Wi-Fi can never
   leave someone unable to open their own study notes.
   ============================================================ */
function gate() {
  if (!window.LocalAI) return;
  window.AI.ready.then(function () {
    var L = window.LocalAI;
    if (window.AI.hasSmart()) return;      /* Claude already answering */
    if (!L.supported()) return;            /* nothing to download */
    if (L.isReady()) return;               /* already installed */
    L.probeAdapter().then(function () { showGate(); });
  });
}

function showGate() {
  var L = window.LocalAI;
  if (H.$("#gatewrap")) return;

  var card = el("div", { class: "lockcard" });
  var wrap = el("div", { class: "lockwrap", id: "gatewrap", role: "dialog", "aria-modal": "true", "aria-label": "Set up your AI tutor" }, [card]);
  document.body.appendChild(wrap);

  var trap = function (e) { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); } };
  document.addEventListener("keydown", trap, true);
  function close() {
    document.removeEventListener("keydown", trap, true);
    wrap.remove();
    if (off) off();

  var escapeShown = false;
  var escapeTimer = setTimeout(function () { escapeShown = true; draw(); }, 15000);

  function skipLink(label) {
    return el("button", {
      class: "btn btn-ghost", style: "width:100%;margin-top:.5rem;font-size:.82rem",

    var st = L.state;

      card.appendChild(el("div", { class: "lockhead" }, [icon("check", 28), el("div", {}, [
        el("h1", { text: "Your tutor is ready" }),

    }

    /* downloading */
    if (L.isLoading()) {
      card.appendChild(el("div", { class: "lockhead" }, [icon("wand", 28), el("div", {}, [
        el("h1", { text: "Setting up your tutor" }),
        el("p", { text: "This happens once. Leave the tab open." })
      ])]));

      el("li", { text: cap === "webgpu" ? "Uses your graphics chip, so replies are quick" : "Runs on your processor — slower, but works anywhere" }),
      el("li", { text: "About " + sizeText(m.mb) + ", downloaded once and cached" })

}

function makePlan(c) {
  var days = H.daysToExam(c);
  var reviewDays = Math.min(4, Math.max(1, Math.floor(days * 0.15)));
  var workDays = Math.max(1, days - reviewDays);
  var units = c.units.filter(function (u) { return !(u.weight && u.weight[0] === 0 && u.weight[1] === 0); });
  var need = units.map(function (u) { return { u: u, gap: 1 - H.unitProgress(c, u), w: Math.max(H.wMid(u.weight), 1) }; })
    .filter(function (x) { return x.gap > 0.08; });
  if (!need.length) need = units.map(function (u) { return { u: u, gap: 0.2, w: Math.max(H.wMid(u.weight), 1) }; });
  need.sort(function (a, b) { return (b.gap * b.w) - (a.gap * a.w); });

  var slots = [], i;
  var totalWeight = need.reduce(function (s, x) { return s + x.gap * x.w; }, 0);
  need.forEach(function (x) {
    var n = Math.max(1, Math.round(workDays * (x.gap * x.w) / totalWeight));
    for (i = 0; i < n; i++) slots.push(x.u.n);
  });
  slots = slots.slice(0, workDays);
  while (slots.length < workDays) slots.push(need[slots.length % need.length].u.n);

  var items = [];
  for (i = 0; i < workDays; i++) {
    items.push({ date: new Date(Date.now() + (i + 1) * 86400000).toISOString().slice(0, 10), unit: slots[i], done: false });
  }
  for (i = 0; i < reviewDays; i++) {
    items.push({
      date: new Date(Date.now() + (workDays + i + 1) * 86400000).toISOString().slice(0, 10),
      unit: null, label: i === reviewDays - 1 ? "Final review: starred cards and exam format" : "Full-course review: due cards plus a practice test", done: false
    });
  }
  H.S.plans[c.id] = { made: H.todayKey(), items: items };
  H.save();
  H.toast("Plan built for " + items.length + " days");
}

  else if (g === 3) { st.iv = st.iv ? Math.round(st.iv * (st.ef || 2.5)) : 1; }

    el("button", { class: "btn btn-sm btn-ghost", onclick: function () { H.go("course/" + c.id + "/make"); } }, [icon("wand"), customN ? "My cards (" + customN + ")" : "Make cards from notes"]),
    el("button", { class: "btn btn-sm btn-ghost", onclick: function () { browseSheet(c); } }, [icon("list"), "Browse all cards"])
  ]));
  host.appendChild(chooser);

  if (!pool.length) {
    host.appendChild(H.emptyState(
      scope === "due" ? "Nothing due right now" : "No cards in this deck",
      scope === "due" ? "Spaced repetition is holding these back until you would start to forget them. Study the whole course or a single unit to get ahead." : "Pick another unit, or make cards from your own notes.",
      el("button", { class: "btn btn-primary", onclick: function () { H.go("course/" + c.id + "/cards"); } }, ["Study the whole course"])
    ));
    return;
  }

  /* player */
  var deck = H.S.settings.shuffleCards ? H.shuffle(pool) : pool;
  var i = 0, flipped = false, correct = 0, graded = 0;
  var startT = Date.now();

  var stage = el("div", { class: "fc-stage" });
  host.appendChild(stage);

  var bar = el("div", { class: "fc-bar" });
  var prog = el("div", { class: "fc-prog" }, [el("i", { style: "width:0%" })]);
  var counter = el("span", { class: "eyebrow", style: "min-width:4.6rem;text-align:right" });
  var starBtn = el("button", { class: "btn btn-ghost btn-icon fc-star", title: "Star this card (S)" }, [icon("star")]);
  bar.appendChild(starBtn); bar.appendChild(prog); bar.appendChild(counter);

  var faceA = el("div", { class: "fc-face fc-face-a" });
  var faceB = el("div", { class: "fc-face fc-face-b" });
  var card = el("button", { class: "fc-card", "aria-label": "Flashcard — click or press space to flip" }, [el("div", { class: "fc-inner" }, [faceA, faceB])]);
  var gradeRow = el("div", { class: "fc-grade" });
  var meta = el("div", { class: "eyebrow", style: "text-align:center" });

  stage.appendChild(bar); stage.appendChild(card); stage.appendChild(gradeRow); stage.appendChild(meta);

  function cur() { return deck[i]; }
  function draw() {
    var k = cur();
    if (!k) return finish();
    flipped = false;
    card.classList.remove("flipped");
    faceA.innerHTML = "";
    faceA.appendChild(el("div", { class: "fc-q", html: H.md(k.q) }));
    faceA.appendChild(el("div", { class: "fc-hint", text: "click or press space to reveal" }));
    faceB.innerHTML = "";
    faceB.appendChild(el("div", { class: "fc-a", html: H.mdBlock(k.a) }));
    var st = H.cardState(k.key);
    starBtn.classList.toggle("on", !!st.star);
    prog.firstChild.style.width = H.pct(i / deck.length) + "%";
    counter.textContent = (i + 1) + " / " + deck.length;
    meta.innerHTML = "";
    meta.appendChild(el("span", { text: (k.unit ? "Unit " + k.unit + " · " + (k.unitTitle || "") : "My cards") + (st.reps ? "  ·  seen " + st.reps + "×" + (st.iv ? ", interval " + st.iv + "d" : "") : "  ·  new card") }));
    gradeRow.innerHTML = "";
    gradeRow.appendChild(el("button", { class: "btn", onclick: function () { flip(); } }, ["Show answer"]));
    speak(k.q);
  }
  function flip() {
    if (flipped) return;
    flipped = true;
    card.classList.add("flipped");
    var k = cur();
    speak(k.a);
    gradeRow.innerHTML = "";
    [[1, "Again", "bad"], [2, "Hard", ""], [3, "Good", ""], [4, "Easy", "good"]].forEach(function (g) {
      gradeRow.appendChild(el("button", {
        class: "btn" + (g[0] === 3 ? " btn-primary" : ""), onclick: function () { answer(g[0]); }
      }, [el("span", { text: g[0] + " · " + g[1] }), el("small", { text: ivLabel(k.key, g[0]) })]));
    });
  }
  function answer(g) {
    var k = cur();
    grade(k.key, g);
    graded++; if (g >= 3) correct++;
    H.save();
    i++;
    if (i >= deck.length) finish(); else draw();
  }
  function finish() {
    var mins = Math.max(1, Math.round((Date.now() - startT) / 60000));
    H.logMinutes(mins);
    stage.innerHTML = "";
    stage.appendChild(el("div", { class: "panel", style: "width:100%;max-width:620px;text-align:center" }, [
      el("h2", { text: "Deck complete" }),
      el("p", { style: "color:var(--muted)", text: graded + " cards graded · " + correct + " you knew · about " + mins + " min" }),
      el("div", { style: "max-width:280px;margin:1rem auto" }, [H.meter(graded ? correct / graded : 0)]),
      el("div", { class: "btn-row", style: "justify-content:center;margin-top:1rem" }, [
        el("button", { class: "btn btn-primary", onclick: function () { H.render(); } }, ["Study again"]),
        el("button", { class: "btn", onclick: function () { H.go("course/" + c.id + "/test"); } }, [icon("quiz"), "Take a test"]),
        el("button", { class: "btn btn-ghost", onclick: function () { H.go("course/" + c.id); } }, ["Back to units"])
      ])
    ]));
    detachKeys();
  }
  card.addEventListener("click", function () { flipped ? answer(3) : flip(); });
  starBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var k = cur(); if (!k) return;
    var st = Object.assign({}, H.cardState(k.key)); st.star = !st.star; H.S.cards[k.key] = st; H.save();
    starBtn.classList.toggle("on", st.star);
    H.toast(st.star ? "Starred" : "Unstarred");
  });

  detachKeys();
  KEYHANDLER = function (e) {
    if (/input|textarea|select/i.test((e.target.tagName || ""))) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipped ? answer(3) : flip(); }
    else if (e.key >= "1" && e.key <= "4" && flipped) { e.preventDefault(); answer(+e.key); }
    else if (e.key === "ArrowRight") { if (i < deck.length - 1) { i++; draw(); } }
    else if (e.key === "ArrowLeft") { if (i > 0) { i--; draw(); } }
    else if (e.key.toLowerCase() === "s") starBtn.click();
  };
  document.addEventListener("keydown", KEYHANDLER);
  draw();
}
function detachKeys() { if (KEYHANDLER) { document.removeEventListener("keydown", KEYHANDLER); KEYHANDLER = null; } }

function buildDeck(c, scope) {
  var all = H.courseCards(c);
  if (scope === "due") return all.filter(function (k) { return H.isDue(k.key); });
  if (scope === "starred") return all.filter(function (k) { return (H.S.cards[k.key] || {}).star; });
  if (scope && !isNaN(+scope)) return H.courseCards(c, +scope);
  if (H.S.settings.hideMastered) {
    var f = all.filter(function (k) { return H.cardMastery(k.key) < 0.75; });
    if (f.length) return f;
  }
  return all;
}

function makeTab(host, c) {

    (function () {
      var ta = el("textarea", { id: "makeText", rows: 10, placeholder: "Osmosis: movement of water across a semipermeable membrane from high to low water potential\nTurgor pressure - the outward pressure of water against a plant cell wall\n\nQ: What does the 10% rule describe?\nA: Roughly a tenth of energy transfers between trophic levels" });

          el("h4", { style: "margin:0", text: pending.length + " card" + (pending.length === 1 ? "" : "s") + " ready" }),
          el("button", {
            class: "btn btn-sm btn-primary", style: "margin-left:auto", onclick: function () {
              var u = +unitSel.value || 0;

        ]));

          ai.value = p.a;
          wrap.appendChild(el("div", { style: "border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem;display:flex;gap:.5rem;align-items:flex-start" }, [
            el("div", { style: "flex:1;display:flex;flex-direction:column;gap:.35rem" }, [qi, ai]),
            el("button", { class: "btn btn-sm btn-ghost btn-icon", title: "Remove", onclick: function () { pending.splice(idx, 1); showPreview(); } }, [icon("x")])
          ]));
        });
        preview.appendChild(wrap);
      }

      function runOffline() {
        var cards = window.AI.parseNotes(ta.value, { max: 60 });
        if (!cards.length) { status.textContent = "Nothing usable found. Try one term per line, separated by a colon or a dash."; return; }
        pending = cards; status.textContent = "Parsed " + cards.length + " cards locally.";
        showPreview();
      }
      function runAI() {
        var text = ta.value.trim();

        status.textContent = "Asking " + window.AI.modeLabel() + "…";

function aiTest(c, cfg) {
  var unitList = cfg.units.length ? cfg.units.join(", ") : "all units";
  var ctx = window.AI.courseContext(c, cfg.units.length === 1 ? cfg.units[0] : null, 9000);
  var prompt =
    "Write " + cfg.n + " multiple-choice questions for the AP " + c.name + " exam, covering " +
    (cfg.units.length ? "units " + unitList : "the whole course, weighted toward the heavier units") + ".\n" +
    "Match real AP style: a specific scenario or stem, four plausible options, exactly one clearly best answer, " +
    "and distractors that reflect common student errors. Do not ask about trivia, and do not reference these notes explicitly.\n" +
    'Reply with ONLY a JSON array. Each element: {"stem":"...","choices":["a","b","c","d"],"answer":0,"why":"one or two sentences explaining why the answer is right and what the distractors get wrong","unit":3}. ' +
    "answer is the zero-based index of the correct choice.\n\n" + ctx;
  return window.AI.ask([{ role: "user", content: prompt }], { json: true, tier: "complex" })
    .then(function (arr) {
      if (!Array.isArray(arr)) throw new Error("unexpected shape");
      var qs = arr.filter(function (q) {
        return q && q.stem && Array.isArray(q.choices) && q.choices.length >= 3 && typeof q.answer === "number" && q.answer >= 0 && q.answer < q.choices.length;
      }).map(function (q) {
        return { stem: String(q.stem), choices: q.choices.map(String), answer: q.answer, why: String(q.why || ""), unit: q.unit || 0, src: "ai" };
      });
      if (qs.length < 3) throw new Error("too few usable questions");
      return qs;
    });
}

function runTest(host, c, qs, cfg, back) {
  host.innerHTML = "";
  var i = 0, answers = new Array(qs.length).fill(null);
  var startT = Date.now();
  var secs = cfg.timed ? qs.length * 80 : 0;
  var timerId = null;

  var head = el("div", { style: "display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem" });
  var progEl = el("div", { class: "fc-prog", style: "flex:1;min-width:120px" }, [el("i", { style: "width:0%" })]);
  var counter = el("span", { class: "eyebrow" });
  var clock = el("span", { class: cfg.timed ? "cd" : "cd", style: cfg.timed ? "" : "display:none" }, [el("b", { text: "" }), "left"]);
  head.appendChild(counter); head.appendChild(progEl); head.appendChild(clock);
  head.appendChild(el("button", { class: "btn btn-sm btn-ghost", onclick: function () { if (confirm("End this test and discard it?")) { stopClock(); host.innerHTML = ""; back(); } } }, ["Quit"]));
  host.appendChild(head);

  var qHost = el("div");
  host.appendChild(qHost);

  function stopClock() { if (timerId) { clearInterval(timerId); timerId = null; } }
  if (cfg.timed) {
    timerId = setInterval(function () {
      secs--;
      var m = Math.floor(secs / 60), s = secs % 60;
      clock.firstChild.textContent = m + ":" + (s < 10 ? "0" : "") + s;
      clock.classList.toggle("soon", secs < 120);
      if (secs <= 0) { stopClock(); H.toast("Time is up — scoring what you have."); finish(); }
    }, 1000);
  }

  function draw() {
    var q = qs[i];
    qHost.innerHTML = "";
    counter.textContent = "Question " + (i + 1) + " of " + qs.length;
    progEl.firstChild.style.width = H.pct(i / qs.length) + "%";

    var card = el("div", { class: "q-card" });
    card.appendChild(el("div", { style: "display:flex;gap:.4rem;margin-bottom:.55rem;flex-wrap:wrap" }, [
      q.unit ? el("span", { class: "chip chip-accent", text: "Unit " + q.unit }) : null,
      el("span", { class: "chip", text: q.src === "ai" ? "AI written" : q.src === "bank" ? "question bank" : "from your cards" })
    ]));
    card.appendChild(el("div", { class: "q-stem", html: H.md(q.stem) }));
    var ch = el("div", { class: "choices" });
    var explain = el("div");
    q.choices.forEach(function (opt, idx) {
      var b = el("button", { class: "choice", "data-state": "" }, [
        el("span", { class: "ltr", text: "ABCDE"[idx] }), el("span", { html: H.md(opt) })
      ]);
      b.addEventListener("click", function () {
        if (answers[i] != null && cfg.mode === "review") return;
        answers[i] = idx;
        if (cfg.mode === "review") {
          H.$$(".choice", ch).forEach(function (x, j) {
            x.setAttribute("data-state", j === q.answer ? "right" : (j === idx ? "wrong" : ""));
            x.disabled = true;
          });
          explain.innerHTML = "";
          explain.appendChild(el("div", { class: "explain", html: (idx === q.answer ? "<b>Correct.</b> " : "<b>Not quite.</b> The answer is " + "ABCDE"[q.answer] + ". ") + H.md(q.why || "") }));
          nextBtn.disabled = false;
          nextBtn.classList.add("btn-primary");
        } else {
          H.$$(".choice", ch).forEach(function (x, j) { x.setAttribute("data-state", j === idx ? "picked" : ""); });
        }
      });
      if (answers[i] === idx) b.setAttribute("data-state", cfg.mode === "exam" ? "picked" : (idx === q.answer ? "right" : "wrong"));
      ch.appendChild(b);
    });
    card.appendChild(ch);
    card.appendChild(explain);
    qHost.appendChild(card);

    var nav = el("div", { class: "btn-row", style: "margin-top:1rem" });
    nav.appendChild(el("button", { class: "btn", disabled: i === 0, onclick: function () { i--; draw(); } }, [icon("back"), "Back"]));
    var nextBtn = el("button", {
      class: "btn" + (cfg.mode === "exam" ? " btn-primary" : ""), disabled: cfg.mode === "review" && answers[i] == null,
      onclick: function () { if (i < qs.length - 1) { i++; draw(); } else finish(); }
    }, [i === qs.length - 1 ? "Finish test" : "Next"]);
    nav.appendChild(nextBtn);
    if (cfg.mode === "exam") nav.appendChild(el("button", { class: "btn btn-ghost", style: "margin-left:auto", onclick: finish }, ["Submit now"]));
    qHost.appendChild(nav);

    if (cfg.mode === "review" && answers[i] != null) {
      H.$$(".choice", ch).forEach(function (x, j) { x.setAttribute("data-state", j === q.answer ? "right" : (j === answers[i] ? "wrong" : "")); x.disabled = true; });
      explain.appendChild(el("div", { class: "explain", html: (answers[i] === q.answer ? "<b>Correct.</b> " : "<b>Not quite.</b> The answer is " + "ABCDE"[q.answer] + ". ") + H.md(q.why || "") }));
      nextBtn.disabled = false;
    }
  }

  function finish() {
    stopClock();
    var score = 0, wrong = [];
    qs.forEach(function (q, idx) { if (answers[idx] === q.answer) score++; else wrong.push({ q: q, picked: answers[idx], idx: idx }); });
    var mins = Math.max(1, Math.round((Date.now() - startT) / 60000));
    H.logMinutes(mins);
    H.S.tests.unshift({ courseId: c.id, date: H.todayKey(), score: score, total: qs.length, units: cfg.units.slice() });
    H.S.tests = H.S.tests.slice(0, 60);
    H.save();

    var ratio = score / qs.length;
    var est = ratio >= 0.78 ? 5 : ratio >= 0.64 ? 4 : ratio >= 0.48 ? 3 : ratio >= 0.33 ? 2 : 1;

    host.innerHTML = "";
    var r = 58, circ = 2 * Math.PI * r;
    var ring = el("div", { class: "score-ring" });
    ring.innerHTML = '<svg viewBox="0 0 132 132" width="132" height="132">' +
      '<circle cx="66" cy="66" r="' + r + '" stroke="var(--surface-3)" stroke-width="9" fill="none"/>' +
      '<circle cx="66" cy="66" r="' + r + '" stroke="var(--accent)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - ratio)) + '"/></svg>';
    ring.appendChild(el("div", { style: "text-align:center" }, [el("div", { class: "big", text: H.pct(ratio) + "%" }), el("div", { class: "cap", text: score + " of " + qs.length })]));

    host.appendChild(el("div", { class: "panel", style: "margin-bottom:1.2rem" }, [
      el("div", { style: "display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap" }, [
        ring,
        el("div", { style: "flex:1;min-width:220px" }, [
          el("h2", { style: "margin:0 0 .3rem", text: "Test complete" }),
          el("p", { style: "margin:0 0 .5rem;color:var(--muted)", text: "About " + mins + " min · " + (cfg.units.length ? "units " + cfg.units.join(", ") : "all units") }),
          el("p", { style: "margin:0", html: "On multiple choice alone this would land near an <b>estimated " + est + "</b>. The real score also depends on free response, so treat this as a signal about your recall, not a prediction." })
        ])
      ]),
      el("div", { class: "btn-row", style: "margin-top:1rem" }, [
        el("button", { class: "btn btn-primary", onclick: function () { H.render(); } }, ["New test"]),
        wrong.length ? el("button", { class: "btn", onclick: function () { makeCardsFromWrong(c, wrong); } }, [icon("cards"), "Add " + wrong.length + " missed to my deck"]) : null,
        el("button", { class: "btn btn-ghost", onclick: function () { H.go("course/" + c.id + "/cards/due"); } }, ["Study due cards"])
      ])
    ]));

    /* per-unit breakdown */
    var byUnit = {};
    qs.forEach(function (q, idx) {
      var u = q.unit || 0;
      byUnit[u] = byUnit[u] || { n: 0, right: 0 };
      byUnit[u].n++; if (answers[idx] === q.answer) byUnit[u].right++;
    });
    var keys = Object.keys(byUnit);
    if (keys.length > 1) {
      var p = el("div", { class: "panel", style: "margin-bottom:1.2rem" }, [el("h3", { text: "By unit" })]);
      keys.sort(function (a, b) { return (byUnit[a].right / byUnit[a].n) - (byUnit[b].right / byUnit[b].n); }).forEach(function (u) {
        var d = byUnit[u], uu = H.unitOf(c, u);
        p.appendChild(el("div", { style: "margin-bottom:.7rem" }, [
          el("div", { style: "display:flex;gap:.5rem;font-size:.88rem;margin-bottom:.22rem" }, [
            el("span", { style: "flex:1", text: uu ? "Unit " + u + ": " + uu.title : "Mixed" }),
            el("span", { class: "num", style: "color:var(--muted)", text: d.right + "/" + d.n })
          ]),
          H.meter(d.right / d.n, d.right / d.n >= 0.7 ? "good" : d.right / d.n >= 0.45 ? "warn" : "")
        ]));
      });
      p.appendChild(el("p", { style: "font-size:.84rem;color:var(--muted);margin:.3rem 0 0", text: "Weakest units first. Those are where the next study session pays most." }));
      host.appendChild(p);
    }

    /* review of every question */
    var rev = el("div", { class: "panel" }, [el("h3", { text: "Review" })]);
    qs.forEach(function (q, idx) {
      var ok = answers[idx] === q.answer;
      rev.appendChild(el("div", { style: "border-top:1px solid var(--line);padding:.9rem 0" }, [
        el("div", { style: "display:flex;gap:.45rem;align-items:center;margin-bottom:.35rem;flex-wrap:wrap" }, [
          el("span", { class: ok ? "chip chip-good" : "chip chip-bad", text: ok ? "correct" : answers[idx] == null ? "skipped" : "missed" }),
          q.unit ? el("span", { class: "chip", text: "Unit " + q.unit }) : null
        ]),
        el("div", { style: "font-size:.95rem;margin-bottom:.4rem", html: H.md(q.stem) }),
        el("div", { style: "font-size:.88rem" }, [
          el("div", { html: "<b>Correct:</b> " + H.md(q.choices[q.answer]) }),
          (!ok && answers[idx] != null) ? el("div", { style: "color:var(--muted)", html: "<b>You chose:</b> " + H.md(q.choices[answers[idx]]) }) : null
        ]),
        q.why ? el("div", { class: "explain", html: H.md(q.why) }) : null
      ]));
    });
    host.appendChild(rev);
  }
  draw();
}

function makeCardsFromWrong(c, wrong) {
  var arr = H.S.custom[c.id] || [];
  wrong.forEach(function (w) {
    arr.push({
      id: H.uid(), q: w.q.stem, a: w.q.choices[w.q.answer] + (w.q.why ? "\n\n" + w.q.why : ""),
      unit: w.q.unit || 0, src: "missed"
    });
  });
  H.S.custom[c.id] = arr; H.save();
  H.toast(wrong.length + " cards added from missed questions");
  H.go("course/" + c.id + "/cards");
}

/* ============================================================ ASK AI TAB */
function askTab(host, c) {
  var log = el("div", { class: "chat-log" });
  var wrap = el("div", { class: "chat-wrap" });
  var ta = el("textarea", { id: "chatInput", rows: 1, placeholder: "Ask anything about " + c.short + "…" });
  var sendBtn = el("button", { class: "btn btn-primary", onclick: send }, ["Send"]);
  var stopBtn = el("button", { class: "btn btn-ghost", style: "display:none", onclick: function () { if (ctl) ctl.abort(); } }, ["Stop"]);
  var suggests = el("div", { class: "suggests" });
  var ctl = null, busy = false;

  var history = H.S.chats[c.id] || [];

  var strip = el("div", { style: "display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem;flex-wrap:wrap" });
  host.appendChild(strip);
  function drawStrip() {
    strip.innerHTML = "";
    strip.appendChild(el("span", { class: "chip chip-accent", text: "Answering with " + window.AI.modeLabel() }));
    strip.appendChild(el("span", { style: "font-size:.84rem;color:var(--muted)", text: window.AI.hasSmart()
      ? "A real model, reading this course's notes as its source."
      : "The model is not running yet, so this is a notes lookup." }));
    strip.appendChild(el("button", { class: "btn btn-sm btn-ghost", style: "margin-left:auto", onclick: function () { delete H.S.chats[c.id]; H.save(); H.render(); } }, ["Clear chat"]));
    strip.appendChild(el("button", { class: "btn btn-sm btn-ghost", onclick: function () { H.go("settings"); } }, [icon("gear"), "AI settings"]));
  }
  drawStrip();
  host.appendChild(window.AISetup.banner(drawStrip));

  wrap.appendChild(log);
  wrap.appendChild(suggests);
  wrap.appendChild(el("form", {
    class: "chat-form", onsubmit: function (e) { e.preventDefault(); send(); }
  }, [ta, stopBtn, sendBtn]));
  host.appendChild(wrap);

  ta.addEventListener("input", function () { ta.style.height = "auto"; ta.style.height = Math.min(160, ta.scrollHeight) + "px"; });
  ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

  function bubble(role, content) {
    var b = el("div", { class: "msg " + (role === "user" ? "me" : "ai") }, [
      el("div", { class: "who", text: role === "user" ? "You" : "AI" }),
      el("div", { class: "bubble" })
    ]);
    b.lastChild.innerHTML = role === "user" ? "<p>" + H.esc(content) + "</p>" : H.mdBlock(content);
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
    return b.lastChild;
  }
  function drawHistory() {
    log.innerHTML = "";
    if (!history.length) {
      log.appendChild(el("div", { class: "empty", style: "padding:1.6rem .6rem" }, [
        el("h3", { text: "Ask about " + c.short }),
        el("p", { text: "Explanations, worked examples, comparisons, what graders look for, or why an answer is wrong. It knows this course's unit notes." })
      ]));
    }
    history.forEach(function (m) { bubble(m.role, m.content); });
  }
  function drawSuggests() {
    suggests.innerHTML = "";
    var u = c.units[Math.floor(Math.random() * c.units.length)];
    var ideas = [
      "Explain " + (u.terms && u.terms.length ? u.terms[0] : u.title) + " simply",
      "What does Unit " + u.n + " actually test?",
      "Give me a worked example from Unit " + u.n,
      "What do graders reward on the free response?",
      "What are the most common mistakes in " + c.short + "?",
      "Compare the two hardest ideas in this course"
    ];
    H.shuffle(ideas).slice(0, 4).forEach(function (t) {
      suggests.appendChild(el("button", { onclick: function () { ta.value = t; send(); } }, [t]));
    });
  }

  function send() {
    if (busy) return;
    var q = ta.value.trim();
    if (!q) return;
    ta.value = ""; ta.style.height = "auto";
    if (!history.length) log.innerHTML = "";
    history.push({ role: "user", content: q });
    bubble("user", q);
    suggests.innerHTML = "";

    var target = bubble("assistant", "");
    target.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
    busy = true; sendBtn.disabled = true; stopBtn.style.display = "";
    ctl = new AbortController();

    var unitHint = null;
    var m = q.match(/unit\s*(\d+)/i);
    if (m) unitHint = m[1];
    var ctx = window.AI.courseContext(c, unitHint, unitHint ? 9000 : 7000);
    var rules = window.AI.TUTOR_RULES + "\n\n" + ctx;
    var turns = [{ role: "user", content: rules }];
    history.slice(-8).forEach(function (x) { turns.push({ role: x.role, content: x.content }); });

    window.AI.ask(turns, {
      signal: ctl.signal, ctx: { course: c },
      onText: function (t) { target.innerHTML = H.mdBlock(t); log.scrollTop = log.scrollHeight; }
    }).then(function (t) {
      target.innerHTML = H.mdBlock(t);
      history.push({ role: "assistant", content: t });
      H.S.chats[c.id] = history.slice(-40); H.save();
      H.touchStreak();
    }).catch(function (e) {
      if (e && e.code === "cancelled") { target.innerHTML = "<p><em>Stopped.</em></p>"; history.pop(); return; }
      target.innerHTML = '<div class="explain"><b>That did not go through.</b> ' + H.esc(e.message || String(e)) +
        '</div><p style="font-size:.87rem;color:var(--muted)">The built-in offline engine always works — pick it in Settings if this keeps happening.</p>';
      history.pop();
    }).then(function () {
      busy = false; sendBtn.disabled = false; stopBtn.style.display = "none"; ctl = null;
      drawSuggests(); log.scrollTop = log.scrollHeight;
    });
  }

  drawHistory(); drawSuggests();
  setTimeout(function () {
    /* don't yank the page down past the setup card when the model is not up yet */
    if (window.AI.hasSmart()) { try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); } }
    log.scrollTop = log.scrollHeight;
  }, 40);
}
