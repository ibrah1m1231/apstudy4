 cards:[
 ["Difference between GPP and NPP","NPP = GPP minus energy lost to the producers' own respiration; NPP is what consumers can use."],
 ["Approximate energy transfer efficiency between trophic levels","About 10%."],
 ["Which cycle has no atmospheric component?","The phosphorus cycle."],
 ["Steps of the nitrogen cycle in order","Fixation, nitrification, assimilation, ammonification, denitrification."],
 ["What primarily determines a terrestrial biome?","Temperature and precipitation patterns."],
 ["Define commensalism","One species benefits while the other is unaffected."],
 ["Which human activity most increases atmospheric carbon?","Burning fossil fuels, which releases carbon stored for millions of years."]]},
{title:"The Living World: Biodiversity",weight:[6,8],
 desc:"Why diversity matters, ecosystem services, and disturbance.",
 notes:[
  {h:"Biodiversity",b:[
   "Three levels: **genetic**, **species**, and **ecosystem** diversity. Greater diversity generally means greater resilience.",
   "**Species richness** counts species; **evenness** describes how balanced their abundances are. A **Simpson's index** style calculation may appear.",
   "**Ecosystem services**: provisioning (food, timber), regulating (water filtration, pollination, climate), supporting (soil formation), and cultural.",
   "**Keystone** and **indicator** species matter beyond their abundance: one structures the community, the other signals ecosystem health."]},
  {h:"Island biogeography and succession",b:[
   "Island biogeography: larger islands closer to the mainland hold more species. Habitat fragmentation turns continuous habitat into 'islands'.",
   "**Edge effects** change microclimate and increase predation at fragment boundaries.",
   "**Primary succession** begins on bare rock with pioneer species like lichens; **secondary succession** follows a disturbance that left soil.",
   "Natural disturbance (fire, flood) is part of many ecosystems; suppressing it can make later disturbance more severe."]}],
 tip:"When asked why biodiversity matters, give a specific ecosystem service plus a resilience argument rather than a general statement.",
 terms:["genetic diversity","species richness","evenness","ecosystem services","keystone species","indicator species","island biogeography","edge effect","primary succession"],
 cards:[
 ["Three levels of biodiversity","Genetic, species, and ecosystem diversity."],
 ["Species richness vs evenness","Richness is the number of species; evenness is how equally abundant they are."],
 ["Give two regulating ecosystem services","Water filtration and pollination (also climate regulation and flood control)."],
 ["What is an indicator species?","A species whose presence, absence, or health signals the condition of an ecosystem."],
 ["Island biogeography prediction","Larger islands closer to a mainland support more species."],
 ["Primary vs secondary succession","Primary starts on bare substrate with no soil; secondary follows a disturbance that left soil intact."],
 ["What is an edge effect?","Altered conditions — light, temperature, predation — at the boundary of a habitat fragment."]]},
{title:"Populations",weight:[10,15],
 desc:"Population dynamics, human demography, and growth calculations.",
 notes:[
  {h:"Population dynamics",b:[
   "**Exponential growth** (J curve) occurs with unlimited resources; **logistic growth** (S curve) levels off at the **carrying capacity**.",
   "**Overshoot** beyond carrying capacity leads to **dieback**.",
   "r-selected species: many offspring, little care, short lives, rapid colonization. K-selected: few offspring, much care, longer lives, stable habitats.",
   "**Survivorship curves**: Type I (high survival until old age, humans), Type II (constant rate, birds), Type III (high early mortality, fish and insects).",
   "**Density-dependent** limits include disease and competition; **density-independent** limits include weather and natural disasters."]},
  {h:"Human demography",b:[
   "**Demographic transition** has four stages: high birth and death rates; falling death rates with rapid growth; falling birth rates; low and stable both.",
   "**Total fertility rate** above about 2.1 grows a population; below it shrinks. Infant mortality, female education, and access to family planning are the strongest drivers of decline.",
   "**Age-structure diagrams**: a wide base predicts rapid growth; a column predicts stability; a narrow base predicts decline and an aging population.",
   "Key calculations: `growth rate = (births + immigration − deaths − emigration)/population × 100`, and **doubling time = 70 ÷ percent growth rate**."]}],
 tip:"Nearly every APES calculation question is dimensional analysis. Write the units at every step; the rubric awards setup even when the arithmetic slips.",
 terms:["exponential growth","logistic growth","carrying capacity","overshoot","r-selected","K-selected","survivorship curve","demographic transition","total fertility rate","rule of 70"],
 cards:[
 ["Rule of 70","Doubling time in years = 70 ÷ annual percent growth rate."],
 ["A population grows at 2% per year. Its doubling time is","35 years."],
 ["What is carrying capacity?","The maximum population an environment can support with its available resources."],
 ["Type III survivorship curve describes which species?","Those with many offspring and very high early mortality, such as fish and insects."],
 ["Four stages of the demographic transition","High birth and death rates; falling death rates; falling birth rates; low and stable both."],
 ["Replacement-level total fertility rate","About 2.1 children per woman."],
 ["Which social factor most reliably lowers total fertility rate?","Increased education and opportunity for women, along with access to family planning."],
 ["Population growth rate formula","(births + immigration − deaths − emigration) ÷ total population × 100"],
 ["What does a wide-based age-structure pyramid predict?","Rapid future population growth."]]},
{title:"Earth Systems and Resources",weight:[10,15],
 desc:"Plate tectonics, soil, the atmosphere, weather, and water availability.",
 notes:[
  {h:"Geology and soil",b:[
   "Plate boundaries: **divergent** (seafloor spreading), **convergent** (subduction, mountains, volcanoes), **transform** (earthquakes).",
   "Soil forms from weathered parent rock plus organic matter; **horizons** run O (organic), A (topsoil), E (eluviation), B (subsoil accumulation), C (parent material).",
   "Soil texture — sand, silt, clay proportions — controls **permeability** and **water-holding capacity**. Loam balances both and is best for agriculture.",
   "Erosion removes topsoil faster than it forms; cover crops, contour plowing, and terracing reduce it."]},
  {h:"Atmosphere and climate",b:[
   "Layers: **troposphere** (weather, temperature falls with altitude), **stratosphere** (ozone layer, temperature rises), mesosphere, thermosphere.",
   "Solar energy drives **Hadley, Ferrel, and polar cells**; the **Coriolis effect** deflects winds, producing prevailing westerlies and trade winds.",
   "**Rain shadows** form on the leeward side of mountains; **El Niño** shifts Pacific circulation and global precipitation patterns.",
   "**Watersheds** drain to a common outlet. **Aquifers** store groundwater; withdrawing faster than recharge causes subsidence and saltwater intrusion.",
   "Only about 2.5% of Earth's water is fresh, and most of that is frozen — which is why allocation conflicts arise."]}],
 tip:"Soil and atmosphere questions reward naming the specific mechanism: 'clay has small pores, so it holds water but drains slowly.'",
 terms:["divergent boundary","subduction","soil horizon","permeability","loam","troposphere","stratosphere","Coriolis effect","rain shadow","El Niño","watershed","aquifer","saltwater intrusion"],
 cards:[
 ["What happens at a convergent plate boundary?","Plates collide; oceanic crust subducts, forming volcanoes, mountains, and deep trenches."],
 ["Order of soil horizons from the surface down","O (organic), A (topsoil), E (eluviation), B (subsoil), C (parent material)."],
 ["Which soil texture has the highest water-holding capacity and lowest permeability?","Clay, because of its very small particles and pores."],
 ["Why does temperature increase with altitude in the stratosphere?","Ozone absorbs ultraviolet radiation there, warming the layer."],
 ["What causes a rain shadow?","Air rises and loses moisture on the windward side of a mountain, then descends dry on the leeward side."],
 ["What is saltwater intrusion?","Seawater moving into a coastal aquifer when freshwater is withdrawn faster than it recharges."],
 ["Roughly what fraction of Earth's water is fresh and accessible?","About 2.5% is fresh, and most of that is locked in ice, leaving well under 1% accessible."],
 ["What is the Coriolis effect?","The deflection of moving air and water caused by Earth's rotation — right in the Northern Hemisphere, left in the Southern."]]},
{title:"Land and Water Use",weight:[10,15],
 desc:"Agriculture, irrigation, mining, forestry, fishing, and urbanization.",
 notes:[
  {h:"Agriculture",b:[
   "The **Green Revolution** raised yields through high-yield varieties, fertilizer, irrigation, and mechanization — with costs in water use, soil degradation, and energy.",
   "Irrigation methods: flood (cheap, wasteful), furrow, spray, and **drip** (most efficient, least evaporation). Over-irrigation causes **waterlogging** and **salinization**.",
   "**CAFOs** concentrate animals, producing large volumes of manure that can reach waterways; they also drive antibiotic use.",
   "**Integrated pest management (IPM)** combines biological controls, crop rotation, and targeted pesticide use to reduce resistance and runoff.",
   "**Pesticide resistance** evolves by natural selection, producing the 'pesticide treadmill'."]},
  {h:"Extraction and urbanization",b:[
   "**Surface mining** (strip, open pit, mountaintop removal) is cheaper but destroys habitat; **subsurface mining** is more dangerous and expensive. Both produce **acid mine drainage** and tailings.",
   "**Clearcutting** is efficient but causes erosion and habitat loss; **selective cutting** preserves structure at higher cost.",
   "Overfishing and **bycatch** deplete stocks; aquaculture relieves pressure but concentrates waste and disease.",
   "**Urban sprawl** increases impervious surface, which raises runoff, flooding, and **urban heat island** effects. Mass transit and mixed-use density reduce per-capita impact.",
   "The **tragedy of the commons** explains overuse of shared resources — fisheries, aquifers, the atmosphere — when individual benefit outruns shared cost."]}],
 tip:"Solution-proposal questions want a specific action plus a mechanism: 'Install drip irrigation, which delivers water to roots and reduces evaporative loss.'",
 terms:["Green Revolution","drip irrigation","salinization","CAFO","integrated pest management","pesticide resistance","acid mine drainage","clearcutting","bycatch","urban sprawl","impervious surface","tragedy of the commons"],
 cards:[
 ["Which irrigation method is most water-efficient?","Drip irrigation, which delivers water slowly at the root zone."],
 ["What causes soil salinization?","Repeated irrigation with water containing dissolved salts, which accumulate as water evaporates."],
 ["What is integrated pest management?","Combining biological control, crop rotation, monitoring, and limited targeted pesticide use."],
 ["Why does pesticide resistance develop?","Natural selection favors individuals that survive the pesticide, and they pass the trait on."],
 ["What is acid mine drainage?","Sulfide minerals exposed by mining react with water and air to form sulfuric acid that contaminates waterways."],
 ["Clearcutting vs selective cutting","Clearcutting removes all trees, maximizing yield but causing erosion; selective cutting removes some trees at higher cost but less damage."],
 ["Two consequences of increased impervious surface","More runoff and flooding, plus a stronger urban heat island effect."],
 ["State the tragedy of the commons","Individuals using a shared resource act in their own interest and collectively deplete it."],
 ["What is bycatch?","Non-target species caught and usually discarded during fishing."]]},
{title:"Energy Resources and Consumption",weight:[10,15],
 desc:"Fossil fuels, nuclear, renewables, and efficiency.",
 notes:[
  {h:"Nonrenewable energy",b:[
   "**Coal** is abundant and cheap but the dirtiest: highest CO₂ per unit energy, plus sulfur dioxide, mercury, and particulates. **Natural gas** burns cleanest of the fossil fuels.",
   "**Fracking** accesses shale gas but risks groundwater contamination and methane leakage; methane is a far stronger greenhouse gas per molecule than CO₂.",
   "**Nuclear fission** emits no CO₂ during operation and has very high energy density, but carries waste storage, meltdown risk (Chernobyl, Fukushima), and thermal pollution issues.",
   "Energy conversion always loses energy as heat; a coal plant is roughly one third efficient."]},
  {h:"Renewables and efficiency",b:[
   "**Solar** (photovoltaic and thermal), **wind**, **hydroelectric**, **geothermal**, **biomass**, and **tidal** each have distinct trade-offs: intermittency, siting, habitat disruption, or upfront cost.",
   "Hydroelectric dams provide reliable power and flood control but block fish migration, flood habitat, and trap sediment.",
   "Biomass is carbon-neutral in principle but produces particulates and competes with food production.",
   "**Conservation and efficiency** are the cheapest gains: insulation, LED lighting, efficient appliances, public transit, and cogeneration.",
   "Compare energy sources by net energy, emissions, land use, and reliability — a four-part comparison answers most FRQ prompts."]}],
 tip:"Energy calculations usually involve kilowatt-hours. Remember 1 kWh is one kilowatt sustained for one hour, and carry units through each conversion.",
 terms:["coal","natural gas","fracking","nuclear fission","thermal pollution","photovoltaic","intermittency","hydroelectric","biomass","cogeneration","energy efficiency"],
 cards:[
 ["Which fossil fuel emits the most CO₂ per unit of energy?","Coal."],
 ["Which fossil fuel burns cleanest?","Natural gas."],
 ["Two environmental concerns about fracking","Groundwater contamination and methane leakage."],
 ["Main advantages and risks of nuclear power","No CO₂ during operation and high energy density, against radioactive waste storage, accident risk, and thermal pollution."],
 ["What is the main drawback of solar and wind power?","Intermittency — output varies with weather and time of day, requiring storage or backup."],
 ["Three environmental costs of hydroelectric dams","Blocked fish migration, flooded habitat, and trapped sediment downstream."],
 ["What is cogeneration?","Capturing waste heat from electricity generation for heating, raising overall efficiency."],
 ["Why is energy conservation often the cheapest strategy?","Reducing demand avoids the cost of new generation entirely."]]},
{title:"Atmospheric Pollution",weight:[7,10],
 desc:"Air pollutants, smog, acid deposition, and indoor air quality.",
 notes:[
  {h:"Outdoor air pollution",b:[
   "**Primary pollutants** are emitted directly (CO, SO₂, NOₓ, particulates, VOCs); **secondary pollutants** form in the atmosphere (ozone, sulfuric and nitric acid).",
   "**Photochemical smog** forms when NOₓ and VOCs react in sunlight, producing tropospheric ozone. It peaks on hot, sunny, still afternoons in traffic-heavy cities.",
   "**Thermal inversion** traps a cool air layer under warm air, concentrating pollutants — worst in basins and valleys.",
   "**Acid deposition** comes from SO₂ and NOₓ; it lowers lake pH, leaches aluminum and nutrients from soil, and damages leaves and buildings. Liming treats symptoms; scrubbers and catalytic converters treat causes.",
   "Controls: **catalytic converters** (cars), **scrubbers** (SO₂), **electrostatic precipitators** (particulates), and low-sulfur fuels."]},
  {h:"Indoor air and noise",b:[
   "Indoor pollutants: **radon** (from soil, a lung cancer risk), asbestos, carbon monoxide, formaldehyde from building materials, mold, and smoke from indoor cooking fires.",
   "Indoor concentrations can exceed outdoor levels; ventilation is the primary control.",
   "Noise pollution causes hearing damage and stress and disrupts wildlife communication."]}],
 tip:"Distinguish tropospheric ozone (a pollutant you breathe) from stratospheric ozone (a shield you need). Questions deliberately blur them.",
 terms:["primary pollutant","secondary pollutant","photochemical smog","tropospheric ozone","thermal inversion","acid deposition","scrubber","catalytic converter","radon","sick building syndrome"],
 cards:[
 ["Primary vs secondary air pollutant","Primary pollutants are emitted directly; secondary pollutants form by reactions in the atmosphere."],
 ["Ingredients and conditions for photochemical smog","NOₓ and VOCs reacting in strong sunlight, typically on hot, still days."],
 ["What is a thermal inversion?","A layer of warm air traps cooler air below it, preventing pollutants from dispersing upward."],
 ["Which pollutants cause acid deposition?","Sulfur dioxide and nitrogen oxides, which form sulfuric and nitric acids."],
 ["What does a catalytic converter do?","Converts CO, NOₓ, and unburned hydrocarbons in vehicle exhaust into CO₂, N₂, and water."],
 ["What does a scrubber remove?","Sulfur dioxide from smokestack emissions."],
 ["Where does indoor radon come from and why does it matter?","Uranium decay in soil and rock beneath buildings; it is a leading cause of lung cancer."],
 ["Tropospheric vs stratospheric ozone","Tropospheric ozone is a harmful pollutant at ground level; stratospheric ozone shields Earth from UV radiation."]]},
{title:"Aquatic and Terrestrial Pollution",weight:[7,10],
 desc:"Water pollution, solid and hazardous waste, and toxicology.",
 notes:[
  {h:"Water pollution",b:[
   "**Point source** pollution has an identifiable origin (a pipe); **nonpoint source** is diffuse (agricultural and urban runoff) and much harder to regulate.",
   "**Eutrophication**: nutrient enrichment from fertilizer or sewage fuels an algal bloom; the algae die, decomposers consume oxygen, and **hypoxia** kills fish — the dead-zone sequence.",
   "**BOD** measures oxygen demanded by decomposers; high BOD means low dissolved oxygen. Dissolved oxygen falls as temperature rises, so **thermal pollution** compounds the problem.",
   "**Coliform bacteria** indicate sewage contamination. Heavy metals (lead, mercury) and oil spills cause distinct, longer-lasting harm.",
   "Sewage treatment: primary (settling solids), secondary (bacterial breakdown of organics), tertiary (nutrient and pathogen removal)."]},
  {h:"Solid waste and toxicology",b:[
   "Waste hierarchy: **reduce, reuse, recycle**, then compost, then incinerate with energy recovery, then landfill.",
   "Sanitary landfills use liners and leachate collection but still produce methane and can leak; incineration reduces volume but emits pollutants and leaves toxic ash.",
   "**e-waste** contains both valuable and hazardous metals and is often exported.",
   "**Bioaccumulation** concentrates a toxin within one organism; **biomagnification** increases concentration up the food chain, which is why top predators carry the highest loads (DDT, mercury).",
   "**LD50** is the dose lethal to half a test population; **dose-response curves** underlie risk assessment. Synergistic effects make combined exposures worse than the sum."]}],
 tip:"Write the eutrophication chain in order every time: nutrients → algal bloom → algae die → decomposers use oxygen → hypoxia → fish die.",
 terms:["point source","nonpoint source","eutrophication","hypoxia","BOD","dissolved oxygen","thermal pollution","coliform","bioaccumulation","biomagnification","LD50","leachate"],
 cards:[
 ["Point source vs nonpoint source pollution","Point source comes from a single identifiable outlet; nonpoint source is diffuse runoff from many places."],
 ["Sequence of eutrophication","Nutrient input, algal bloom, algae die, decomposers consume oxygen, hypoxia, fish kill."],
 ["What does BOD measure?","Biochemical oxygen demand — the oxygen decomposers need to break down organic matter in water."],
 ["How does temperature affect dissolved oxygen?","Warmer water holds less dissolved oxygen."],
 ["What does the presence of coliform bacteria indicate?","Fecal contamination and therefore possible pathogens."],
 ["Bioaccumulation vs biomagnification","Bioaccumulation is buildup within one organism over time; biomagnification is increasing concentration at higher trophic levels."],
 ["What is LD50?","The dose of a substance that kills 50% of a test population."],
 ["Three stages of sewage treatment","Primary settling of solids, secondary biological breakdown, tertiary nutrient and pathogen removal."],
 ["What is landfill leachate?","Liquid that percolates through waste, picking up contaminants, which can reach groundwater if the liner fails."]]},
{title:"Global Change",weight:[15,20],
 desc:"Ozone depletion, climate change, invasive species, and conservation. The heaviest unit.",
 notes:[
  {h:"Ozone depletion",b:[
   "**CFCs** released at the surface drift to the stratosphere, where UV frees chlorine atoms that catalytically destroy ozone — one chlorine atom destroys many ozone molecules.",
   "Depletion is worst over Antarctica because polar stratospheric clouds concentrate the reactions during the cold, dark winter.",
   "Consequences: more UV-B reaching the surface, raising skin cancer and cataract rates and damaging phytoplankton.",
   "The **Montreal Protocol** phased out CFCs and is the standard example of a successful international environmental agreement."]},
  {h:"Climate change",b:[
   "Greenhouse gases (CO₂, CH₄, N₂O, water vapor, CFCs) absorb outgoing infrared radiation and re-emit it, warming the lower atmosphere. This is the **enhanced greenhouse effect**, distinct from the natural one that makes Earth habitable.",
   "Methane has a much higher warming potential per molecule than CO₂ but a shorter atmospheric lifetime.",
   "Consequences: rising global temperature, sea level rise (thermal expansion plus melting land ice), ocean **acidification** from dissolved CO₂, shifting precipitation, more intense storms, range shifts, and coral bleaching.",
   "**Positive feedbacks** amplify warming: melting ice lowers **albedo**, thawing permafrost releases methane, and warmer oceans absorb less CO₂.",
   "Mitigation reduces emissions (renewables, efficiency, carbon pricing, reforestation); adaptation prepares for impacts (seawalls, drought-tolerant crops)."]},
  {h:"Biodiversity loss and conservation",b:[
   "Main drivers, often remembered as **HIPPCO**: Habitat destruction, Invasive species, Population growth, Pollution, Climate change, Overexploitation.",
   "**Invasive species** lack natural predators and outcompete natives; prevention is far cheaper than control.",
   "Conservation strategies: protected areas and corridors, habitat restoration, captive breeding, legal protection (Endangered Species Act, CITES), and sustainable harvest limits.",
   "Sustainability means meeting present needs without compromising future generations' ability to meet theirs — the framing most solution questions expect."]}],
 tip:"For any climate FRQ, name the specific greenhouse gas, its specific human source, and one specific consequence. Generic answers about 'pollution' earn nothing.",
 terms:["CFC","Montreal Protocol","greenhouse gas","enhanced greenhouse effect","ocean acidification","albedo","positive feedback","permafrost","HIPPCO","invasive species","CITES","sustainability"],
 cards:[
 ["How do CFCs destroy stratospheric ozone?","UV light frees chlorine atoms, which catalytically break apart many ozone molecules each."],
 ["Why is ozone depletion worst over Antarctica?","Polar stratospheric clouds in the cold, dark winter concentrate the reactions that release active chlorine."],
 ["Which international agreement successfully addressed ozone depletion?","The Montreal Protocol, which phased out CFCs."],
 ["Name four greenhouse gases","Carbon dioxide, methane, nitrous oxide, and water vapor (CFCs also qualify)."],
 ["Why is methane a concern despite its low concentration?","It has a far greater warming potential per molecule than CO₂."],
 ["What causes ocean acidification?","Dissolved CO₂ forms carbonic acid, lowering ocean pH and impairing shell formation."],
 ["How does melting ice create a positive feedback?","Less ice means lower albedo, so more solar energy is absorbed, causing further warming and melting."],
 ["What does HIPPCO stand for?","Habitat destruction, Invasive species, Population growth, Pollution, Climate change, Overexploitation."],
 ["Mitigation vs adaptation","Mitigation reduces greenhouse gas emissions; adaptation prepares for the impacts already coming."],
 ["Two causes of sea level rise","Thermal expansion of seawater and melting of land-based ice."]]}
],

units:[
{title:"Period 1: 1491–1607",weight:[4,6],
 desc:"Contact, the Columbian Exchange, and the Spanish colonial system.",
 notes:[
  {h:"Native societies before contact",b:[
   "Native societies were diverse and adapted to their environments: maize agriculture in the Southwest supported permanent settlement, Great Plains peoples combined hunting with farming, and Pacific Northwest peoples relied on abundant fish.",
   "The **Cahokia** mound complex and Iroquois Confederacy show large-scale political organization before European arrival.",
   "Maize cultivation spreading north from Mexico is the single most important pre-contact development for population growth and settlement patterns."]},
  {h:"European exploration and the Columbian Exchange",b:[
   "Spanish motives are remembered as **God, gold, and glory**; technological advances (caravel, astrolabe, gunpowder) made voyages possible.",
   "The **Columbian Exchange** moved crops, animals, people, and diseases in both directions. Old World diseases — smallpox above all — caused catastrophic Native population decline.",
   "New World crops (maize, potatoes) drove European and African population growth; horses transformed Plains Native cultures."]},
  {h:"The Spanish colonial system",b:[
   "The **encomienda** system granted colonists Native labor; the **casta** system ranked a racially mixed society.",
   "Spanish colonization aimed at extraction and conversion rather than settlement by families, producing different demographics from later English colonies.",
   "**Bartolomé de las Casas** criticized the treatment of Native peoples; the **Valladolid debate** and the shift toward African slavery followed.",
   "Native resistance was continuous — armed conflict, flight, and selective adaptation of European tools and animals."]}],
 tip:"Period 1 is lightly weighted but supplies the contextualization for almost any colonial DBQ. Know the Columbian Exchange cold.",
 terms:["Cahokia","maize","Columbian Exchange","encomienda","casta system","Las Casas","Pueblo peoples"],
 cards:[
 ["What was the Columbian Exchange?","The transatlantic transfer of plants, animals, people, and diseases between the Americas, Europe, and Africa after 1492."],
 ["What caused the greatest Native population decline?","Old World diseases, especially smallpox, to which Native peoples had no immunity."],
 ["What was the encomienda system?","A Spanish grant giving colonists the right to demand labor and tribute from Native peoples."],
 ["How did maize cultivation change North American societies?","It supported larger, more permanent settlements and more complex social organization."],
 ["Who criticized Spanish treatment of Native peoples?","Bartolomé de las Casas."],
 ["Why did the Spanish turn increasingly to African slave labor?","Native populations collapsed from disease and resistance, and reformers challenged Native enslavement."]]},
{title:"Period 2: 1607–1754",weight:[6,8],
 desc:"Distinct colonial regions, the Atlantic economy, and early self-government.",
 notes:[
  {h:"Regional differences",b:[
   "**Chesapeake and Southern colonies**: cash-crop plantations (tobacco, then rice and indigo), indentured servitude giving way to racial slavery, dispersed settlement, high mortality.",
   "**New England**: Puritan families, town-based settlement, mixed farming, shipbuilding and fishing, and a religiously defined community (the 'city upon a hill').",
   "**Middle colonies**: the most ethnically and religiously diverse, grain exports, and a commercial port economy in New York and Philadelphia.",
   "**British West Indies**: the most extreme plantation model — sugar, enormous enslaved majorities, and brutal conditions that shaped South Carolina's slave code."]},
  {h:"Slavery and resistance",b:[
   "**Bacon's Rebellion (1676)** exposed class tension between backcountry settlers and the tidewater elite and accelerated the shift from indentured servitude to hereditary racial slavery.",
   "Slave codes defined slavery as lifelong and inherited through the mother.",
   "Resistance took many forms: work slowdowns, flight, maintaining family and cultural practices, and revolt (**Stono Rebellion, 1739**)."]},
  {h:"Empire, religion, and self-government",b:[
   "**Mercantilism** and the Navigation Acts made colonies suppliers of raw materials and markets for British goods; **salutary neglect** meant weak enforcement and growing colonial autonomy.",
   "Colonial assemblies, the **Virginia House of Burgesses**, and New England town meetings built a tradition of self-rule.",
   "The **First Great Awakening** (Edwards, Whitefield) emphasized personal conversion, undercut established clergy, and created the first intercolonial shared experience.",
   "The **Enlightenment** brought natural rights and reason; the **Zenger trial** advanced press freedom."]}],
 tip:"Regional comparison is the most common Period 2 prompt. Be able to contrast New England, Middle, and Southern colonies on economy, labor, religion, and settlement pattern.",
 terms:["indentured servitude","Bacon's Rebellion","Stono Rebellion","mercantilism","Navigation Acts","salutary neglect","House of Burgesses","First Great Awakening","Zenger trial"],
 cards:[
 ["Economic basis of the New England colonies","Mixed subsistence farming, fishing, shipbuilding, and trade rather than cash crops."],
 ["Why were the Middle Colonies called the 'breadbasket'?","Fertile land produced grain exports, especially wheat."],
 ["What did Bacon's Rebellion reveal and accelerate?","Class conflict between frontier settlers and the coastal elite; it accelerated the shift from indentured servitude to racial slavery."],
 ["What was mercantilism?","An economic theory treating colonies as sources of raw materials and captive markets to enrich the mother country."],
 ["What was salutary neglect?","Britain's loose enforcement of trade laws, which allowed colonial self-government and smuggling to grow."],
 ["Two effects of the First Great Awakening","It weakened the authority of established clergy and created a shared intercolonial experience."],
 ["What was the Stono Rebellion?","A 1739 slave uprising in South Carolina that led to harsher slave codes."]]},
{title:"Period 3: 1754–1800",weight:[10,17],
 desc:"Imperial crisis, Revolution, the Constitution, and the first party system.",
 notes:[
  {h:"From war to revolution",b:[
   "The **French and Indian War (1754–63)** removed the French threat, left Britain in debt, and produced the **Proclamation of 1763** restricting westward settlement.",
   "Taxation without representation: **Stamp Act**, **Townshend Acts**, **Tea Act**, and after the Boston Tea Party the **Coercive (Intolerable) Acts**.",
   "Colonial responses escalated from petitions and boycotts (nonimportation, aided by women's homespun production) to the Continental Congresses.",
   "**Common Sense** made independence thinkable for a mass audience; the **Declaration of Independence** grounded it in natural rights and consent of the governed."]},
  {h:"The Revolutionary War and its meaning",b:[
   "Advantages: fighting at home, French alliance after Saratoga, and Washington's strategy of survival. Disadvantages: money, supplies, and a divided population.",
   "The Revolution was also a civil conflict — Loyalists, neutral colonists, Native nations choosing sides, and enslaved people seeking freedom with either army.",
   "Republican ideals spread unevenly: gradual emancipation in the North, **republican motherhood** for white women, and no change for the enslaved South.",
   "The **Treaty of Paris (1783)** granted independence and land to the Mississippi."]},
  {h:"Confederation and Constitution",b:[
   "The **Articles of Confederation** had no power to tax or regulate trade and no executive; its success was the **Northwest Ordinance**, which created a process for new states and barred slavery in the territory.",
   "**Shays' Rebellion** convinced many elites a stronger central government was needed.",
   "Constitutional compromises: **Great Compromise** (bicameral legislature), **Three-Fifths Compromise**, and the slave-trade clause.",
   "**Federalists** (Federalist Papers) versus **Anti-Federalists** (fear of centralized power, demand for a bill of rights). The **Bill of Rights** was the price of ratification."]},
  {h:"The new republic",b:[
   "Hamilton's program — national bank, assumption of state debts, tariffs — provoked Jefferson's strict-construction opposition and created the first party system.",
   "**Washington's Farewell Address** warned against permanent alliances and factions; the **Whiskey Rebellion** showed the new government could enforce law.",
   "The **Alien and Sedition Acts** and the **Virginia and Kentucky Resolutions** raised the question of states' power to judge federal law.",
   "Relations with Native nations and Britain remained unsettled; the **Northwest Indian War** and Jay's Treaty are the markers."]}],
 tip:"Period 3 appears constantly. Be ready to argue both that the Revolution was radical and that it was conservative, with evidence for each.",
 terms:["French and Indian War","Proclamation of 1763","Stamp Act","Intolerable Acts","Common Sense","Declaration of Independence","republican motherhood","Articles of Confederation","Northwest Ordinance","Shays' Rebellion","Great Compromise","Three-Fifths Compromise","Federalist Papers","Bill of Rights","Whiskey Rebellion","Alien and Sedition Acts"],
 cards:[
 ["Three consequences of the French and Indian War","British debt leading to new taxes, removal of the French threat, and the Proclamation of 1763 limiting westward settlement."],
 ["What principle did colonists invoke against the Stamp Act?","No taxation without representation."],
 ["Why was Common Sense significant?","Paine's plain language made the case for independence persuasive to a broad popular audience."],
 ["Two major weaknesses of the Articles of Confederation","No power to tax and no power to regulate interstate or foreign commerce."],
 ["What was the Northwest Ordinance's lasting achievement?","It created an orderly process for admitting new states and prohibited slavery in the Northwest Territory."],
 ["What did Shays' Rebellion demonstrate?","That the national government under the Articles was too weak to maintain order, strengthening calls for a new constitution."],
 ["What was the Great Compromise?","A bicameral Congress with representation by population in the House and equal representation in the Senate."],
 ["Core Anti-Federalist objection to the Constitution","It concentrated too much power in a distant central government and lacked a bill of rights."],
 ["What was Hamilton's financial program?","Assumption of state debts, a national bank, and protective tariffs to build national credit and manufacturing."],
 ["What did the Virginia and Kentucky Resolutions argue?","That states could judge the constitutionality of federal laws — an early states' rights position."]]},
{title:"Period 4: 1800–1848",weight:[10,17],
 desc:"Democratization, market revolution, reform, and sectional strain.",
 notes:[
  {h:"Politics and the Supreme Court",b:[
   "The **Election of 1800** showed peaceful transfer of power between parties. Jefferson's **Louisiana Purchase** doubled the nation and strained his own strict-construction principles.",
   "The Marshall Court built federal power: **Marbury v. Madison** (judicial review), **McCulloch v. Maryland** (implied powers, national supremacy), **Gibbons v. Ogden** (federal commerce power).",
   "The **War of 1812** ended the Federalist Party (Hartford Convention), spurred domestic manufacturing, and produced a surge of nationalism.",
   "The **Monroe Doctrine** warned Europe away from the Americas. The **American System** (tariff, bank, internal improvements) shaped economic debate."]},
  {h:"Market revolution and regional economies",b:[
   "Transportation — canals (**Erie Canal**), steamboats, then railroads — knit a national market and tied the Northwest to the Northeast.",
   "**Factory production** and the **Lowell system** drew young women into wage work; immigration (Irish, German) supplied urban labor and sparked **nativism**.",
   "The cotton gin made short-staple cotton profitable, expanding slavery westward and deepening Southern dependence on one crop.",
   "A **middle class** emerged with new ideas about domesticity and the 'cult of true womanhood'."]},
  {h:"Jacksonian democracy",b:[
   "Expanded white male suffrage, party conventions, and the **spoils system** broadened participation while narrowing it for others.",
   "Jackson vetoed the Bank recharter, faced down South Carolina in the **Nullification Crisis**, and pursued **Indian removal** despite *Worcester v. Georgia*, producing the **Trail of Tears**.",
   "Opposition coalesced as the **Whig Party**, favoring the American System and moral reform."]},
  {h:"Reform and resistance",b:[
   "The **Second Great Awakening** fueled temperance, prison and asylum reform, education (Horace Mann), utopian communities, and abolition.",
   "Abolitionism split between gradualists, Garrison's immediatism, and Black abolitionists like **Frederick Douglass**; enslaved people resisted through flight, family preservation, and revolt (**Nat Turner, 1831**).",
   "The **Seneca Falls Convention (1848)** and its Declaration of Sentiments launched organized women's rights.",
   "The **Missouri Compromise (1820)** postponed the sectional crisis by drawing a line at 36°30′."]}],
 tip:"Period 4 LEQs often ask about the effects of market or transportation change. Tie economic change to a social consequence — immigration, class, or slavery's expansion.",
 terms:["Louisiana Purchase","Marbury v. Madison","McCulloch v. Maryland","War of 1812","Monroe Doctrine","American System","Erie Canal","market revolution","Lowell system","nativism","cotton gin","Nullification Crisis","Trail of Tears","Second Great Awakening","Seneca Falls","Missouri Compromise"],
 cards:[
 ["What did Marbury v. Madison establish?","Judicial review — the Supreme Court's power to declare laws unconstitutional."],
 ["What did McCulloch v. Maryland establish?","Implied powers of Congress and the supremacy of federal law over state law."],
 ["Why did the Louisiana Purchase trouble Jefferson?","The Constitution did not explicitly authorize it, conflicting with his strict-construction views."],
 ["Three effects of the War of 1812","Surging nationalism, the collapse of the Federalist Party, and growth of domestic manufacturing."],
 ["What were the three parts of the American System?","A protective tariff, a national bank, and federally funded internal improvements."],
 ["How did the cotton gin affect slavery?","It made short-staple cotton profitable, driving slavery's expansion into the Deep South and Southwest."],
 ["What was the Nullification Crisis about?","South Carolina claimed a state could void a federal tariff; Jackson rejected nullification and threatened force."],
 ["What did Worcester v. Georgia rule, and what happened?","The Court upheld Cherokee sovereignty, but removal proceeded anyway, leading to the Trail of Tears."],
 ["What reform movements did the Second Great Awakening inspire?","Temperance, abolition, women's rights, education reform, and prison and asylum reform."],
 ["What was the Missouri Compromise?","Missouri entered as a slave state, Maine as free, and slavery was barred north of 36°30′ in the Louisiana Territory."]]},
{title:"Period 5: 1844–1877",weight:[10,17],
 desc:"Manifest Destiny, sectional crisis, Civil War, and Reconstruction.",
 notes:[
  {h:"Expansion and the crisis of the 1850s",b:[
   "**Manifest Destiny** justified expansion; the **Mexican-American War** added vast territory and reopened the question of slavery's extension (**Wilmot Proviso**).",
   "The **Compromise of 1850** admitted California free, applied popular sovereignty in the Southwest, and imposed a harsh **Fugitive Slave Act** that radicalized Northern opinion.",
   "**Kansas-Nebraska Act (1854)** repealed the Missouri Compromise line, produced 'Bleeding Kansas', destroyed the Whigs, and created the **Republican Party**.",
   "**Dred Scott (1857)** held that Black Americans were not citizens and Congress could not bar slavery from territories, outraging the North.",
   "**Uncle Tom's Cabin**, John Brown's raid, and the Lincoln-Douglas debates hardened both sections."]},
  {h:"The Civil War",b:[
   "Lincoln's 1860 victory triggered secession; the war began at **Fort Sumter**. Union advantages were population, industry, railroads, and navy; Confederate advantages were defensive war and initial command.",
   "The **Emancipation Proclamation (1863)** redefined the war's purpose, kept Britain out, and authorized Black enlistment; roughly 180,000 Black soldiers served.",
   "Total war measures: conscription on both sides, suspension of habeas corpus, income tax, Homestead and Pacific Railway Acts, and the draft riots.",
   "Gettysburg and Vicksburg in 1863 were the turning point; the **Thirteenth Amendment** abolished slavery."]},
  {h:"Reconstruction",b:[
   "Competing plans: Lincoln's lenient Ten Percent Plan, Johnson's quick restoration, and Congressional (Radical) Reconstruction with military districts.",
   "**Reconstruction Amendments**: 13th (abolition), 14th (citizenship, equal protection, due process), 15th (voting regardless of race).",
   "Freedpeople built churches, schools, and families; the **Freedmen's Bureau** provided limited aid. Black men voted and held office.",
   "**Black Codes**, **sharecropping**, and violence by the Ku Klux Klan restored white control in practice.",
   "The **Compromise of 1877** ended Reconstruction; by the 1890s segregation and disfranchisement were entrenched, but the 14th and 15th Amendments remained as tools for later movements."]}],
 tip:"A frequent prompt asks whether Reconstruction succeeded or failed. The strongest answers distinguish constitutional gains from social and economic outcomes.",
 terms:["Manifest Destiny","Wilmot Proviso","Compromise of 1850","Fugitive Slave Act","Kansas-Nebraska Act","Dred Scott","Fort Sumter","Emancipation Proclamation","Thirteenth Amendment","Fourteenth Amendment","Fifteenth Amendment","Freedmen's Bureau","Black Codes","sharecropping","Compromise of 1877"],
 cards:[
 ["What was the Wilmot Proviso?","A failed proposal to ban slavery in any territory gained from Mexico."],
 ["Which part of the Compromise of 1850 most angered the North?","The strengthened Fugitive Slave Act, which required Northerners to assist in capturing escapees."],
 ["What did the Kansas-Nebraska Act do?","Applied popular sovereignty to those territories, repealing the Missouri Compromise line and triggering violence in Kansas."],
 ["What did the Dred Scott decision hold?","That Black Americans were not citizens and that Congress could not prohibit slavery in the territories."],
 ["Strategic effects of the Emancipation Proclamation","It redefined the war as a fight against slavery, discouraged European intervention, and allowed Black enlistment in the Union army."],
 ["What does the Fourteenth Amendment guarantee?","Birthright citizenship, equal protection of the laws, and due process."],
 ["What does the Fifteenth Amendment guarantee?","That voting rights cannot be denied on the basis of race, color, or previous condition of servitude."],
 ["What were Black Codes?","Southern laws after the war restricting freedpeople's labor, movement, and rights."],
 ["What was sharecropping and why did it persist?","Tenants farmed land for a share of the crop; debt and crop liens kept families bound to the land."],
 ["How did Reconstruction end?","The Compromise of 1877 settled the disputed election, and federal troops withdrew from the South."]]},
{title:"Period 6: 1865–1898",weight:[10,17],
 desc:"Industrialization, the West, immigration, and the Gilded Age.",
 notes:[
  {h:"Industrial growth",b:[
   "Railroads created a national market, standardized time, and pioneered modern corporate management. Carnegie used **vertical integration**; Rockefeller used **horizontal integration** and the trust.",
   "Technological change (Bessemer steel, electricity, the telephone) and abundant immigrant labor fueled growth; **laissez-faire** and **Social Darwinism** justified it, while the **Gospel of Wealth** urged philanthropy.",
   "Limited regulation arrived with the **Interstate Commerce Act (1887)** and the **Sherman Antitrust Act (1890)**, both weakly enforced at first."]},
  {h:"Labor and cities",b:[
   "Wage work meant long hours, low pay, and danger. The **Knights of Labor** organized broadly; the **AFL** under Gompers focused on skilled craft workers and bread-and-butter demands.",
   "Major conflicts: the Great Railroad Strike (1877), **Haymarket** (1886), Homestead (1892), and **Pullman** (1894) — most ended with government siding with employers.",
   "New immigration from southern and eastern Europe filled cities and tenements; **nativism** produced the **Chinese Exclusion Act (1882)**.",
   "Political machines traded services for votes; settlement houses (**Hull House**) and the Social Gospel pursued reform."]},
  {h:"The West and the South",b:[
   "Railroads, mining, cattle, and the **Homestead Act** drew settlers. Native nations were confined to reservations after the Plains wars; the **Dawes Act (1887)** broke up communal land and pressed assimilation.",
   "The loss of the bison and events at Wounded Knee (1890) marked the end of armed resistance.",
   "Farmers faced falling prices, high freight rates, and debt. The Grange and then the **Populist Party** demanded free silver, railroad regulation, and a graduated income tax.",
   "In the South, the **'New South'** rhetoric of industry coexisted with tenancy, **Jim Crow** laws, disfranchisement, and *Plessy v. Ferguson* (1896) sanctioning 'separate but equal'."]}],
 tip:"When a prompt mentions the Gilded Age, pair an economic development with a response — labor organizing, Populism, or reform — to show causation rather than description.",
 terms:["vertical integration","horizontal integration","trust","Social Darwinism","Gospel of Wealth","Sherman Antitrust Act","Knights of Labor","AFL","Haymarket","Pullman Strike","Chinese Exclusion Act","Hull House","Dawes Act","Populist Party","Jim Crow","Plessy v. Ferguson"],
 cards:[
 ["Vertical vs horizontal integration","Vertical integration controls every stage of production; horizontal integration buys out competitors in the same stage."],
 ["What was Social Darwinism used to justify?","Great wealth inequality and minimal government regulation, framed as natural selection applied to society."],
 ["How did the AFL differ from the Knights of Labor?","The AFL organized skilled workers around wages, hours, and conditions; the Knights sought to include nearly all workers and broader social reform."],
 ["What was the Dawes Act intended to do?","Divide tribal land into individual allotments to force assimilation, which stripped Native nations of most of their land."],
 ["Three main Populist demands","Free coinage of silver, government regulation of railroads, and a graduated income tax."],
 ["What did Plessy v. Ferguson establish?","The 'separate but equal' doctrine permitting legal racial segregation."],
 ["Why did farmers face worsening conditions in the late 1800s?","Overproduction pushed crop prices down while debts, freight rates, and deflation stayed high."],
 ["What was the Chinese Exclusion Act?","An 1882 law barring Chinese laborers from immigrating — the first major federal restriction targeting a nationality."]]},
{title:"Period 7: 1890–1945",weight:[10,17],
 desc:"Progressivism, empire, two world wars, and the New Deal.",
 notes:[
  {h:"Progressive Era and imperialism",b:[
   "Progressives sought efficiency, regulation, and democracy: muckrakers, the 16th (income tax), 17th (direct election of senators), 18th (prohibition), and 19th (women's suffrage) Amendments.",
   "Roosevelt's **Square Deal** (trust-busting, conservation, consumer protection), Wilson's **New Freedom** (Federal Reserve, Clayton Act, lower tariffs).",
   "Progressivism's limits: it largely excluded Black Americans, and **Booker T. Washington** and **W. E. B. Du Bois** offered competing strategies.",
   "**Spanish-American War (1898)** brought Cuba, Puerto Rico, Guam, and the Philippines into the American orbit; debates over empire pitted strategic and economic arguments against anti-imperialist ones. The **Open Door** policy and Panama Canal followed."]},
  {h:"World War I and the 1920s",b:[
   "Neutrality collapsed over submarine warfare and the Zimmermann Telegram. Mobilization meant the War Industries Board, Committee on Public Information, and suppression of dissent (**Espionage and Sedition Acts**, *Schenck v. United States*).",
   "The **Great Migration** moved hundreds of thousands of Black Southerners north. The Senate rejected the **League of Nations**.",
   "The 1920s: consumer credit and mass culture, the Harlem Renaissance, immigration quotas (1924), the Red Scare, revived Klan, and the Scopes Trial — a decade of cultural conflict over modernity."]},
  {h:"Depression and New Deal",b:[
   "Causes of the **Great Depression**: overproduction, unequal income distribution, speculation and margin buying, bank failures, and contractionary policy.",
   "Hoover's limited response gave way to FDR's **New Deal** — **relief** (CCC, WPA, FERA), **recovery** (AAA, NRA, TVA), and **reform** (FDIC, SEC, Wagner Act, **Social Security**).",
   "Opposition came from the right (unconstitutional overreach, *Schechter* and *Butler* decisions) and the left (Huey Long, Father Coughlin). The court-packing plan cost Roosevelt political capital.",
   "The New Deal permanently expanded federal responsibility and built the Democratic coalition, but did not end the Depression and excluded many agricultural and domestic workers — disproportionately Black and Latino."]},
  {h:"World War II",b:[
   "Neutrality Acts gave way to Lend-Lease; **Pearl Harbor** ended the debate. Mobilization ended unemployment and expanded federal power.",
   "Home front change: women in industry ('Rosie the Riveter'), the **Double V campaign**, the Bracero program, and the **internment of Japanese Americans** upheld in *Korematsu*.",
   "Strategy: Europe first, D-Day, island-hopping in the Pacific, and the **atomic bombings** of Hiroshima and Nagasaki.",
   "The war left the United States the dominant economic and military power and set up the United Nations, Bretton Woods, and the Cold War."]}],
 tip:"For New Deal prompts, organize by relief, recovery, and reform. It gives you a clear line of reasoning and makes evidence easy to slot in.",
 terms:["muckrakers","Square Deal","New Freedom","Du Bois","Spanish-American War","Open Door","Espionage Act","Schenck v. United States","Great Migration","League of Nations","Harlem Renaissance","Great Depression","New Deal","Social Security","court-packing","Lend-Lease","Pearl Harbor","Double V campaign","Korematsu","Hiroshima"],
 cards:[
 ["Four Progressive Era amendments and what each did","16th income tax, 17th direct election of senators, 18th prohibition, 19th women's suffrage."],
 ["How did Washington and Du Bois differ?","Washington urged vocational training and gradual economic advancement; Du Bois demanded immediate civil and political rights and higher education for a Black elite."],
 ["What did Schenck v. United States establish?","Speech could be restricted when it posed a 'clear and present danger', upholding wartime prosecutions."],
 ["What was the Great Migration?","The large-scale movement of Black Americans from the rural South to Northern and Western cities for work and to escape Jim Crow."],
 ["Why did the Senate reject the League of Nations?","Fears that Article X would commit the United States to foreign wars without congressional consent."],
 ["Name the three goals of the New Deal","Relief for the suffering, recovery of the economy, and reform to prevent another depression."],
 ["Which New Deal program most permanently changed American life?","Social Security, which created federal old-age and unemployment insurance."],
 ["Why did the court-packing plan backfire?","It appeared to threaten judicial independence and cost Roosevelt support even among allies."],
 ["What was the Double V campaign?","A Black wartime effort for victory against fascism abroad and racism at home."],
 ["What did Korematsu v. United States uphold?","The wartime internment of Japanese Americans as a military necessity."]]},
{title:"Period 8: 1945–1980",weight:[10,17],
 desc:"Cold War, affluence, civil rights, Vietnam, and the conservative turn.",
 notes:[
  {h:"Cold War",b:[
   "**Containment** was articulated in Kennan's Long Telegram, the **Truman Doctrine**, the **Marshall Plan**, and NATO; the Berlin Airlift and NSC-68 militarized it.",
   "Korea established limited war and permanent mobilization. The arms race, **Cuban Missile Crisis**, and détente traced the shifting temperature.",
   "Domestic anticommunism: HUAC, loyalty programs, the Rosenbergs, and **McCarthyism**.",
   "Decolonization and the Third World made the Cold War global; **Vietnam** escalated from advisers to 500,000 troops under Johnson, and the Tet Offensive, Pentagon Papers, and antiwar movement destroyed consensus."]},
  {h:"Affluence and its discontents",b:[
   "The **GI Bill**, suburbanization, the interstate highway system, and a baby boom created mass middle-class affluence — unequally distributed, with redlining excluding Black families from the housing boom.",
   "Sun Belt growth shifted population and political power south and west.",
   "Critics of conformity, *The Feminine Mystique*, and the counterculture questioned the postwar settlement.",
   "Johnson's **Great Society** brought Medicare, Medicaid, Head Start, and civil rights legislation — the largest expansion of federal social policy since the New Deal."]},
  {h:"Civil rights and rights movements",b:[
   "**Brown v. Board (1954)** overturned *Plessy* in education; the Montgomery Bus Boycott, sit-ins, Freedom Rides, Birmingham, and the March on Washington built pressure.",
   "The **Civil Rights Act of 1964** barred discrimination in public accommodations and employment; the **Voting Rights Act of 1965** enforced the 15th Amendment.",
   "Tensions over tactics and goals: nonviolent direct action, Black Power, and Northern struggles over housing, schools, and policing.",
   "The movement's model spread: the women's movement (NOW, Title IX, *Roe v. Wade*), the United Farm Workers and Chávez, the American Indian Movement, disability rights, and gay rights after Stonewall."]},
  {h:"The 1970s turn",b:[
   "**Watergate** and Nixon's resignation deepened distrust in government, already strained by Vietnam.",
   "Stagflation, the 1973 oil embargo, and deindustrialization ended postwar prosperity.",
   "A resurgent conservatism combined free-market economics, opposition to the Great Society, the religious right, and the anti-ERA movement.",
   "Environmentalism grew (Earth Day, EPA, Clean Air and Water Acts) as part of the rights-era expansion of federal regulation."]}],
 tip:"Civil rights DBQs reward distinguishing the legal, legislative, and grassroots strands — and noting the continuing Northern and economic struggles after 1965.",
 terms:["containment","Truman Doctrine","Marshall Plan","NATO","McCarthyism","Cuban Missile Crisis","Vietnam War","Tet Offensive","GI Bill","suburbanization","redlining","Great Society","Brown v. Board","Civil Rights Act of 1964","Voting Rights Act","Black Power","Title IX","Watergate","stagflation","religious right"],
 cards:[
 ["What was containment?","The American strategy of preventing the spread of Soviet influence rather than rolling it back directly."],
 ["What did the Marshall Plan do?","Provided massive economic aid to rebuild Western Europe, stabilizing it against communist appeal."],
 ["What was McCarthyism?","Aggressive and often unfounded accusations of communist subversion in American institutions."],
 ["How did the GI Bill shape postwar America?","It funded education and home loans for veterans, expanding the middle class and fueling suburbanization — though Black veterans were often excluded in practice."],
 ["What was redlining?","Denying mortgages and insurance in neighborhoods marked as risky, which excluded Black families from suburban homeownership and wealth building."],
 ["What did Brown v. Board of Education decide?","That racially segregated public schools violate the Equal Protection Clause, overturning Plessy in education."],
 ["What did the Civil Rights Act of 1964 ban?","Discrimination based on race, color, religion, sex, or national origin in public accommodations and employment."],
 ["What did the Voting Rights Act of 1965 do?","Banned literacy tests and authorized federal oversight of registration in places with a history of discrimination."],
 ["What was the significance of the Tet Offensive?","Though a military setback for the North, it shattered American confidence that the war was being won."],
 ["Two effects of Watergate","Nixon's resignation and a lasting decline in public trust in the federal government."],
 ["What was stagflation?","Simultaneous high inflation and high unemployment in the 1970s, which standard economic policy could not easily address."]]},
{title:"Period 9: 1980–present",weight:[4,6],
 desc:"Conservatism, the end of the Cold War, globalization, and a polarized politics.",
 notes:[
  {h:"The Reagan era and the Cold War's end",b:[
   "**Reaganomics**: tax cuts, deregulation, reduced domestic spending, and a large military buildup, with rising deficits and inequality.",
   "Conservative coalition: economic libertarians, the religious right, and neoconservatives. Debates over abortion, affirmative action, and the role of government defined the decade.",
   "Gorbachev's reforms, the fall of the Berlin Wall (1989), and the Soviet collapse (1991) ended the Cold War, leaving the United States the sole superpower."]},
  {h:"Globalization and a new politics",b:[
   "**NAFTA**, the WTO, and offshoring reshaped employment; the digital revolution transformed work and communication.",
   "Immigration from Latin America and Asia changed demographics and fueled renewed debate over borders and citizenship.",
   "**September 11, 2001** produced the war on terror, the Patriot Act, and wars in Afghanistan and Iraq, reviving debates over civil liberties and executive power.",
   "The 2008 financial crisis, the Affordable Care Act, rising partisan polarization, and movements for racial justice and climate action frame recent decades.",
   "Recurring threads across all nine periods: the scope of federal power, who counts as a full citizen, America's role in the world, and the tension between economic growth and equality."]}],
 tip:"Period 9 is lightly tested but frequently useful as the 'after' half of a continuity-and-change prompt. Have two or three specific post-1980 facts ready.",
 terms:["Reaganomics","deregulation","religious right","fall of the Berlin Wall","NAFTA","globalization","September 11","Patriot Act","Affordable Care Act","polarization"],
 cards:[
 ["What were the main elements of Reaganomics?","Tax cuts, deregulation, reduced domestic spending, and increased military spending."],
 ["What ended the Cold War?","Soviet reform under Gorbachev, economic strain, the fall of the Berlin Wall in 1989, and the USSR's dissolution in 1991."],
 ["What was NAFTA and why was it controversial?","A 1994 free trade agreement among the US, Canada, and Mexico, criticized for manufacturing job losses and praised for lower consumer prices."],
 ["Two domestic consequences of September 11","The Patriot Act's expansion of surveillance powers and the creation of the Department of Homeland Security."],
 ["Which groups formed the modern conservative coalition?","Free-market economic conservatives, the religious right, and foreign-policy hawks."]]}
],
qbank:[
{u:1,q:"The most significant long-term demographic consequence of the Columbian Exchange in the Americas was",c:["the spread of maize to Europe","catastrophic Native population decline from disease","the introduction of horses","increased European migration"],a:1,e:"Epidemic disease killed a large majority of Native populations, reshaping every subsequent development."},
{u:2,q:"Bacon's Rebellion most directly contributed to",c:["the end of the tobacco economy","a shift from indentured servitude toward racial slavery","independence from Britain","the founding of Pennsylvania"],a:1,e:"Elites sought a labor force that could not unite with poor whites against them."},
{u:3,q:"The Articles of Confederation's greatest structural weakness was",c:["an overly strong executive","no power to tax","too many amendments","judicial overreach"],a:1,e:"Without taxation the national government could not pay debts or fund itself."},
{u:3,q:"The Northwest Ordinance is most significant for",c:["ending the Revolutionary War","creating a process for new states and banning slavery in the territory","establishing the national bank","creating the Supreme Court"],a:1,e:"It set the template for orderly expansion and excluded slavery from the Northwest Territory."},
{u:4,q:"McCulloch v. Maryland strengthened",c:["states' rights","federal implied powers","judicial review","presidential authority"],a:1,e:"The Court upheld the national bank under implied powers and barred state taxation of it."},
{u:4,q:"The cotton gin's most important consequence was",c:["reducing the need for enslaved labor","expanding slavery into the Deep South","industrializing the South","ending the Atlantic slave trade"],a:1,e:"Profitable short-staple cotton drove slavery's geographic expansion and economic entrenchment."},
{u:5,q:"Which provision of the Compromise of 1850 most inflamed Northern opinion?",c:["California's admission as free","popular sovereignty in the territories","the strengthened Fugitive Slave Act","the end of the slave trade in Washington D.C."],a:2,e:"It forced Northerners into direct complicity with slavery's enforcement."},
{u:5,q:"The Fourteenth Amendment is most often cited today for its",c:["abolition of slavery","guarantee of equal protection","protection of voting rights","limits on federal power"],a:1,e:"Equal protection and due process have grounded civil rights litigation ever since."},
{u:6,q:"Rockefeller's Standard Oil is the classic example of",c:["vertical integration","horizontal integration","a labor union","government regulation"],a:1,e:"He absorbed competing refiners at the same stage of production."},
{u:6,q:"The Dawes Act attempted to",c:["protect tribal sovereignty","assimilate Native peoples by allotting individual land","expand reservations","end westward settlement"],a:1,e:"Allotment broke up communal holdings and transferred most remaining land out of Native hands."},
{u:7,q:"The New Deal's most lasting institutional legacy is",c:["the NRA","Social Security","the court-packing plan","the Bonus Army"],a:1,e:"Social Security created permanent federal old-age and unemployment insurance."},
{u:7,q:"The Great Migration was primarily driven by",c:["the Homestead Act","wartime industrial jobs and escape from Jim Crow","the Dust Bowl alone","the Harlem Renaissance"],a:1,e:"Northern labor demand during the world wars combined with Southern racial violence and disfranchisement."},
{u:8,q:"The Marshall Plan is best understood as",c:["a military alliance","economic aid to stabilize Western Europe against communism","a nuclear arms treaty","a domestic jobs program"],a:1,e:"Rebuilding prosperous democracies was containment by economic means."},
{u:8,q:"The Voting Rights Act of 1965 primarily enforced which amendment?",c:["Thirteenth","Fourteenth","Fifteenth","Nineteenth"],a:2,e:"It gave practical enforcement to the Fifteenth Amendment's ban on racial voting discrimination."},
{u:9,q:"A central economic feature of the Reagan administration was",c:["higher income tax rates","deregulation and tax cuts","nationalizing industry","wage and price controls"],a:1,e:"Supply-side policy combined tax reduction with deregulation and military spending increases."}
]
